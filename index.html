  <aside class="lesson"><span class="rubric">Урок, который нужно запомнить</span><p>Когда мир содрогается, помните, Кто снимает печати.</p></aside>
  <section class="quiz"><span class="rubric">Проверьте себя</span><h3>Что происходит при шестой печати?</h3><div class="quiz-options"><button class="quiz-opt" data-correct>Наступает великий день гнева: конец света</button><button class="quiz-opt">Выезжает пятый всадник</button><button class="quiz-opt">Церковь тайно забирают</button></div><p class="quiz-feedback" hidden>При шестой печати небо свивается, как свиток, и «пришел великий день гнева Его» (6:12–17). Первый цикл видений уже дошёл до конца.</p></section>
</section>

<section class="page topic" id="144000" data-nav="Кто такие 144 000?" data-num="04" data-keywords="144000 144 000 запечатленные колена израиль великое множество откровение 7 14 церковь">
  <p class="eyebrow">Вопрос 04 · Откровение 7 и 14</p>
  <h1>Кто такие 144 000?</h1>
  <p class="deck">Народ, который Бог считает, запечатлевает и хранит</p>
  <div class="locator" data-vision="2,4"></div>
  <ul class="refs" aria-label="Отрывки для чтения"><li class="refs-label">Читать в Синодальном переводе</li><li><a href="https://www.bible.com/bible/400/REV.7.SYNO" target="_blank" rel="noopener">Откровение 7</a></li><li><a href="https://www.bible.com/bible/400/REV.14.SYNO" target="_blank" rel="noopener">Откровение 14</a></li><li><a href="https://www.bible.com/bible/400/NUM.1.SYNO" target="_blank" rel="noopener">Числа 1</a></li></ul>
  <figure class="art"><img data-art src="https://commons.wikimedia.org/wiki/Special:FilePath/Albrecht_D%C3%BCrer,_The_Four_Angels_Holding_the_Winds,_1498,_NGA_142354.jpg?width=1000" alt="Гравюра: четыре ангела удерживают ветры, а другой ангел ставит знак на челах толпы верных." loading="lazy" decoding="async" width="1000" height="1400"><figcaption><b>Четыре ангела, удерживающие ветры</b>, и запечатление рабов Божиих, Альбрехт Дюрер, 1498. Историческое произведение, а не буквальное изображение видения.</figcaption></figure>
  <blockquote class="passage"><span class="rubric">Текст</span><p>После сего взглянул я, и вот, великое множество людей, которого никто не мог перечесть, из всех племен и колен, и народов и языков, стояло пред престолом и пред Агнцем в белых одеждах и с пальмовыми ветвями в руках своих.</p><footer><cite>Откровение 7:9</cite><a href="https://www.bible.com/bible/400/REV.7.SYNO" target="_blank" rel="noopener">Читать главу ↗</a></footer></blockquote>
  <div class="myth"><span class="rubric">Распространённое заблуждение</span><p>Спасутся только 144 000 человек — или это особая группа еврейских благовестников в будущей скорби.</p></div>
  <div class="teach">
    <h2>Чему учит Писание</h2>
    <p class="illum">Иоанн <em>слышит</em> число: 144 000 запечатлённых из колен Израиля (7:4). Затем он оборачивается и <em>видит</em> «великое множество людей, которого никто не мог перечесть, из всех племен» (7:9). Именно это произошло в пятой главе, когда он услышал о Льве и увидел Агнца. То, что Иоанн слышит, и то, что он видит, — это одна и та же реальность с двух сторон. <strong>144 000 — это вся церковь</strong>, описанная как истинный Израиль Божий и сосчитанная до последнего человека; великое множество — та же церковь, какова она на самом деле, собранная из всех народов.</p>
    <p>Это число построено, а не подсчитано: 12 колен × 12 апостолов × 1000 — полнота народа Божьего. Оно оформлено как военная перепись (ср. Числа 1), потому что это воинство Агнца, те, «которые следуют за Агнцем, куда бы Он ни пошел» (14:4). Сам список необычен. Иуда, колено Мессии, стоит первым, а Дан пропущен вовсе. Это не обычный перечень колен; это портрет народа Мессии. Павел желает мира и милости «Израилю Божию» (Галатам 6:16) — то есть церкви, а печать на их челах означает, что они принадлежат Богу и будут сохранены в любом испытании.</p>
  </div>
  <div class="pair-cards">
    <article><span class="ref">Что Иоанн слышит · 7:4–8</span><h3>144 000</h3><p>Сосчитаны по коленам, запечатлены, построены к битве. Церковь как истинный Израиль, в полноте.</p></article>
    <article class="dark"><span class="ref">Что Иоанн видит · 7:9–17</span><h3>Бесчисленное множество</h3><p>Из всех народов, в белых одеждах, перед престолом. Та же церковь, какова она на самом деле.</p></article>
  </div>
  <section class="evidence" aria-labelledby="ev-144">
    <h2 id="ev-144">Откуда мы это знаем?</h2>
    <details class="ev"><summary><span class="ev-n">01</span><span class="ev-ref">Откровение 7:4, 9</span><i class="tag stated">Сказано</i></summary><div class="ev-body"><p>«Я слышал число запечатленных… После сего взглянул я, и вот, великое множество людей, которого никто не мог перечесть».</p><a href="https://www.bible.com/bible/400/REV.7.SYNO" target="_blank" rel="noopener">Читать Откровение 7 ↗</a></div></details>
    <details class="ev"><summary><span class="ev-n">02</span><span class="ev-ref">Откровение 5:5–6</span><i class="tag link">Связь</i></summary><div class="ev-body"><p>Тот же образец: Иоанн слышит «лев», а видит Агнца. Услышанное и увиденное описывают одну реальность двумя способами.</p><a href="https://www.bible.com/bible/400/REV.5.SYNO" target="_blank" rel="noopener">Читать Откровение 5 ↗</a></div></details>
    <details class="ev"><summary><span class="ev-n">03</span><span class="ev-ref">Галатам 6:16; Римлянам 2:28–29; Филиппийцам 3:3</span><i class="tag link">Связь</i></summary><div class="ev-body"><p>Павел называет верующих Израилем Божиим («мир им и милость, и Израилю Божию») и истинным обрезанием — теми, кто служит Богу духом.</p><a href="https://www.bible.com/bible/400/GAL.6.SYNO" target="_blank" rel="noopener">Читать Галатам 6 ↗</a></div></details>
    <details class="ev"><summary><span class="ev-n">04</span><span class="ev-ref">Откровение 14:1–4</span><i class="tag inference">Вывод</i></summary><div class="ev-body"><p>144 000 стоят с Агнцем, носят имя Его Отца и следуют за Ним. То, что это вся искупленная церковь, — вывод из глав 5, 7 и 14, взятых вместе.</p><a href="https://www.bible.com/bible/400/REV.14.SYNO" target="_blank" rel="noopener">Читать Откровение 14 ↗</a></div></details>
  </section>
  <details class="alt"><summary>Как читают другие</summary><div class="alt-body"><div class="alt-grid">
    <article><h3>Этнический Израиль в последние времена</h3><p>Диспенсационалисты видят 144 000 верующих евреев, запечатлённых во время будущей скорби, в отличие от множества верующих из язычников.</p></article>
    <article class="ours"><h3>Весь народ Божий</h3><p>Число символизирует полноту, а множество — это то же собрание, увиденное таким, какое оно есть: одна церковь из иудеев и язычников.</p></article>
  </div></div></details>
  <aside class="lesson"><span class="rubric">Урок, который нужно запомнить</span><p>Бог знает каждого из Своего народа по имени, и ни один из них не погибнет.</p></aside>
  <section class="quiz"><span class="rubric">Проверьте себя</span><h3>Что видит Иоанн сразу после того, как слышит число 144 000?</h3><div class="quiz-options"><button class="quiz-opt" data-correct>Великое множество, которого никто не мог перечесть, из всех народов</button><button class="quiz-opt">Ровно 144 000 мужчин из Израиля и больше никого</button><button class="quiz-opt">Пустое небо, которое ждёт, чтобы его наполнили</button></div><p class="quiz-feedback" hidden>Иоанн слышит число, а затем видит бесчисленное множество (7:4, 9) — так же, как в пятой главе он услышал о Льве и увидел Агнца.</p></section>
</section>

<section class="page topic" id="trumpets" data-nav="Что такое трубы и чаши?" data-num="05" data-keywords="семь труб семь чаш казни египет исход гнев третья часть откровение 8 9 15 16 суды язвы">
  <p class="eyebrow">Вопрос 05 · Откровение 8–9 и 15–16</p>
  <h1>Что такое трубы и чаши?</h1>
  <p class="deck">Казни египетские, звучащие над всей эпохой</p>
  <div class="locator" data-vision="3,5"></div>
  <ul class="refs" aria-label="Отрывки для чтения"><li class="refs-label">Читать в Синодальном переводе</li><li><a href="https://www.bible.com/bible/400/REV.8.SYNO" target="_blank" rel="noopener">Откровение 8</a></li><li><a href="https://www.bible.com/bible/400/REV.9.SYNO" target="_blank" rel="noopener">Откровение 9</a></li><li><a href="https://www.bible.com/bible/400/REV.16.SYNO" target="_blank" rel="noopener">Откровение 16</a></li><li><a href="https://www.bible.com/bible/400/EXO.7.SYNO" target="_blank" rel="noopener">Исход 7</a></li></ul>
  <figure class="art"><img data-art src="https://commons.wikimedia.org/wiki/Special:FilePath/Albrecht_D%C3%BCrer,_The_Seven_Angels_with_the_Trumpets,_probably_c._1496-1498,_NGA_850.jpg?width=1000" alt="Гравюра: семь ангелов получают трубы перед Божьим престолом, а внизу огонь, град и падающая звезда поражают землю и море." loading="lazy" decoding="async" width="1000" height="1400"><figcaption><b>Семь ангелов с трубами</b>, Альбрехт Дюрер, около 1496–1498. Историческое произведение, а не буквальное изображение видения.</figcaption></figure>
  <blockquote class="passage"><span class="rubric">Текст</span><p>Прочие же люди, которые не умерли от этих язв, не раскаялись в делах рук своих, так чтобы не поклоняться бесам и золотым, серебряным, медным, каменным и деревянным идолам, которые не могут ни видеть, ни слышать, ни ходить.</p><footer><cite>Откровение 9:20</cite><a href="https://www.bible.com/bible/400/REV.9.SYNO" target="_blank" rel="noopener">Читать главу ↗</a></footer></blockquote>
  <div class="myth"><span class="rubric">Распространённое заблуждение</span><p>Трубы и чаши — это четырнадцать отдельных бедствий, которые произойдут одно за другим в последние несколько лет истории.</p></div>
  <div class="teach">
    <h2>Чему учит Писание</h2>
    <p class="illum">Обе серии построены по образцу казней, которые Бог послал на Египет перед исходом: град и огонь, вода, превращённая в кровь, тьма, саранча, язвы. Смысл тот же, что и в книге Исход. Бог судит мир, который поклоняется ложным богам и угнетает Его народ, и выводит Свой народ на свободу. Прямо перед тем, как звучат трубы, молитвы святых возносятся от жертвенника, и огонь повергается на землю (8:3–5). <strong>Суды — это Божий ответ на молитвы Его народа.</strong></p>
    <p>Обе серии поражают одни и те же цели в одном и том же порядке. Разница — в том, насколько далеко они простираются. Трубы падают на «третью часть»: это частичные суды-предупреждения, и всё же мир не раскаивается (9:20–21). Чаши — это «семь последних язв, которыми оканчивалась ярость Божия» (15:1). Это не более поздние события, а тот же образец, явленный в полную силу, в конце эпохи.</p>
  </div>
  <div class="table-scroll wide"><table class="parallels">
    <caption>Те же цели, тот же порядок. Трубы предупреждают; чаши завершают.</caption>
    <thead><tr><th scope="col">Цель</th><th scope="col">Трубы · частично</th><th scope="col">Чаши · полностью</th></tr></thead>
    <tbody>
      <tr><th scope="row">1 · Земля<small>Исход: град, язвы</small></th><td><span class="ref">8:7</span>Град и огонь; третья часть дерев сгорела</td><td><span class="ref">16:2</span>Гнойные раны на имеющих начертание зверя</td></tr>
      <tr><th scope="row">2 · Море<small>Исход: кровь</small></th><td><span class="ref">8:8–9</span>Третья часть моря сделалась кровью</td><td><span class="ref">16:3</span>Море сделалось кровью; всё живое в нём умерло</td></tr>
      <tr><th scope="row">3 · Реки и источники</th><td><span class="ref">8:10–11</span>Звезда «полынь»; третья часть вод стала горькой</td><td><span class="ref">16:4–7</span>Реки и источники сделались кровью</td></tr>
      <tr><th scope="row">4 · Солнце</th><td><span class="ref">8:12</span>Затмилась третья часть солнца, луны и звёзд</td><td><span class="ref">16:8–9</span>Солнце жжёт людей огнём</td></tr>
      <tr><th scope="row">5 · Тьма<small>Исход: тьма, саранча</small></th><td><span class="ref">9:1–11</span>Бездна отверзлась; дым затмил небо; саранча</td><td><span class="ref">16:10–11</span>Царство зверя погрузилось во тьму</td></tr>
      <tr><th scope="row">6 · Евфрат</th><td><span class="ref">9:13–21</span>Освобождены четыре Ангела при реке; огромное войско</td><td><span class="ref">16:12–16</span>Река высохла; цари собраны к Армагеддону</td></tr>
      <tr class="final"><th scope="row">7 · Конец</th><td><span class="ref">11:15–19</span>«Царство мира соделалось царством Господа нашего»; молнии, землетрясение, град</td><td><span class="ref">16:17–21</span>«Совершилось!»; величайшее землетрясение, огромный град</td></tr>
    </tbody>
  </table></div>
  <section class="evidence" aria-labelledby="ev-trumpets">
    <h2 id="ev-trumpets">Откуда мы это знаем?</h2>
    <details class="ev"><summary><span class="ev-n">01</span><span class="ev-ref">Исход 7–10</span><i class="tag link">Связь</i></summary><div class="ev-body"><p>Кровь, град, саранча, тьма и язвы — это казни египетские, повторённые в Откровении как суды над новым фараоном.</p><a href="https://www.bible.com/bible/400/EXO.9.SYNO" target="_blank" rel="noopener">Читать Исход 9 ↗</a></div></details>
    <details class="ev"><summary><span class="ev-n">02</span><span class="ev-ref">Откровение 8:3–5</span><i class="tag stated">Сказано</i></summary><div class="ev-body"><p>Фимиам с молитвами святых возносится пред Бога, а затем огонь с того же жертвенника повергается на землю.</p><a href="https://www.bible.com/bible/400/REV.8.SYNO" target="_blank" rel="noopener">Читать Откровение 8 ↗</a></div></details>
    <details class="ev"><summary><span class="ev-n">03</span><span class="ev-ref">Откровение 9:4, 20–21</span><i class="tag stated">Сказано</i></summary><div class="ev-body"><p>Имеющие печать Божию защищены, а казни — это призывы к покаянию, которые мир отвергает.</p><a href="https://www.bible.com/bible/400/REV.9.SYNO" target="_blank" rel="noopener">Читать Откровение 9 ↗</a></div></details>
    <details class="ev"><summary><span class="ev-n">04</span><span class="ev-ref">Откровение 15:1</span><i class="tag inference">Вывод</i></summary><div class="ev-body"><p>Чаши названы «последними», потому что ими оканчивается ярость Божия. Понимать их как трубы в полную силу, а не как более поздние события, — вывод из совпадающей семичастной схемы.</p><a href="https://www.bible.com/bible/400/REV.15.SYNO" target="_blank" rel="noopener">Читать Откровение 15 ↗</a></div></details>
  </section>
  <details class="alt"><summary>Как читают другие</summary><div class="alt-body"><div class="alt-grid">
    <article><h3>Хронологический обратный отсчёт</h3><p>Футуристы обычно читают печати, трубы и чаши как двадцать один последовательный суд: трубы выходят из седьмой печати, а чаши — из седьмой трубы.</p></article>
    <article class="ours"><h3>Параллельные циклы одной эпохи</h3><p>Трубы предупреждают на протяжении всей эпохи; чаши показывают те же суды завершёнными в её конце. Обе серии заканчиваются одной и той же бурей от престола.</p></article>
  </div></div></details>
  <aside class="lesson"><span class="rubric">Урок, который нужно запомнить</span><p>Каждое бедствие в этом мире — это труба: призыв покаяться, пока ещё есть время.</p></aside>
  <section class="quiz"><span class="rubric">Проверьте себя</span><h3>В чём главное различие между трубами и чашами?</h3><div class="quiz-options"><button class="quiz-opt" data-correct>Трубы поражают третью часть как предупреждение; чаши — всё целиком</button><button class="quiz-opt">Они поражают совершенно разные части творения</button><button class="quiz-opt">Чаши изливаются на церковь</button></div><p class="quiz-feedback" hidden>Обе серии поражают одни и те же семь целей в одном порядке. Трубы — частичные («третья часть»), а чашами оканчивается ярость Божия (15:1).</p></section>
</section>

<section class="page topic" id="witnesses" data-nav="Кто такие два свидетеля?" data-num="06" data-keywords="два свидетеля маслины светильники моисей илия откровение 11 храм измерен вретище пророчествовать">
  <p class="eyebrow">Вопрос 06 · Откровение 11</p>
  <h1>Кто такие два свидетеля?</h1>
  <p class="deck">Церковь, свидетельствующая народам</p>
  <div class="locator" data-vision="3"></div>
  <ul class="refs" aria-label="Отрывки для чтения"><li class="refs-label">Читать в Синодальном переводе</li><li><a href="https://www.bible.com/bible/400/REV.11.SYNO" target="_blank" rel="noopener">Откровение 11</a></li><li><a href="https://www.bible.com/bible/400/ZEC.4.SYNO" target="_blank" rel="noopener">Захария 4</a></li><li><a href="https://www.bible.com/bible/400/DEU.19.SYNO" target="_blank" rel="noopener">Второзаконие 19</a></li></ul>
  <figure class="art"><img data-art src="https://commons.wikimedia.org/wiki/Special:FilePath/Albrecht_D%C3%BCrer_-_Saint_John_Devouring_the_Book_(NGA_1941.3.9).jpg?width=1000" alt="Гравюра: могучий ангел с ногами, как огненные столпы, подаёт Иоанну книжку, и тот съедает её." loading="lazy" decoding="async" width="1000" height="1400"><figcaption><b>Святой Иоанн, поглощающий книгу</b>, Альбрехт Дюрер, около 1496–1498. Прямо перед появлением свидетелей Иоанну сказано: «тебе надлежит опять пророчествовать» (10:11). Историческое произведение, а не буквальное изображение видения.</figcaption></figure>
  <blockquote class="passage"><span class="rubric">Текст</span><p>И дам двум свидетелям Моим, и они будут пророчествовать тысячу двести шестьдесят дней, будучи облечены во вретище. Это суть две маслины и два светильника, стоящие пред Богом земли.</p><footer><cite>Откровение 11:3–4</cite><a href="https://www.bible.com/bible/400/REV.11.SYNO" target="_blank" rel="noopener">Читать главу ↗</a></footer></blockquote>
  <div class="myth"><span class="rubric">Распространённое заблуждение</span><p>Два конкретных пророка — возможно, вернувшиеся Моисей и Илия — будут проповедовать в восстановленном храме в Иерусалиме во время будущей скорби.</p></div>
  <div class="teach">
    <h2>Чему учит Писание</h2>
    <p class="illum">Откровение само говорит нам, кто они: «два светильника» (11:4). А что такое светильники, оно уже сказало: «семь светильников… суть семь церквей» (1:20). Свидетели — это <strong>церковь в её призвании свидетельствовать</strong>. Почему два? Потому что закон требовал двух свидетелей, чтобы дело состоялось (Второзаконие 19:15), и Иисус посылал учеников по двое. Возможно, важно и то, что только две из семи церквей — Смирна и Филадельфия — не получили обличения.</p>
    <p>Их власть — это власть Моисея и Илии: «затворить небо, чтобы не шел дождь», как Илия на три года и шесть месяцев (Иакова 5:17), и превращать воды «в кровь», как Моисей в Египте (11:6). Церковь несёт всё свидетельство Закона и Пророков. Её история повторяет историю её Господа. Она пророчествует всю эпоху (1260 дней), она защищена, пока не завершит своё дело, а затем, в самом конце, зверь побеждает её. Три с половиной дня мир торжествует на улице «великого города… где и Господь наш распят». Затем в свидетелей входит «дух жизни от Бога», они встают на ноги и восходят на небо на облаке на глазах у своих врагов (11:11–12). Сразу же седьмая труба возвещает конец.</p>
  </div>
  <section class="evidence" aria-labelledby="ev-witnesses">
    <h2 id="ev-witnesses">Откуда мы это знаем?</h2>
    <details class="ev"><summary><span class="ev-n">01</span><span class="ev-ref">Откровение 11:4 и 1:20</span><i class="tag stated">Сказано</i></summary><div class="ev-body"><p>Свидетели — это светильники, а светильники — это церкви. Откровение само толкует свой символ.</p><a href="https://www.bible.com/bible/400/REV.1.SYNO" target="_blank" rel="noopener">Читать Откровение 1 ↗</a></div></details>
    <details class="ev"><summary><span class="ev-n">02</span><span class="ev-ref">Захария 4:2–3, 14</span><i class="tag link">Связь</i></summary><div class="ev-body"><p>Захария видел светильник и рядом две маслины — «два помазанные елеем, предстоящие Господу всей земли»: народ Божий, наделённый силой Его Духа.</p><a href="https://www.bible.com/bible/400/ZEC.4.SYNO" target="_blank" rel="noopener">Читать Захария 4 ↗</a></div></details>
    <details class="ev"><summary><span class="ev-n">03</span><span class="ev-ref">Откровение 11:6; Иакова 5:17; Исход 7:20</span><i class="tag link">Связь</i></summary><div class="ev-body"><p>Затворённое небо напоминает об Илии; вода, превращённая в кровь, — о Моисее.</p><a href="https://www.bible.com/bible/400/JAS.5.SYNO" target="_blank" rel="noopener">Читать Иакова 5 ↗</a></div></details>
    <details class="ev"><summary><span class="ev-n">04</span><span class="ev-ref">Откровение 11:8</span><i class="tag stated">Сказано</i></summary><div class="ev-body"><p>Великий город «духовно называется Содом и Египет». Сам текст показывает, что место символическое: это мировой город, отвергающий Бога.</p><a href="https://www.bible.com/bible/400/REV.11.SYNO" target="_blank" rel="noopener">Читать Откровение 11 ↗</a></div></details>
    <details class="ev"><summary><span class="ev-n">05</span><span class="ev-ref">Два конкретных человека?</span><i class="tag caution">Осторожно</i></summary><div class="ev-body"><p>Некоторые вдумчивые толкователи, в том числе некоторые амилленаристы, считают, что в конце явятся и два конкретных пророка. Символическое прочтение выше не требует это исключать, но текст не называет имён.</p></div></details>
  </section>
  <details class="alt"><summary>Как читают другие</summary><div class="alt-body"><div class="alt-grid">
    <article><h3>Два пророка последнего времени</h3><p>Футуристы обычно ожидают двух буквальных пророков — часто это Моисей и Илия или Енох и Илия, — служащих в Иерусалиме три с половиной года.</p></article>
    <article class="ours"><h3>Свидетель­ствующая церковь</h3><p>Два светильника — это церковь, пророчествующая на протяжении всей эпохи, ненадолго замолкающая в конце и оправданная при возвращении Христа.</p></article>
  </div></div></details>
  <aside class="lesson"><span class="rubric">Урок, который нужно запомнить</span><p>Церковь призвана не к удобству, а к верности. Её свидетельство нельзя заглушить, пока Бог не скажет, что её дело окончено.</p></aside>
  <section class="quiz"><span class="rubric">Проверьте себя</span><h3>Откровение называет свидетелей «два светильника». Что такое светильники в Откровении?</h3><div class="quiz-options"><button class="quiz-opt" data-correct>Церкви (1:20)</button><button class="quiz-opt">Ангелы, охраняющие Иерусалим</button><button class="quiz-opt">Две половины Библии</button></div><p class="quiz-feedback" hidden>«Семь светильников, которые ты видел, суть семь церквей» (1:20). Значит, два светильника из 11:4 указывают на церковь как на Божьего свидетеля.</p></section>
</section>

<section class="page topic" id="1260" data-nav="Что означают 1260 дней?" data-num="07" data-keywords="1260 дней 42 месяца время времена полвремени три с половиной года даниил 7 12 пустыня числа">
  <p class="eyebrow">Вопрос 07 · Откровение 11–13</p>
  <h1>Что означают 1260 дней?</h1>
  <p class="deck">Один период испытаний под пятью именами</p>
  <div class="locator" data-vision="3,4"></div>
  <ul class="refs" aria-label="Отрывки для чтения"><li class="refs-label">Читать в Синодальном переводе</li><li><a href="https://www.bible.com/bible/400/REV.12.SYNO" target="_blank" rel="noopener">Откровение 12</a></li><li><a href="https://www.bible.com/bible/400/DAN.7.SYNO" target="_blank" rel="noopener">Даниил 7</a></li><li><a href="https://www.bible.com/bible/400/DAN.12.SYNO" target="_blank" rel="noopener">Даниил 12</a></li></ul>
  <figure class="art"><img data-art src="https://commons.wikimedia.org/wiki/Special:FilePath/Albrecht_D%C3%BCrer,_The_Apocalyptic_Woman,_1498,_NGA_142358.jpg?width=1000" alt="Гравюра: жене, облечённой в солнце и стоящей на луне, даны орлиные крылья; ей угрожает семиглавый дракон, а её дитя возносится к Богу." loading="lazy" decoding="async" width="1000" height="1400"><figcaption><b>Жена, облечённая в солнце</b>, Альбрехт Дюрер, 1498. Жену питают в пустыне 1260 дней. Историческое произведение, а не буквальное изображение видения.</figcaption></figure>
  <blockquote class="passage"><span class="rubric">Текст</span><p>И родила она младенца мужеского пола, которому надлежит пасти все народы жезлом железным; и восхищено было дитя ее к Богу и престолу Его. А жена убежала в пустыню, где приготовлено было для нее место от Бога, чтобы питали ее там тысячу двести шестьдесят дней.</p><footer><cite>Откровение 12:5–6</cite><a href="https://www.bible.com/bible/400/REV.12.SYNO" target="_blank" rel="noopener">Читать главу ↗</a></footer></blockquote>
  <div class="myth"><span class="rubric">Распространённое заблуждение</span><p>Эти числа — секундомер последних трёх с половиной лет истории, и по ним можно вычислить, когда вернётся Христос.</p></div>
  <div class="teach">
    <h2>Чему учит Писание</h2>
    <p class="illum">Посмотрите, когда начинается этот период в 12-й главе. Младенец рождается, и «восхищено было дитя ее к Богу и престолу Его» — это рождение и вознесение Христа. Затем жена убегает, и её питают 1260 дней. <strong>Период начинается с первого пришествия Христа.</strong> Это время церкви в пустыне — между вознесением и возвращением.</p>
    <p>Откровение называет этот период тремя способами: сорок два месяца, тысяча двести шестьдесят дней и «времени, времен и полвремени», то есть три с половиной года. Все три взяты из книги Даниила, где время жестокого, но ограниченного гонения длится «до времени и времен и полувремени» (Даниил 7:25; 12:7). Три с половиной — это половина от семи: время, которое <em>сокращено</em>. Оно напоминает и о трёх годах и шести месяцах Илии, когда Бог питал его, а земля была под судом (Иакова 5:17). Церковь попирают, но хранят, гонят, но питают, и срок устанавливает Бог, а не дракон.</p>
  </div>
  <ul class="periods" aria-label="Пять имён одного периода">
    <li><b>42 месяца</b><span>Язычники попирают внешний двор; внутренний храм измерен и сохранён</span><span class="ref">11:2</span></li>
    <li><b>1260 дней</b><span>Два свидетеля пророчествуют во вретище</span><span class="ref">11:3</span></li>
    <li><b>1260 дней</b><span>Жену питают в пустыне</span><span class="ref">12:6</span></li>
    <li><b>Время, времена и полвремени</b><span>Жена питается вне досягаемости змия</span><span class="ref">12:14</span></li>
    <li><b>42 месяца</b><span>Зверю дана власть богохульствовать и вести войну</span><span class="ref">13:5</span></li>
    <li class="short"><b>Три дня с половиною</b><span>В самом конце свидетели лежат мёртвыми, а мир торжествует, пока Бог не воскрешает их</span><span class="ref">11:9–11</span></li>
  </ul>
  <section class="evidence" aria-labelledby="ev-1260">
    <h2 id="ev-1260">Откуда мы это знаем?</h2>
    <details class="ev"><summary><span class="ev-n">01</span><span class="ev-ref">Откровение 12:5–6</span><i class="tag stated">Сказано</i></summary><div class="ev-body"><p>Жена убегает на 1260 дней сразу после того, как дитя восхищено к Божьему престолу.</p><a href="https://www.bible.com/bible/400/REV.12.SYNO" target="_blank" rel="noopener">Читать Откровение 12 ↗</a></div></details>
    <details class="ev"><summary><span class="ev-n">02</span><span class="ev-ref">Откровение 12:6, 14</span><i class="tag stated">Сказано</i></summary><div class="ev-body"><p>Одно и то же событие — жену питают в пустыне — названо и «тысячу двести шестьдесят дней», и «в продолжение времени, времен и полвремени».</p><a href="https://www.bible.com/bible/400/REV.12.SYNO" target="_blank" rel="noopener">Читать Откровение 12 ↗</a></div></details>
    <details class="ev"><summary><span class="ev-n">03</span><span class="ev-ref">Даниил 7:25; 12:7</span><i class="tag link">Связь</i></summary><div class="ev-body"><p>Даниил говорит «до времени и времен и полувремени» о гонении на святых со стороны враждебной власти — об ограниченном периоде, которому Бог кладёт конец.</p><a href="https://www.bible.com/bible/400/DAN.7.SYNO" target="_blank" rel="noopener">Читать Даниил 7 ↗</a></div></details>
    <details class="ev"><summary><span class="ev-n">04</span><span class="ev-ref">Точные даты</span><i class="tag caution">Осторожно</i></summary><div class="ev-body"><p>Многие пытались превратить эти числа в календари. Каждая такая дата не сбылась, а Иисус сказал: «О дне же том и часе никто не знает» (Матфея 24:36).</p></div></details>
  </section>
  <details class="alt"><summary>Как читают другие</summary><div class="alt-body"><div class="alt-grid">
    <article><h3>Вторая половина 70-й седмины Даниила</h3><p>Футуристы понимают 1260 дней как буквальные дни второй половины семилетней скорби. Историцисты часто читают их как 1260 лет.</p></article>
    <article class="ours"><h3>Вся эпоха церкви</h3><p>Эти числа описывают один ограниченный Богом период — от вознесения до возвращения, — увиденный как попрание, свидетельство, защита и гонение.</p></article>
  </div></div></details>
  <aside class="lesson"><span class="rubric">Урок, который нужно запомнить</span><p>У пустыни церкви есть дата окончания, и её назначил Бог. А до тех пор Он питает Свой народ.</p></aside>
  <section class="quiz"><span class="rubric">Проверьте себя</span><h3>В Откровении 12 1260 дней жены начинаются сразу после какого события?</h3><div class="quiz-options"><button class="quiz-opt" data-correct>Её дитя восхищено к Богу и престолу Его</button><button class="quiz-opt">Восхищение церкви</button><button class="quiz-opt">Восстановление храма</button></div><p class="quiz-feedback" hidden>Дитя, Христос, восхищено к Божьему престолу (12:5), и затем жена убегает (12:6). Период начинается с Его вознесения.</p></section>
</section>

<section class="page topic" id="satan" data-nav="Правит ли сатана миром?" data-num="08" data-keywords="сатана диавол дракон змий война на небе михаил клеветник низвержен откровение 12 крест побежден">
  <p class="eyebrow">Вопрос 08 · Откровение 12</p>
  <h1>Правит ли сатана миром?</h1>
  <p class="deck">Побеждённый враг, чьё время на исходе</p>
  <div class="locator" data-vision="4,7"></div>
  <ul class="refs" aria-label="Отрывки для чтения"><li class="refs-label">Читать в Синодальном переводе</li><li><a href="https://www.bible.com/bible/400/REV.12.SYNO" target="_blank" rel="noopener">Откровение 12</a></li><li><a href="https://www.bible.com/bible/400/JHN.12.SYNO" target="_blank" rel="noopener">Иоанна 12</a></li><li><a href="https://www.bible.com/bible/400/COL.2.SYNO" target="_blank" rel="noopener">Колоссянам 2</a></li></ul>
  <figure class="art"><img data-art src="https://commons.wikimedia.org/wiki/Special:FilePath/Albrecht_D%C3%BCrer_-_Saint_Michael_Fighting_the_Dragon_(NGA_2008.109.12).jpg?width=1000" alt="Гравюра: архангел Михаил и его ангелы поражают копьями дракона и его бесов в небе над тихим пейзажем." loading="lazy" decoding="async" width="1000" height="1400"><figcaption><b>Святой Михаил, сражающийся с драконом</b>, Альбрехт Дюрер, 1498. Историческое произведение, а не буквальное изображение видения.</figcaption></figure>
  <blockquote class="passage"><span class="rubric">Текст</span><p>И низвержен был великий дракон, древний змий, называемый диаволом и сатаною, обольщающий всю вселенную, низвержен на землю, и ангелы его низвержены с ним.</p><footer><cite>Откровение 12:9</cite><a href="https://www.bible.com/bible/400/REV.12.SYNO" target="_blank" rel="noopener">Читать главу ↗</a></footer></blockquote>
  <div class="myth"><span class="rubric">Распространённое заблуждение</span><p>Бог и сатана — две равные силы, сцепившиеся в борьбе, исход которой ещё не ясен.</p></div>
  <div class="teach">
    <h2>Чему учит Писание</h2>
    <p class="illum">Война на небе в Откровении 12 — не о том, что было до сотворения мира. Она происходит из-за креста. Дитя восхищено к Божьему престолу, дракон низвержен, и небо объясняет почему: «ныне настало спасение и сила и царство Бога нашего… потому что <strong>низвержен клеветник братий наших</strong>». Святые «победили его кровию Агнца и словом свидетельства своего» (12:10–11). То же самое сказал Иисус, идя на крест: «ныне князь мира сего изгнан будет вон» (Иоанна 12:31).</p>
    <p>Итак, сатана реален, опасен и разъярён, но он — побеждённое творение. Он больше не может обвинять Божий народ пред Богом, потому что Христос заплатил за их грехи. Он свирепствует на земле, «зная, что немного ему остается времени» (12:12). Он по-прежнему гонит и обманывает, и Пётр предупреждает, что он «ходит, как рыкающий лев» (1 Петра 5:8). Но он на цепи (20:1–3), приговор ему вынесен, и озеро огненное ждёт его (20:10).</p>
  </div>
  <section class="evidence" aria-labelledby="ev-satan">
    <h2 id="ev-satan">Откуда мы это знаем?</h2>
    <details class="ev"><summary><span class="ev-n">01</span><span class="ev-ref">Откровение 12:5, 9–11</span><i class="tag stated">Сказано</i></summary><div class="ev-body"><p>Дракон низвержен после того, как дитя восхищено к Богу, и небо празднует пришествие спасения через кровь Агнца.</p><a href="https://www.bible.com/bible/400/REV.12.SYNO" target="_blank" rel="noopener">Читать Откровение 12 ↗</a></div></details>
    <details class="ev"><summary><span class="ev-n">02</span><span class="ev-ref">Иоанна 12:31; Луки 10:18; Колоссянам 2:15</span><i class="tag link">Связь</i></summary><div class="ev-body"><p>Иисус видел сатану, «спадшего с неба, как молнию», и говорил об изгнании князя мира сего; Павел пишет, что Христос, «отняв силы у начальств и властей», восторжествовал над ними.</p><a href="https://www.bible.com/bible/400/COL.2.SYNO" target="_blank" rel="noopener">Читать Колоссянам 2 ↗</a></div></details>
    <details class="ev"><summary><span class="ev-n">03</span><span class="ev-ref">Откровение 12:12; 1 Петра 5:8</span><i class="tag stated">Сказано</i></summary><div class="ev-body"><p>Диавол всё ещё действует и яростен, но времени у него немного.</p><a href="https://www.bible.com/bible/400/1PE.5.SYNO" target="_blank" rel="noopener">Читать 1 Петра 5 ↗</a></div></details>
    <details class="ev"><summary><span class="ev-n">04</span><span class="ev-ref">Откровение 20:10</span><i class="tag stated">Сказано</i></summary><div class="ev-body"><p>Диавол, прельщавший народы, ввержен в озеро огненное. Его конец несомненен.</p><a href="https://www.bible.com/bible/400/REV.20.SYNO" target="_blank" rel="noopener">Читать Откровение 20 ↗</a></div></details>
  </section>
  <details class="alt"><summary>Как читают другие</summary><div class="alt-body"><div class="alt-grid">
    <article><h3>Будущее или изначальное падение</h3><p>Одни читают войну на небе как изначальный мятеж сатаны до сотворения мира; другие относят её к середине будущей скорби.</p></article>
    <article class="ours"><h3>Низвержен крестом</h3><p>Контекст связывает поражение сатаны со смертью и вознесением Христа. Откровение 12 объясняет, почему диавол свирепствует сейчас: он проиграл и знает это.</p></article>
  </div></div></details>
  <aside class="lesson"><span class="rubric">Урок, который нужно запомнить</span><p>Не недооценивайте диавола, но никогда не думайте, что он равен Богу. Клеветник низвержен.</p></aside>
  <section class="quiz"><span class="rubric">Проверьте себя</span><h3>Как святые побеждают дракона в Откровении 12?</h3><div class="quiz-options"><button class="quiz-opt" data-correct>Кровью Агнца и словом своего свидетельства</button><button class="quiz-opt">Одолевая его собственными ангельскими войсками</button><button class="quiz-opt">Никак: исход всё ещё не решён</button></div><p class="quiz-feedback" hidden>«Они победили его кровию Агнца и словом свидетельства своего» (12:11). Победа была одержана на кресте.</p></section>
</section>

<section class="page topic" id="beast" data-nav="Что такое зверь?" data-num="09" data-keywords="зверь из моря из земли лжепророк даниил 7 рим империя откровение 13 государство власть">
  <p class="eyebrow">Вопрос 09 · Откровение 13</p>
  <h1>Что такое зверь?</h1>
  <p class="deck">Власть, выдающая себя за Бога</p>
  <div class="locator" data-vision="4,6"></div>
  <ul class="refs" aria-label="Отрывки для чтения"><li class="refs-label">Читать в Синодальном переводе</li><li><a href="https://www.bible.com/bible/400/REV.13.SYNO" target="_blank" rel="noopener">Откровение 13</a></li><li><a href="https://www.bible.com/bible/400/DAN.7.SYNO" target="_blank" rel="noopener">Даниил 7</a></li><li><a href="https://www.bible.com/bible/400/REV.19.SYNO" target="_blank" rel="noopener">Откровение 19</a></li></ul>
  <figure class="art"><img data-art src="https://commons.wikimedia.org/wiki/Special:FilePath/Albrecht_D%C3%BCrer_-_The_Seven-Headed_Beast_and_the_Beast_with_Lamb%27s_Horns_-_Google_Art_Project.jpg?width=1000" alt="Гравюра: семиглавый зверь выходит из моря, а второй зверь с рогами агнца низводит огонь; толпы преклоняются." loading="lazy" decoding="async" width="1000" height="1400"><figcaption><b>Семиглавый зверь и зверь с рогами агнца</b>, Альбрехт Дюрер, около 1496–1498. Историческое произведение, а не буквальное изображение видения.</figcaption></figure>
  <blockquote class="passage"><span class="rubric">Текст</span><p>И стал я на песке морском, и увидел выходящего из моря зверя с семью головами и десятью рогами: на рогах его было десять диадим, а на головах его имена богохульные. Зверь, которого я видел, был подобен барсу; ноги у него — как у медведя, а пасть у него — как пасть у льва; и дал ему дракон силу свою и престол свой и великую власть.</p><footer><cite>Откровение 13:1–2</cite><a href="https://www.bible.com/bible/400/REV.13.SYNO" target="_blank" rel="noopener">Читать главу ↗</a></footer></blockquote>
  <div class="myth"><span class="rubric">Распространённое заблуждение</span><p>Зверь — это только один будущий мировой диктатор, и задача христиан — вычислить, кто он.</p></div>
  <div class="teach">
    <h2>Чему учит Писание</h2>
    <p class="illum">В Даниила 7 из моря выходят четыре зверя, и Даниилу объясняют, что они означают, «что четыре царя восстанут от земли» (7:17): лев, медведь, барс и страшный четвёртый зверь. Зверь Иоанна — это все они сразу: барс, медведь и лев вместе. <strong>Это богоборческое государство</strong> — политическая власть, требующая поклонения, которое принадлежит только Богу, и ведущая «войну со святыми» (13:7). Для первых читателей Иоанна это был Рим с его культом императора. Но зверь пережил Рим. Он вновь поднимался в каждой империи, которая ставила себя на место Бога.</p>
    <p>Из земли выходит второй зверь. Он «имел два рога, подобные агнчим, и говорил как дракон» (13:11). Он творит знамения и убеждает людей поклоняться первому зверю; позже Откровение называет его лжепророком (16:13; 19:20). Это ложная религия и пропаганда на службе у государства. Вместе дракон, зверь и лжепророк образуют злую подделку под Отца, Сына и Духа. У зверя даже есть смертельная рана, которая исцелела (13:3), — пародия на воскресение. В конце этот образец достигает последней вершины — того, что Хукема назвал одновременно принципом и личностью. И тогда зверь будет схвачен и брошен в озеро огненное (19:20).</p>
  </div>
  <div class="pair-cards">
    <article class="red"><span class="ref">13:1–10 · из моря</span><h3>Первый зверь</h3><p>Политическая власть, притязающая на божественный авторитет. Хулит Бога, воюет со святыми, мир поклоняется ему.</p></article>
    <article class="red"><span class="ref">13:11–18 · из земли</span><h3>Лжепророк</h3><p>Религия и убеждение на службе у государства. Выглядит как агнец, говорит как дракон.</p></article>
  </div>
  <section class="evidence" aria-labelledby="ev-beast">
    <h2 id="ev-beast">Откуда мы это знаем?</h2>
    <details class="ev"><summary><span class="ev-n">01</span><span class="ev-ref">Даниил 7:3–7, 17</span><i class="tag stated">Сказано</i></summary><div class="ev-body"><p>Звери Даниила, выходящие из моря, истолкованы как цари и царства.</p><a href="https://www.bible.com/bible/400/DAN.7.SYNO" target="_blank" rel="noopener">Читать Даниил 7 ↗</a></div></details>
    <details class="ev"><summary><span class="ev-n">02</span><span class="ev-ref">Откровение 13:1–2</span><i class="tag link">Связь</i></summary><div class="ev-body"><p>Зверь Иоанна соединяет барса, медведя и льва из Даниила и имеет десять рогов, как четвёртый зверь Даниила.</p><a href="https://www.bible.com/bible/400/REV.13.SYNO" target="_blank" rel="noopener">Читать Откровение 13 ↗</a></div></details>
    <details class="ev"><summary><span class="ev-n">03</span><span class="ev-ref">Откровение 13:11–14; 19:20</span><i class="tag stated">Сказано</i></summary><div class="ev-body"><p>Второй зверь направляет поклонение к первому, а позже назван лжепророком.</p><a href="https://www.bible.com/bible/400/REV.19.SYNO" target="_blank" rel="noopener">Читать Откровение 19 ↗</a></div></details>
    <details class="ev"><summary><span class="ev-n">04</span><span class="ev-ref">Откровение 17:9–11</span><i class="tag caution">Осторожно</i></summary><div class="ev-body"><p>«Семь голов суть семь гор» и семь царей — это указывало читателям первого века на Рим. Попытки сопоставить царей с точным списком императоров так и не привели к согласию.</p><a href="https://www.bible.com/bible/400/REV.17.SYNO" target="_blank" rel="noopener">Читать Откровение 17 ↗</a></div></details>
  </section>
  <details class="alt"><summary>Как читают другие</summary><div class="alt-body"><div class="alt-grid">
    <article><h3>Один будущий правитель</h3><p>Футуристы видят в звере из моря прежде всего грядущего мирового диктатора и его империю, а в лжепророке — его религиозного союзника.</p></article>
    <article class="ours"><h3>Государство-гонитель во все века</h3><p>Сначала Рим, затем всякая богоборческая власть, и последнее воплощение в конце. Зверь — это образец, который завершится в личности.</p></article>
  </div></div></details>
  <aside class="lesson"><span class="rubric">Урок, который нужно запомнить</span><p>Власти — слуги Божии, но никогда не Бог. Когда какая-либо власть требует поклонения, принадлежащего Христу, христианин должен отказаться.</p></aside>
  <section class="quiz"><span class="rubric">Проверьте себя</span><h3>В какой главе Ветхого Завета звери из моря объяснены как царства?</h3><div class="quiz-options"><button class="quiz-opt" data-correct>Даниил 7</button><button class="quiz-opt">Бытие 1</button><button class="quiz-opt">Псалом 22</button></div><p class="quiz-feedback" hidden>Даниил видел четырёх зверей, выходящих из моря, и ему было сказано, что они означают «четыре царя» (Даниил 7:17). Зверь Иоанна соединяет их всех.</p></section>
</section>

<section class="page topic" id="666" data-nav="Что означает число 666?" data-num="10" data-keywords="666 616 число зверя нерон гематрия шесть семь откровение 13 18">
  <p class="eyebrow">Вопрос 10 · Откровение 13:18</p>
  <h1>Что означает число 666?</h1>
  <p class="deck">Число, а не проклятие</p>
  <div class="locator" data-vision="4"></div>
  <ul class="refs" aria-label="Отрывки для чтения"><li class="refs-label">Читать в Синодальном переводе</li><li><a href="https://www.bible.com/bible/400/REV.13.SYNO" target="_blank" rel="noopener">Откровение 13</a></li></ul>
  <div class="number-art" aria-hidden="true">
    <div><span class="big">7</span><small>Число Божьей полноты: семь церквей, печатей, труб, чаш</small></div>
    <div class="red"><span class="big">666</span><small>Шесть, и шесть, и шесть: всегда на одну меньше семи</small></div>
  </div>
  <blockquote class="passage"><span class="rubric">Текст</span><p>Здесь мудрость. Кто имеет ум, тот сочти число зверя, ибо это число человеческое; число его шестьсот шестьдесят шесть.</p><footer><cite>Откровение 13:18</cite><a href="https://www.bible.com/bible/400/REV.13.SYNO" target="_blank" rel="noopener">Читать главу ↗</a></footer></blockquote>
  <div class="myth"><span class="rubric">Распространённое заблуждение</span><p>Цифры 666 опасны сами по себе, поэтому увидеть их на чеке, номерном знаке или в номере телефона — к беде.</p></div>
  <div class="teach">
    <h2>Чему учит Писание</h2>
    <p class="illum">В Откровении семь — число полноты, число совершенного Божьего дела. Шесть не дотягивает до него. Шесть, повторённое трижды, — это <strong>человечество, пытающееся быть Богом и всегда не дотягивающее</strong>. Зверь подражает Троице, требует поклонения и творит чудеса, но остаётся всего лишь «числом человеческим». Как бы внушительно он ни выглядел, до семи ему никогда не дойти.</p>
    <p>Есть и второй слой. В еврейском и греческом языках буквы служили также цифрами. Если записать «Нерон Кесарь» еврейскими буквами (<em>Нрвн Кср</em>), их значения в сумме дают 666. Нерон был первым императором, преследовавшим христиан, и многие римляне позже ожидали его возвращения; исцелённая рана зверя, возможно, отражает этот слух (13:3). Примечательно, что некоторые древние рукописи читают 616 — ровно столько даёт латинское написание имени Нерона еврейскими буквами. Нерон — вероятный ключ для первого века, а символический смысл простирается на все века. Одно не противоречит другому: Нерон был просто первым «человеком» числа 666.</p>
  </div>
  <section class="evidence" aria-labelledby="ev-666">
    <h2 id="ev-666">Откуда мы это знаем?</h2>
    <details class="ev"><summary><span class="ev-n">01</span><span class="ev-ref">Откровение 13:17–18</span><i class="tag stated">Сказано</i></summary><div class="ev-body"><p>Число относится к имени зверя, и это «число человеческое». Иоанн призывает к мудрости, а не к страху.</p><a href="https://www.bible.com/bible/400/REV.13.SYNO" target="_blank" rel="noopener">Читать Откровение 13 ↗</a></div></details>
    <details class="ev"><summary><span class="ev-n">02</span><span class="ev-ref">Семёрки по всему Откровению</span><i class="tag link">Связь</i></summary><div class="ev-body"><p>Семь церквей, духов, печатей, труб, чаш и многое другое: семь обозначает полноту Божьего дела.</p></div></details>
    <details class="ev"><summary><span class="ev-n">03</span><span class="ev-ref">Нерон Кесарь = 666</span><i class="tag inference">Вывод</i></summary><div class="ev-body"><p>Еврейское написание נרון קסר (50 + 200 + 6 + 50 + 100 + 60 + 200) в сумме даёт 666; без последнего <em>н</em> — 616, вариант, который есть в некоторых рукописях. Это отождествление широко распространено, но не бесспорно.</p></div></details>
    <details class="ev"><summary><span class="ev-n">04</span><span class="ev-ref">Современные имена и устройства</span><i class="tag caution">Осторожно</i></summary><div class="ev-body"><p>Почти любое имя можно при желании подогнать под 666. Расчёты, направленные на современных лидеров, раз за разом оказывались ошибочными.</p></div></details>
  </section>
  <details class="alt"><summary>Как читают другие</summary><div class="alt-body"><div class="alt-grid">
    <article><h3>Шифр будущей личности</h3><p>Некоторые футуристы ожидают, что число укажет на последнего антихриста по его имени или по системе, которую он контролирует.</p></article>
    <article class="ours"><h3>Человечество, не дотягивающее до Бога, — впервые в Нероне</h3><p>Число изображает всякую власть, которая пытается быть Богом и терпит неудачу. Нерон был примером первого века; этот образец продолжается до конца.</p></article>
  </div></div></details>
  <aside class="lesson"><span class="rubric">Урок, который нужно запомнить</span><p>Зло может впечатлять, но оно лишь тварно. Ему всегда будет недоставать одного до Бога.</p></aside>
  <section class="quiz"><span class="rubric">Проверьте себя</span><h3>Откровение называет 666 числом …</h3><div class="quiz-options"><button class="quiz-opt" data-correct>человеческим</button><button class="quiz-opt">проклятия, которое падает на всякого, кто его увидит</button><button class="quiz-opt">даты конца света</button></div><p class="quiz-feedback" hidden>«Это число человеческое» (13:18). Зверь при всех своих притязаниях — всего лишь человек и не дотягивает до Бога.</p></section>
</section>

<section class="page topic" id="mark" data-nav="Что такое начертание зверя?" data-num="11" data-keywords="начертание зверя метка печать зверя чело рука печать бога покупать продавать верность поклонение чип штрихкод откровение 13 14">
  <p class="eyebrow">Вопрос 11 · Откровение 13:16–17</p>
  <h1>Что такое начертание зверя?</h1>
  <p class="deck">Вопрос верности</p>
  <div class="locator" data-vision="4"></div>
  <ul class="refs" aria-label="Отрывки для чтения"><li class="refs-label">Читать в Синодальном переводе</li><li><a href="https://www.bible.com/bible/400/REV.13.SYNO" target="_blank" rel="noopener">Откровение 13</a></li><li><a href="https://www.bible.com/bible/400/REV.14.SYNO" target="_blank" rel="noopener">Откровение 14</a></li><li><a href="https://www.bible.com/bible/400/REV.7.SYNO" target="_blank" rel="noopener">Откровение 7</a></li><li><a href="https://www.bible.com/bible/400/DEU.6.SYNO" target="_blank" rel="noopener">Второзаконие 6</a></li></ul>
  <blockquote class="passage"><span class="rubric">Текст</span><p>И он сделает то, что всем, малым и великим, богатым и нищим, свободным и рабам, положено будет начертание на правую руку их или на чело их, и что никому нельзя будет ни покупать, ни продавать, кроме того, кто имеет это начертание, или имя зверя, или число имени его.</p><footer><cite>Откровение 13:16–17</cite><a href="https://www.bible.com/bible/400/REV.13.SYNO" target="_blank" rel="noopener">Читать главу ↗</a></footer></blockquote>
  <div class="myth"><span class="rubric">Распространённое заблуждение</span><p>Начертание — это микрочип, штрихкод, прививка или цифровой паспорт, который человек может получить случайно.</p></div>
  <div class="teach">
    <h2>Чему учит Писание</h2>
    <p class="illum">В Откровении два знака, а не один. Прежде чем зверь отметит кого-либо, Бог кладёт печать «на челах рабов Бога нашего» (7:3), а у 144 000 «имя Отца Его написано на челах» (14:1). Никто не думает, что Божья печать — это татуировка. Она означает, что они принадлежат Ему. <strong>Начертание зверя — это подделка</strong>: оно показывает, кто принадлежит зверю.</p>
    <p>Почему рука и чело? Потому что Бог велел Израилю о Своих словах: «навяжи их в знак на руку твою, и да будут они повязкою над глазами твоими» (Второзаконие 6:8) — то есть Его слово должно управлять тем, что они думают и что делают. Начертание зверя — противоположность этому: ум и жизнь, подчинённые верности богоборческой власти. Подробность о покупке и продаже показывает, как действует это давление. Во времена Иоанна ремесленная гильдия могла исключить того, кто отказывался чтить богов и императора. Откровение говорит о поклонении и верности, и каждый человек несёт тот или другой знак.</p>
  </div>
  <div class="pair-cards">
    <article class="dark"><span class="ref">7:3 · 14:1 · 22:4</span><h3>Печать Божия</h3><p>Имя Отца и Агнца на челе. Принадлежность, защита, а в конце — лицезрение Его.</p></article>
    <article class="red"><span class="ref">13:16–17 · 14:9–11</span><h3>Начертание зверя</h3><p>Имя зверя на руке или на челе. Верность, купленная доступом к рынку и утраченная на суде.</p></article>
  </div>
  <section class="evidence" aria-labelledby="ev-mark">
    <h2 id="ev-mark">Откуда мы это знаем?</h2>
    <details class="ev"><summary><span class="ev-n">01</span><span class="ev-ref">Откровение 13:15–17</span><i class="tag stated">Сказано</i></summary><div class="ev-body"><p>Начертание сопровождается поклонением образу зверя и отлучением от купли и продажи.</p><a href="https://www.bible.com/bible/400/REV.13.SYNO" target="_blank" rel="noopener">Читать Откровение 13 ↗</a></div></details>
    <details class="ev"><summary><span class="ev-n">02</span><span class="ev-ref">Откровение 7:3; 14:1; 22:4</span><i class="tag link">Связь</i></summary><div class="ev-body"><p>Рабы Божии запечатлены Его именем на челах. Откровение ставит два знака рядом.</p><a href="https://www.bible.com/bible/400/REV.14.SYNO" target="_blank" rel="noopener">Читать Откровение 14 ↗</a></div></details>
    <details class="ev"><summary><span class="ev-n">03</span><span class="ev-ref">Второзаконие 6:6–8</span><i class="tag link">Связь</i></summary><div class="ev-body"><p>Божьи слова нужно было навязывать на руку и носить над глазами: мысли и дела, посвящённые Ему.</p><a href="https://www.bible.com/bible/400/DEU.6.SYNO" target="_blank" rel="noopener">Читать Второзаконие 6 ↗</a></div></details>
    <details class="ev"><summary><span class="ev-n">04</span><span class="ev-ref">Откровение 14:9–11</span><i class="tag stated">Сказано</i></summary><div class="ev-body"><p>Принятие начертания связано с поклонением зверю. Это избранная верность, а не случайность.</p><a href="https://www.bible.com/bible/400/REV.14.SYNO" target="_blank" rel="noopener">Читать Откровение 14 ↗</a></div></details>
  </section>
  <details class="alt"><summary>Как читают другие</summary><div class="alt-body"><div class="alt-grid">
    <article><h3>Видимый знак последних дней</h3><p>Некоторые ожидают буквального, видимого знака, введённого последним режимом, и высматривают его в новых технологиях.</p></article>
    <article class="ours"><h3>Две принадлежности</h3><p>Начертание и печать означают верность зверю или Богу. Давление пойти на компромисс ради работы и торговли сегодня так же реально, как во дни Иоанна.</p></article>
  </div></div></details>
  <aside class="lesson"><span class="rubric">Урок, который нужно запомнить</span><p>Не спрашивайте, какого устройства бояться. Спросите, чьё имя написано на ваших мыслях и делах.</p></aside>
  <section class="quiz"><span class="rubric">Проверьте себя</span><h3>Что Откровение противопоставляет начертанию зверя?</h3><div class="quiz-options"><button class="quiz-opt" data-correct>Печать Божию — Его имя на челах Его рабов</button><button class="quiz-opt">Конкурирующий микрочип, выданный церковью</button><button class="quiz-opt">Ничего: начертание получат все</button></div><p class="quiz-feedback" hidden>Бог запечатлевает Своих рабов первыми (7:3; 14:1). Каждый человек принадлежит либо Богу, либо зверю.</p></section>
</section>

<section class="page topic" id="antichrist" data-nav="Кто такой антихрист?" data-num="12" data-keywords="антихрист человек греха беззаконник 1 иоанна 2 фессалоникийцам 2 папство папа зверь исповедание">
  <p class="eyebrow">Вопрос 12 · 1 Иоанна 2 и 2 Фессалоникийцам 2</p>
  <h1>Кто такой антихрист?</h1>
  <p class="deck">Дух, уже действующий, и последний противник, который ещё придёт</p>
  <div class="locator" data-vision="4"></div>
  <ul class="refs" aria-label="Отрывки для чтения"><li class="refs-label">Читать в Синодальном переводе</li><li><a href="https://www.bible.com/bible/400/1JN.2.SYNO" target="_blank" rel="noopener">1 Иоанна 2</a></li><li><a href="https://www.bible.com/bible/400/2JN.1.SYNO" target="_blank" rel="noopener">2 Иоанна</a></li><li><a href="https://www.bible.com/bible/400/2TH.2.SYNO" target="_blank" rel="noopener">2 Фессалоникийцам 2</a></li></ul>
  <figure class="art"><img data-art src="https://commons.wikimedia.org/wiki/Special:FilePath/Bamberg_Apocalypse_Msc.Bibl.140_0070._32v_The_beast_of_the_sea_miniature_cropped.jpg?width=1000" alt="Средневековая миниатюра: многоглавый зверь выходит из моря." loading="lazy" decoding="async" width="1000" height="1000"><figcaption><b>Зверь из моря</b>, Бамбергский Апокалипсис, начало XI века. Историческое произведение, а не буквальное изображение видения.</figcaption></figure>
  <blockquote class="passage"><span class="rubric">Текст</span><p>Дети! последнее время. И как вы слышали, что придет антихрист, и теперь появилось много антихристов, то мы и познаём из того, что последнее время.</p><footer><cite>1 Иоанна 2:18</cite><a href="https://www.bible.com/bible/400/1JN.2.SYNO" target="_blank" rel="noopener">Читать главу ↗</a></footer></blockquote>
  <div class="myth"><span class="rubric">Распространённое заблуждение</span><p>Откровение — это книга об антихристе, таинственном будущем диктаторе, которого христиане должны попытаться опознать среди нынешних политиков.</p></div>
  <div class="teach">
    <h2>Чему учит Писание</h2>
    <p class="illum">Слово <em>антихрист</em> ни разу не встречается в Откровении. Его используют только послания Иоанна, и там он говорит нечто удивительное: «теперь появилось много антихристов». Антихрист — это всякий, кто «отвергает, что Иисус есть Христос» (1 Иоанна 2:22), или не исповедует «Иисуса Христа, пришедшего во плоти» (2 Иоанна 7). «Дух антихриста» был в мире уже в первом веке (1 Иоанна 4:3). И Иоанн говорит, что именно по этому «мы и познаём… что последнее время», — а значит, последние дни начались с первого пришествия Христа.</p>
    <p>Павел добавляет, что перед возвращением Христа откроется «человек греха», который выдаёт себя за Бога, и что его «Господь Иисус убьет духом уст Своих» (2 Фессалоникийцам 2:3–8). И всё же уже тогда «тайна беззакония уже в действии» (2:7). Соединяя всё это, Хукема описывал антихриста как <strong>и нынешний дух, и будущую личность</strong>: противостояние Христу проходит через всю эпоху и достигает последней вершины перед самым концом. Зверь Откровения — та же реальность в образах.</p>
  </div>
  <div class="note"><p><strong>Заметка из реформатской истории.</strong> Вестминстерское исповедание веры (25.6) и Лондонское баптистское исповедание 1689 года (26.4) называли папство «тем антихристом, человеком греха». Реформаторы видели в притязаниях Рима человека беззакония, который «в храме Божием сядет». Некоторые позднейшие редакции, например американская редакция Вестминстерского исповедания 1903 года, убрали эту строку, и реформатские христиане сегодня расходятся в том, считать ли это окончательным отождествлением или одним из исторических воплощений духа антихриста.</p></div>
  <section class="evidence" aria-labelledby="ev-antichrist">
    <h2 id="ev-antichrist">Откуда мы это знаем?</h2>
    <details class="ev"><summary><span class="ev-n">01</span><span class="ev-ref">1 Иоанна 2:18, 22; 4:3; 2 Иоанна 7</span><i class="tag stated">Сказано</i></summary><div class="ev-body"><p>Многие антихристы уже пришли; дух антихриста отвергает Отца и Сына и воплощение.</p><a href="https://www.bible.com/bible/400/1JN.2.SYNO" target="_blank" rel="noopener">Читать 1 Иоанна 2 ↗</a></div></details>
    <details class="ev"><summary><span class="ev-n">02</span><span class="ev-ref">2 Фессалоникийцам 2:3–8</span><i class="tag stated">Сказано</i></summary><div class="ev-body"><p>Последний беззаконник откроется и будет истреблён Христом при Его пришествии.</p><a href="https://www.bible.com/bible/400/2TH.2.SYNO" target="_blank" rel="noopener">Читать 2 Фессалоникийцам 2 ↗</a></div></details>
    <details class="ev"><summary><span class="ev-n">03</span><span class="ev-ref">Откровение 13; 19:19–20</span><i class="tag inference">Вывод</i></summary><div class="ev-body"><p>Хула зверя, поклонение ему и его гибель при пришествии Христа совпадают с описанием беззаконника у Павла. Связывать их — это толкование, поскольку Откровение этого слова не использует.</p><a href="https://www.bible.com/bible/400/REV.13.SYNO" target="_blank" rel="noopener">Читать Откровение 13 ↗</a></div></details>
  </section>
  <details class="alt"><summary>Как читают другие</summary><div class="alt-body"><div class="alt-grid">
    <article><h3>Только будущий мировой правитель</h3><p>Популярный футуризм ожидает, что в последние семь лет возвысится один человек, заключит завет с Израилем, а затем нарушит его.</p></article>
    <article class="ours"><h3>Нынешний дух и будущая личность</h3><p>Антихристы приходили на протяжении всей истории; последний явится перед возвращением Христа и будет Им истреблён.</p></article>
  </div></div></details>
  <aside class="lesson"><span class="rubric">Урок, который нужно запомнить</span><p>Не превращайте Откровение в угадайку о публичных фигурах. Учитесь распознавать всякое учение и всякую власть, отвергающие Иисуса Христа.</p></aside>
  <section class="quiz"><span class="rubric">Проверьте себя</span><h3>Где в Библии встречается слово «антихрист»?</h3><div class="quiz-options"><button class="quiz-opt" data-correct>Только в посланиях Иоанна</button><button class="quiz-opt">По всему Откровению</button><button class="quiz-opt">В книге Даниила</button></div><p class="quiz-feedback" hidden>Слово «антихрист» встречается только в 1 и 2 посланиях Иоанна, где он говорит, что «появилось много антихристов» (1 Иоанна 2:18).</p></section>
</section>

<section class="page topic" id="tribulation" data-nav="Что такое великая скорбь?" data-num="13" data-keywords="великая скорбь семь лет страдания гонения откровение 7 14 эпоха церкви седмина даниила">
  <p class="eyebrow">Вопрос 13 · Откровение 1:9 и 7:14</p>
  <h1>Что такое великая скорбь?</h1>
  <p class="deck">Верность под давлением, во все времена</p>
  <div class="locator" data-vision="2,3,4"></div>
  <ul class="refs" aria-label="Отрывки для чтения"><li class="refs-label">Читать в Синодальном переводе</li><li><a href="https://www.bible.com/bible/400/REV.7.SYNO" target="_blank" rel="noopener">Откровение 7</a></li><li><a href="https://www.bible.com/bible/400/JHN.16.SYNO" target="_blank" rel="noopener">Иоанна 16</a></li><li><a href="https://www.bible.com/bible/400/ACT.14.SYNO" target="_blank" rel="noopener">Деяния 14</a></li></ul>
  <figure class="art"><img data-art src="https://commons.wikimedia.org/wiki/Special:FilePath/Albrecht_D%C3%BCrer,_The_Opening_of_the_Fifth_and_Sixth_Seals,_probably_c._1496-1498,_NGA_52558.jpg?width=1000" alt="Гравюра: ангелы дают белые одежды душам мучеников под жертвенником, а внизу звёзды падают на объятых ужасом людей." loading="lazy" decoding="async" width="1000" height="1400"><figcaption><b>Снятие пятой и шестой печатей</b>, Альбрехт Дюрер, около 1496–1498. Мученики получают белые одежды. Историческое произведение, а не буквальное изображение видения.</figcaption></figure>
  <blockquote class="passage"><span class="rubric">Текст</span><p>Я сказал ему: ты знаешь, господин. И он сказал мне: это те, которые пришли от великой скорби; они омыли одежды свои и убелили одежды свои Кровию Агнца.</p><footer><cite>Откровение 7:14</cite><a href="https://www.bible.com/bible/400/REV.7.SYNO" target="_blank" rel="noopener">Читать главу ↗</a></footer></blockquote>
  <div class="myth"><span class="rubric">Распространённое заблуждение</span><p>Великая скорбь — это семилетний период в конце истории, и христиане будут взяты прежде, чем он начнётся.</p></div>
  <div class="teach">
    <h2>Чему учит Писание</h2>
    <p class="illum">Иоанн открывает книгу словами: «брат ваш и соучастник в <strong>скорби</strong> и в царствии и в терпении Иисуса Христа» (1:9). Скорбь для него уже началась на Патмосе. Иисус обещал её каждому ученику: «В мире будете иметь скорбь; но мужайтесь: Я победил мир» (Иоанна 16:33). Павел учил новообращённых, «что многими скорбями надлежит нам войти в Царствие Божие» (Деяния 14:22).</p>
    <p>Итак, великое множество из 7:14 — это церковь всех времён, выходящая из испытаний этой жизни в Божье присутствие. Это не исключает последнего, более жестокого гонения в самом конце — последней войны зверя против свидетелей (11:7) и краткого освобождения сатаны (20:7–9). Но церковь проходит <em>через</em> скорбь, запечатлённая и хранимая Богом, а не в обход её. Нигде в Откровении не упоминается семилетний период. Эта схема возникает, когда книгу соединяют с одним определённым прочтением Даниила 9:27.</p>
  </div>
  <section class="evidence" aria-labelledby="ev-trib">
    <h2 id="ev-trib">Откуда мы это знаем?</h2>
    <details class="ev"><summary><span class="ev-n">01</span><span class="ev-ref">Откровение 1:9</span><i class="tag stated">Сказано</i></summary><div class="ev-body"><p>Иоанн уже разделяет «скорбь» с церквами.</p><a href="https://www.bible.com/bible/400/REV.1.SYNO" target="_blank" rel="noopener">Читать Откровение 1 ↗</a></div></details>
    <details class="ev"><summary><span class="ev-n">02</span><span class="ev-ref">Иоанна 16:33; Деяния 14:22; 2 Тимофею 3:12</span><i class="tag link">Связь</i></summary><div class="ev-body"><p>Иисус и апостолы учат, что страдание принадлежит обычной христианской жизни: «все, желающие жить благочестиво во Христе Иисусе, будут гонимы».</p><a href="https://www.bible.com/bible/400/JHN.16.SYNO" target="_blank" rel="noopener">Читать Иоанна 16 ↗</a></div></details>
    <details class="ev"><summary><span class="ev-n">03</span><span class="ev-ref">Откровение 3:10; Иоанна 17:15</span><i class="tag link">Связь</i></summary><div class="ev-body"><p>Христос обещает: «сохраню тебя от годины искушения» — тем же словом, которым молился Иисус: «Не молю, чтобы Ты взял их из мира, но чтобы сохранил их от зла». Защита в испытании, а не изъятие из него.</p><a href="https://www.bible.com/bible/400/JHN.17.SYNO" target="_blank" rel="noopener">Читать Иоанна 17 ↗</a></div></details>
    <details class="ev"><summary><span class="ev-n">04</span><span class="ev-ref">Семилетняя скорбь</span><i class="tag caution">Осторожно</i></summary><div class="ev-body"><p>Эта идея зависит от того, чтобы поставить промежуток перед последней из семидесяти седмин Даниила (Даниил 9:27). Само Откровение нигде не говорит о семи годах.</p></div></details>
  </section>
  <details class="alt"><summary>Как читают другие</summary><div class="alt-body"><div class="alt-grid">
    <article><h3>Будущие семь лет</h3><p>Диспенсационалисты ожидают семилетнюю скорбь после восхищения церкви, причём её вторую половину называют «великой скорбью».</p></article>
    <article class="ours"><h3>Вся эпоха, обостряющаяся к концу</h3><p>Церковь терпит скорбь от апостолов до возвращения Христа, с напряжённым последним периодом, и всё это время её хранит Бог.</p></article>
  </div></div></details>
  <aside class="lesson"><span class="rubric">Урок, который нужно запомнить</span><p>Христос не обещает уберечь нас от бед. Он обещает хранить нас в них и провести через них к славе.</p></aside>
  <section class="quiz"><span class="rubric">Проверьте себя</span><h3>Как Иоанн описывает себя в Откровении 1:9?</h3><div class="quiz-options"><button class="quiz-opt" data-correct>Как соучастника церквей в скорби</button><button class="quiz-opt">Как того, кто благополучно взят до скорби</button><button class="quiz-opt">Как пророка скорби, до которой две тысячи лет</button></div><p class="quiz-feedback" hidden>Иоанн называет себя «брат ваш и соучастник в скорби» (1:9). Скорбь уже была опытом церкви.</p></section>
</section>

<section class="page topic" id="babylon" data-nav="Кто такой Вавилон великий?" data-num="14" data-keywords="вавилон великий блудница рим город купцы невеста откровение 17 18 выйди от нее">
  <p class="eyebrow">Вопрос 14 · Откровение 17–18</p>
  <h1>Кто такой Вавилон великий?</h1>
  <p class="deck">Город человеческой гордости и город Божий</p>
  <div class="locator" data-vision="6"></div>
  <ul class="refs" aria-label="Отрывки для чтения"><li class="refs-label">Читать в Синодальном переводе</li><li><a href="https://www.bible.com/bible/400/REV.17.SYNO" target="_blank" rel="noopener">Откровение 17</a></li><li><a href="https://www.bible.com/bible/400/REV.18.SYNO" target="_blank" rel="noopener">Откровение 18</a></li><li><a href="https://www.bible.com/bible/400/GEN.11.SYNO" target="_blank" rel="noopener">Бытие 11</a></li><li><a href="https://www.bible.com/bible/400/JER.51.SYNO" target="_blank" rel="noopener">Иеремия 51</a></li></ul>
  <figure class="art"><img data-art src="https://commons.wikimedia.org/wiki/Special:FilePath/Albrecht_D%C3%BCrer,_The_Whore_of_Babylon,_1498,_NGA_142362.jpg?width=1000" alt="Гравюра: богато одетая женщина на семиглавом звере поднимает чашу перед восхищёнными людьми, а город горит, и ангел возвещает её падение." loading="lazy" decoding="async" width="1000" height="1400"><figcaption><b>Вавилонская блудница</b>, Альбрехт Дюрер, 1498. Историческое произведение, а не буквальное изображение видения.</figcaption></figure>
  <blockquote class="passage"><span class="rubric">Текст</span><p>Они будут вести брань с Агнцем, и Агнец победит их; ибо Он есть Господь господствующих и Царь царей, и те, которые с Ним, суть званые и избранные и верные.</p><footer><cite>Откровение 17:14</cite><a href="https://www.bible.com/bible/400/REV.17.SYNO" target="_blank" rel="noopener">Читать главу ↗</a></footer></blockquote>
  <div class="myth"><span class="rubric">Распространённое заблуждение</span><p>Вавилон — это обязательно одна конкретная современная страна, город или организация, и задача в том, чтобы назвать её.</p></div>
  <div class="teach">
    <h2>Чему учит Писание</h2>
    <p class="illum">Вавилон — это город, разрушивший Иерусалим и уведший народ Божий в плен, а ещё раньше Вавилон был местом, где человечество пыталось построить башню до небес. В Библии он становится образом <strong>человеческой цивилизации, устроенной против Бога</strong>: гордой, богатой, соблазнительной и жестокой. Ангел объясняет, что жена «есть великий город, царствующий над земными царями» (17:18), сидящий на семи горах (17:9). Любой читатель первого века подумал бы о Риме. Но Вавилон больше, чем Рим. Рим был просто Вавилоном во дни Иоанна.</p>
    <p>Откровение намеренно ставит рядом двух жён и два города. Ангел из той же семёрки говорит почти теми же словами: «подойди, я покажу тебе суд над великою блудницею» (17:1), а позже: «пойди, я покажу тебе жену, невесту Агнца» (21:9). Первая жена «упоена была кровью святых» (17:6); вторая — святой город, где обитает Бог. Один оплакивают купцы, потерявшие свою торговлю; другой наполнен славой Божией. Каждый человек живёт в том или другом городе, и призыв во все века один и тот же: «выйди от нее, народ Мой» (18:4).</p>
  </div>
  <div class="pair-cards">
    <article class="red"><span class="ref">17:1 · «я покажу тебе…»</span><h3>Блудница, Вавилон</h3><p>В порфире и золоте, упоена кровью святых, сидит на звере. Падёт «в один час».</p></article>
    <article class="dark"><span class="ref">21:9 · «я покажу тебе…»</span><h3>Невеста, новый Иерусалим</h3><p>Облечена в виссон — праведность святых. Нисходит от Бога и пребудет вечно.</p></article>
  </div>
  <section class="evidence" aria-labelledby="ev-babylon">
    <h2 id="ev-babylon">Откуда мы это знаем?</h2>
    <details class="ev"><summary><span class="ev-n">01</span><span class="ev-ref">Откровение 17:9, 18</span><i class="tag stated">Сказано</i></summary><div class="ev-body"><p>Жена — это великий город, царствующий над земными царями и сидящий на семи горах.</p><a href="https://www.bible.com/bible/400/REV.17.SYNO" target="_blank" rel="noopener">Читать Откровение 17 ↗</a></div></details>
    <details class="ev"><summary><span class="ev-n">02</span><span class="ev-ref">Откровение 18:3, 11–19, 24</span><i class="tag stated">Сказано</i></summary><div class="ev-body"><p>Её богатство развращает народы, купцы оплакивают её падение, и «в нем найдена кровь пророков и святых».</p><a href="https://www.bible.com/bible/400/REV.18.SYNO" target="_blank" rel="noopener">Читать Откровение 18 ↗</a></div></details>
    <details class="ev"><summary><span class="ev-n">03</span><span class="ev-ref">Иеремия 51:6–8; Исаия 47</span><i class="tag link">Связь</i></summary><div class="ev-body"><p>Откровение 18 перекликается с пророчествами против древнего Вавилона, включая призыв бежать из него.</p><a href="https://www.bible.com/bible/400/JER.51.SYNO" target="_blank" rel="noopener">Читать Иеремия 51 ↗</a></div></details>
    <details class="ev"><summary><span class="ev-n">04</span><span class="ev-ref">Откровение 17:1; 21:9</span><i class="tag link">Связь</i></summary><div class="ev-body"><p>Одинаковое ангельское вступление представляет блудницу и невесту, приглашая читателя сравнить два города.</p><a href="https://www.bible.com/bible/400/REV.21.SYNO" target="_blank" rel="noopener">Читать Откровение 21 ↗</a></div></details>
    <details class="ev"><summary><span class="ev-n">05</span><span class="ev-ref">Вавилон и папство</span><i class="tag caution">Осторожно</i></summary><div class="ev-body"><p>Многие реформаторы отождествляли Вавилон с папским Римом. У этого прочтения долгая протестантская история, но собственные указания текста ведут прежде всего к императорскому Риму, а через него — к мировой системе во все века.</p></div></details>
  </section>
  <details class="alt"><summary>Как читают другие</summary><div class="alt-body"><div class="alt-grid">
    <article><h3>Восстановленный город или последняя система</h3><p>Некоторые футуристы ожидают буквально восстановленного Вавилона в Ираке или будущей мировой экономической и религиозной системы.</p></article>
    <article class="ours"><h3>Мировой город во все века</h3><p>Вавилон — это Рим для читателей Иоанна и гордый, идолопоклоннический мир в каждом поколении, осуждённый раз и навсегда в конце.</p></article>
  </div></div></details>
  <aside class="lesson"><span class="rubric">Урок, который нужно запомнить</span><p>Не стройте надежду на богатстве, удобстве или культуре, которая проходит. Ваше гражданство — в городе, который нисходит от Бога.</p></aside>
  <section class="quiz"><span class="rubric">Проверьте себя</span><h3>Какой город Откровение противопоставляет Вавилону?</h3><div class="quiz-options"><button class="quiz-opt" data-correct>Новый Иерусалим, невесту Агнца</button><button class="quiz-opt">Древнюю Ниневию</button><button class="quiz-opt">Рим, который приходит на смену Вавилону</button></div><p class="quiz-feedback" hidden>Город-блудницу (17:1) и город-невесту (21:9) представляют одними и теми же словами: «я покажу тебе». Каждый человек принадлежит тому или другому городу.</p></section>
</section>

<section class="page topic" id="armageddon" data-nav="Что такое Армагеддон?" data-num="15" data-keywords="армагеддон мегиддо битва брань цари евфрат гог магог война откровение 16 19 20">
  <p class="eyebrow">Вопрос 15 · Откровение 16:12–16</p>
  <h1>Что такое Армагеддон?</h1>
  <p class="deck">Последний мятеж, оконченный одним словом</p>
  <div class="locator" data-vision="5,6,7"></div>
  <ul class="refs" aria-label="Отрывки для чтения"><li class="refs-label">Читать в Синодальном переводе</li><li><a href="https://www.bible.com/bible/400/REV.16.SYNO" target="_blank" rel="noopener">Откровение 16</a></li><li><a href="https://www.bible.com/bible/400/REV.19.SYNO" target="_blank" rel="noopener">Откровение 19</a></li><li><a href="https://www.bible.com/bible/400/REV.20.SYNO" target="_blank" rel="noopener">Откровение 20</a></li><li><a href="https://www.bible.com/bible/400/EZK.38.SYNO" target="_blank" rel="noopener">Иезекииль 38</a></li></ul>
  <figure class="art"><img data-art src="https://commons.wikimedia.org/wiki/Special:FilePath/Albrecht_D%C3%BCrer,_The_Four_Avenging_Angels,_1498,_NGA_142356.jpg?width=1000" alt="Гравюра: четыре вооружённых ангела поражают толпы людей; позади всадники и огнедышащие кони." loading="lazy" decoding="async" width="1000" height="1400"><figcaption><b>Четыре ангела мщения</b>, Альбрехт Дюрер, 1498. Ангелы, освобождённые при Евфрате (9:14), — той реке, у которой позже собираются цари к Армагеддону (16:12). Историческое произведение, а не буквальное изображение видения.</figcaption></figure>
  <blockquote class="passage"><span class="rubric">Текст</span><p>И он собрал их на место, называемое по-еврейски Армагеддон.</p><footer><cite>Откровение 16:16</cite><a href="https://www.bible.com/bible/400/REV.16.SYNO" target="_blank" rel="noopener">Читать главу ↗</a></footer></blockquote>
  <div class="myth"><span class="rubric">Распространённое заблуждение</span><p>Армагеддон — это ядерная Третья мировая война на обозначенном на картах поле битвы на севере Израиля.</p></div>
  <div class="teach">
    <h2>Чему учит Писание</h2>
    <p class="illum">«Армагеддон» означает «гора Мегиддо». Мегиддо — реальная долина в Израиле, знаменитая решающими битвами (Судей 5:19; 4 Царств 23:29). Но горы у Мегиддо нет, и название дано как символ, «по-еврейски». Оно обозначает <strong>место, где мятеж мира даёт последний бой</strong>, собранный бесовской ложью (16:13–14).</p>
    <p>Обратите внимание на удивительное: сама битва так и не происходит. В 16-й главе цари собраны, а в следующем стихе звучит: «совершилось!» В 19-й главе зверь и цари «собранные, чтобы сразиться», а Всадник просто побеждает их мечом, исходящим из Его уст, — то есть Своим словом (19:15, 21). В 20-й главе сатана собирает народы «на брань», и «ниспал огонь с неба» (20:9). Это три взгляда на один и тот же последний натиск на церковь, и каждый опирается на пророчество Иезекииля о Гоге и Магоге. То же говорит Павел: Господь Иисус убьёт беззаконника «духом уст Своих» (2 Фессалоникийцам 2:8).</p>
  </div>
  <ol class="steps" aria-label="Одна битва, три взгляда">
    <li><span class="ref">16:14–16</span><b>Собраны «на брань»</b><small>Цари собраны к Армагеддону; затем «совершилось!»</small></li>
    <li><span class="ref">19:19–21</span><b>«Собранные, чтобы сразиться»</b><small>Зверь и цари побеждены мечом уст Христа</small></li>
    <li><span class="ref">20:8–9</span><b>Собраны «на брань»</b><small>Гог и Магог окружают святых; огонь с неба</small></li>
    <li><span class="ref">2 Фес 2:8</span><b>Одно дуновение</b><small>Господь убивает беззаконника при Своём пришествии</small></li>
  </ol>
  <section class="evidence" aria-labelledby="ev-armageddon">
    <h2 id="ev-armageddon">Откуда мы это знаем?</h2>
    <details class="ev"><summary><span class="ev-n">01</span><span class="ev-ref">Откровение 16:13–16</span><i class="tag stated">Сказано</i></summary><div class="ev-body"><p>Бесовские духи собирают царей всей вселенной «на брань в оный великий день Бога Вседержителя».</p><a href="https://www.bible.com/bible/400/REV.16.SYNO" target="_blank" rel="noopener">Читать Откровение 16 ↗</a></div></details>
    <details class="ev"><summary><span class="ev-n">02</span><span class="ev-ref">Откровение 19:15, 19–21</span><i class="tag stated">Сказано</i></summary><div class="ev-body"><p>Враги «убиты мечом Сидящего на коне, исходящим из уст Его».</p><a href="https://www.bible.com/bible/400/REV.19.SYNO" target="_blank" rel="noopener">Читать Откровение 19 ↗</a></div></details>
    <details class="ev"><summary><span class="ev-n">03</span><span class="ev-ref">Иезекииль 38–39 в Откровении 19 и 20</span><i class="tag link">Связь</i></summary><div class="ev-body"><p>Великая вечеря птиц (19:17–18) и Гог и Магог (20:8) взяты из одного пророчества Иезекииля о последнем враге.</p><a href="https://www.bible.com/bible/400/EZK.39.SYNO" target="_blank" rel="noopener">Читать Иезекииль 39 ↗</a></div></details>
    <details class="ev"><summary><span class="ev-n">04</span><span class="ev-ref">Судей 5:19; 4 Царств 23:29</span><i class="tag link">Связь</i></summary><div class="ev-body"><p>Мегиддо помнили по битвам — и победам, и поражениям, — поэтому оно стало подходящим символом.</p><a href="https://www.bible.com/bible/400/JDG.5.SYNO" target="_blank" rel="noopener">Читать Судей 5 ↗</a></div></details>
  </section>
  <details class="alt"><summary>Как читают другие</summary><div class="alt-body"><div class="alt-grid">
    <article><h3>Буквальная война в Израиле</h3><p>Многие футуристы ожидают, что армии мира соберутся в Изреельской долине перед возвращением Христа, и отличают это от более позднего мятежа Гога и Магога после тысячелетия.</p></article>
    <article class="ours"><h3>Последний натиск, увиденный трижды</h3><p>Армагеддон, битва 19-й главы и Гог и Магог — это одно последнее нападение на церковь, мгновенно прекращённое Христом при Его пришествии.</p></article>
  </div></div></details>
  <aside class="lesson"><span class="rubric">Урок, который нужно запомнить</span><p>Исход не вызывает сомнений. Последняя битва окончена в тот миг, когда говорит Христос.</p></aside>
  <section class="quiz"><span class="rubric">Проверьте себя</span><h3>Как Христос побеждает войска в Откровении 19?</h3><div class="quiz-options"><button class="quiz-opt" data-correct>Мечом, исходящим из Его уст, — Своим словом</button><button class="quiz-opt">Современным оружием, которое поставляют Его последователи</button><button class="quiz-opt">После долгой войны, длящейся семь лет</button></div><p class="quiz-feedback" hidden>Враги «убиты мечом Сидящего на коне, исходящим из уст Его» (19:21). Христос побеждает Своим словом.</p></section>
</section>
