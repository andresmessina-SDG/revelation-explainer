<section class="page topic" id="rapture" data-nav="А как же восхищение церкви?" data-num="16" data-keywords="восхищение церкви восхищены в сретение господу на воздухе тайное оставленные 1 фессалоникийцам 4 труба до скорби">
  <p class="eyebrow">Вопрос 16 · 1 Фессалоникийцам 4</p>
  <h1>А как же восхищение церкви?</h1>
  <p class="deck">Выйти навстречу возвращающемуся Царю</p>
  <div class="locator" data-vision="6"></div>
  <ul class="refs" aria-label="Отрывки для чтения"><li class="refs-label">Читать в Синодальном переводе</li><li><a href="https://www.bible.com/bible/400/1TH.4.SYNO" target="_blank" rel="noopener">1 Фессалоникийцам 4</a></li><li><a href="https://www.bible.com/bible/400/1CO.15.SYNO" target="_blank" rel="noopener">1 Коринфянам 15</a></li><li><a href="https://www.bible.com/bible/400/MAT.24.SYNO" target="_blank" rel="noopener">Матфея 24</a></li></ul>
  <blockquote class="passage"><span class="rubric">Текст</span><p>потому что Сам Господь при возвещении, при гласе Архангела и трубе Божией, сойдет с неба, и мертвые во Христе воскреснут прежде; потом мы, оставшиеся в живых, вместе с ними восхищены будем на облаках в сретение Господу на воздухе, и так всегда с Господом будем.</p><footer><cite>1 Фессалоникийцам 4:16–17</cite><a href="https://www.bible.com/bible/400/1TH.4.SYNO" target="_blank" rel="noopener">Читать главу ↗</a></footer></blockquote>
  <ol class="steps" aria-label="Что описывает Павел, по порядку">
    <li><span class="ref">4:16</span><b>Господь сходит</b><small>Возвещение, глас Архангела, труба Божия</small></li>
    <li><span class="ref">4:16</span><b>Мёртвые воскресают</b><small>«Мертвые во Христе воскреснут прежде»</small></li>
    <li><span class="ref">4:17</span><b>Живые восхищаются</b><small>Вместе с ними, в сретение Господу</small></li>
    <li><span class="ref">4:17</span><b>Всегда с Господом</b><small>Ни второго ухода, ни возвращения, чтобы ждать</small></li>
  </ol>
  <div class="myth"><span class="rubric">Распространённое заблуждение</span><p>Иисус тайно заберёт христиан, оставив мир в недоумении, а через семь лет вернётся открыто.</p></div>
  <div class="teach">
    <h2>Чему учит Писание</h2>
    <p class="illum">Библия действительно учит о «восхищении»: верующие, которые будут живы при возвращении Христа, «восхищены будем… в сретение Господу». Но Павел описывает это как <strong>самое громкое событие в истории</strong>: возвещение, глас Архангела, труба Божия. Оно происходит вместе с воскресением мёртвых и в «день Господень», который придёт на неготовых, «как тать ночью» (5:2). Ту же трубу Павел называет последней: «при последней трубе» (1 Коринфянам 15:52), а Иисус говорит, что Его Ангелы соберут избранных «с трубою громогласною», когда все племена земные увидят Его грядущим (Матфея 24:30–31).</p>
    <p>Слово, которое здесь переведено как «сретение» (встреча), употреблялось, когда горожане выходили из города навстречу прибывающему царю, чтобы торжественно ввести его в город. Именно такова картина. Мы не улетаем со Христом на небо, пока мир продолжает жить своей жизнью. Мы выходим навстречу нашему Царю и идём с Ним, когда Он приходит судить мир и обновить его. Возвращение <strong>одно, а не два</strong>.</p>
  </div>
  <section class="evidence" aria-labelledby="ev-rapture">
    <h2 id="ev-rapture">Откуда мы это знаем?</h2>
    <details class="ev"><summary><span class="ev-n">01</span><span class="ev-ref">1 Фессалоникийцам 4:16–5:2</span><i class="tag stated">Сказано</i></summary><div class="ev-body"><p>Восхищение публично, сопровождается воскресением и относится к тому, что Павел называет «день Господень».</p><a href="https://www.bible.com/bible/400/1TH.5.SYNO" target="_blank" rel="noopener">Читать 1 Фессалоникийцам 5 ↗</a></div></details>
    <details class="ev"><summary><span class="ev-n">02</span><span class="ev-ref">1 Коринфянам 15:51–52</span><i class="tag link">Связь</i></summary><div class="ev-body"><p>Верующие изменятся «при последней трубе», когда воскреснут мёртвые. После последней трубы других труб нет.</p><a href="https://www.bible.com/bible/400/1CO.15.SYNO" target="_blank" rel="noopener">Читать 1 Коринфянам 15 ↗</a></div></details>
    <details class="ev"><summary><span class="ev-n">03</span><span class="ev-ref">Матфея 24:30–31</span><i class="tag link">Связь</i></summary><div class="ev-body"><p>Собирание избранных происходит, когда Христос видимо приходит «на облаках небесных с силою и славою великою».</p><a href="https://www.bible.com/bible/400/MAT.24.SYNO" target="_blank" rel="noopener">Читать Матфея 24 ↗</a></div></details>
    <details class="ev"><summary><span class="ev-n">04</span><span class="ev-ref">Откровение 3:10; 4:1</span><i class="tag caution">Осторожно</i></summary><div class="ev-body"><p>Эти стихи часто приводят в пользу восхищения до скорби, но 3:10 обещает защиту в испытании (ср. Иоанна 17:15), а 4:1 призывает в видение одного Иоанна.</p><a href="https://www.bible.com/bible/400/REV.3.SYNO" target="_blank" rel="noopener">Читать Откровение 3 ↗</a></div></details>
  </section>
  <details class="alt"><summary>Как читают другие</summary><div class="alt-body"><div class="alt-grid">
    <article><h3>Восхищение до скорби</h3><p>Диспенсационалисты учат, что Христос сначала тайно приходит за Своей церковью перед семилетней скорбью, а затем видимо приходит вместе с ней.</p></article>
    <article class="ours"><h3>Одно видимое возвращение</h3><p>Верующие восхищаются, чтобы встретить Христа при Его едином славном пришествии, при последней трубе, вместе с воскресением мёртвых.</p></article>
  </div></div></details>
  <aside class="lesson"><span class="rubric">Урок, который нужно запомнить</span><p>Наша надежда — не бегство, а встреча: видимое возвращение нашего Спасителя и вечная жизнь с Ним.</p></aside>
  <section class="quiz"><span class="rubric">Проверьте себя</span><h3>Что, по словам Павла, будет сопровождать восхищение верующих?</h3><div class="quiz-options"><button class="quiz-opt" data-correct>Возвещение, глас Архангела и труба Божия</button><button class="quiz-opt">Полная тишина, чтобы никто не заметил</button><button class="quiz-opt">Сначала семь лет предупреждающих знамений</button></div><p class="quiz-feedback" hidden>Описание Павла совсем не тайное (1 Фессалоникийцам 4:16). Весь мир узнает, что Царь пришёл.</p></section>
</section>

<section class="page topic" id="second-coming" data-nav="Что произойдёт, когда Иисус вернётся?" data-num="17" data-keywords="второе пришествие возвращение христа конь белый верный и истинный суд воскресение откровение 19 один день">
  <p class="eyebrow">Вопрос 17 · Откровение 19:11–21</p>
  <h1>Что произойдёт, когда Иисус вернётся?</h1>
  <p class="deck">Приходит Царь, и всё решается</p>
  <div class="locator" data-vision="1,2,3,4,5,6,7"></div>
  <ul class="refs" aria-label="Отрывки для чтения"><li class="refs-label">Читать в Синодальном переводе</li><li><a href="https://www.bible.com/bible/400/REV.19.SYNO" target="_blank" rel="noopener">Откровение 19</a></li><li><a href="https://www.bible.com/bible/400/REV.20.SYNO" target="_blank" rel="noopener">Откровение 20</a></li><li><a href="https://www.bible.com/bible/400/JHN.5.SYNO" target="_blank" rel="noopener">Иоанна 5</a></li><li><a href="https://www.bible.com/bible/400/MAT.25.SYNO" target="_blank" rel="noopener">Матфея 25</a></li></ul>
  <blockquote class="passage"><span class="rubric">Текст</span><p>И увидел я отверстое небо, и вот конь белый, и сидящий на нем называется Верный и Истинный, Который праведно судит и воинствует.</p><footer><cite>Откровение 19:11</cite><a href="https://www.bible.com/bible/400/REV.19.SYNO" target="_blank" rel="noopener">Читать главу ↗</a></footer></blockquote>
  <div class="myth"><span class="rubric">Распространённое заблуждение</span><p>Возвращение Христа — лишь один шаг в длинной череде будущих этапов: тайное пришествие, скорбь, открытое пришествие, тысячелетнее царство, затем ещё одно воскресение и суд.</p></div>
  <div class="teach">
    <h2>Чему учит Писание</h2>
    <p class="illum">Каждое из семи видений Откровения заканчивается в одном и том же месте, потому что в конце эпохи — одно великое событие. Христос придёт снова <strong>видимо</strong>: «узрит Его всякое око» (1:7). Он придёт <strong>во славе</strong>, как «Царь царей и Господь господствующих» (19:16). И в этот один день соединится всё, что Библия обещает о конце.</p>
    <p>Иисус сказал: «наступает время, в которое <em>все</em>, находящиеся в гробах, услышат глас Сына Божия», и изыдут как творившие добро, так и делавшие зло (Иоанна 5:28–29). Народы соберутся перед Его престолом и будут отделены, как овцы от козлов (Матфея 25:31–32). Смерть, последний враг, будет истреблена (1 Коринфянам 15:26). А небо и земля станут новыми (2 Петра 3:13). Реформатские исповедания подытоживают это как одно всеобщее воскресение и один последний суд. Дня мы не знаем (Матфея 24:36), поэтому призыв — не вычислять, а быть готовыми.</p>
  </div>
  <ol class="steps" aria-label="Единый день возвращения Христа">
    <li><span class="ref">Откр 1:7; 19:11</span><b>Христос является</b><small>Видимо, во славе, перед всяким оком</small></li>
    <li><span class="ref">Ин 5:28–29</span><b>Воскресают все мёртвые</b><small>И праведные, и нечестивые — в одно время</small></li>
    <li><span class="ref">Откр 20:11–15</span><b>Последний суд</b><small>Каждый человек перед великим белым престолом</small></li>
    <li><span class="ref">Откр 21:1–5</span><b>Всё новое</b><small>Новое небо и новая земля</small></li>
  </ol>
  <section class="evidence" aria-labelledby="ev-return">
    <h2 id="ev-return">Откуда мы это знаем?</h2>
    <details class="ev"><summary><span class="ev-n">01</span><span class="ev-ref">Откровение 19:11–16</span><i class="tag stated">Сказано</i></summary><div class="ev-body"><p>Всадник — это Христос: «Верный и Истинный», «Слово Божие», «Царь царей и Господь господствующих».</p><a href="https://www.bible.com/bible/400/REV.19.SYNO" target="_blank" rel="noopener">Читать Откровение 19 ↗</a></div></details>
    <details class="ev"><summary><span class="ev-n">02</span><span class="ev-ref">Иоанна 5:28–29; Деяния 24:15</span><i class="tag stated">Сказано</i></summary><div class="ev-body"><p>Одно грядущее время приносит воскресение и праведных, и нечестивых.</p><a href="https://www.bible.com/bible/400/JHN.5.SYNO" target="_blank" rel="noopener">Читать Иоанна 5 ↗</a></div></details>
    <details class="ev"><summary><span class="ev-n">03</span><span class="ev-ref">1 Коринфянам 15:23–26</span><i class="tag link">Связь</i></summary><div class="ev-body"><p>«Первенец Христос, потом Христовы, в пришествие Его. А затем конец». Христос царствует сейчас, «доколе низложит всех врагов под ноги Свои», и последней истребится смерть.</p><a href="https://www.bible.com/bible/400/1CO.15.SYNO" target="_blank" rel="noopener">Читать 1 Коринфянам 15 ↗</a></div></details>
    <details class="ev"><summary><span class="ev-n">04</span><span class="ev-ref">Матфея 24:36</span><i class="tag caution">Осторожно</i></summary><div class="ev-body"><p>«О дне же том и часе никто не знает». Каждая попытка назначить дату оказывалась ошибочной.</p><a href="https://www.bible.com/bible/400/MAT.24.SYNO" target="_blank" rel="noopener">Читать Матфея 24 ↗</a></div></details>
  </section>
  <details class="alt"><summary>Как читают другие</summary><div class="alt-body"><div class="alt-grid">
    <article><h3>Этапы и промежутки</h3><p>Премилленаристские взгляды помещают тысячу лет между возвращением Христа и последним судом, разделяя этим периодом воскресение верующих и неверующих.</p></article>
    <article class="ours"><h3>Один день Господень</h3><p>Возвращение Христа, воскресение всех, последний суд и новое творение составляют вместе одно великое событие.</p></article>
  </div></div></details>
  <aside class="lesson"><span class="rubric">Урок, который нужно запомнить</span><p>Для тех, кто принадлежит Ему, возвращение Христа — не угроза, а великая надежда.</p></aside>
  <section class="quiz"><span class="rubric">Проверьте себя</span><h3>Кто, согласно Иоанна 5:28–29, воскреснет, когда настанет время?</h3><div class="quiz-options"><button class="quiz-opt" data-correct>Все, находящиеся в гробах, — праведные и нечестивые</button><button class="quiz-opt">Только верующие; неверующие — через тысячу лет</button><button class="quiz-opt">Только те, кто будет тогда жив</button></div><p class="quiz-feedback" hidden>Иисус говорит об одном времени, «в которое все, находящиеся в гробах, услышат глас Сына Божия» (Иоанна 5:28–29).</p></section>
</section>

<section class="page topic" id="millennium" data-nav="Что такое тысячелетнее царство?" data-num="18" data-keywords="тысячелетнее царство тысячелетие тысяча лет сатана связан бездна цепь царствование амилленаризм откровение 20 царство">
  <p class="eyebrow">Вопрос 18 · Откровение 20:1–10</p>
  <h1>Что такое тысячелетнее царство?</h1>
  <p class="deck">Царь, Который царствует уже сейчас</p>
  <div class="locator" data-vision="7"></div>
  <ul class="refs" aria-label="Отрывки для чтения"><li class="refs-label">Читать в Синодальном переводе</li><li><a href="https://www.bible.com/bible/400/REV.20.SYNO" target="_blank" rel="noopener">Откровение 20</a></li><li><a href="https://www.bible.com/bible/400/MAT.12.SYNO" target="_blank" rel="noopener">Матфея 12</a></li><li><a href="https://www.bible.com/bible/400/EPH.1.SYNO" target="_blank" rel="noopener">Ефесянам 1</a></li><li><a href="https://www.bible.com/bible/400/MAT.28.SYNO" target="_blank" rel="noopener">Матфея 28</a></li></ul>
  <figure class="art"><img data-art src="https://commons.wikimedia.org/wiki/Special:FilePath/Albrecht_D%C3%BCrer,_The_Angel_with_the_Key_to_the_Bottomless_Pit,_probably_c._1496-1498,_NGA_6685.jpg?width=1000" alt="Гравюра: ангел запирает скованного дракона в бездне, а другой ангел показывает Иоанну Новый Иерусалим на холме." loading="lazy" decoding="async" width="1000" height="1400"><figcaption><b>Ангел с ключом от бездны</b>, Альбрехт Дюрер, около 1496–1498. Последняя гравюра серии: сатана связан, и святой город виден. Историческое произведение, а не буквальное изображение видения.</figcaption></figure>
  <blockquote class="passage"><span class="rubric">Текст</span><p>Он взял дракона, змия древнего, который есть диавол и сатана, и сковал его на тысячу лет, и низверг его в бездну, и заключил его, и положил над ним печать, дабы не прельщал уже народы, доколе не окончится тысяча лет; после же сего ему должно быть освобожденным на малое время.</p><footer><cite>Откровение 20:2–3</cite><a href="https://www.bible.com/bible/400/REV.20.SYNO" target="_blank" rel="noopener">Читать главу ↗</a></footer></blockquote>
  <div class="myth"><span class="rubric">Распространённое заблуждение</span><p>Иисус ещё не царствует как Царь. Его царство начнётся только после того, как Он вернётся и установит на земле тысячелетнее политическое государство.</p></div>
  <div class="teach">
    <h2>Чему учит Писание</h2>
    <p class="illum">Глава 20 — седьмое видение, и, как каждое из остальных, оно начинается снова с первого пришествия Христа. Связывание сатаны — не будущее событие. Иисус описал его во время Своего служения: «как может кто войти в дом сильного и расхитить вещи его, если прежде не свяжет сильного?» (Матфея 12:29). Обратите внимание, <strong>от чего</strong> удержан сатана: «дабы не прельщал уже народы» (20:3). Веками народы сидели во тьме, а Божья истина была в основном заключена в Израиле. Со времени креста Евангелие пошло ко всем народам, и сатана не может его остановить.</p>
    <p>Итак, <strong>тысяча лет</strong> — это вся эпоха между пришествиями Христа: долгий, завершённый период (десять × десять × десять), а не секундомер. В это время души умерших верующих «ожили и царствовали со Христом» на небе (20:4), а на земле Христос царствует уже сейчас: «дана Мне всякая власть на небе и на земле» (Матфея 28:18). В конце сатана освобождается «на малое время», собирает народы на ту же последнюю битву, которую мы встречали в главах 16 и 19, и бывает ввержен в озеро огненное. Таково амилленаристское прочтение реформатских исповеданий. <em>Амилленаризм</em> не означает «никакого тысячелетия». Он означает, что нет отдельного будущего земного тысячелетия: тысячелетнее царство — сейчас.</p>
  </div>
  <div class="mill-inline">
    <div class="mill-track" role="img" aria-label="Хронология: первое пришествие и связывание сатаны, тысяча лет царствования Христа, краткое освобождение, возвращение Христа, новое творение">
      <div class="mill-seg event" style="--w:.9"><i></i><b>Первое при­шествие</b><small>Сатана связан · 20:1–3</small></div>
      <div class="mill-seg reign" style="--w:3"><i></i><b>Тысяча лет</b><small>Христос царствует; Евангелие идёт к народам · 20:4–6</small></div>
      <div class="mill-seg event" style="--w:.9"><i></i><b>Краткое осво­бождение</b><small>Последний мятеж · 20:7–9</small></div>
      <div class="mill-seg final" style="--w:1.2"><i></i><b>Христос возвра­щается</b><small>Суд, новое творение · 20:10–22:5</small></div>
    </div>
  </div>
  <section class="evidence" aria-labelledby="ev-mill">
    <h2 id="ev-mill">Откуда мы это знаем?</h2>
    <details class="ev"><summary><span class="ev-n">01</span><span class="ev-ref">Откровение 20:3</span><i class="tag stated">Сказано</i></summary><div class="ev-body"><p>У связывания названа цель: «дабы не прельщал уже народы». Там не сказано, что сатана вообще ничего не может делать.</p><a href="https://www.bible.com/bible/400/REV.20.SYNO" target="_blank" rel="noopener">Читать Откровение 20 ↗</a></div></details>
    <details class="ev"><summary><span class="ev-n">02</span><span class="ev-ref">Матфея 12:28–29; Иоанна 12:31–32</span><i class="tag link">Связь</i></summary><div class="ev-body"><p>Иисус говорит, что сильный связывается в Его служении, и обещает: «когда Я вознесен буду от земли, всех привлеку к Себе», — ведь «ныне князь мира сего изгнан будет вон».</p><a href="https://www.bible.com/bible/400/MAT.12.SYNO" target="_blank" rel="noopener">Читать Матфея 12 ↗</a></div></details>
    <details class="ev"><summary><span class="ev-n">03</span><span class="ev-ref">Ефесянам 1:20–22; 1 Коринфянам 15:25</span><i class="tag link">Связь</i></summary><div class="ev-body"><p>Христос уже посажен «превыше всякого Начальства, и Власти», и «Ему надлежит царствовать, доколе низложит всех врагов под ноги Свои». Его царствование — настоящее.</p><a href="https://www.bible.com/bible/400/EPH.1.SYNO" target="_blank" rel="noopener">Читать Ефесянам 1 ↗</a></div></details>
    <details class="ev"><summary><span class="ev-n">04</span><span class="ev-ref">Откровение 20:8, 16:14 и 19:19</span><i class="tag inference">Вывод</i></summary><div class="ev-body"><p>Собирание «на брань» в 20:8 совпадает с 16:14 и 19:19 и опирается на то же пророчество Иезекииля, что и 19:17–18. Поэтому глава 20 повторяет главу 19 с другого ракурса, а не следует за ней.</p><a href="https://www.bible.com/bible/400/REV.20.SYNO" target="_blank" rel="noopener">Читать Откровение 20 ↗</a></div></details>
    <details class="ev"><summary><span class="ev-n">05</span><span class="ev-ref">Сатана всё ещё действует</span><i class="tag caution">Осторожно</i></summary><div class="ev-body"><p>Новый Завет также говорит, что диавол «ходит, как рыкающий лев» (1 Петра 5:8) и ослепляет умы неверующих (2 Коринфянам 4:4). Быть связанным в одном отношении — не в силах остановить Евангелие, идущее к народам, — не значит бездействовать во всех отношениях.</p></div></details>
  </section>
  <details class="alt"><summary>Как читают другие</summary><div class="alt-body"><div class="alt-grid">
    <article><h3>Премилленаризм</h3><p>Христос возвращается до будущего тысячелетнего царства на земле; главы 19 и 20 читаются последовательно.</p></article>
    <article><h3>Постмилленаризм</h3><p>Золотой век успеха Евангелия наступает внутри истории, до возвращения Христа.</p></article>
  </div><p class="alt-intro" style="margin:14px 0 0">Полное сравнение — в разделе <a href="#mill-study">«Как толковать Откровение»</a>.</p></div></details>
  <aside class="lesson"><span class="rubric">Урок, который нужно запомнить</span><p>Мы не ждём, когда Иисус станет Царём. Он царствует уже сейчас, и Евангелие идёт к народам, потому что сильный связан.</p></aside>
  <section class="quiz"><span class="rubric">Проверьте себя</span><h3>Согласно Откровению 20:3, сатана связан для того, чтобы он не мог делать что?</h3><div class="quiz-options"><button class="quiz-opt" data-correct>Прельщать народы</button><button class="quiz-opt">Искушать кого бы то ни было</button><button class="quiz-opt">Находиться где-либо на земле</button></div><p class="quiz-feedback" hidden>Связывание имеет конкретную цель: «дабы не прельщал уже народы» (20:3). Со времени креста Евангелие идёт к каждому народу.</p></section>
</section>

<section class="page topic" id="resurrection" data-nav="Что такое первое воскресение?" data-num="19" data-keywords="первое воскресение вторая смерть души царствуют престолы промежуточное состояние откровение 20 4 6 озеро огненное">
  <p class="eyebrow">Вопрос 19 · Откровение 20:4–6</p>
  <h1>Что такое первое воскресение?</h1>
  <p class="deck">Живы со Христом даже в смерти</p>
  <div class="locator" data-vision="7"></div>
  <ul class="refs" aria-label="Отрывки для чтения"><li class="refs-label">Читать в Синодальном переводе</li><li><a href="https://www.bible.com/bible/400/REV.20.SYNO" target="_blank" rel="noopener">Откровение 20</a></li><li><a href="https://www.bible.com/bible/400/REV.6.SYNO" target="_blank" rel="noopener">Откровение 6</a></li><li><a href="https://www.bible.com/bible/400/PHP.1.SYNO" target="_blank" rel="noopener">Филиппийцам 1</a></li><li><a href="https://www.bible.com/bible/400/JHN.5.SYNO" target="_blank" rel="noopener">Иоанна 5</a></li></ul>
  <figure class="art"><img data-art src="https://commons.wikimedia.org/wiki/Special:FilePath/Cloisters_Apocalypse_-_New_Jerusalem_and_angel.jpg?width=1000" alt="Средневековая миниатюра: ангел показывает Иоанну Новый Иерусалим — город со стенами и ворота из драгоценных камней." loading="lazy" decoding="async" width="1000" height="1200"><figcaption><b>Новый Иерусалим и ангел</b>, Апокалипсис из Клойстерс, около 1330 года. Историческое произведение, а не буквальное изображение видения.</figcaption></figure>
  <blockquote class="passage"><span class="rubric">Текст</span><p>Блажен и свят имеющий участие в воскресении первом: над ними смерть вторая не имеет власти, но они будут священниками Бога и Христа и будут царствовать с Ним тысячу лет.</p><footer><cite>Откровение 20:6</cite><a href="https://www.bible.com/bible/400/REV.20.SYNO" target="_blank" rel="noopener">Читать главу ↗</a></footer></blockquote>
  <div class="myth"><span class="rubric">Распространённое заблуждение</span><p>Верующие воскреснут телесно на тысячу лет раньше неверующих, так что будет два телесных воскресения, разделённых тысячелетием.</p></div>
  <div class="teach">
    <h2>Чему учит Писание</h2>
    <p class="illum">Посмотрите, кого видит Иоанн: «<strong>души</strong> обезглавленных за свидетельство Иисуса» (20:4). Это перекликается с пятой печатью, где Иоанн видел «души убиенных» под жертвенником, ожидающие и взывающие: «доколе?» (6:9–11). Теперь они видны на престолах — живыми и царствующими со Христом. Именно это происходит с каждым верующим при смерти: «разрешиться и быть со Христом, потому что это несравненно лучше» (Филиппийцам 1:23). Они желают «выйти из тела и водвориться у Господа» (2 Коринфянам 5:8).</p>
    <p>Откровение использует продуманный образец. Для верующих <em>первая смерть</em> (физическая) ведёт к <strong>первому воскресению</strong> — жизни и царствованию со Христом на небе. Затем в конце наступает телесное воскресение всех — в то единое время, о котором говорил Иисус (Иоанна 5:28–29). Для неверующих за физической жизнью следует <strong>вторая смерть</strong> — «озеро огненное» (20:14). Смысл отрывка — утешение гонимой церкви: те, кто отдал жизнь за Христа, не проиграли. Они царствуют.</p>
  </div>
  <div class="pair-cards">
    <article class="dark"><span class="ref">20:4–6 · 6:9–11 · Флп 1:23</span><h3>Верующий</h3><p>Первая смерть, затем первое воскресение: жив и царствует со Христом. «Над ними смерть вторая не имеет власти».</p></article>
    <article class="red"><span class="ref">20:5, 13–15 · 21:8</span><h3>Неверующий</h3><p>Физическая жизнь, затем суд в последний день и вторая смерть — озеро огненное.</p></article>
  </div>
  <section class="evidence" aria-labelledby="ev-res">
    <h2 id="ev-res">Откуда мы это знаем?</h2>
    <details class="ev"><summary><span class="ev-n">01</span><span class="ev-ref">Откровение 20:4</span><i class="tag stated">Сказано</i></summary><div class="ev-body"><p>Иоанн видит на престолах души, а не тела: обезглавленных за свидетельство и тех, кто не поклонился зверю.</p><a href="https://www.bible.com/bible/400/REV.20.SYNO" target="_blank" rel="noopener">Читать Откровение 20 ↗</a></div></details>
    <details class="ev"><summary><span class="ev-n">02</span><span class="ev-ref">Откровение 6:9–11</span><i class="tag link">Связь</i></summary><div class="ev-body"><p>Души тех же мучеников появляются под жертвенником при пятой печати. В 20-й главе их ожидание показано как царствование.</p><a href="https://www.bible.com/bible/400/REV.6.SYNO" target="_blank" rel="noopener">Читать Откровение 6 ↗</a></div></details>
    <details class="ev"><summary><span class="ev-n">03</span><span class="ev-ref">Иоанна 5:28–29; Деяния 24:15</span><i class="tag link">Связь</i></summary><div class="ev-body"><p>Телесное воскресение праведных и нечестивых происходит вместе, в одно время. Это исключает два телесных воскресения с промежутком в тысячу лет.</p><a href="https://www.bible.com/bible/400/JHN.5.SYNO" target="_blank" rel="noopener">Читать Иоанна 5 ↗</a></div></details>
    <details class="ev"><summary><span class="ev-n">04</span><span class="ev-ref">Откровение 20:14; 21:8</span><i class="tag stated">Сказано</i></summary><div class="ev-body"><p>«И смерть и ад повержены в озеро огненное. Это смерть вторая». Пара «первое — второе» принадлежит самому Откровению.</p><a href="https://www.bible.com/bible/400/REV.21.SYNO" target="_blank" rel="noopener">Читать Откровение 21 ↗</a></div></details>
    <details class="ev"><summary><span class="ev-n">05</span><span class="ev-ref">Новое рождение?</span><i class="tag caution">Осторожно</i></summary><div class="ev-body"><p>Августин понимал первое воскресение как новое рождение, когда духовно мёртвые оживают (Иоанна 5:24–25). Многие амилленаристы, в том числе Уорфилд, Хукема и Риддлбаргер, предпочитают прочтение, изложенное выше, поскольку 20:4 описывает души умерших. Оба прочтения относят первое воскресение к нынешней эпохе.</p></div></details>
  </section>
  <details class="alt"><summary>Как читают другие</summary><div class="alt-body"><div class="alt-grid">
    <article><h3>Два телесных воскресения</h3><p>Премилленаристы понимают слово «ожили» как телесное воскресение верующих перед тысячелетием, а остальных — после него.</p></article>
    <article class="ours"><h3>Жизнь со Христом сейчас, тело — потом</h3><p>Первое воскресение — это вхождение верующего в жизнь и царствование со Христом при смерти; тело воскреснет вместе со всеми в последний день.</p></article>
  </div></div></details>
  <aside class="lesson"><span class="rubric">Урок, который нужно запомнить</span><p>Для христианина смерть — не конец жизни, а начало царствования со Христом.</p></aside>
  <section class="quiz"><span class="rubric">Проверьте себя</span><h3>Кого Иоанн видит на престолах в Откровении 20:4?</h3><div class="quiz-options"><button class="quiz-opt" data-correct>Души умерших за своё свидетельство</button><button class="quiz-opt">Политических правителей будущего земного царства</button><button class="quiz-opt">Ангелов, никогда не живших на земле</button></div><p class="quiz-feedback" hidden>Иоанн видит «души обезглавленных за свидетельство Иисуса» (20:4) — тех же мучеников, которых видел под жертвенником в 6:9.</p></section>
</section>

<section class="page topic" id="new-creation" data-nav="Что такое Новый Иерусалим?" data-num="20" data-keywords="новый иерусалим новое небо новая земля святой город невеста эдем древо жизни река откровение 21 22 вечность">
  <p class="eyebrow">Вопрос 20 · Откровение 21–22</p>
  <h1>Что такое Новый Иерусалим?</h1>
  <p class="deck">Бог творит всё новое</p>
  <div class="locator" data-vision="7"></div>
  <ul class="refs" aria-label="Отрывки для чтения"><li class="refs-label">Читать в Синодальном переводе</li><li><a href="https://www.bible.com/bible/400/REV.21.SYNO" target="_blank" rel="noopener">Откровение 21</a></li><li><a href="https://www.bible.com/bible/400/REV.22.SYNO" target="_blank" rel="noopener">Откровение 22</a></li><li><a href="https://www.bible.com/bible/400/ISA.65.SYNO" target="_blank" rel="noopener">Исаия 65</a></li><li><a href="https://www.bible.com/bible/400/ROM.8.SYNO" target="_blank" rel="noopener">Римлянам 8</a></li></ul>
  <figure class="art"><img data-art src="https://commons.wikimedia.org/wiki/Special:FilePath/Saint-Sever_Beatus_f._207v-208r_-_New_Jerusalem.jpg?width=1000" alt="Средневековая миниатюра: Новый Иерусалим в виде квадратного города с двенадцатью воротами, в каждых — апостол, в центре — Агнец." loading="lazy" decoding="async" width="1000" height="700"><figcaption><b>Новый Иерусалим</b>, Беат из Сен-Севера, XI век. Двенадцать ворот, двенадцать апостолов и Агнец в центре. Историческое произведение, а не буквальное изображение видения.</figcaption></figure>
  <blockquote class="passage"><span class="rubric">Текст</span><p>И услышал я громкий голос с неба, говорящий: се, скиния Бога с человеками, и Он будет обитать с ними; они будут Его народом, и Сам Бог с ними будет Богом их. И отрет Бог всякую слезу с очей их, и смерти не будет уже; ни плача, ни вопля, ни болезни уже не будет, ибо прежнее прошло.</p><footer><cite>Откровение 21:3–4</cite><a href="https://www.bible.com/bible/400/REV.21.SYNO" target="_blank" rel="noopener">Читать главу ↗</a></footer></blockquote>
  <div class="myth"><span class="rubric">Распространённое заблуждение</span><p>Христианская надежда — вечно парить духом в облаках, далеко от материального мира.</p></div>
  <div class="teach">
    <h2>Чему учит Писание</h2>
    <p class="illum">Откровение заканчивается не бегством из творения, а обновлённым творением: Иоанн видит «новое небо и новую землю» (21:1). Город <strong>сходит</strong> с неба на землю. Сама «тварь освобождена будет от рабства тлению» (Римлянам 8:21), а тела народа Божьего воскреснут. Ангел обещает показать Иоанну «жену, невесту Агнца», а показывает святой город (21:9–10). Город — это народ Божий, наконец-то совершенно дома у Него.</p>
    <p>Каждая подробность говорит одно и то же: <strong>Бог живёт со Своим народом.</strong> Город — совершенный куб: «длина и широта и высота его равны» (21:16), как Святое святых в храме Соломона (3 Царств 6:20), так что весь город теперь — место Божьего присутствия. Поэтому Иоанн говорит: «Храма же я не видел в нем, ибо Господь Бог Вседержитель — храм его, и Агнец» (21:22). Река жизни и древо жизни возвращаются из Эдема (22:1–2), и «ничего уже не будет проклятого». Библейская история, начавшаяся в саду, заканчивается в городе-саде, где «узрят лице Его» (22:4).</p>
  </div>
  <section class="evidence" aria-labelledby="ev-new">
    <h2 id="ev-new">Откуда мы это знаем?</h2>
    <details class="ev"><summary><span class="ev-n">01</span><span class="ev-ref">Откровение 21:1–4</span><i class="tag stated">Сказано</i></summary><div class="ev-body"><p>Новое небо и новая земля, город, сходящий с неба, Бог, обитающий с людьми, и конец смерти и плача.</p><a href="https://www.bible.com/bible/400/REV.21.SYNO" target="_blank" rel="noopener">Читать Откровение 21 ↗</a></div></details>
    <details class="ev"><summary><span class="ev-n">02</span><span class="ev-ref">Откровение 21:9–10</span><i class="tag stated">Сказано</i></summary><div class="ev-body"><p>Ангел обещает показать «невесту» и показывает святой город: город — это народ Божий.</p><a href="https://www.bible.com/bible/400/REV.21.SYNO" target="_blank" rel="noopener">Читать Откровение 21 ↗</a></div></details>
    <details class="ev"><summary><span class="ev-n">03</span><span class="ev-ref">Откровение 21:16, 22; 3 Царств 6:20</span><i class="tag link">Связь</i></summary><div class="ev-body"><p>Город в форме куба соответствует внутреннему святилищу храма, и храма в нём нет, потому что Бог и Агнец — его храм.</p><a href="https://www.bible.com/bible/400/1KI.6.SYNO" target="_blank" rel="noopener">Читать 3 Царств 6 ↗</a></div></details>
    <details class="ev"><summary><span class="ev-n">04</span><span class="ev-ref">Откровение 22:1–5; Бытие 2–3</span><i class="tag link">Связь</i></summary><div class="ev-body"><p>Река, древо жизни и снятие проклятия возвращают Эдем — и превосходят его.</p><a href="https://www.bible.com/bible/400/REV.22.SYNO" target="_blank" rel="noopener">Читать Откровение 22 ↗</a></div></details>
    <details class="ev"><summary><span class="ev-n">05</span><span class="ev-ref">Римлянам 8:19–23; 2 Петра 3:13</span><i class="tag inference">Вывод</i></summary><div class="ev-body"><p>Творение освобождается, а не выбрасывается. Понимание слова «новое» как обновления, а не замены, — так реформатская традиция в целом понимала эти тексты, хотя некоторые читают 2 Петра 3:10 как более полное разрушение.</p><a href="https://www.bible.com/bible/400/ROM.8.SYNO" target="_blank" rel="noopener">Читать Римлянам 8 ↗</a></div></details>
  </section>
  <aside class="lesson"><span class="rubric">Урок, который нужно запомнить</span><p>Последнее слово — не разрушение. Это жизнь с Богом, лицом к лицу, вовеки. «Ей, гряди, Господи Иисусе!»</p></aside>
  <section class="quiz"><span class="rubric">Проверьте себя</span><h3>Почему в Новом Иерусалиме нет храма?</h3><div class="quiz-options"><button class="quiz-opt" data-correct>Потому что Господь Бог и Агнец — его храм</button><button class="quiz-opt">Потому что поклонение прекратилось</button><button class="quiz-opt">Потому что город ещё не достроен</button></div><p class="quiz-feedback" hidden>«Храма же я не видел в нем, ибо Господь Бог Вседержитель — храм его, и Агнец» (21:22). Весь город — жилище Бога.</p></section>
</section>

    lenses: {
      preterism: { title: 'Исполнилось в первом веке', desc: 'Большинство видений описывает события апостольской эпохи: римские гонения и, по мнению многих претеристов, падение Иерусалима в 70 году.', stress: 'Семь реальных церквей, культ римского императора и настойчивое утверждение книги, что всё это «надлежит быть вскоре» (1:1, 3).', caveat: 'Частичные претеристы по-прежнему ожидают телесного возвращения Христа, воскресения и последнего суда. Полный претеризм, утверждающий, что и это уже в прошлом, находится за пределами исторических символов веры.', eras: [0.95, 0.25, 0.1, 0.18] },
      historicism: { title: 'Карта истории церкви', desc: 'Видения разворачиваются последовательно через века — от Иоанна до конца, — и определённые империи и движения соотносятся с определёнными символами.', stress: 'Долгая борьба Царства Христа с враждебными силами. Многие реформаторы читали так образы зверя и Вавилона, часто имея в виду папство.', caveat: 'Историцисты так и не пришли к согласию, какие символы соответствуют каким событиям, и их схемы приходилось перерисовывать по мере того, как шла история.', eras: [0.3, 0.9, 0.95, 0.65] },

      idealism: { title: 'Вся эпоха глазами неба', desc: 'Видения изображают реальности, истинные для всей эпохи между пришествиями Христа: страдающее свидетельство церкви, обман мирской власти, Божьи суды и победу Христа.', stress: 'Ветхозаветная образность Откровения, его повторяющиеся циклы и обращение к «церквам» всех времён.', caveat: 'Сам по себе идеализм может оторваться от истории. Прочтение этого пособия закрепляет его: книга написана реальным церквам под властью Рима, истинна для каждой эпохи и завершается реальным, будущим возвращением.', eras: [0.8, 0.9, 0.9, 0.9] }

      a: { title: 'Амилленаризм: тысяча лет — сейчас', desc: 'Тысяча лет из Откровения 20 — это вся эпоха между первым и вторым пришествиями Христа. Сатана связан, так что не может помешать Евангелию дойти до народов. Умершие верующие царствуют со Христом на небе. Христос возвращается один раз, воскрешает всех мёртвых, судит мир и творит всё новое.', texts: 'Матфея 12:29 (сильный связан); Ефесянам 1:20–22 и Матфея 28:18 (Христос царствует сейчас); Иоанна 5:28–29 (один час, одно воскресение всех); Откровение 20 как новое видение всей эпохи, подобно шести предыдущим.', caveat: '«Амилленаризм» не означает «никакого тысячелетия». Он означает, что тысячелетнее царство — не отдельное будущее земное царство. Таково прочтение реформатских исповеданий и этого пособия.', segs: [['Первое при\u00ADшествие', 'Сатана связан, Христос воцарился', 'event', 0.8], ['Тысяча лет', 'Христос царствует; Евангелие идёт по миру', 'reign', 3], ['Краткое осво\u00ADбождение', 'Последнее отступление', 'event', 0.8], ['Христос возвра\u00ADщается', 'Одно воскресение, один суд', 'event', 1], ['Новое творение', 'Навеки', 'final', 1.1]] },

      post: { title: 'Постмилленаризм: Христос возвращается после тысячелетия', desc: 'Через Евангелие Царство Христа растёт, пока бо́льшая часть мира не станет христианской, и наступает долгая эпоха праведности и мира, после которой Он возвращается судить и творить всё новое.', texts: 'Псалмы 2 и 71 (в еврейской нумерации 72); притчи о горчичном зерне и закваске (Матфея 13:31–33); Великое поручение (Матфея 28:18–20).', caveat: 'Постмилленаристы согласны с амилленаристами в том, что возвращение одно и воскресение одно. Различие — в ожидании золотого века внутри истории.', segs: [['Евангелие ше\u00ADствует', 'Царство растёт', 'age', 1.6], ['Золотой век', 'Расцвет христианства', 'reign', 2], ['Христос возвра\u00ADщается', 'Воскресение и суд', 'event', 1], ['Новое творение', 'Навеки', 'final', 1.1]] }

/* ---------- Outline of the current page ---------- */
function outline(page) {
  if (page._toc) return page._toc;
  const items = [];
  $$('.passage, h2, .quiz, details.alt', page).forEach(node => {
    if (node.matches('h2') && node.closest('.passage, .quiz, details.alt')) return;
    let label;
    if (node.matches('.passage, .quiz')) label = $('.rubric', node).textContent;
    else if (node.matches('details.alt')) label = $('summary', node).textContent;
    else if (node.closest('.primary')) label = $('.rubric', node.closest('.primary')).textContent;
    else label = node.textContent;
    label = label.replace(/\s+/g, ' ').trim();
    const k = items.length + 1;
    const anchor = el('span', 'sec-anchor'); anchor.id = `${page.id}--${k}`;
    node.before(anchor);
    items.push({ id: anchor.id, label, node });
    if (node.matches('h2') && !node.closest('.primary')) {
      const b = el('button', 'h-link', '#'); b.type = 'button';
      b.setAttribute('aria-label', t('copyLink')); b.title = t('copyLink');
      b.dataset.anchor = anchor.id;
      node.append(b);
    }
  });
  const words = page.textContent.trim().split(/\s+/).length;
  page._toc = { items, minutes: Math.max(1, Math.round(words / 210)) };
  return page._toc;
}

function renderToc(id) {
  $$('.toc').forEach(x => x.remove());
  const page = byId[id];
  if (!page) return;
  const { items, minutes } = outline(page);
  toc = items;
  if (items.length < 2) return;
  $$(`.nav-list li[data-id="${CSS.escape(id)}"]`).forEach(li => {
    const box = el('div', 'toc');
    box.append(el('p', 'toc-head', `${t('onPage')} · ${t('minutes')(minutes)}`));
    const ol = el('ol');
    items.forEach(it => {
      const a = el('a', null, it.label); a.href = '#' + it.id; a.dataset.toc = it.id;
      const li2 = el('li'); li2.append(a); ol.append(li2);
    });
    box.append(ol);
    li.append(box);
  });
  spy();
}

function spy() {
  if (!toc.length) return;
  const line = window.innerHeight * 0.32;
  let active = toc[0].id;
  for (const it of toc) { if (it.node.getBoundingClientRect().top - line <= 0) active = it.id; else break; }
  $$('.toc a').forEach(a => {
    if (a.dataset.toc === active) a.setAttribute('aria-current', 'location'); else a.removeAttribute('aria-current');
  });
}

function filterNav(container, q) {
  q = fold(q.trim());
  let shown = 0;
  container.classList.toggle('filtering', !!q);

    let any = false;
    $$('.nav-link', g).forEach(a => {

}

function show(id, focus) {

  pages.forEach(p => { p.hidden = p.id !== id; });

  document.title = (id === 'introduction' ? t('home') : titleOf(id) + ' · ' + t('home')) + ' — ' + t('docTitle');
  updateNavState();

function route(focus) {
  const raw = decodeURIComponent(location.hash.slice(1));
  if (!raw) return show('introduction', false);
  if (byId[raw]) return show(raw, focus);
  const m = raw.match(/^(.+)--\d+$/);
  if (m && byId[m[1]]) outline(byId[m[1]]);
  const target = document.getElementById(raw);
  const page = target && target.closest('.page');
  if (page) {
    show(page.id, false);

    requestAnimationFrame(() => target.scrollIntoView({ block: 'start' }));

/* ---------- Mount a language ---------- */

let ticking = false, lastY = window.scrollY;

  else if (y > lastY + 8) root.classList.add('hdr-away');

  }

}

  const theme = choice === 'auto' ? (darkPref.matches ? 'night' : 'vellum') : choice;
  root.dataset.theme = theme;
  const meta = $('meta[name="theme-color"]'); if (meta) meta.setAttribute('content', theme === 'night' ? '#1B1612' : '#F4EBD6');
  $$('[data-theme-pick]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.themePick === choice)));
}
function applySize(z) {
  root.style.setProperty('--zoom', z);
  $$('[data-size]').forEach(b => b.setAttribute('aria-pressed', String(Number(b.dataset.size) === Number(z))));
  requestAnimationFrame(onScroll);
}
applyTheme(store.get('theme', 'vellum'));
applySize(store.get('size', 1));
darkPref.addEventListener('change', () => { if (store.get('theme', 'vellum') === 'auto') applyTheme('auto'); });
$$('[data-theme-pick]').forEach(b => b.addEventListener('click', () => { store.set('theme', b.dataset.themePick); applyTheme(b.dataset.themePick); }));
$$('[data-size]').forEach(b => b.addEventListener('click', () => { store.set('size', Number(b.dataset.size)); applySize(b.dataset.size); }));

let settingsReturn = null;
function openSettings(from) {
  settingsReturn = from || document.activeElement;
  settings.hidden = false;
  settingsBtn.setAttribute('aria-expanded', 'true');
  const first = $('.seg button[aria-pressed="true"]', settings) || $('button', settings);
  first.focus();
}
function closeSettings(restore = true) {
  if (settings.hidden) return;
  settings.hidden = true;
  settingsBtn.setAttribute('aria-expanded', 'false');
  disarmReset();
  if (restore && settingsReturn && settingsReturn.isConnected) settingsReturn.focus();
}
settingsBtn.addEventListener('click', () => { if (settings.hidden) openSettings(settingsBtn); else closeSettings(); });
$('#settingsClose').addEventListener('click', () => closeSettings());
$('#drawerSettings').addEventListener('click', () => { closeDrawer(false); openSettings(contentsBtn); });
settings.addEventListener('keydown', e => { if (e.key === 'Escape') { e.preventDefault(); closeSettings(); } });
document.addEventListener('pointerdown', e => {
  if (!settings.hidden && !settings.contains(e.target) && !settingsBtn.contains(e.target) && !e.target.closest('#drawerSettings')) closeSettings(false);
});
$('#printBtn').addEventListener('click', () => { closeSettings(false); setTimeout(() => window.print(), 50); });

const keysDialog = $('#keysDialog');
function openKeys() { closeSettings(false); if (!keysDialog.open) keysDialog.showModal(); }
$('#shortcutsBtn').addEventListener('click', openKeys);
$('#keysClose').addEventListener('click', () => keysDialog.close());
keysDialog.addEventListener('click', e => { if (e.target === keysDialog) keysDialog.close(); });

let resetTimer = 0;
const resetBtn = $('#resetBtn');
function disarmReset() { clearTimeout(resetTimer); delete resetBtn.dataset.armed; resetBtn.textContent = t('reset'); }
resetBtn.addEventListener('click', () => {
  if (!resetBtn.dataset.armed) {
    resetBtn.dataset.armed = '1'; resetBtn.textContent = t('resetArmed');
    resetTimer = setTimeout(disarmReset, 4000);
    return;
  }
  disarmReset();
  done.clear(); seen.clear();
  ['done', 'seen', 'last', 'collapsed'].forEach(k => store.del(k));
  collapsed.clear();
  const at = currentId;
  mount(lang);
  if (at) show(at, false);
  closeSettings();
  toast(t('resetDone'));
});

/* ---------- Keyboard shortcuts ---------- */
document.addEventListener('keydown', e => {
  if (e.defaultPrevented || e.metaKey || e.ctrlKey || e.altKey) return;
  const tgt = e.target;
  if (tgt.closest('input, textarea, select, [contenteditable="true"]')) return;
  if (keysDialog.open || !drawer.hidden) return;
  if (e.key === 'Escape') { closeSettings(); return; }
  if (!settings.hidden && e.key !== '?') return;
  const i = order.indexOf(currentId);
  switch (e.key) {
    case 'ArrowLeft':
    case 'ArrowRight':
      if (tgt.closest('[role="tablist"], .table-scroll, .seg, .lang-pick')) return;
      e.preventDefault();
      if (e.key === 'ArrowLeft' && i > 0) location.hash = order[i - 1];
      if (e.key === 'ArrowRight' && i < order.length - 1) location.hash = order[i + 1];
      break;
    case '/':
      e.preventDefault();
      if (desktop.matches) { if (!sideShown()) setSide(true); $('#sideSearch').focus(); }
      else { openDrawer(); $('#drawerSearch').focus(); }
      break;
    case 's': case 'S': e.preventDefault(); toggleContents(); break;
    case 'l': case 'L': e.preventDefault(); switchLang(LANGS[(LANGS.indexOf(lang) + 1) % LANGS.length]); break;
    case 't': case 'T': e.preventDefault(); toTop(); break;
    case '?': e.preventDefault(); openKeys(); break;
    default: break;
  }
});

mount(pickLang());
})();

</script>
</body>
</html>
