  <div class="myth"><span class="rubric">A common misunderstanding</span><p>Four supernatural riders will appear in a future seven-year tribulation, just before the world ends.</p></div>
  <div class="teach">
    <h2>What Scripture teaches</h2>
    <p class="illum">The horsemen ride out only when the Lamb opens the seals. They picture conquest, war, scarcity and death: the same four judgments God named through Ezekiel (“sword, famine, wild beasts, and plague,” Ezekiel 14:21), drawn as horses from Zechariah’s visions (Zechariah 1 and 6). Jesus said these troubles would mark the whole age: “wars and rumors of wars… famines and earthquakes,” which are “the beginning of birth pains” (Matthew 24:6–8).</p>
    <p>So the horsemen are not four future events. They are the characteristic sorrows of history between Christ’s comings. Notice the limits: authority is “given” to them, and only over “a fourth of the earth.” Then the fifth seal shows the martyrs crying “How long?”, and the sixth seal brings the end of the world itself. The seventh opens into the trumpets, the next vision of the same age.</p>
  </div>
  <div class="seals" aria-labelledby="seals-h">
    <h3 id="seals-h">One scroll, seven seals</h3>
    <p>Four horsemen, a cry from the altar, and the end, then silence before the next vision begins.</p>
    <ol class="seal-row">
      <li class="seal"><span class="wax" aria-hidden="true">I</span><b>White horse</b><small>Conquest · 6:1–2</small></li>
      <li class="seal"><span class="wax" aria-hidden="true">II</span><b>Red horse</b><small>War · 6:3–4</small></li>
      <li class="seal"><span class="wax" aria-hidden="true">III</span><b>Black horse</b><small>Scarcity · 6:5–6</small></li>
      <li class="seal"><span class="wax" aria-hidden="true">IV</span><b>Pale horse</b><small>Death · 6:7–8</small></li>
      <li class="seal"><span class="wax" aria-hidden="true">V</span><b>The martyrs</b><small>“How long?” · 6:9–11</small></li>
      <li class="seal end"><span class="wax" aria-hidden="true">VI</span><b>The end</b><small>Day of wrath · 6:12–17</small></li>
      <li class="seal"><span class="wax" aria-hidden="true">VII</span><b>Silence</b><small>Then trumpets · 8:1–5</small></li>
    </ol>
    <p class="seal-note">Between the sixth and seventh seals, chapter 7 pauses to show God’s people sealed and safe. The question “who is able to withstand it?” (6:17) is answered at once: the sealed servants of God.</p>
  </div>
  <section class="evidence" aria-labelledby="ev-horsemen">
    <h2 id="ev-horsemen">How do we know?</h2>
    <details class="ev"><summary><span class="ev-n">01</span><span class="ev-ref">Revelation 6:1–8</span><i class="tag stated">Stated</i></summary><div class="ev-body"><p>Each rider appears when the Lamb opens a seal, and each is “given” his authority.</p><a href="https://ebible.org/engbsb/REV06.htm" target="_blank" rel="noopener">Read Revelation 6 ↗</a></div></details>
    <details class="ev"><summary><span class="ev-n">02</span><span class="ev-ref">Zechariah 1:8–11; 6:1–8</span><i class="tag link">Connection</i></summary><div class="ev-body"><p>Coloured horses patrol the earth in Zechariah’s night visions, sent out by the Lord.</p><a href="https://ebible.org/engbsb/ZEC06.htm" target="_blank" rel="noopener">Read Zechariah 6 ↗</a></div></details>
    <details class="ev"><summary><span class="ev-n">03</span><span class="ev-ref">Matthew 24:6–8</span><i class="tag link">Connection</i></summary><div class="ev-body"><p>Jesus describes war, famine and earthquakes as marks of the age before the end, not signs that the end has come.</p><a href="https://ebible.org/engbsb/MAT24.htm" target="_blank" rel="noopener">Read Matthew 24 ↗</a></div></details>
    <details class="ev"><summary><span class="ev-n">04</span><span class="ev-ref">The white horse (6:2)</span><i class="tag caution">Caution</i></summary><div class="ev-body"><p>The first rider is disputed even among Reformed interpreters. Hendriksen saw Christ and the gospel’s advance (compare 19:11); many others see conquest or a counterfeit of Christ, since the other three riders bring harm.</p></div></details>
  </section>
  <details class="alt"><summary>How others read it</summary><div class="alt-body"><div class="alt-grid">
    <article><h3>Future tribulation judgments</h3><p>Futurists place the seals in a coming seven-year period, often with the white rider as the Antichrist making a false peace.</p></article>
    <article class="ours"><h3>Marks of the whole age</h3><p>The seals show what every generation suffers between Christ’s comings, under the Lamb’s control, until the sixth seal brings the end.</p></article>
  </div></div></details>
  <aside class="lesson"><span class="rubric">The lesson to remember</span><p>When the world trembles, remember who opens the seals.</p></aside>
  <section class="quiz"><span class="rubric">Check your understanding</span><h3>What happens at the sixth seal?</h3><div class="quiz-options"><button class="quiz-opt" data-correct>The great day of wrath arrives: the end of the world</button><button class="quiz-opt">A fifth horseman rides out</button><button class="quiz-opt">The church is secretly removed</button></div><p class="quiz-feedback" hidden>At the sixth seal the sky rolls up like a scroll and “the great day of Their wrath has come” (6:12–17). The first cycle of visions has already reached the end.</p></section>
</section>

<section class="page topic" id="144000" data-nav="Who are the 144,000?" data-num="04" data-keywords="144000 144,000 sealed tribes israel great multitude revelation 7 14 church">
  <p class="eyebrow">Question 04 · Revelation 7 and 14</p>
  <h1>Who are the 144,000?</h1>
  <p class="deck">The people God counts, seals and keeps</p>
  <div class="locator" data-vision="2,4"></div>
  <ul class="refs" aria-label="Passages to read"><li class="refs-label">Read in the BSB</li><li><a href="https://ebible.org/engbsb/REV07.htm" target="_blank" rel="noopener">Revelation 7</a></li><li><a href="https://ebible.org/engbsb/REV14.htm" target="_blank" rel="noopener">Revelation 14</a></li><li><a href="https://ebible.org/engbsb/NUM01.htm" target="_blank" rel="noopener">Numbers 1</a></li></ul>
  <figure class="art"><img data-art src="https://commons.wikimedia.org/wiki/Special:FilePath/Albrecht_D%C3%BCrer,_The_Four_Angels_Holding_the_Winds,_1498,_NGA_142354.jpg?width=1000" alt="Woodcut: four angels hold back the winds while another angel marks the foreheads of a crowd of the faithful." loading="lazy" decoding="async" width="1000" height="1400"><figcaption><b>The Four Angels Holding the Winds</b> and the sealing of God’s servants, Albrecht Dürer, 1498. Historical artwork, not a literal picture of the vision.</figcaption></figure>
  <blockquote class="passage"><span class="rubric">The text</span><p>After this I looked and saw a multitude too large to count, from every nation and tribe and people and tongue, standing before the throne and before the Lamb. They were wearing white robes and holding palm branches in their hands.</p><footer><cite>Revelation 7:9</cite><a href="https://ebible.org/engbsb/REV07.htm" target="_blank" rel="noopener">Read the chapter ↗</a></footer></blockquote>
  <div class="myth"><span class="rubric">A common misunderstanding</span><p>Only 144,000 people will be saved, or the number is a special group of Jewish evangelists in a future tribulation.</p></div>
  <div class="teach">
    <h2>What Scripture teaches</h2>
    <p class="illum">John <em>hears</em> a number: 144,000 sealed from the tribes of Israel (7:4). Then he turns and <em>sees</em> “a multitude too large to count, from every nation” (7:9). This is exactly what happened in chapter 5, when he heard of a Lion and saw a Lamb. What John hears and what he sees are the same reality from two sides. <strong>The 144,000 is the whole church</strong>, described as God’s true Israel and counted to the last person; the great multitude is that same church as it really is, gathered from every people.</p>
    <p>The number is built, not counted: 12 tribes × 12 apostles × 1,000, the fullness of God’s people. It is laid out like a military census (compare Numbers 1), because these are the Lamb’s army who “follow the Lamb wherever He goes” (14:4). The list itself is unusual. Judah, the tribe of the Messiah, comes first, and Dan is left out altogether. This is not an ordinary list of the tribes; it is a portrait of the people of the Messiah. The New Testament calls the church “the Israel of God” (Galatians 6:16), and the seal on their foreheads means they belong to God and will be kept through every trial.</p>
  </div>
  <div class="pair-cards">
    <article><span class="ref">What John hears · 7:4–8</span><h3>144,000</h3><p>Counted by tribe, sealed, ordered for battle. The church as the true Israel, complete.</p></article>
    <article class="dark"><span class="ref">What John sees · 7:9–17</span><h3>A countless multitude</h3><p>From every nation, robed in white, before the throne. The same church, as it truly is.</p></article>
  </div>
  <section class="evidence" aria-labelledby="ev-144">
    <h2 id="ev-144">How do we know?</h2>
    <details class="ev"><summary><span class="ev-n">01</span><span class="ev-ref">Revelation 7:4, 9</span><i class="tag stated">Stated</i></summary><div class="ev-body"><p>“I heard the number… After this I looked and saw a multitude too large to count.”</p><a href="https://ebible.org/engbsb/REV07.htm" target="_blank" rel="noopener">Read Revelation 7 ↗</a></div></details>
    <details class="ev"><summary><span class="ev-n">02</span><span class="ev-ref">Revelation 5:5–6</span><i class="tag link">Connection</i></summary><div class="ev-body"><p>The same pattern: John hears “Lion” and sees a Lamb. Hearing and seeing describe one reality two ways.</p><a href="https://ebible.org/engbsb/REV05.htm" target="_blank" rel="noopener">Read Revelation 5 ↗</a></div></details>
    <details class="ev"><summary><span class="ev-n">03</span><span class="ev-ref">Galatians 6:16; Romans 2:28–29; Philippians 3:3</span><i class="tag link">Connection</i></summary><div class="ev-body"><p>Paul calls believers “the Israel of God” and the true circumcision, those who worship by the Spirit.</p><a href="https://ebible.org/engbsb/GAL06.htm" target="_blank" rel="noopener">Read Galatians 6 ↗</a></div></details>
    <details class="ev"><summary><span class="ev-n">04</span><span class="ev-ref">Revelation 14:1–4</span><i class="tag inference">Inference</i></summary><div class="ev-body"><p>The 144,000 stand with the Lamb, bear his Father’s name, and follow him. Seeing them as the whole redeemed church is a conclusion drawn from chapters 5, 7 and 14 together.</p><a href="https://ebible.org/engbsb/REV14.htm" target="_blank" rel="noopener">Read Revelation 14 ↗</a></div></details>
  </section>
  <details class="alt"><summary>How others read it</summary><div class="alt-body"><div class="alt-grid">
    <article><h3>Ethnic Israel in the end times</h3><p>Dispensationalists see 144,000 Jewish believers sealed during a future tribulation, distinct from the multitude of Gentile believers.</p></article>
    <article class="ours"><h3>The whole people of God</h3><p>The number is symbolic of fullness, and the multitude is the same company seen as it truly is: one church of Jews and Gentiles.</p></article>
  </div></div></details>
  <aside class="lesson"><span class="rubric">The lesson to remember</span><p>God knows every one of his people by name, and not one of them will be lost.</p></aside>
  <section class="quiz"><span class="rubric">Check your understanding</span><h3>What does John see right after he hears the number 144,000?</h3><div class="quiz-options"><button class="quiz-opt" data-correct>A multitude too large to count, from every nation</button><button class="quiz-opt">Exactly 144,000 men from Israel and no one else</button><button class="quiz-opt">An empty heaven waiting to be filled</button></div><p class="quiz-feedback" hidden>John hears the number, then sees the countless multitude (7:4, 9), just as he heard of the Lion and saw the Lamb in chapter 5.</p></section>
</section>

<section class="page topic" id="trumpets" data-nav="What are the trumpets and bowls?" data-num="05" data-keywords="seven trumpets seven bowls plagues egypt exodus wrath third revelation 8 9 15 16 judgments">
  <p class="eyebrow">Question 05 · Revelation 8–9 and 15–16</p>
  <h1>What are the trumpets and bowls?</h1>
  <p class="deck">The plagues of Egypt, sounded over the whole age</p>
  <div class="locator" data-vision="3,5"></div>
  <ul class="refs" aria-label="Passages to read"><li class="refs-label">Read in the BSB</li><li><a href="https://ebible.org/engbsb/REV08.htm" target="_blank" rel="noopener">Revelation 8</a></li><li><a href="https://ebible.org/engbsb/REV09.htm" target="_blank" rel="noopener">Revelation 9</a></li><li><a href="https://ebible.org/engbsb/REV16.htm" target="_blank" rel="noopener">Revelation 16</a></li><li><a href="https://ebible.org/engbsb/EXO07.htm" target="_blank" rel="noopener">Exodus 7</a></li></ul>
  <figure class="art"><img data-art src="https://commons.wikimedia.org/wiki/Special:FilePath/Albrecht_D%C3%BCrer,_The_Seven_Angels_with_the_Trumpets,_probably_c._1496-1498,_NGA_850.jpg?width=1000" alt="Woodcut: seven angels receive trumpets before God’s throne while fire, hail and a falling star strike the earth and sea below." loading="lazy" decoding="async" width="1000" height="1400"><figcaption><b>The Seven Angels with the Trumpets</b>, Albrecht Dürer, about 1496–98. Historical artwork, not a literal picture of the vision.</figcaption></figure>
  <blockquote class="passage"><span class="rubric">The text</span><p>Now the rest of mankind who were not killed by these plagues still did not repent of the works of their hands. They did not stop worshiping demons and idols of gold, silver, bronze, stone, and wood, which cannot see or hear or walk.</p><footer><cite>Revelation 9:20</cite><a href="https://ebible.org/engbsb/REV09.htm" target="_blank" rel="noopener">Read the chapter ↗</a></footer></blockquote>
  <div class="myth"><span class="rubric">A common misunderstanding</span><p>The trumpets and bowls are fourteen separate disasters that will happen one after another in the last few years of history.</p></div>
  <div class="teach">
    <h2>What Scripture teaches</h2>
    <p class="illum">Both series are patterned on the plagues God sent on Egypt before the exodus: hail and fire, water turned to blood, darkness, locusts, sores. The point is the same as in Exodus. God judges a world that worships false gods and oppresses his people, and he is leading his people out to freedom. Just before the trumpets sound, the prayers of the saints rise from the altar and fire is thrown to the earth (8:3–5). <strong>The judgments are God’s answer to his people’s prayers.</strong></p>
    <p>The two series strike the same targets, in the same order. The difference is how far they reach. The trumpets fall on “a third,” partial judgments that act as warnings, and still the world will not repent (9:20–21). The bowls are “the seven final plagues, with which the wrath of God is completed” (15:1). They are not later events but the same pattern seen at full strength, at the end of the age.</p>
  </div>
  <div class="table-scroll wide"><table class="parallels">
    <caption>Same targets, same order. Trumpets warn; bowls complete.</caption>
    <thead><tr><th scope="col">Target</th><th scope="col">Trumpets · partial</th><th scope="col">Bowls · complete</th></tr></thead>
    <tbody>
      <tr><th scope="row">1 · The earth<small>Exodus: hail, boils</small></th><td><span class="ref">8:7</span>Hail and fire; a third of the earth burned</td><td><span class="ref">16:2</span>Painful sores on those with the beast’s mark</td></tr>
      <tr><th scope="row">2 · The sea<small>Exodus: blood</small></th><td><span class="ref">8:8–9</span>A third of the sea becomes blood</td><td><span class="ref">16:3</span>The sea becomes blood; every living thing in it dies</td></tr>
      <tr><th scope="row">3 · Rivers and springs</th><td><span class="ref">8:10–11</span>The star Wormwood; a third of the waters turn bitter</td><td><span class="ref">16:4–7</span>Rivers and springs become blood</td></tr>
      <tr><th scope="row">4 · The sun</th><td><span class="ref">8:12</span>A third of sun, moon and stars darkened</td><td><span class="ref">16:8–9</span>The sun scorches people with fire</td></tr>
      <tr><th scope="row">5 · Darkness<small>Exodus: darkness, locusts</small></th><td><span class="ref">9:1–11</span>The Abyss opened; smoke darkens the sky; locusts</td><td><span class="ref">16:10–11</span>The beast’s kingdom plunged into darkness</td></tr>
      <tr><th scope="row">6 · The Euphrates</th><td><span class="ref">9:13–21</span>Four angels released at the river; a vast army</td><td><span class="ref">16:12–16</span>The river dried; kings gathered at Armageddon</td></tr>
      <tr class="final"><th scope="row">7 · The end</th><td><span class="ref">11:15–19</span>“The kingdom of the world has become the kingdom of our Lord”; lightning, earthquake, hail</td><td><span class="ref">16:17–21</span>“It is done!”; the greatest earthquake, enormous hail</td></tr>
    </tbody>
  </table></div>
  <section class="evidence" aria-labelledby="ev-trumpets">
    <h2 id="ev-trumpets">How do we know?</h2>
    <details class="ev"><summary><span class="ev-n">01</span><span class="ev-ref">Exodus 7–10</span><i class="tag link">Connection</i></summary><div class="ev-body"><p>Blood, hail, locusts, darkness and boils are the plagues of Egypt, repeated in Revelation as judgments on a new Pharaoh.</p><a href="https://ebible.org/engbsb/EXO09.htm" target="_blank" rel="noopener">Read Exodus 9 ↗</a></div></details>
    <details class="ev"><summary><span class="ev-n">02</span><span class="ev-ref">Revelation 8:3–5</span><i class="tag stated">Stated</i></summary><div class="ev-body"><p>The incense of the saints’ prayers rises before God, and then fire from the same altar is hurled to the earth.</p><a href="https://ebible.org/engbsb/REV08.htm" target="_blank" rel="noopener">Read Revelation 8 ↗</a></div></details>
    <details class="ev"><summary><span class="ev-n">03</span><span class="ev-ref">Revelation 9:4, 20–21</span><i class="tag stated">Stated</i></summary><div class="ev-body"><p>Those with God’s seal are protected, and the plagues are calls to repentance that the world refuses.</p><a href="https://ebible.org/engbsb/REV09.htm" target="_blank" rel="noopener">Read Revelation 9 ↗</a></div></details>
    <details class="ev"><summary><span class="ev-n">04</span><span class="ev-ref">Revelation 15:1</span><i class="tag inference">Inference</i></summary><div class="ev-body"><p>The bowls are called “final” because they complete God’s wrath. Reading them as the trumpets at full strength, rather than as later events, follows from the matching seven-step pattern.</p><a href="https://ebible.org/engbsb/REV15.htm" target="_blank" rel="noopener">Read Revelation 15 ↗</a></div></details>
  </section>
  <details class="alt"><summary>How others read it</summary><div class="alt-body"><div class="alt-grid">
    <article><h3>A chronological countdown</h3><p>Futurists usually read seals, trumpets and bowls as twenty-one judgments in sequence, the trumpets coming out of the seventh seal and the bowls out of the seventh trumpet.</p></article>
    <article class="ours"><h3>Parallel cycles of one age</h3><p>The trumpets warn throughout the age; the bowls show the same judgments complete at its close. Both end in the same storm from the throne.</p></article>
  </div></div></details>
  <aside class="lesson"><span class="rubric">The lesson to remember</span><p>Every disaster in this world is a trumpet: a summons to repent while there is still time.</p></aside>
  <section class="quiz"><span class="rubric">Check your understanding</span><h3>What is the main difference between the trumpets and the bowls?</h3><div class="quiz-options"><button class="quiz-opt" data-correct>The trumpets strike a third as warnings; the bowls are complete</button><button class="quiz-opt">They strike completely different parts of creation</button><button class="quiz-opt">The bowls are poured out on the church</button></div><p class="quiz-feedback" hidden>The two series hit the same seven targets in the same order. The trumpets are partial (“a third”), and the bowls complete the wrath of God (15:1).</p></section>
</section>

<section class="page topic" id="witnesses" data-nav="Who are the two witnesses?" data-num="06" data-keywords="two witnesses olive trees lampstands moses elijah revelation 11 temple measured sackcloth prophesy">
  <p class="eyebrow">Question 06 · Revelation 11</p>
  <h1>Who are the two witnesses?</h1>
  <p class="deck">The church bearing testimony to the nations</p>
  <div class="locator" data-vision="3"></div>
  <ul class="refs" aria-label="Passages to read"><li class="refs-label">Read in the BSB</li><li><a href="https://ebible.org/engbsb/REV11.htm" target="_blank" rel="noopener">Revelation 11</a></li><li><a href="https://ebible.org/engbsb/ZEC04.htm" target="_blank" rel="noopener">Zechariah 4</a></li><li><a href="https://ebible.org/engbsb/DEU19.htm" target="_blank" rel="noopener">Deuteronomy 19</a></li></ul>
  <figure class="art"><img data-art src="https://commons.wikimedia.org/wiki/Special:FilePath/Albrecht_D%C3%BCrer_-_Saint_John_Devouring_the_Book_(NGA_1941.3.9).jpg?width=1000" alt="Woodcut: a mighty angel with legs like pillars of fire hands John a small book, which he eats." loading="lazy" decoding="async" width="1000" height="1400"><figcaption><b>Saint John Devouring the Book</b>, Albrecht Dürer, about 1496–98. Just before the witnesses appear, John is told, “You must prophesy again” (10:11). Historical artwork, not a literal picture of the vision.</figcaption></figure>
  <blockquote class="passage"><span class="rubric">The text</span><p>And I will empower my two witnesses, and they will prophesy for 1,260 days, clothed in sackcloth.” These witnesses are the two olive trees and the two lampstands that stand before the Lord of the earth.</p><footer><cite>Revelation 11:3–4</cite><a href="https://ebible.org/engbsb/REV11.htm" target="_blank" rel="noopener">Read the chapter ↗</a></footer></blockquote>
  <div class="myth"><span class="rubric">A common misunderstanding</span><p>Two specific prophets, perhaps Moses and Elijah returned, will preach in a rebuilt temple in Jerusalem during a future tribulation.</p></div>
  <div class="teach">
    <h2>What Scripture teaches</h2>
    <p class="illum">Revelation tells us who they are: “the two lampstands” (11:4). And it has already told us what lampstands are: “the seven lampstands are the seven churches” (1:20). The witnesses are <strong>the church in its calling to testify</strong>. Why two? Because the law required two witnesses to establish a matter (Deuteronomy 19:15), and Jesus sent his disciples out two by two. It may also matter that only two of the seven churches, Smyrna and Philadelphia, received no rebuke.</p>
    <p>Their powers are those of Moses and Elijah: shutting the sky so that it does not rain, as Elijah did for three and a half years (James 5:17), and turning water into blood, as Moses did in Egypt (11:6). The church carries the whole witness of the Law and the Prophets. Its story follows its Lord’s. It prophesies for the whole age (1,260 days), it is protected until its work is done, and then, at the very end, the beast overpowers it. For three and a half days the world celebrates, in “the great city… where their Lord was also crucified.” Then the breath of life enters the witnesses, they stand, and they are called up to heaven in a cloud as their enemies watch (11:11–12). Immediately the seventh trumpet sounds the end.</p>
  </div>
  <section class="evidence" aria-labelledby="ev-witnesses">
    <h2 id="ev-witnesses">How do we know?</h2>
    <details class="ev"><summary><span class="ev-n">01</span><span class="ev-ref">Revelation 11:4 with 1:20</span><i class="tag stated">Stated</i></summary><div class="ev-body"><p>The witnesses are lampstands, and the lampstands are churches. Revelation interprets its own symbol.</p><a href="https://ebible.org/engbsb/REV01.htm" target="_blank" rel="noopener">Read Revelation 1 ↗</a></div></details>
    <details class="ev"><summary><span class="ev-n">02</span><span class="ev-ref">Zechariah 4:2–3, 14</span><i class="tag link">Connection</i></summary><div class="ev-body"><p>Zechariah saw a lampstand beside two olive trees, the anointed ones who stand before the Lord: God’s people empowered by his Spirit.</p><a href="https://ebible.org/engbsb/ZEC04.htm" target="_blank" rel="noopener">Read Zechariah 4 ↗</a></div></details>
    <details class="ev"><summary><span class="ev-n">03</span><span class="ev-ref">Revelation 11:6; James 5:17; Exodus 7:20</span><i class="tag link">Connection</i></summary><div class="ev-body"><p>Shutting the sky recalls Elijah; turning water to blood recalls Moses.</p><a href="https://ebible.org/engbsb/JAS05.htm" target="_blank" rel="noopener">Read James 5 ↗</a></div></details>
    <details class="ev"><summary><span class="ev-n">04</span><span class="ev-ref">Revelation 11:8</span><i class="tag stated">Stated</i></summary><div class="ev-body"><p>The great city is “figuratively called Sodom and Egypt.” The text itself signals that the place is symbolic: the world-city that rejects God.</p><a href="https://ebible.org/engbsb/REV11.htm" target="_blank" rel="noopener">Read Revelation 11 ↗</a></div></details>
    <details class="ev"><summary><span class="ev-n">05</span><span class="ev-ref">Two individuals?</span><i class="tag caution">Caution</i></summary><div class="ev-body"><p>Some careful interpreters, including some amillennialists, hold that two individual prophets will also appear at the end. The symbolic reading above does not depend on ruling that out, but the text gives no names.</p></div></details>
  </section>
  <details class="alt"><summary>How others read it</summary><div class="alt-body"><div class="alt-grid">
    <article><h3>Two end-time prophets</h3><p>Futurists usually expect two literal prophets, often identified as Moses and Elijah or Enoch and Elijah, ministering in Jerusalem for three and a half years.</p></article>
    <article class="ours"><h3>The witnessing church</h3><p>The two lampstands are the church, prophesying through the whole age, silenced briefly at the end, and vindicated when Christ returns.</p></article>
  </div></div></details>
  <aside class="lesson"><span class="rubric">The lesson to remember</span><p>The church is not called to be comfortable but to be faithful. Its testimony cannot be silenced until God says its work is finished.</p></aside>
  <section class="quiz"><span class="rubric">Check your understanding</span><h3>Revelation calls the witnesses “the two lampstands.” What are lampstands in Revelation?</h3><div class="quiz-options"><button class="quiz-opt" data-correct>Churches (1:20)</button><button class="quiz-opt">Angels who guard Jerusalem</button><button class="quiz-opt">The two halves of the Bible</button></div><p class="quiz-feedback" hidden>“The seven lampstands are the seven churches” (1:20). So the two lampstands of 11:4 point to the church as God’s witness.</p></section>
</section>

<section class="page topic" id="1260" data-nav="What do the 1,260 days mean?" data-num="07" data-keywords="1260 days 42 months time times half a time three and a half years daniel 7 12 wilderness numbers">
  <p class="eyebrow">Question 07 · Revelation 11–13</p>
  <h1>What do the 1,260 days mean?</h1>
  <p class="deck">One period of testing, named five ways</p>
  <div class="locator" data-vision="3,4"></div>
  <ul class="refs" aria-label="Passages to read"><li class="refs-label">Read in the BSB</li><li><a href="https://ebible.org/engbsb/REV12.htm" target="_blank" rel="noopener">Revelation 12</a></li><li><a href="https://ebible.org/engbsb/DAN07.htm" target="_blank" rel="noopener">Daniel 7</a></li><li><a href="https://ebible.org/engbsb/DAN12.htm" target="_blank" rel="noopener">Daniel 12</a></li></ul>
  <figure class="art"><img data-art src="https://commons.wikimedia.org/wiki/Special:FilePath/Albrecht_D%C3%BCrer,_The_Apocalyptic_Woman,_1498,_NGA_142358.jpg?width=1000" alt="Woodcut: a woman clothed with the sun and standing on the moon is given eagle’s wings, while a seven-headed dragon threatens her and her child is carried up to God." loading="lazy" decoding="async" width="1000" height="1400"><figcaption><b>The Apocalyptic Woman</b>, Albrecht Dürer, 1498. The woman is nourished in the wilderness for 1,260 days. Historical artwork, not a literal picture of the vision.</figcaption></figure>
  <blockquote class="passage"><span class="rubric">The text</span><p>And she gave birth to a son, a male child, who will rule all the nations with an iron scepter. And her child was caught up to God and to His throne. And the woman fled into the wilderness, where God had prepared a place for her to be nourished for 1,260 days.</p><footer><cite>Revelation 12:5–6</cite><a href="https://ebible.org/engbsb/REV12.htm" target="_blank" rel="noopener">Read the chapter ↗</a></footer></blockquote>
  <div class="myth"><span class="rubric">A common misunderstanding</span><p>These numbers are a stopwatch for the last three and a half years of history, and we can use them to calculate when Christ returns.</p></div>
  <div class="teach">
    <h2>What Scripture teaches</h2>
    <p class="illum">Look at when the period starts in chapter 12. The child is born and “caught up to God and to His throne,” which is Christ’s birth and ascension. Then the woman flees and is nourished for 1,260 days. <strong>The period begins at Christ’s first coming.</strong> It is the church’s time in the wilderness, between the ascension and the return.</p>
    <p>Revelation names this period three ways: 42 months, 1,260 days, and “a time, and times, and half a time,” which is three and a half years. All three come from Daniel, where a time of fierce but limited persecution lasts “a time, and times, and half a time” (Daniel 7:25; 12:7). Three and a half is half of seven: a time that is <em>cut short</em>. It also recalls Elijah’s three and a half years in the wilderness, fed by God while the land was under judgment (James 5:17). The church is trampled yet protected, persecuted yet nourished, and the time is set by God, not by the dragon.</p>
  </div>
  <ul class="periods" aria-label="The five names for one period">
    <li><b>42 months</b><span>The nations trample the outer court; the inner temple is measured and kept</span><span class="ref">11:2</span></li>
    <li><b>1,260 days</b><span>The two witnesses prophesy in sackcloth</span><span class="ref">11:3</span></li>
    <li><b>1,260 days</b><span>The woman is nourished in the wilderness</span><span class="ref">12:6</span></li>
    <li><b>A time, times and half a time</b><span>The woman is nourished out of the serpent’s reach</span><span class="ref">12:14</span></li>
    <li><b>42 months</b><span>The beast is given authority to blaspheme and make war</span><span class="ref">13:5</span></li>
    <li class="short"><b>Three and a half days</b><span>At the very end, the witnesses lie dead and the world celebrates, until God raises them</span><span class="ref">11:9–11</span></li>
  </ul>
  <section class="evidence" aria-labelledby="ev-1260">
    <h2 id="ev-1260">How do we know?</h2>
    <details class="ev"><summary><span class="ev-n">01</span><span class="ev-ref">Revelation 12:5–6</span><i class="tag stated">Stated</i></summary><div class="ev-body"><p>The woman flees for 1,260 days right after the child is caught up to God’s throne.</p><a href="https://ebible.org/engbsb/REV12.htm" target="_blank" rel="noopener">Read Revelation 12 ↗</a></div></details>
    <details class="ev"><summary><span class="ev-n">02</span><span class="ev-ref">Revelation 12:6, 14</span><i class="tag stated">Stated</i></summary><div class="ev-body"><p>The same event, the woman nourished in the wilderness, is given as 1,260 days and as “a time, and times, and half a time.”</p><a href="https://ebible.org/engbsb/REV12.htm" target="_blank" rel="noopener">Read Revelation 12 ↗</a></div></details>
    <details class="ev"><summary><span class="ev-n">03</span><span class="ev-ref">Daniel 7:25; 12:7</span><i class="tag link">Connection</i></summary><div class="ev-body"><p>Daniel uses “a time, and times, and half a time” for the persecution of the saints by a hostile power, a limited period that God brings to an end.</p><a href="https://ebible.org/engbsb/DAN07.htm" target="_blank" rel="noopener">Read Daniel 7 ↗</a></div></details>
    <details class="ev"><summary><span class="ev-n">04</span><span class="ev-ref">Exact dates</span><i class="tag caution">Caution</i></summary><div class="ev-body"><p>Many people have tried to turn these numbers into calendars. Every such date has failed, and Jesus said no one knows the day or hour (Matthew 24:36).</p></div></details>
  </section>
  <details class="alt"><summary>How others read it</summary><div class="alt-body"><div class="alt-grid">
    <article><h3>The second half of Daniel’s 70th week</h3><p>Futurists take the 1,260 days as literal days in the last half of a seven-year tribulation. Historicists often read them as 1,260 years.</p></article>
    <article class="ours"><h3>The whole church age</h3><p>The numbers describe one God-limited period, from the ascension to the return, seen as trampling, witness, protection and persecution.</p></article>
  </div></div></details>
  <aside class="lesson"><span class="rubric">The lesson to remember</span><p>The church’s wilderness has an end date, and God set it. Until then, he feeds his people.</p></aside>
  <section class="quiz"><span class="rubric">Check your understanding</span><h3>In Revelation 12, the woman’s 1,260 days begin right after what event?</h3><div class="quiz-options"><button class="quiz-opt" data-correct>Her child is caught up to God and to his throne</button><button class="quiz-opt">The rapture of the church</button><button class="quiz-opt">The rebuilding of a temple</button></div><p class="quiz-feedback" hidden>The child, Christ, is caught up to God’s throne (12:5), and then the woman flees (12:6). The period starts with his ascension.</p></section>
</section>

<section class="page topic" id="satan" data-nav="Is Satan ruling the world?" data-num="08" data-keywords="satan devil dragon serpent war in heaven michael accuser cast down revelation 12 cross defeated">
  <p class="eyebrow">Question 08 · Revelation 12</p>
  <h1>Is Satan ruling the world?</h1>
  <p class="deck">A defeated enemy on borrowed time</p>
  <div class="locator" data-vision="4,7"></div>
  <ul class="refs" aria-label="Passages to read"><li class="refs-label">Read in the BSB</li><li><a href="https://ebible.org/engbsb/REV12.htm" target="_blank" rel="noopener">Revelation 12</a></li><li><a href="https://ebible.org/engbsb/JHN12.htm" target="_blank" rel="noopener">John 12</a></li><li><a href="https://ebible.org/engbsb/COL02.htm" target="_blank" rel="noopener">Colossians 2</a></li></ul>
  <figure class="art"><img data-art src="https://commons.wikimedia.org/wiki/Special:FilePath/Albrecht_D%C3%BCrer_-_Saint_Michael_Fighting_the_Dragon_(NGA_2008.109.12).jpg?width=1000" alt="Woodcut: the archangel Michael and his angels spear the dragon and its demons in the sky above a quiet landscape." loading="lazy" decoding="async" width="1000" height="1400"><figcaption><b>Saint Michael Fighting the Dragon</b>, Albrecht Dürer, 1498. Historical artwork, not a literal picture of the vision.</figcaption></figure>
  <blockquote class="passage"><span class="rubric">The text</span><p>And the great dragon was hurled down—that ancient serpent called the devil and Satan, the deceiver of the whole world. He was hurled to the earth, and his angels with him.</p><footer><cite>Revelation 12:9</cite><a href="https://ebible.org/engbsb/REV12.htm" target="_blank" rel="noopener">Read the chapter ↗</a></footer></blockquote>
  <div class="myth"><span class="rubric">A common misunderstanding</span><p>God and Satan are two equal powers locked in a struggle whose outcome is still uncertain.</p></div>
  <div class="teach">
    <h2>What Scripture teaches</h2>
    <p class="illum">The war in heaven in Revelation 12 is not about something before creation. It happens because of the cross. The child is caught up to God’s throne, the dragon is thrown down, and heaven explains why: “Now have come the salvation and the power and the kingdom of our God… For <strong>the accuser of our brothers has been thrown down</strong>.” The saints “conquered him by the blood of the Lamb and by the word of their testimony” (12:10–11). Jesus said the same as he went to the cross: “now the prince of this world will be cast out” (John 12:31).</p>
    <p>So Satan is real, dangerous and furious, but he is a defeated creature. He can no longer accuse God’s people before God, because Christ has paid for their sins. He rages on earth “knowing he has only a short time” (12:12). He still persecutes and deceives, and Peter warns that he “prowls around like a roaring lion” (1 Peter 5:8). But he is on a chain (20:1–3), his sentence has been passed, and the lake of fire is waiting (20:10).</p>
  </div>
  <section class="evidence" aria-labelledby="ev-satan">
    <h2 id="ev-satan">How do we know?</h2>
    <details class="ev"><summary><span class="ev-n">01</span><span class="ev-ref">Revelation 12:5, 9–11</span><i class="tag stated">Stated</i></summary><div class="ev-body"><p>The dragon is thrown down after the child is caught up to God, and heaven celebrates the coming of salvation through the blood of the Lamb.</p><a href="https://ebible.org/engbsb/REV12.htm" target="_blank" rel="noopener">Read Revelation 12 ↗</a></div></details>
    <details class="ev"><summary><span class="ev-n">02</span><span class="ev-ref">John 12:31; Luke 10:18; Colossians 2:15</span><i class="tag link">Connection</i></summary><div class="ev-body"><p>Jesus saw Satan fall like lightning and spoke of the ruler of this world being cast out; Paul says Christ disarmed the powers “by the cross.”</p><a href="https://ebible.org/engbsb/COL02.htm" target="_blank" rel="noopener">Read Colossians 2 ↗</a></div></details>
    <details class="ev"><summary><span class="ev-n">03</span><span class="ev-ref">Revelation 12:12; 1 Peter 5:8</span><i class="tag stated">Stated</i></summary><div class="ev-body"><p>The devil is still active and furious, but his time is short.</p><a href="https://ebible.org/engbsb/1PE05.htm" target="_blank" rel="noopener">Read 1 Peter 5 ↗</a></div></details>
    <details class="ev"><summary><span class="ev-n">04</span><span class="ev-ref">Revelation 20:10</span><i class="tag stated">Stated</i></summary><div class="ev-body"><p>The devil who deceived the nations is thrown into the lake of fire. His end is certain.</p><a href="https://ebible.org/engbsb/REV20.htm" target="_blank" rel="noopener">Read Revelation 20 ↗</a></div></details>
  </section>
  <details class="alt"><summary>How others read it</summary><div class="alt-body"><div class="alt-grid">
    <article><h3>A future or primeval fall</h3><p>Some read the war in heaven as Satan’s original rebellion before creation; others place it in the middle of a future tribulation.</p></article>
    <article class="ours"><h3>Thrown down by the cross</h3><p>The context ties Satan’s defeat to Christ’s death and ascension. Revelation 12 explains why the devil rages now: he has lost, and he knows it.</p></article>
  </div></div></details>
  <aside class="lesson"><span class="rubric">The lesson to remember</span><p>Do not underestimate the devil, but never imagine he is God’s equal. The accuser has been thrown down.</p></aside>
  <section class="quiz"><span class="rubric">Check your understanding</span><h3>How do the saints conquer the dragon in Revelation 12?</h3><div class="quiz-options"><button class="quiz-opt" data-correct>By the blood of the Lamb and the word of their testimony</button><button class="quiz-opt">By out-fighting him with angelic armies of their own</button><button class="quiz-opt">They cannot; the outcome is still undecided</button></div><p class="quiz-feedback" hidden>“They have conquered him by the blood of the Lamb and by the word of their testimony” (12:11). The victory was won at the cross.</p></section>
</section>

<section class="page topic" id="beast" data-nav="What is the beast?" data-num="09" data-keywords="beast sea land false prophet daniel 7 rome empire revelation 13 state power">
  <p class="eyebrow">Question 09 · Revelation 13</p>
  <h1>What is the beast?</h1>
  <p class="deck">Power pretending to be God</p>
  <div class="locator" data-vision="4,6"></div>
  <ul class="refs" aria-label="Passages to read"><li class="refs-label">Read in the BSB</li><li><a href="https://ebible.org/engbsb/REV13.htm" target="_blank" rel="noopener">Revelation 13</a></li><li><a href="https://ebible.org/engbsb/DAN07.htm" target="_blank" rel="noopener">Daniel 7</a></li><li><a href="https://ebible.org/engbsb/REV19.htm" target="_blank" rel="noopener">Revelation 19</a></li></ul>
  <figure class="art"><img data-art src="https://commons.wikimedia.org/wiki/Special:FilePath/Albrecht_D%C3%BCrer_-_The_Seven-Headed_Beast_and_the_Beast_with_Lamb%27s_Horns_-_Google_Art_Project.jpg?width=1000" alt="Woodcut: a seven-headed beast rises from the sea while a second beast with lamb’s horns calls down fire, and crowds kneel in worship." loading="lazy" decoding="async" width="1000" height="1400"><figcaption><b>The Seven-Headed Beast and the Beast with Lamb’s Horns</b>, Albrecht Dürer, about 1496–98. Historical artwork, not a literal picture of the vision.</figcaption></figure>
  <blockquote class="passage"><span class="rubric">The text</span><p>Then I saw a beast with ten horns and seven heads rising out of the sea. There were ten royal crowns on its horns and blasphemous names on its heads. The beast I saw was like a leopard, with the feet of a bear and the mouth of a lion. And the dragon gave the beast his power and his throne and great authority.</p><footer><cite>Revelation 13:1–2</cite><a href="https://ebible.org/engbsb/REV13.htm" target="_blank" rel="noopener">Read the chapter ↗</a></footer></blockquote>
  <div class="myth"><span class="rubric">A common misunderstanding</span><p>The beast is only one future world dictator, and the job of Christians is to work out who he is.</p></div>
  <div class="teach">
    <h2>What Scripture teaches</h2>
    <p class="illum">In Daniel 7, four beasts rise from the sea, and Daniel is told they are “four kings who will arise from the earth” (7:17): a lion, a bear, a leopard and a terrifying fourth beast. John’s beast is all of them rolled into one, leopard, bear and lion together. <strong>It is the God-defying state</strong>: political power that demands the worship belonging to God alone and makes war on the saints (13:7). For John’s first readers, that meant Rome and its emperor cult. But the beast outlives Rome. It has risen again in every empire that has set itself up as god.</p>
    <p>A second beast rises from the land. It “had two horns like a lamb, but spoke like a dragon” (13:11). It works signs and persuades people to worship the first beast; later Revelation calls it “the false prophet” (16:13; 19:20). It is false religion and propaganda serving the state. Together, the dragon, the beast and the false prophet form an evil counterfeit of the Father, the Son and the Spirit. The beast even has a mortal wound that was healed (13:3), a parody of the resurrection. At the end, this pattern comes to a final head, in what Hoekema called both a principle and a person. And then it is captured and thrown into the lake of fire (19:20).</p>
  </div>
  <div class="pair-cards">
    <article class="red"><span class="ref">13:1–10 · from the sea</span><h3>The first beast</h3><p>Political power claiming divine authority. Blasphemes God, wars on the saints, is worshipped by the world.</p></article>
    <article class="red"><span class="ref">13:11–18 · from the land</span><h3>The false prophet</h3><p>Religion and persuasion in the service of the state. Looks like a lamb, speaks like the dragon.</p></article>
  </div>
  <section class="evidence" aria-labelledby="ev-beast">
    <h2 id="ev-beast">How do we know?</h2>
    <details class="ev"><summary><span class="ev-n">01</span><span class="ev-ref">Daniel 7:3–7, 17</span><i class="tag stated">Stated</i></summary><div class="ev-body"><p>Daniel’s beasts from the sea are explained as kings and kingdoms.</p><a href="https://ebible.org/engbsb/DAN07.htm" target="_blank" rel="noopener">Read Daniel 7 ↗</a></div></details>
    <details class="ev"><summary><span class="ev-n">02</span><span class="ev-ref">Revelation 13:1–2</span><i class="tag link">Connection</i></summary><div class="ev-body"><p>John’s beast combines Daniel’s leopard, bear and lion, and has ten horns like Daniel’s fourth beast.</p><a href="https://ebible.org/engbsb/REV13.htm" target="_blank" rel="noopener">Read Revelation 13 ↗</a></div></details>
    <details class="ev"><summary><span class="ev-n">03</span><span class="ev-ref">Revelation 13:11–14; 19:20</span><i class="tag stated">Stated</i></summary><div class="ev-body"><p>The second beast directs worship to the first and is later named the false prophet.</p><a href="https://ebible.org/engbsb/REV19.htm" target="_blank" rel="noopener">Read Revelation 19 ↗</a></div></details>
    <details class="ev"><summary><span class="ev-n">04</span><span class="ev-ref">Revelation 17:9–11</span><i class="tag caution">Caution</i></summary><div class="ev-body"><p>The seven heads are seven hills and seven kings, which pointed first-century readers to Rome. Attempts to match the kings to a precise list of emperors have never agreed.</p><a href="https://ebible.org/engbsb/REV17.htm" target="_blank" rel="noopener">Read Revelation 17 ↗</a></div></details>
  </section>
  <details class="alt"><summary>How others read it</summary><div class="alt-body"><div class="alt-grid">
    <article><h3>A single future ruler</h3><p>Futurists see the sea beast mainly as a coming world dictator and his empire, with the false prophet as his religious ally.</p></article>
    <article class="ours"><h3>The persecuting state in every age</h3><p>Rome first, every God-defying power since, and a final embodiment at the end. The beast is a pattern that will culminate in a person.</p></article>
  </div></div></details>
  <aside class="lesson"><span class="rubric">The lesson to remember</span><p>Governments are God’s servants, never God. When any power demands the worship that belongs to Christ, the Christian must refuse.</p></aside>
  <section class="quiz"><span class="rubric">Check your understanding</span><h3>Which Old Testament chapter explains beasts from the sea as kingdoms?</h3><div class="quiz-options"><button class="quiz-opt" data-correct>Daniel 7</button><button class="quiz-opt">Genesis 1</button><button class="quiz-opt">Psalm 23</button></div><p class="quiz-feedback" hidden>Daniel saw four beasts rise from the sea and was told they are “four kings” (Daniel 7:17). John’s beast combines them.</p></section>
</section>

<section class="page topic" id="666" data-nav="What does 666 mean?" data-num="10" data-keywords="666 616 number of the beast nero gematria six seven revelation 13 18">
  <p class="eyebrow">Question 10 · Revelation 13:18</p>
  <h1>What does 666 mean?</h1>
  <p class="deck">A number, not a curse</p>
  <div class="locator" data-vision="4"></div>
  <ul class="refs" aria-label="Passages to read"><li class="refs-label">Read in the BSB</li><li><a href="https://ebible.org/engbsb/REV13.htm" target="_blank" rel="noopener">Revelation 13</a></li></ul>
  <div class="number-art" aria-hidden="true">
    <div><span class="big">7</span><small>The number of God’s fullness: seven churches, seals, trumpets, bowls</small></div>
    <div class="red"><span class="big">666</span><small>Six, and six, and six: always one short of seven</small></div>
  </div>
  <blockquote class="passage"><span class="rubric">The text</span><p>Here is a call for wisdom: Let the one who has insight calculate the number of the beast, for it is the number of a man, and that number is 666.</p><footer><cite>Revelation 13:18</cite><a href="https://ebible.org/engbsb/REV13.htm" target="_blank" rel="noopener">Read the chapter ↗</a></footer></blockquote>
  <div class="myth"><span class="rubric">A common misunderstanding</span><p>The digits 666 are dangerous in themselves, so seeing them on a receipt, a licence plate or a phone number brings a curse.</p></div>
  <div class="teach">
    <h2>What Scripture teaches</h2>
    <p class="illum">In Revelation, seven is the number of completeness, the number of God’s perfect work. Six falls short of it. Six, repeated three times, is <strong>humanity trying to be God and always falling short</strong>. The beast copies the trinity, demands worship and works wonders, but it is still only “the number of a man.” However impressive it looks, it will never reach seven.</p>
    <p>There is a second layer. In Hebrew and Greek, letters also served as numbers. Spell “Nero Caesar” in Hebrew letters (<em>Nrwn Qsr</em>) and their values add up to 666. Nero was the first emperor to persecute Christians, and many later Romans expected him to return; the beast’s healed wound may echo that rumour (13:3). Strikingly, some early manuscripts read 616, which is exactly the total of the Latin spelling of Nero’s name in Hebrew letters. Nero is the likely first-century key, and the symbolic meaning reaches every age. The two fit together: Nero was simply the first “man” of 666.</p>
  </div>
  <section class="evidence" aria-labelledby="ev-666">
    <h2 id="ev-666">How do we know?</h2>
    <details class="ev"><summary><span class="ev-n">01</span><span class="ev-ref">Revelation 13:17–18</span><i class="tag stated">Stated</i></summary><div class="ev-body"><p>The number belongs to the beast’s name and is “the number of a man.” John calls for wisdom, not fear.</p><a href="https://ebible.org/engbsb/REV13.htm" target="_blank" rel="noopener">Read Revelation 13 ↗</a></div></details>
    <details class="ev"><summary><span class="ev-n">02</span><span class="ev-ref">Sevens throughout Revelation</span><i class="tag link">Connection</i></summary><div class="ev-body"><p>Seven churches, spirits, seals, trumpets, bowls and more: seven marks the fullness of God’s work.</p></div></details>
    <details class="ev"><summary><span class="ev-n">03</span><span class="ev-ref">Nero Caesar = 666</span><i class="tag inference">Inference</i></summary><div class="ev-body"><p>The Hebrew spelling נרון קסר (50 + 200 + 6 + 50 + 100 + 60 + 200) totals 666; without the final <em>n</em> it totals 616, the variant some manuscripts have. This identification is widely held but not certain.</p></div></details>
    <details class="ev"><summary><span class="ev-n">04</span><span class="ev-ref">Modern names and gadgets</span><i class="tag caution">Caution</i></summary><div class="ev-body"><p>Almost any name can be made to add up to 666 with enough adjustment. Calculations aimed at modern leaders have repeatedly been wrong.</p></div></details>
  </section>
  <details class="alt"><summary>How others read it</summary><div class="alt-body"><div class="alt-grid">
    <article><h3>A code for a future person</h3><p>Some futurists expect the number to identify the final Antichrist by his name or a system he controls.</p></article>
    <article class="ours"><h3>Humanity falling short, first seen in Nero</h3><p>The number portrays every power that tries to be God and fails. Nero was the first-century example; the pattern continues until the end.</p></article>
  </div></div></details>
  <aside class="lesson"><span class="rubric">The lesson to remember</span><p>Evil can be impressive, but it is only creaturely. It will always be one short of God.</p></aside>
  <section class="quiz"><span class="rubric">Check your understanding</span><h3>Revelation calls 666 “the number of …”</h3><div class="quiz-options"><button class="quiz-opt" data-correct>a man</button><button class="quiz-opt">a curse that comes on whoever sees it</button><button class="quiz-opt">the date of the end</button></div><p class="quiz-feedback" hidden>“It is the number of a man” (13:18). The beast, for all its claims, is only human, and falls short of God.</p></section>
</section>

<section class="page topic" id="mark" data-nav="What is the mark of the beast?" data-num="11" data-keywords="mark of the beast forehead hand seal of god buy sell allegiance worship chip barcode revelation 13 14">
  <p class="eyebrow">Question 11 · Revelation 13:16–17</p>
  <h1>What is the mark of the beast?</h1>
  <p class="deck">A question of allegiance</p>
  <div class="locator" data-vision="4"></div>
  <ul class="refs" aria-label="Passages to read"><li class="refs-label">Read in the BSB</li><li><a href="https://ebible.org/engbsb/REV13.htm" target="_blank" rel="noopener">Revelation 13</a></li><li><a href="https://ebible.org/engbsb/REV14.htm" target="_blank" rel="noopener">Revelation 14</a></li><li><a href="https://ebible.org/engbsb/REV07.htm" target="_blank" rel="noopener">Revelation 7</a></li><li><a href="https://ebible.org/engbsb/DEU06.htm" target="_blank" rel="noopener">Deuteronomy 6</a></li></ul>
  <blockquote class="passage"><span class="rubric">The text</span><p>And the second beast required all people small and great, rich and poor, free and slave, to receive a mark on their right hand or on their forehead, so that no one could buy or sell unless he had the mark—the name of the beast or the number of its name.</p><footer><cite>Revelation 13:16–17</cite><a href="https://ebible.org/engbsb/REV13.htm" target="_blank" rel="noopener">Read the chapter ↗</a></footer></blockquote>
  <div class="myth"><span class="rubric">A common misunderstanding</span><p>The mark is a microchip, barcode, vaccine or digital ID that a person could receive by accident.</p></div>
  <div class="teach">
    <h2>What Scripture teaches</h2>
    <p class="illum">Revelation has two marks, not one. Before the beast marks anyone, God seals “the foreheads of the servants of our God” (7:3), and the 144,000 have “His name and His Father’s name written on their foreheads” (14:1). Nobody thinks God’s seal is a tattoo. It means that they belong to him. <strong>The beast’s mark is the counterfeit</strong>: it shows who belongs to the beast.</p>
    <p>Why the hand and the forehead? Because God told Israel to take his words and “tie them as reminders on your hands and bind them on your foreheads” (Deuteronomy 6:8), meaning that his word should govern what they think and what they do. The mark of the beast is the opposite: a mind and a life shaped by loyalty to the God-defying power. The detail about buying and selling shows how that pressure works. In John’s day, a trade guild could exclude anyone who would not honour the gods and the emperor. Revelation is about worship and allegiance, and every person bears one mark or the other.</p>
  </div>
  <div class="pair-cards">
    <article class="dark"><span class="ref">7:3 · 14:1 · 22:4</span><h3>The seal of God</h3><p>The Father’s and the Lamb’s name on the forehead. Belonging, protection and, at the end, seeing his face.</p></article>
    <article class="red"><span class="ref">13:16–17 · 14:9–11</span><h3>The mark of the beast</h3><p>The beast’s name on hand or forehead. Allegiance bought with access to the marketplace, and lost in the judgment.</p></article>
  </div>
  <section class="evidence" aria-labelledby="ev-mark">
    <h2 id="ev-mark">How do we know?</h2>
    <details class="ev"><summary><span class="ev-n">01</span><span class="ev-ref">Revelation 13:15–17</span><i class="tag stated">Stated</i></summary><div class="ev-body"><p>The mark comes with worship of the beast’s image and exclusion from buying and selling.</p><a href="https://ebible.org/engbsb/REV13.htm" target="_blank" rel="noopener">Read Revelation 13 ↗</a></div></details>
    <details class="ev"><summary><span class="ev-n">02</span><span class="ev-ref">Revelation 7:3; 14:1; 22:4</span><i class="tag link">Connection</i></summary><div class="ev-body"><p>God’s servants are sealed with his name on their foreheads. Revelation sets the two marks side by side.</p><a href="https://ebible.org/engbsb/REV14.htm" target="_blank" rel="noopener">Read Revelation 14 ↗</a></div></details>
    <details class="ev"><summary><span class="ev-n">03</span><span class="ev-ref">Deuteronomy 6:6–8</span><i class="tag link">Connection</i></summary><div class="ev-body"><p>God’s words were to be bound on the hand and forehead: thought and action devoted to him.</p><a href="https://ebible.org/engbsb/DEU06.htm" target="_blank" rel="noopener">Read Deuteronomy 6 ↗</a></div></details>
    <details class="ev"><summary><span class="ev-n">04</span><span class="ev-ref">Revelation 14:9–11</span><i class="tag stated">Stated</i></summary><div class="ev-body"><p>Receiving the mark is tied to worshipping the beast. It is a chosen allegiance, not an accident.</p><a href="https://ebible.org/engbsb/REV14.htm" target="_blank" rel="noopener">Read Revelation 14 ↗</a></div></details>
  </section>
  <details class="alt"><summary>How others read it</summary><div class="alt-body"><div class="alt-grid">
    <article><h3>A visible end-time sign</h3><p>Some expect a literal, visible mark enforced by a final regime, and watch new technologies for it.</p></article>
    <article class="ours"><h3>Two kinds of belonging</h3><p>The mark and the seal stand for allegiance to the beast or to God. The pressure to compromise in order to work and trade is as real now as in John’s day.</p></article>
  </div></div></details>
  <aside class="lesson"><span class="rubric">The lesson to remember</span><p>Don’t ask which gadget to fear. Ask whose name is written on your thinking and your doing.</p></aside>
  <section class="quiz"><span class="rubric">Check your understanding</span><h3>What does Revelation set against the mark of the beast?</h3><div class="quiz-options"><button class="quiz-opt" data-correct>The seal of God, his name on his servants’ foreheads</button><button class="quiz-opt">A rival microchip issued by the church</button><button class="quiz-opt">Nothing. Everyone receives the mark</button></div><p class="quiz-feedback" hidden>God seals his servants first (7:3; 14:1). Every person belongs either to God or to the beast.</p></section>
</section>

<section class="page topic" id="antichrist" data-nav="Who is the Antichrist?" data-num="12" data-keywords="antichrist man of lawlessness 1 john 2 thessalonians 2 papacy pope beast confession">
  <p class="eyebrow">Question 12 · 1 John 2 and 2 Thessalonians 2</p>
  <h1>Who is the Antichrist?</h1>
  <p class="deck">A spirit already at work, and a final opponent to come</p>
  <div class="locator" data-vision="4"></div>
  <ul class="refs" aria-label="Passages to read"><li class="refs-label">Read in the BSB</li><li><a href="https://ebible.org/engbsb/1JN02.htm" target="_blank" rel="noopener">1 John 2</a></li><li><a href="https://ebible.org/engbsb/2JN01.htm" target="_blank" rel="noopener">2 John</a></li><li><a href="https://ebible.org/engbsb/2TH02.htm" target="_blank" rel="noopener">2 Thessalonians 2</a></li></ul>
  <figure class="art"><img data-art src="https://commons.wikimedia.org/wiki/Special:FilePath/Bamberg_Apocalypse_Msc.Bibl.140_0070._32v_The_beast_of_the_sea_miniature_cropped.jpg?width=1000" alt="Medieval miniature: a many-headed beast rises from the sea." loading="lazy" decoding="async" width="1000" height="1000"><figcaption><b>The Beast of the Sea</b>, Bamberg Apocalypse, early 11th century. Historical artwork, not a literal picture of the vision.</figcaption></figure>
  <blockquote class="passage"><span class="rubric">The text</span><p>Children, it is the last hour; and just as you have heard that the antichrist is coming, so now many antichrists have appeared. This is how we know it is the last hour.</p><footer><cite>1 John 2:18</cite><a href="https://ebible.org/engbsb/1JN02.htm" target="_blank" rel="noopener">Read the chapter ↗</a></footer></blockquote>
  <div class="myth"><span class="rubric">A common misunderstanding</span><p>Revelation is about the Antichrist, a mysterious future dictator whom Christians must try to identify among today’s politicians.</p></div>
  <div class="teach">
    <h2>What Scripture teaches</h2>
    <p class="illum">The word <em>antichrist</em> never appears in Revelation. Only John’s letters use it, and there he says something surprising: “many antichrists have appeared” already. An antichrist is anyone who “denies that Jesus is the Christ” (1 John 2:22) or denies “the coming of Jesus Christ in the flesh” (2 John 7). The “spirit of the antichrist” was already in the world in the first century (1 John 4:3). And John says this is how we know it is “the last hour,” which shows that the last days began with Christ’s first coming.</p>
    <p>Paul adds that before Christ returns “the man of lawlessness” will be revealed, setting himself up as God, and that “the Lord Jesus will slay [him] with the breath of His mouth” (2 Thessalonians 2:3–8). Yet even then “the mystery of lawlessness is already at work” (2:7). Putting it together, Hoekema described antichrist as <strong>both a present spirit and a future person</strong>: opposition to Christ runs through the whole age and comes to a final head just before the end. Revelation’s beast is the same reality in picture form.</p>
  </div>
  <div class="note"><p><strong>A note from Reformed history.</strong> The Westminster Confession (25.6) and the 1689 London Baptist Confession (26.4) both identified the papacy as “that antichrist, that man of sin.” The Reformers saw in Rome’s claims the man of lawlessness sitting “in the temple of God.” Some later revisions, such as the 1903 American revision of the Westminster Confession, removed that line, and Reformed Christians today differ on whether it should be held as a final identification or as one historic embodiment of the antichrist spirit.</p></div>
  <section class="evidence" aria-labelledby="ev-antichrist">
    <h2 id="ev-antichrist">How do we know?</h2>
    <details class="ev"><summary><span class="ev-n">01</span><span class="ev-ref">1 John 2:18, 22; 4:3; 2 John 7</span><i class="tag stated">Stated</i></summary><div class="ev-body"><p>Many antichrists had already come; the antichrist spirit denies the Father and the Son and the incarnation.</p><a href="https://ebible.org/engbsb/1JN02.htm" target="_blank" rel="noopener">Read 1 John 2 ↗</a></div></details>
    <details class="ev"><summary><span class="ev-n">02</span><span class="ev-ref">2 Thessalonians 2:3–8</span><i class="tag stated">Stated</i></summary><div class="ev-body"><p>A final man of lawlessness will be revealed and destroyed by Christ at his coming.</p><a href="https://ebible.org/engbsb/2TH02.htm" target="_blank" rel="noopener">Read 2 Thessalonians 2 ↗</a></div></details>
    <details class="ev"><summary><span class="ev-n">03</span><span class="ev-ref">Revelation 13; 19:19–20</span><i class="tag inference">Inference</i></summary><div class="ev-body"><p>The beast’s blasphemy, worship and destruction at Christ’s coming match Paul’s man of lawlessness. Linking them is an interpretation, since Revelation does not use the word.</p><a href="https://ebible.org/engbsb/REV13.htm" target="_blank" rel="noopener">Read Revelation 13 ↗</a></div></details>
  </section>
  <details class="alt"><summary>How others read it</summary><div class="alt-body"><div class="alt-grid">
    <article><h3>A future world ruler only</h3><p>Popular futurism expects one individual to rise in the last seven years, make a covenant with Israel and then break it.</p></article>
    <article class="ours"><h3>A present spirit and a future person</h3><p>Antichrists have come throughout history; a final one will appear before Christ returns and will be destroyed by him.</p></article>
  </div></div></details>
  <aside class="lesson"><span class="rubric">The lesson to remember</span><p>Don’t make Revelation a guessing game about public figures. Learn to recognize every teaching and power that denies Jesus Christ.</p></aside>
  <section class="quiz"><span class="rubric">Check your understanding</span><h3>Where in the Bible is the word “antichrist” used?</h3><div class="quiz-options"><button class="quiz-opt" data-correct>Only in John’s letters</button><button class="quiz-opt">Throughout Revelation</button><button class="quiz-opt">In Daniel</button></div><p class="quiz-feedback" hidden>“Antichrist” appears only in 1 and 2 John, where John says many antichrists had already appeared (1 John 2:18).</p></section>
</section>

<section class="page topic" id="tribulation" data-nav="What is the great tribulation?" data-num="13" data-keywords="great tribulation seven years suffering persecution revelation 7 14 church age daniel 70th week">
  <p class="eyebrow">Question 13 · Revelation 1:9 and 7:14</p>
  <h1>What is the great tribulation?</h1>
  <p class="deck">Faithfulness under pressure, in every age</p>
  <div class="locator" data-vision="2,3,4"></div>
  <ul class="refs" aria-label="Passages to read"><li class="refs-label">Read in the BSB</li><li><a href="https://ebible.org/engbsb/REV07.htm" target="_blank" rel="noopener">Revelation 7</a></li><li><a href="https://ebible.org/engbsb/JHN16.htm" target="_blank" rel="noopener">John 16</a></li><li><a href="https://ebible.org/engbsb/ACT14.htm" target="_blank" rel="noopener">Acts 14</a></li></ul>
  <figure class="art"><img data-art src="https://commons.wikimedia.org/wiki/Special:FilePath/Albrecht_D%C3%BCrer,_The_Opening_of_the_Fifth_and_Sixth_Seals,_probably_c._1496-1498,_NGA_52558.jpg?width=1000" alt="Woodcut: angels give white robes to the souls of martyrs beneath the altar while stars fall on terrified people below." loading="lazy" decoding="async" width="1000" height="1400"><figcaption><b>The Opening of the Fifth and Sixth Seals</b>, Albrecht Dürer, about 1496–98. The martyrs receive white robes. Historical artwork, not a literal picture of the vision.</figcaption></figure>
  <blockquote class="passage"><span class="rubric">The text</span><p>“Sir,” I answered, “you know.” So he replied, “These are the ones who have come out of the great tribulation; they have washed their robes and made them white in the blood of the Lamb.”</p><footer><cite>Revelation 7:14</cite><a href="https://ebible.org/engbsb/REV07.htm" target="_blank" rel="noopener">Read the chapter ↗</a></footer></blockquote>
  <div class="myth"><span class="rubric">A common misunderstanding</span><p>The great tribulation is a seven-year period at the end of history, and Christians will be taken away before it begins.</p></div>
  <div class="teach">
    <h2>What Scripture teaches</h2>
    <p class="illum">John opens the book as “your brother and partner in <strong>the tribulation</strong> and kingdom and perseverance that are in Jesus” (1:9). The tribulation had already begun for him on Patmos. Jesus promised it to every disciple: “In the world you will have tribulation. But take courage; I have overcome the world!” (John 16:33). Paul told new believers, “We must endure many hardships to enter the kingdom of God” (Acts 14:22).</p>
    <p>So the great multitude of 7:14 is the church of every age, coming out of the trials of this life into God’s presence. That does not rule out a final, sharper persecution at the very end: the beast’s last war on the witnesses (11:7) and Satan’s brief release (20:7–9). But the church goes <em>through</em> tribulation, sealed and kept by God, not around it. Revelation nowhere mentions a seven-year period. That scheme comes from joining it to one particular reading of Daniel 9:27.</p>
  </div>
  <section class="evidence" aria-labelledby="ev-trib">
    <h2 id="ev-trib">How do we know?</h2>
    <details class="ev"><summary><span class="ev-n">01</span><span class="ev-ref">Revelation 1:9</span><i class="tag stated">Stated</i></summary><div class="ev-body"><p>John already shares “the tribulation” with the churches.</p><a href="https://ebible.org/engbsb/REV01.htm" target="_blank" rel="noopener">Read Revelation 1 ↗</a></div></details>
    <details class="ev"><summary><span class="ev-n">02</span><span class="ev-ref">John 16:33; Acts 14:22; 2 Timothy 3:12</span><i class="tag link">Connection</i></summary><div class="ev-body"><p>Jesus and the apostles teach that suffering belongs to the ordinary Christian life.</p><a href="https://ebible.org/engbsb/JHN16.htm" target="_blank" rel="noopener">Read John 16 ↗</a></div></details>
    <details class="ev"><summary><span class="ev-n">03</span><span class="ev-ref">Revelation 3:10; John 17:15</span><i class="tag link">Connection</i></summary><div class="ev-body"><p>Christ will “keep you from the hour of testing,” the same words Jesus prayed: not “take them out of the world,” but “keep them from the evil one.” Protection in the trial, not removal from it.</p><a href="https://ebible.org/engbsb/JHN17.htm" target="_blank" rel="noopener">Read John 17 ↗</a></div></details>
    <details class="ev"><summary><span class="ev-n">04</span><span class="ev-ref">A seven-year tribulation</span><i class="tag caution">Caution</i></summary><div class="ev-body"><p>The idea depends on placing a gap before the last of Daniel’s seventy weeks (Daniel 9:27). Revelation itself never speaks of seven years.</p></div></details>
  </section>
  <details class="alt"><summary>How others read it</summary><div class="alt-body"><div class="alt-grid">
    <article><h3>A future seven years</h3><p>Dispensationalists expect a seven-year tribulation after a pre-tribulation rapture, with its second half as “the great tribulation.”</p></article>
    <article class="ours"><h3>The whole age, sharpening at the end</h3><p>The church suffers tribulation from the apostles to the return, with an intense final season, and is kept by God throughout.</p></article>
  </div></div></details>
  <aside class="lesson"><span class="rubric">The lesson to remember</span><p>Christ does not promise to keep us out of trouble. He promises to keep us in it, and to bring us through it to glory.</p></aside>
  <section class="quiz"><span class="rubric">Check your understanding</span><h3>In Revelation 1:9, how does John describe himself?</h3><div class="quiz-options"><button class="quiz-opt" data-correct>A partner in the tribulation with the churches</button><button class="quiz-opt">Someone safely removed before the tribulation</button><button class="quiz-opt">A prophet of a tribulation two thousand years away</button></div><p class="quiz-feedback" hidden>John calls himself “your brother and partner in the tribulation” (1:9). It was already the church’s experience.</p></section>
</section>

<section class="page topic" id="babylon" data-nav="Who is Babylon the Great?" data-num="14" data-keywords="babylon great harlot prostitute rome city merchants bride revelation 17 18 come out of her">
  <p class="eyebrow">Question 14 · Revelation 17–18</p>
  <h1>Who is Babylon the Great?</h1>
  <p class="deck">The city of human pride, and the city of God</p>
  <div class="locator" data-vision="6"></div>
  <ul class="refs" aria-label="Passages to read"><li class="refs-label">Read in the BSB</li><li><a href="https://ebible.org/engbsb/REV17.htm" target="_blank" rel="noopener">Revelation 17</a></li><li><a href="https://ebible.org/engbsb/REV18.htm" target="_blank" rel="noopener">Revelation 18</a></li><li><a href="https://ebible.org/engbsb/GEN11.htm" target="_blank" rel="noopener">Genesis 11</a></li><li><a href="https://ebible.org/engbsb/JER51.htm" target="_blank" rel="noopener">Jeremiah 51</a></li></ul>
  <figure class="art"><img data-art src="https://commons.wikimedia.org/wiki/Special:FilePath/Albrecht_D%C3%BCrer,_The_Whore_of_Babylon,_1498,_NGA_142362.jpg?width=1000" alt="Woodcut: a richly dressed woman on a seven-headed beast holds up a cup to admiring people, while a city burns and an angel announces her fall." loading="lazy" decoding="async" width="1000" height="1400"><figcaption><b>The Whore of Babylon</b>, Albrecht Dürer, 1498. Historical artwork, not a literal picture of the vision.</figcaption></figure>
  <blockquote class="passage"><span class="rubric">The text</span><p>They will make war against the Lamb, and the Lamb will triumph over them, because He is Lord of lords and King of kings; and He will be accompanied by His called and chosen and faithful ones.</p><footer><cite>Revelation 17:14</cite><a href="https://ebible.org/engbsb/REV17.htm" target="_blank" rel="noopener">Read the chapter ↗</a></footer></blockquote>
  <div class="myth"><span class="rubric">A common misunderstanding</span><p>Babylon must be one particular modern country, city or institution, and the task is to name it.</p></div>
  <div class="teach">
    <h2>What Scripture teaches</h2>
    <p class="illum">Babylon was the city that destroyed Jerusalem and carried God’s people into exile, and before that, Babel was where humanity tried to build a tower to heaven. In the Bible it becomes the picture of <strong>human civilization organized against God</strong>: proud, rich, seductive and violent. The angel explains that the woman “is the great city that rules over the kings of the earth” (17:18), seated on seven hills (17:9). Every first-century reader would have thought of Rome. But Babylon is more than Rome. Rome was simply the Babylon of John’s day.</p>
    <p>Revelation deliberately sets two women and two cities side by side. The same kind of angel says, “Come, I will show you the punishment of the great prostitute” (17:1) and later, “Come, I will show you the bride, the wife of the Lamb” (21:9). One city is drunk with the blood of the saints; the other is the holy city where God dwells. One is mourned by merchants who lost their trade; the other is filled with the glory of God. Every person lives in one city or the other, and the call is the same in every age: “Come out of her, My people” (18:4).</p>
  </div>
  <div class="pair-cards">
    <article class="red"><span class="ref">17:1 · “Come, I will show you…”</span><h3>The harlot, Babylon</h3><p>Dressed in purple and gold, drunk with the saints’ blood, riding the beast. Falls “in a single hour.”</p></article>
    <article class="dark"><span class="ref">21:9 · “Come, I will show you…”</span><h3>The bride, New Jerusalem</h3><p>Clothed in fine linen, the righteous acts of the saints. Comes down from God and lasts forever.</p></article>
  </div>
  <section class="evidence" aria-labelledby="ev-babylon">
    <h2 id="ev-babylon">How do we know?</h2>
    <details class="ev"><summary><span class="ev-n">01</span><span class="ev-ref">Revelation 17:9, 18</span><i class="tag stated">Stated</i></summary><div class="ev-body"><p>The woman is a great city that rules the kings of the earth, sitting on seven hills.</p><a href="https://ebible.org/engbsb/REV17.htm" target="_blank" rel="noopener">Read Revelation 17 ↗</a></div></details>
    <details class="ev"><summary><span class="ev-n">02</span><span class="ev-ref">Revelation 18:3, 11–19, 24</span><i class="tag stated">Stated</i></summary><div class="ev-body"><p>Her wealth corrupts the nations, merchants mourn her fall, and the blood of the prophets and saints is found in her.</p><a href="https://ebible.org/engbsb/REV18.htm" target="_blank" rel="noopener">Read Revelation 18 ↗</a></div></details>
    <details class="ev"><summary><span class="ev-n">03</span><span class="ev-ref">Jeremiah 51:6–8; Isaiah 47</span><i class="tag link">Connection</i></summary><div class="ev-body"><p>Revelation 18 echoes the prophets’ oracles against ancient Babylon, including the call to flee from her.</p><a href="https://ebible.org/engbsb/JER51.htm" target="_blank" rel="noopener">Read Jeremiah 51 ↗</a></div></details>
    <details class="ev"><summary><span class="ev-n">04</span><span class="ev-ref">Revelation 17:1; 21:9</span><i class="tag link">Connection</i></summary><div class="ev-body"><p>The same angelic introduction presents the harlot and the bride, inviting the reader to compare the two cities.</p><a href="https://ebible.org/engbsb/REV21.htm" target="_blank" rel="noopener">Read Revelation 21 ↗</a></div></details>
    <details class="ev"><summary><span class="ev-n">05</span><span class="ev-ref">Babylon and the papacy</span><i class="tag caution">Caution</i></summary><div class="ev-body"><p>Many Reformers identified Babylon with papal Rome. That reading has a long Protestant history, but the text’s own clues point first to imperial Rome and, through it, to the world-system in every age.</p></div></details>
  </section>
  <details class="alt"><summary>How others read it</summary><div class="alt-body"><div class="alt-grid">
    <article><h3>A rebuilt city or final system</h3><p>Some futurists expect a literal rebuilt Babylon in Iraq, or a future global economic and religious system.</p></article>
    <article class="ours"><h3>The world-city in every age</h3><p>Babylon is Rome for John’s readers and the proud, idolatrous world in every generation, judged once and for all at the end.</p></article>
  </div></div></details>
  <aside class="lesson"><span class="rubric">The lesson to remember</span><p>Don’t build your hope on wealth, comfort or a culture that is passing away. Your citizenship is in the city that is coming down from God.</p></aside>
  <section class="quiz"><span class="rubric">Check your understanding</span><h3>Which city does Revelation set against Babylon?</h3><div class="quiz-options"><button class="quiz-opt" data-correct>The New Jerusalem, the bride of the Lamb</button><button class="quiz-opt">Ancient Nineveh</button><button class="quiz-opt">Rome, which replaces Babylon</button></div><p class="quiz-feedback" hidden>The harlot city (17:1) and the bride city (21:9) are introduced in the same words. Every person belongs to one city or the other.</p></section>
</section>

<section class="page topic" id="armageddon" data-nav="What is Armageddon?" data-num="15" data-keywords="armageddon megiddo battle kings euphrates gog magog war revelation 16 19 20">
  <p class="eyebrow">Question 15 · Revelation 16:12–16</p>
  <h1>What is Armageddon?</h1>
  <p class="deck">The last rebellion, ended by a word</p>
  <div class="locator" data-vision="5,6,7"></div>
  <ul class="refs" aria-label="Passages to read"><li class="refs-label">Read in the BSB</li><li><a href="https://ebible.org/engbsb/REV16.htm" target="_blank" rel="noopener">Revelation 16</a></li><li><a href="https://ebible.org/engbsb/REV19.htm" target="_blank" rel="noopener">Revelation 19</a></li><li><a href="https://ebible.org/engbsb/REV20.htm" target="_blank" rel="noopener">Revelation 20</a></li><li><a href="https://ebible.org/engbsb/EZK38.htm" target="_blank" rel="noopener">Ezekiel 38</a></li></ul>
  <figure class="art"><img data-art src="https://commons.wikimedia.org/wiki/Special:FilePath/Albrecht_D%C3%BCrer,_The_Four_Avenging_Angels,_1498,_NGA_142356.jpg?width=1000" alt="Woodcut: four armed angels strike down crowds of people, with horsemen and fire breathing horses behind them." loading="lazy" decoding="async" width="1000" height="1400"><figcaption><b>The Four Avenging Angels</b>, Albrecht Dürer, 1498. The angels released at the Euphrates (9:14), the river where the kings later gather for Armageddon (16:12). Historical artwork, not a literal picture of the vision.</figcaption></figure>
  <blockquote class="passage"><span class="rubric">The text</span><p>And they assembled the kings in the place that in Hebrew is called Armageddon.</p><footer><cite>Revelation 16:16</cite><a href="https://ebible.org/engbsb/REV16.htm" target="_blank" rel="noopener">Read the chapter ↗</a></footer></blockquote>
