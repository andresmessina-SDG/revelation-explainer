    <li><span class="ref">Rev 20:11–15</span><b>The last judgment</b><small>Every person before the great white throne</small></li>
    <li><span class="ref">Rev 21:1–5</span><b>All things new</b><small>A new heaven and a new earth</small></li>
  </ol>
  <section class="evidence" aria-labelledby="ev-return">
    <h2 id="ev-return">How do we know?</h2>
    <details class="ev"><summary><span class="ev-n">01</span><span class="ev-ref">Revelation 19:11–16</span><i class="tag stated">Stated</i></summary><div class="ev-body"><p>Christ is the Rider, “Faithful and True,” “The Word of God,” “King of kings and Lord of lords.”</p><a href="https://ebible.org/engbsb/REV19.htm" target="_blank" rel="noopener">Read Revelation 19 ↗</a></div></details>
    <details class="ev"><summary><span class="ev-n">02</span><span class="ev-ref">John 5:28–29; Acts 24:15</span><i class="tag stated">Stated</i></summary><div class="ev-body"><p>One coming hour brings the resurrection of both the righteous and the wicked.</p><a href="https://ebible.org/engbsb/JHN05.htm" target="_blank" rel="noopener">Read John 5 ↗</a></div></details>
    <details class="ev"><summary><span class="ev-n">03</span><span class="ev-ref">1 Corinthians 15:23–26</span><i class="tag link">Connection</i></summary><div class="ev-body"><p>“Then at His coming, those who belong to Him. Then the end will come.” Christ reigns now “until He has put all His enemies under His feet,” and death is the last to be destroyed.</p><a href="https://ebible.org/engbsb/1CO15.htm" target="_blank" rel="noopener">Read 1 Corinthians 15 ↗</a></div></details>
    <details class="ev"><summary><span class="ev-n">04</span><span class="ev-ref">Matthew 24:36</span><i class="tag caution">Caution</i></summary><div class="ev-body"><p>No one knows the day or hour. Every attempt to set a date has been wrong.</p><a href="https://ebible.org/engbsb/MAT24.htm" target="_blank" rel="noopener">Read Matthew 24 ↗</a></div></details>
  </section>
  <details class="alt"><summary>How others read it</summary><div class="alt-body"><div class="alt-grid">
    <article><h3>Stages and intervals</h3><p>Premillennial views place a thousand years between the return of Christ and the final judgment, with the resurrection of believers and unbelievers separated by that period.</p></article>
    <article class="ours"><h3>One day of the Lord</h3><p>Christ’s return, the resurrection of all, the last judgment and the new creation belong together as one great event.</p></article>
  </div></div></details>
  <aside class="lesson"><span class="rubric">The lesson to remember</span><p>For those who belong to him, the return of Christ is not a threat but their great hope.</p></aside>
  <section class="quiz"><span class="rubric">Check your understanding</span><h3>According to John 5:28–29, who will be raised when the hour comes?</h3><div class="quiz-options"><button class="quiz-opt" data-correct>All who are in their graves, righteous and wicked</button><button class="quiz-opt">Only believers; unbelievers a thousand years later</button><button class="quiz-opt">Only those alive at the time</button></div><p class="quiz-feedback" hidden>Jesus speaks of one hour when “all who are in their graves will hear His voice and come out” (John 5:28–29).</p></section>
</section>

<section class="page topic" id="millennium" data-nav="What is the millennium?" data-num="18" data-keywords="millennium thousand years satan bound abyss chain reign amillennial revelation 20 kingdom">
  <p class="eyebrow">Question 18 · Revelation 20:1–10</p>
  <h1>What is the millennium?</h1>
  <p class="deck">A King who reigns now</p>
  <div class="locator" data-vision="7"></div>
  <ul class="refs" aria-label="Passages to read"><li class="refs-label">Read in the BSB</li><li><a href="https://ebible.org/engbsb/REV20.htm" target="_blank" rel="noopener">Revelation 20</a></li><li><a href="https://ebible.org/engbsb/MAT12.htm" target="_blank" rel="noopener">Matthew 12</a></li><li><a href="https://ebible.org/engbsb/EPH01.htm" target="_blank" rel="noopener">Ephesians 1</a></li><li><a href="https://ebible.org/engbsb/MAT28.htm" target="_blank" rel="noopener">Matthew 28</a></li></ul>
  <figure class="art"><img data-art src="https://commons.wikimedia.org/wiki/Special:FilePath/Albrecht_D%C3%BCrer,_The_Angel_with_the_Key_to_the_Bottomless_Pit,_probably_c._1496-1498,_NGA_6685.jpg?width=1000" alt="Woodcut: an angel locks the chained dragon into the bottomless pit while another angel shows John the New Jerusalem on a hill." loading="lazy" decoding="async" width="1000" height="1400"><figcaption><b>The Angel with the Key to the Bottomless Pit</b>, Albrecht Dürer, about 1496–98. The final woodcut of the series: Satan bound, and the holy city in view. Historical artwork, not a literal picture of the vision.</figcaption></figure>
  <blockquote class="passage"><span class="rubric">The text</span><p>He seized the dragon, that ancient serpent who is the devil and Satan, and bound him for a thousand years. And he threw him into the Abyss, shut it, and sealed it over him, so that he could not deceive the nations until the thousand years were complete. After that, he must be released for a brief period of time.</p><footer><cite>Revelation 20:2–3</cite><a href="https://ebible.org/engbsb/REV20.htm" target="_blank" rel="noopener">Read the chapter ↗</a></footer></blockquote>
  <div class="myth"><span class="rubric">A common misunderstanding</span><p>Jesus is not reigning as King yet. His kingdom begins only after he returns and sets up a thousand-year political state on earth.</p></div>
  <div class="teach">
    <h2>What Scripture teaches</h2>
    <p class="illum">Chapter 20 is the seventh vision, and like each of the others it starts again at Christ’s first coming. The binding of Satan is not a future event. Jesus described it during his ministry: “how can anyone enter a strong man’s house and steal his possessions, unless he first ties up the strong man?” (Matthew 12:29). Notice <strong>what</strong> Satan is bound from doing: “so that he could not deceive the nations” (20:3). For centuries the nations sat in darkness while God’s truth was largely confined to Israel. Since the cross, the gospel has gone out to every people, and Satan cannot stop it.</p>
    <p>The <strong>thousand years</strong> is therefore the whole age between Christ’s comings: a long, complete period (ten × ten × ten), not a stopwatch. During it the souls of believers who have died “came to life and reigned with Christ” in heaven (20:4), and on earth Christ reigns now: “All authority in heaven and on earth has been given to Me” (Matthew 28:18). At the end, Satan is released for “a brief period,” gathers the nations for the same final battle we met in chapters 16 and 19, and is thrown into the lake of fire. This is the amillennial reading of the Reformed confessions. <em>Amillennial</em> does not mean “no millennium.” It means no separate, future earthly millennium: the millennium is now.</p>
  </div>
  <div class="mill-inline">
    <div class="mill-track" role="img" aria-label="Timeline: first coming and Satan bound, the thousand years of Christ's reign, a brief release, Christ returns, new creation">
      <div class="mill-seg event" style="--w:.9"><i></i><b>First coming</b><small>Satan bound · 20:1–3</small></div>
      <div class="mill-seg reign" style="--w:3"><i></i><b>The thousand years</b><small>Christ reigns; the gospel to the nations · 20:4–6</small></div>
      <div class="mill-seg event" style="--w:.9"><i></i><b>Brief release</b><small>Final rebellion · 20:7–9</small></div>
      <div class="mill-seg final" style="--w:1.2"><i></i><b>Christ returns</b><small>Judgment, new creation · 20:10–22:5</small></div>
    </div>
  </div>
  <section class="evidence" aria-labelledby="ev-mill">
    <h2 id="ev-mill">How do we know?</h2>
    <details class="ev"><summary><span class="ev-n">01</span><span class="ev-ref">Revelation 20:3</span><i class="tag stated">Stated</i></summary><div class="ev-body"><p>The binding has a stated purpose: that Satan “could not deceive the nations.” It does not say he can do nothing at all.</p><a href="https://ebible.org/engbsb/REV20.htm" target="_blank" rel="noopener">Read Revelation 20 ↗</a></div></details>
    <details class="ev"><summary><span class="ev-n">02</span><span class="ev-ref">Matthew 12:28–29; John 12:31–32</span><i class="tag link">Connection</i></summary><div class="ev-body"><p>Jesus says the strong man is being tied up in his ministry, and that when he is lifted up on the cross he “will draw everyone” to himself as the ruler of this world is cast out.</p><a href="https://ebible.org/engbsb/MAT12.htm" target="_blank" rel="noopener">Read Matthew 12 ↗</a></div></details>
    <details class="ev"><summary><span class="ev-n">03</span><span class="ev-ref">Ephesians 1:20–22; 1 Corinthians 15:25</span><i class="tag link">Connection</i></summary><div class="ev-body"><p>Christ is already seated far above every power, and “He must reign until He has put all His enemies under His feet.” His reign is present.</p><a href="https://ebible.org/engbsb/EPH01.htm" target="_blank" rel="noopener">Read Ephesians 1 ↗</a></div></details>
    <details class="ev"><summary><span class="ev-n">04</span><span class="ev-ref">Revelation 20:8 with 16:14 and 19:19</span><i class="tag inference">Inference</i></summary><div class="ev-body"><p>The gathering “for battle” in 20:8 matches 16:14 and 19:19 and draws on the same Ezekiel prophecy as 19:17–18. So chapter 20 recapitulates rather than follows chapter 19.</p><a href="https://ebible.org/engbsb/REV20.htm" target="_blank" rel="noopener">Read Revelation 20 ↗</a></div></details>
    <details class="ev"><summary><span class="ev-n">05</span><span class="ev-ref">Satan is still active</span><i class="tag caution">Caution</i></summary><div class="ev-body"><p>The New Testament also says the devil prowls (1 Peter 5:8) and blinds unbelievers (2 Corinthians 4:4). Being bound in one respect, unable to stop the gospel going to the nations, is not being inactive in every respect.</p></div></details>
  </section>
  <details class="alt"><summary>How others read it</summary><div class="alt-body"><div class="alt-grid">
    <article><h3>Premillennial</h3><p>Christ returns before a future thousand-year reign on earth; chapters 19 and 20 are read in sequence.</p></article>
    <article><h3>Postmillennial</h3><p>A golden age of gospel success arrives within history before Christ returns.</p></article>
  </div><p class="alt-intro" style="margin:14px 0 0">The full comparison is on <a href="#mill-study">How to interpret Revelation</a>.</p></div></details>
  <aside class="lesson"><span class="rubric">The lesson to remember</span><p>We are not waiting for Jesus to become King. He reigns now, and the gospel is going to the nations because the strong man is bound.</p></aside>
  <section class="quiz"><span class="rubric">Check your understanding</span><h3>According to Revelation 20:3, Satan is bound so that he cannot do what?</h3><div class="quiz-options"><button class="quiz-opt" data-correct>Deceive the nations</button><button class="quiz-opt">Tempt anyone at all</button><button class="quiz-opt">Exist anywhere on earth</button></div><p class="quiz-feedback" hidden>The binding is specific: “so that he could not deceive the nations” (20:3). Since the cross, the gospel goes to every people.</p></section>
</section>

<section class="page topic" id="resurrection" data-nav="What is the first resurrection?" data-num="19" data-keywords="first resurrection second death souls reign thrones intermediate state revelation 20 4 6 lake of fire">
  <p class="eyebrow">Question 19 · Revelation 20:4–6</p>
  <h1>What is the first resurrection?</h1>
  <p class="deck">Alive with Christ, even in death</p>
  <div class="locator" data-vision="7"></div>
  <ul class="refs" aria-label="Passages to read"><li class="refs-label">Read in the BSB</li><li><a href="https://ebible.org/engbsb/REV20.htm" target="_blank" rel="noopener">Revelation 20</a></li><li><a href="https://ebible.org/engbsb/REV06.htm" target="_blank" rel="noopener">Revelation 6</a></li><li><a href="https://ebible.org/engbsb/PHP01.htm" target="_blank" rel="noopener">Philippians 1</a></li><li><a href="https://ebible.org/engbsb/JHN05.htm" target="_blank" rel="noopener">John 5</a></li></ul>
  <figure class="art"><img data-art src="https://commons.wikimedia.org/wiki/Special:FilePath/Cloisters_Apocalypse_-_New_Jerusalem_and_angel.jpg?width=1000" alt="Medieval illumination: an angel shows John the New Jerusalem, drawn as a walled city with jewelled gates." loading="lazy" decoding="async" width="1000" height="1200"><figcaption><b>The New Jerusalem and the Angel</b>, Cloisters Apocalypse, about 1330. Historical artwork, not a literal picture of the vision.</figcaption></figure>
  <blockquote class="passage"><span class="rubric">The text</span><p>Blessed and holy are those who share in the first resurrection! The second death has no power over them, but they will be priests of God and of Christ, and will reign with Him for a thousand years.</p><footer><cite>Revelation 20:6</cite><a href="https://ebible.org/engbsb/REV20.htm" target="_blank" rel="noopener">Read the chapter ↗</a></footer></blockquote>
  <div class="myth"><span class="rubric">A common misunderstanding</span><p>Believers are raised bodily a thousand years before unbelievers, so there are two bodily resurrections separated by the millennium.</p></div>
  <div class="teach">
    <h2>What Scripture teaches</h2>
    <p class="illum">Look at who John sees: “the <strong>souls</strong> of those who had been beheaded for their testimony of Jesus” (20:4). That echoes the fifth seal, where John saw “the souls” of the martyrs under the altar, waiting and crying “How long?” (6:9–11). Now they are seen on thrones, living and reigning with Christ. This is what happens to every believer at death: “to depart and be with Christ, which is far better” (Philippians 1:23). They are “away from the body and at home with the Lord” (2 Corinthians 5:8).</p>
    <p>Revelation uses a deliberate pattern. For believers, the <em>first death</em> (physical death) leads to the <strong>first resurrection</strong>, life and reign with Christ in heaven. Then at the end comes the bodily resurrection of everyone, in the single hour Jesus spoke of (John 5:28–29). For unbelievers, physical life is followed by the <strong>second death</strong>, “the lake of fire” (20:14). The point of the passage is comfort for a persecuted church: those who lose their lives for Christ have not lost. They reign.</p>
  </div>
  <div class="pair-cards">
    <article class="dark"><span class="ref">20:4–6 · 6:9–11 · Phil 1:23</span><h3>The believer</h3><p>The first death, then the first resurrection: alive and reigning with Christ. The second death “has no power over them.”</p></article>
    <article class="red"><span class="ref">20:5, 13–15 · 21:8</span><h3>The unbeliever</h3><p>Physical life, then judgment at the last day, and the second death: the lake of fire.</p></article>
  </div>
  <section class="evidence" aria-labelledby="ev-res">
    <h2 id="ev-res">How do we know?</h2>
    <details class="ev"><summary><span class="ev-n">01</span><span class="ev-ref">Revelation 20:4</span><i class="tag stated">Stated</i></summary><div class="ev-body"><p>John sees souls, not bodies, on thrones: those beheaded for their testimony and those who refused the beast.</p><a href="https://ebible.org/engbsb/REV20.htm" target="_blank" rel="noopener">Read Revelation 20 ↗</a></div></details>
    <details class="ev"><summary><span class="ev-n">02</span><span class="ev-ref">Revelation 6:9–11</span><i class="tag link">Connection</i></summary><div class="ev-body"><p>The same martyrs’ souls appear under the altar at the fifth seal. In chapter 20 their waiting is shown as reigning.</p><a href="https://ebible.org/engbsb/REV06.htm" target="_blank" rel="noopener">Read Revelation 6 ↗</a></div></details>
    <details class="ev"><summary><span class="ev-n">03</span><span class="ev-ref">John 5:28–29; Acts 24:15</span><i class="tag link">Connection</i></summary><div class="ev-body"><p>The bodily resurrection of righteous and wicked happens together, in one hour. That rules out two bodily resurrections a thousand years apart.</p><a href="https://ebible.org/engbsb/JHN05.htm" target="_blank" rel="noopener">Read John 5 ↗</a></div></details>
    <details class="ev"><summary><span class="ev-n">04</span><span class="ev-ref">Revelation 20:14; 21:8</span><i class="tag stated">Stated</i></summary><div class="ev-body"><p>“This is the second death—the lake of fire.” The pairing of first and second is Revelation’s own.</p><a href="https://ebible.org/engbsb/REV21.htm" target="_blank" rel="noopener">Read Revelation 21 ↗</a></div></details>
    <details class="ev"><summary><span class="ev-n">05</span><span class="ev-ref">New birth?</span><i class="tag caution">Caution</i></summary><div class="ev-body"><p>Augustine read the first resurrection as the new birth, when the spiritually dead come to life (John 5:24–25). Many amillennialists, including Warfield, Hoekema and Riddlebarger, prefer the reading above, since 20:4 describes the souls of those who have died. Both readings place the first resurrection in the present age.</p></div></details>
  </section>
  <details class="alt"><summary>How others read it</summary><div class="alt-body"><div class="alt-grid">
    <article><h3>Two bodily resurrections</h3><p>Premillennialists read “came to life” as bodily resurrection of believers before the millennium, with the rest raised after it.</p></article>
    <article class="ours"><h3>Life with Christ now, the body later</h3><p>The first resurrection is the believer’s entrance into life and reign with Christ at death; the body is raised with everyone else at the last day.</p></article>
  </div></div></details>
  <aside class="lesson"><span class="rubric">The lesson to remember</span><p>For the Christian, death is not the end of life but the beginning of reigning with Christ.</p></aside>
  <section class="quiz"><span class="rubric">Check your understanding</span><h3>In Revelation 20:4, what does John see on the thrones?</h3><div class="quiz-options"><button class="quiz-opt" data-correct>The souls of those who died for their testimony</button><button class="quiz-opt">Political rulers of a future earthly kingdom</button><button class="quiz-opt">Angels who have never lived on earth</button></div><p class="quiz-feedback" hidden>John sees “the souls of those who had been beheaded for their testimony of Jesus” (20:4), the same martyrs seen under the altar in 6:9.</p></section>
</section>

<section class="page topic" id="new-creation" data-nav="What is the New Jerusalem?" data-num="20" data-keywords="new jerusalem new heaven new earth holy city bride eden tree of life river revelation 21 22 eternal state">
  <p class="eyebrow">Question 20 · Revelation 21–22</p>
  <h1>What is the New Jerusalem?</h1>
  <p class="deck">God makes all things new</p>
  <div class="locator" data-vision="7"></div>
  <ul class="refs" aria-label="Passages to read"><li class="refs-label">Read in the BSB</li><li><a href="https://ebible.org/engbsb/REV21.htm" target="_blank" rel="noopener">Revelation 21</a></li><li><a href="https://ebible.org/engbsb/REV22.htm" target="_blank" rel="noopener">Revelation 22</a></li><li><a href="https://ebible.org/engbsb/ISA65.htm" target="_blank" rel="noopener">Isaiah 65</a></li><li><a href="https://ebible.org/engbsb/ROM08.htm" target="_blank" rel="noopener">Romans 8</a></li></ul>
  <figure class="art"><img data-art src="https://commons.wikimedia.org/wiki/Special:FilePath/Saint-Sever_Beatus_f._207v-208r_-_New_Jerusalem.jpg?width=1000" alt="Medieval illumination: the New Jerusalem as a square city with twelve gates, each with an apostle, and the Lamb at the centre." loading="lazy" decoding="async" width="1000" height="700"><figcaption><b>The New Jerusalem</b>, Saint-Sever Beatus, 11th century. Twelve gates, twelve apostles, and the Lamb at the centre. Historical artwork, not a literal picture of the vision.</figcaption></figure>
  <blockquote class="passage"><span class="rubric">The text</span><p>And I heard a loud voice from the throne saying: “Behold, the dwelling place of God is with man, and He will dwell with them. They will be His people, and God Himself will be with them as their God. ‘He will wipe away every tear from their eyes,’ and there will be no more death or mourning or crying or pain, for the former things have passed away.”</p><footer><cite>Revelation 21:3–4</cite><a href="https://ebible.org/engbsb/REV21.htm" target="_blank" rel="noopener">Read the chapter ↗</a></footer></blockquote>
  <div class="myth"><span class="rubric">A common misunderstanding</span><p>The Christian hope is to float forever as a spirit in the clouds, far away from the physical world.</p></div>
  <div class="teach">
    <h2>What Scripture teaches</h2>
    <p class="illum">Revelation ends not with escape from creation but with creation renewed: “a new heaven and a new earth” (21:1). The city comes <strong>down</strong> out of heaven to the earth. Creation itself “will be set free from its bondage to decay” (Romans 8:21), and the bodies of God’s people will be raised. The angel shows John “the bride, the wife of the Lamb,” and what he sees is the holy city (21:9–10). The city is the people of God, at last perfectly at home with him.</p>
    <p>Every detail says the same thing: <strong>God lives with his people.</strong> The city is a perfect cube (21:16), the shape of the Most Holy Place in Solomon’s temple (1 Kings 6:20), so the whole city is now the place of God’s presence. That is why John sees “no temple in the city, because the Lord God Almighty and the Lamb are its temple” (21:22). The river of life and the tree of life return from Eden (22:1–2), and “no longer will there be any curse.” The Bible’s story that began in a garden ends in a garden-city, where “they will see His face” (22:4).</p>
  </div>
  <section class="evidence" aria-labelledby="ev-new">
    <h2 id="ev-new">How do we know?</h2>
    <details class="ev"><summary><span class="ev-n">01</span><span class="ev-ref">Revelation 21:1–4</span><i class="tag stated">Stated</i></summary><div class="ev-body"><p>A new heaven and earth, the city coming down, God dwelling with mankind, and death and mourning ended.</p><a href="https://ebible.org/engbsb/REV21.htm" target="_blank" rel="noopener">Read Revelation 21 ↗</a></div></details>
    <details class="ev"><summary><span class="ev-n">02</span><span class="ev-ref">Revelation 21:9–10</span><i class="tag stated">Stated</i></summary><div class="ev-body"><p>The angel promises to show “the bride” and shows the holy city: the city is God’s people.</p><a href="https://ebible.org/engbsb/REV21.htm" target="_blank" rel="noopener">Read Revelation 21 ↗</a></div></details>
    <details class="ev"><summary><span class="ev-n">03</span><span class="ev-ref">Revelation 21:16, 22; 1 Kings 6:20</span><i class="tag link">Connection</i></summary><div class="ev-body"><p>The cube-shaped city matches the inner sanctuary of the temple, and there is no temple because God and the Lamb are its temple.</p><a href="https://ebible.org/engbsb/1KI06.htm" target="_blank" rel="noopener">Read 1 Kings 6 ↗</a></div></details>
    <details class="ev"><summary><span class="ev-n">04</span><span class="ev-ref">Revelation 22:1–5; Genesis 2–3</span><i class="tag link">Connection</i></summary><div class="ev-body"><p>The river, the tree of life and the lifting of the curse bring back Eden, and go beyond it.</p><a href="https://ebible.org/engbsb/REV22.htm" target="_blank" rel="noopener">Read Revelation 22 ↗</a></div></details>
    <details class="ev"><summary><span class="ev-n">05</span><span class="ev-ref">Romans 8:19–23; 2 Peter 3:13</span><i class="tag inference">Inference</i></summary><div class="ev-body"><p>Creation is liberated, not discarded. Reading “new” as renewal rather than replacement is how the Reformed tradition has generally understood these texts, though some read 2 Peter 3:10 as a more complete dissolution.</p><a href="https://ebible.org/engbsb/ROM08.htm" target="_blank" rel="noopener">Read Romans 8 ↗</a></div></details>
  </section>
  <aside class="lesson"><span class="rubric">The lesson to remember</span><p>The last word is not destruction. It is life with God, face to face, forever. “Come, Lord Jesus!”</p></aside>
  <section class="quiz"><span class="rubric">Check your understanding</span><h3>Why is there no temple in the New Jerusalem?</h3><div class="quiz-options"><button class="quiz-opt" data-correct>Because the Lord God and the Lamb are its temple</button><button class="quiz-opt">Because worship has ended</button><button class="quiz-opt">Because the city has not been finished</button></div><p class="quiz-feedback" hidden>“I saw no temple in the city, because the Lord God Almighty and the Lamb are its temple” (21:22). The whole city is God’s dwelling place.</p></section>

  <p class="eyebrow">El libro del Apocalipsis · Introducción</p>
  <h1>Una revelación llena de esperanza</h1>
  <p class="lead">El Apocalipsis no es un libro de claves secretas sobre el fin del mundo. Es «la Revelación de Jesucristo» (1:1). Nos muestra, desde el lado del cielo, al Cordero que ya ha vencido, y fue dado a una iglesia que sufría para que permaneciera fiel hasta que Él venga.</p>
  <p class="resume" id="resume" hidden>Continúa donde lo dejaste: <a href="#">…</a></p>

  <figure class="hero-art">
    <div class="hero-img"><img data-art src="https://commons.wikimedia.org/wiki/Special:FilePath/Saint-Sever_Beatus_f._207v-208r_-_New_Jerusalem.jpg?width=1000" alt="Iluminación medieval de la nueva Jerusalén como una ciudad cuadrada amurallada con doce puertas y el Cordero en el centro." width="1000" height="700" decoding="async"></div>
    <figcaption>

      <small>La nueva Jerusalén, Beato de Saint-Sever, siglo XI.</small>
    </figcaption>
  </figure>

  <blockquote class="passage">
    <span class="rubric">Comienza con la Escritura</span>
    <p>Bienaventurado el que lee y los que oyen las palabras de la profecía y guardan las cosas que están escritas en ella, porque el tiempo está cerca.</p>
    <footer><cite>Apocalipsis 1:3</cite><a href="https://www.biblegateway.com/passage/?search=Apocalipsis+1&amp;version=NBLA" target="_blank" rel="noopener">Leer Apocalipsis 1 ↗</a></footer>
  </blockquote>

  <h2>¿Qué es el Apocalipsis?</h2>
  <p class="illum">El Apocalipsis es el último libro de la Biblia. El apóstol Juan lo escribió alrededor del año 95 d. C., hacia el final del reinado del emperador Domiciano, mientras estaba desterrado en la isla de Patmos «por causa de la palabra de Dios y del testimonio de Jesús» (1:9). El Cristo resucitado le dio una serie de visiones y le mandó enviarlas a siete iglesias reales de la provincia romana de Asia, en lo que hoy es el occidente de Turquía.</p>
  <p>El título griego, <em>apokalypsis</em>, significa <strong>revelación</strong> o <strong>descubrimiento</strong>. El Apocalipsis corre el velo y muestra lo que realmente sucede detrás de la historia: Cristo reina ahora, Satanás se enfurece contra la iglesia, Dios juzga el mal y Su pueblo vivirá con Él para siempre. Fue escrito para ser entendido. Incluso promete una bendición a todo el que lo lee y lo guarda.</p>
  <div class="note"><p>El Apocalipsis es a la vez una carta, una profecía y un apocalipsis (1:1–4). Habló primero a cristianos del primer siglo y, por medio de ellos, habla a la iglesia de todas las épocas.</p></div>

  <h2>¿Por qué fue escrito?</h2>
  <p>Imagina ser cristiano en el Imperio romano. Tus vecinos adoran a los dioses de la ciudad y honran al César como si fuera divino. Negarte a participar puede costarte tu oficio, tus amigos y hasta la vida. La iglesia parece pequeña y Roma parece invencible. Si Jesús es Rey, ¿por qué parece que el César va ganando?</p>
  <p><strong>El Apocalipsis responde mostrando el mismo mundo desde el punto de vista del cielo.</strong></p>
  <div class="purpose">
    <article><span class="n">I</span><h3>Valor en el sufrimiento</h3><p>Cristo conoce las pruebas de Su pueblo y camina en medio de él (1:12–13; 2:10).</p></article>
    <article><span class="n">II</span><h3>Fidelidad en la tentación</h3><p>La iglesia debe rechazar la idolatría y las concesiones, aunque le cueste (2:14; 13:16–17).</p></article>
    <article><span class="n">III</span><h3>Confianza en Cristo</h3><p>Los imperios suben y caen, pero el Cordero ya está en el trono (5:6; 17:14).</p></article>
    <article><span class="n">IV</span><h3>Esperanza para el futuro</h3><p>El mal será juzgado, la muerte destruida y todas las cosas hechas nuevas (21:4–5).</p></article>
  </div>

  <h2>¿Cómo debemos leerlo?</h2>
  <p>En el primer versículo, «dio a conocer» traduce un verbo griego que significa mostrar por medio de señales. Así que la pregunta correcta no es «¿literal o simbólico?», sino «<strong>¿a qué apunta esta señal?</strong>». Muchas veces el mismo Apocalipsis nos lo dice:</p>
  <table class="symbols">
    <thead><tr><th scope="col">La imagen</th><th scope="col">Lo que representa</th><th scope="col">Dónde</th></tr></thead>
    <tbody>
      <tr><td>Los siete candelabros</td><td>Las iglesias</td><td>1:20</td></tr>
      <tr><td>El Cordero con siete cuernos</td><td>Cristo, inmolado y resucitado, todopoderoso</td><td>5:6</td></tr>
      <tr><td>Las copas de incienso</td><td>Las oraciones de los santos</td><td>5:8</td></tr>
      <tr><td>El gran dragón</td><td>Satanás, «la serpiente antigua»</td><td>12:9</td></tr>
      <tr><td>Las muchas aguas</td><td>Pueblos, multitudes, naciones y lenguas</td><td>17:15</td></tr>
      <tr><td>La mujer sobre la bestia</td><td>La gran ciudad que reina sobre los reyes</td><td>17:18</td></tr>
      <tr><td>La novia del Cordero</td><td>La ciudad santa, el pueblo de Dios</td><td>21:9–10</td></tr>
    </tbody>
  </table>
  <p>Los números funcionan igual. El <strong>siete</strong> indica plenitud, el <strong>doce</strong> al pueblo de Dios, el <strong>tres y medio</strong> un tiempo limitado de angustia (la mitad de siete) y el <strong>mil</strong> un número inmenso y completo.</p>
  <div class="note"><p><strong>Cuatro preguntas para cada visión.</strong> ¿Qué habrían entendido las siete iglesias? ¿Dónde más usa la Biblia esta imagen? (El Apocalipsis alude al Antiguo Testamento cientos de veces). ¿Qué nos muestra acerca de Cristo? ¿Cómo debería cambiar nuestra manera de vivir?</p></div>

  <h2>¿Es una cronología de sucesos futuros?</h2>
  <p>No en una sola línea recta. Siete veces se le muestra a Juan toda la era, desde la primera venida de Cristo hasta Su regreso, cada vez desde un ángulo distinto. Es como ver un mismo partido desde siete cámaras: el mismo juego, pero cada ángulo muestra lo que los otros no ven. Y cada vez, la visión llega hasta el final.</p>
  <ol class="mini-visions" aria-label="Las siete visiones en resumen">
    <li><span class="mv-n">I</span><span class="mv-c">1–3</span><span class="mv-bar"><i style="--end:0"></i></span></li>
    <li><span class="mv-n">II</span><span class="mv-c">4–7</span><span class="mv-bar"><i style="--end:6%"></i></span></li>
    <li><span class="mv-n">III</span><span class="mv-c">8–11</span><span class="mv-bar"><i style="--end:10%"></i></span></li>
    <li><span class="mv-n">IV</span><span class="mv-c">12–14</span><span class="mv-bar"><i style="--end:14%"></i></span></li>
    <li><span class="mv-n">V</span><span class="mv-c">15–16</span><span class="mv-bar"><i style="--end:19%"></i></span></li>
    <li><span class="mv-n">VI</span><span class="mv-c">17–19</span><span class="mv-bar"><i style="--end:24%"></i></span></li>
    <li><span class="mv-n">VII</span><span class="mv-c">20–22</span><span class="mv-bar"><i style="--end:30%"></i></span></li>
  </ol>
  <p class="small">Cada barra va desde la primera venida de Cristo hasta la segunda. El dorado es el fin, que se ve cada vez con más claridad.</p>
  <p>Eso no significa que nada en el Apocalipsis sea futuro. El regreso de Cristo, la resurrección de los muertos, el juicio final y la nueva creación todavía están por delante. Pero una visión que aparece más adelante en el libro no tiene que ocurrir más adelante en el tiempo.</p>
  <p><a class="btn ghost" href="#structure">Ver las siete visiones completas →</a></p>

  <section class="world wide" aria-labelledby="world-title-es">

  <h2>La historia en cinco movimientos</h2>
  <ol class="movements">

  <h2>¿Cuál es su gran mensaje?</h2>
  <p>El que murió y resucitó dice: «estoy vivo por los siglos de los siglos, y tengo las llaves de la muerte y del Hades» (1:18). Y viene otra vez (22:20). Todo lo que hay entre esas dos promesas explica por qué Su regreso es una buena noticia para Su pueblo.</p>
  <aside class="lesson"><span class="rubric">Recuerda esto</span><p>El Apocalipsis fue escrito para producir fidelidad y no especulación, valor y no miedo, esperanza y no desesperación.</p></aside>

<section class="page" id="structure" data-nav="Cómo está construido el libro" data-num="◇" data-keywords="estructura siete visiones paralelismo progresivo recapitulación hendriksen cronología bosquejo">
  <p class="eyebrow">Cómo leer el libro · Su estructura</p>
  <h1>Siete visiones, una sola era</h1>
  <p class="lead">El Apocalipsis no avanza capítulo por capítulo como una línea de tiempo. Siete veces se le muestra a Juan todo el período desde la primera venida de Cristo hasta Su regreso, cada vez desde un punto de vista nuevo. Cada visión llega al fin, y cada vez el fin se ve con más claridad, hasta que la última se abre a la nueva creación.</p>
  <p>William Hendriksen llamó a este patrón <strong>paralelismo progresivo</strong>. Las visiones son <em>paralelas</em> porque cada una abarca la misma era. Son <em>progresivas</em> porque el fin primero se anuncia, luego se muestra, y después se muestra cada vez con más plenitud. Elige cualquier visión para abrirla.</p>

  <div class="visions wide" role="group" aria-labelledby="visions-h-es">
    <div class="visions-title">
      <span class="rubric">El Apocalipsis de Juan</span>
      <h3 id="visions-h-es">Siete visiones, una sola era</h3>
      <p>Cada visión abarca desde la primera venida de Cristo hasta Su regreso, y cada una muestra el fin con más claridad.</p>
    </div>
    <div class="vgrid">
      <div class="vcell vaxis vlab">La visión</div>
      <div class="vcell vaxis vmid"><span>Primera venida</span><span>Esta era presente</span><span>Segunda venida</span></div>
      <div class="vcell vaxis vend">La era venidera</div>

      <div class="vcell vpart vlab">Primera parte · capítulos 1–11</div>
      <div class="vcell vpart vmid" data-part="Primera parte · capítulos 1–11">La iglesia en el mundo</div>
      <div class="vcell vpart vend"></div>

      <button type="button" class="vcell vlabel" id="vision-1" aria-expanded="false" aria-controls="vd-1"><span class="vn">I</span><span class="vt"><b>Cristo entre los candelabros</b><small>Capítulos 1–3</small></span><span class="vchev" aria-hidden="true">▸</span></button>
      <div class="vcell vbar vmid"><div class="vtrack"><i class="age"></i><i class="dot open"></i></div><div class="vcap">1:7 · Su venida anunciada</div></div>
      <div class="vcell vend"></div>
      <div class="vdetail" id="vd-1" hidden><div class="vdetail-inner">
        <p>El Cristo resucitado camina entre siete candelabros, que son las iglesias (1:12–20). Sus siete cartas muestran a la iglesia de toda época tal como Él la ve. El fin todavía no se describe, solo se promete: «Él viene con las nubes» (1:7). Cada promesa hecha «al vencedor» se cumple en los capítulos 21–22.</p>
        <ul><li><a href="#churches">¿Qué son las siete cartas?</a></li></ul>
      </div></div>

      <button type="button" class="vcell vlabel" id="vision-2" aria-expanded="false" aria-controls="vd-2"><span class="vn">II</span><span class="vt"><b>Los siete sellos</b><small>Capítulos 4–7</small></span><span class="vchev" aria-hidden="true">▸</span></button>
      <div class="vcell vbar vmid"><div class="vtrack"><i class="age"></i><i class="end" style="width:5%"></i><i class="dot"></i></div><div class="vcap">6:12–17 · el gran día de la ira</div></div>
      <div class="vcell vend"></div>
      <div class="vdetail" id="vd-2" hidden><div class="vdetail-inner">
        <p>El salón del trono en el cielo, y el Cordero inmolado toma el libro (5:5–6): es Su entronización después de la cruz. Al abrir Él los sellos, la conquista, la guerra, el hambre y la muerte recorren la era; los mártires claman «¿Hasta cuándo?», y el sexto sello trae el fin mismo (6:12–17). El capítulo 7 muestra al pueblo de Dios sellado y seguro.</p>
        <ul><li><a href="#throne">¿Quién es el Cordero en el trono?</a></li><li><a href="#horsemen">¿Quiénes son los cuatro jinetes?</a></li><li><a href="#144000">¿Quiénes son los 144,000?</a></li><li><a href="#tribulation">¿Qué es la gran tribulación?</a></li></ul>
      </div></div>

      <button type="button" class="vcell vlabel" id="vision-3" aria-expanded="false" aria-controls="vd-3"><span class="vn">III</span><span class="vt"><b>Las siete trompetas</b><small>Capítulos 8–11</small></span><span class="vchev" aria-hidden="true">▸</span></button>
      <div class="vcell vbar vmid"><div class="vtrack"><i class="age"></i><i class="end" style="width:8%"></i><i class="dot"></i></div><div class="vcap">11:15–18 · el reino ha llegado</div></div>
      <div class="vcell vend"></div>
      <div class="vdetail" id="vd-3" hidden><div class="vdetail-inner">
        <p>Las trompetas suenan advertencias sobre la tercera parte del mundo, y aun así el resto de la humanidad «no se arrepintieron» (9:20). Mientras tanto, la iglesia da testimonio como Moisés y Elías, es vencida y muerta, y es levantada al cielo. La séptima trompeta anuncia: «El reino del mundo ha venido a ser el reino de nuestro Señor y de Su Cristo» (11:15).</p>
        <ul><li><a href="#trumpets">¿Qué son las trompetas y las copas?</a></li><li><a href="#witnesses">¿Quiénes son los dos testigos?</a></li><li><a href="#1260">¿Qué significan los 1,260 días?</a></li></ul>
      </div></div>

      <div class="vcell vpart vlab">Segunda parte · capítulos 12–22</div>
      <div class="vcell vpart vmid" data-part="Segunda parte · capítulos 12–22">La guerra detrás de la guerra</div>
      <div class="vcell vpart vend"></div>

      <button type="button" class="vcell vlabel" id="vision-4" aria-expanded="false" aria-controls="vd-4"><span class="vn">IV</span><span class="vt"><b>La mujer y el dragón</b><small>Capítulos 12–14</small></span><span class="vchev" aria-hidden="true">▸</span></button>
      <div class="vcell vbar vmid"><div class="vtrack"><i class="age"></i><i class="end" style="width:12%"></i><i class="dot"></i></div><div class="vcap">14:14–20 · la siega de la tierra</div></div>
      <div class="vcell vend"></div>
      <div class="vdetail" id="vd-4" hidden><div class="vdetail-inner">
        <p>Se levanta el telón sobre la guerra espiritual detrás de la historia. Esta visión empieza con el nacimiento y la ascensión de Cristo (12:5). Arrojado por la cruz, el dragón se enfurece contra la mujer y levanta a dos bestias: el Estado perseguidor y su falso profeta. La era termina con el Hijo del Hombre segando la tierra (14:14–20).</p>
        <ul><li><a href="#satan">¿Gobierna Satanás el mundo?</a></li><li><a href="#beast">¿Qué es la bestia?</a></li><li><a href="#666">¿Qué significa el 666?</a></li><li><a href="#mark">¿Qué es la marca de la bestia?</a></li><li><a href="#antichrist">¿Quién es el Anticristo?</a></li></ul>
      </div></div>

      <button type="button" class="vcell vlabel" id="vision-5" aria-expanded="false" aria-controls="vd-5"><span class="vn">V</span><span class="vt"><b>Las siete copas</b><small>Capítulos 15–16</small></span><span class="vchev" aria-hidden="true">▸</span></button>
      <div class="vcell vbar vmid"><div class="vtrack"><i class="age"></i><i class="end" style="width:16%"></i><i class="dot"></i></div><div class="vcap">16:17–21 · «Hecho está»</div></div>
      <div class="vcell vend"></div>
      <div class="vdetail" id="vd-5" hidden><div class="vdetail-inner">
        <p>Vuelven los juicios de las trompetas, ahora completos en lugar de parciales, sobre los mismos blancos y en el mismo orden. La sexta copa reúne a los reyes en Armagedón (16:12–16); la séptima trae la voz del trono: «Hecho está».</p>
        <ul><li><a href="#trumpets">¿Qué son las trompetas y las copas?</a></li><li><a href="#armageddon">¿Qué es el Armagedón?</a></li></ul>
      </div></div>

      <button type="button" class="vcell vlabel" id="vision-6" aria-expanded="false" aria-controls="vd-6"><span class="vn">VI</span><span class="vt"><b>Cae Babilonia, vuelve el Rey</b><small>Capítulos 17–19</small></span><span class="vchev" aria-hidden="true">▸</span></button>
      <div class="vcell vbar vmid"><div class="vtrack"><i class="age"></i><i class="end" style="width:20%"></i><i class="dot"></i></div><div class="vcap">19:11–21 · el Jinete del caballo blanco</div></div>
      <div class="vcell vend"></div>
      <div class="vdetail" id="vd-6" hidden><div class="vdetail-inner">
        <p>La ciudad ramera que sedujo a las naciones es juzgada, y la lloran los mercaderes que amaban su riqueza. Luego el cielo se abre y Cristo sale, Fiel y Verdadero, a vencer a la bestia, al falso profeta y a los reyes reunidos contra Él (19:11–21).</p>
        <ul><li><a href="#babylon">¿Quién es Babilonia la grande?</a></li><li><a href="#second-coming">¿Qué pasa cuando Jesús regrese?</a></li><li><a href="#rapture">¿Y el arrebatamiento?</a></li></ul>
      </div></div>

      <button type="button" class="vcell vlabel" id="vision-7" aria-expanded="false" aria-controls="vd-7"><span class="vn">VII</span><span class="vt"><b>El dragón juzgado, todo hecho nuevo</b><small>Capítulos 20–22</small></span><span class="vchev" aria-hidden="true">▸</span></button>
      <div class="vcell vbar vmid"><div class="vtrack"><i class="age"></i><i class="end" style="width:24%"></i><i class="dot"></i></div><div class="vcap"><span class="tie">vuelve a contar 19:19–21</span><span>20:7–15 · el trono blanco</span></div></div>
      <div class="vcell vbeyond vend"><i></i><span>21:1–22:5 · nueva creación</span></div>
      <div class="vdetail" id="vd-7" hidden><div class="vdetail-inner">
        <p>Por última vez, de regreso al principio. En la primera venida de Cristo, Satanás es atado «para que no engañara más a las naciones» (20:3), y las almas de los fieles que han muerto reinan con Cristo durante los «mil años». Después de una breve liberación viene la misma batalla final de 19:19–21, luego el gran trono blanco y, por fin, el cielo nuevo y la tierra nueva.</p>
        <ul><li><a href="#millennium">¿Qué es el milenio?</a></li><li><a href="#resurrection">¿Qué es la primera resurrección?</a></li><li><a href="#new-creation">¿Qué es la nueva Jerusalén?</a></li></ul>

        <span><i class="k-ring" aria-hidden="true"></i>El fin anunciado, no mostrado</span>

  <h2>Cinco pistas de que el Apocalipsis se repite</h2>
  <h3>1. El fin llega demasiado pronto</h3>
  <p>En el sexto sello el sol se pone negro, el cielo desaparece «como un pergamino que se enrolla», todo monte e isla son removidos, y la gente clama: «ha llegado el gran día de la ira de ellos» (6:12–17). Eso es el fin del mundo, y apenas estamos en el capítulo 6. El libro tiene que volver a empezar, y lo hace.</p>
  <h3>2. Las trompetas y las copas golpean los mismos blancos en el mismo orden</h3>
  <p>La tierra, el mar, los ríos, el sol, las tinieblas, el río Éufrates y una tormenta final: las trompetas (capítulos 8–11) y las copas (capítulo 16) siguen el mismo patrón de siete pasos, ambas inspiradas en las plagas de Egipto. La diferencia es que las trompetas afectan «la tercera parte», mientras que las copas son completas. <a href="#trumpets">Ver las dos listas lado a lado.</a></p>
  <h3>3. La misma tormenta cierra cada serie, cada vez más fuerte</h3>
  <p>Cada serie termina con la misma tormenta que sale del trono de Dios, y crece cada vez. Después de los sellos hay «truenos, ruidos, relámpagos, y un terremoto» (8:5). Después de las trompetas, la misma tormenta con una gran granizada añadida (11:19). Después de las copas, el terremoto más grande de la historia y granizos de casi cuarenta y cinco kilos (16:18–21).</p>
  <h3>4. Una batalla final, contada tres veces</h3>
  <p>Los espíritus inmundos van a los reyes «a reunirlos para la batalla del gran día del Dios Todopoderoso» (16:14). La bestia y los reyes están «reunidos para hacer guerra» contra el Jinete (19:19). Satanás junta a las naciones «a fin de reunirlas para la batalla» (20:8). En griego, cada vez es <em>la</em> batalla, y los capítulos 19 y 20 toman imágenes de la misma profecía, Ezequiel 38–39. Así que el capítulo 20 no ocurre después del capítulo 19: cuenta la misma batalla final desde otro ángulo.</p>
  <h3>5. Un solo período con cinco nombres</h3>
  <p>El tiempo del testimonio y del sufrimiento de la iglesia se llama cuarenta y dos meses, 1,260 días, y «un tiempo, tiempos y medio tiempo» (11:2–3; 12:6, 14; 13:5). Son tres maneras de decir lo mismo. <a href="#1260">Ver cómo encajan.</a></p>

  <div class="note"><p><strong>La repetición es la manera en que Dios confirma un mensaje.</strong> José le dijo a Faraón: «En cuanto a la repetición del sueño a Faraón dos veces, quiere decir que el asunto está determinado por Dios» (Génesis 41:32). Daniel vio los mismos cuatro reinos primero como una estatua (Daniel 2) y luego como cuatro bestias (Daniel 7). El Apocalipsis hace lo mismo siete veces. El comentario latino más antiguo del Apocalipsis, de Victorino de Petovio (murió hacia el año 304), ya enseñaba que las copas repiten las trompetas.</p></div>

  <h2>Dos mitades</h2>
  <p>Hendriksen vio que las siete visiones se agrupan en dos partes. <strong>Los capítulos 1–11</strong> muestran la lucha en la superficie de la historia: la iglesia perseguida por el mundo, pero protegida, vindicada y victoriosa. <strong>Los capítulos 12–22</strong> van más hondo y muestran la guerra espiritual que hay detrás: Cristo y Su iglesia contra el dragón y sus ayudantes, la bestia, el falso profeta y Babilonia. Uno por uno, en el orden inverso al que aparecieron, esos enemigos son juzgados: Babilonia (cap. 18), la bestia y el falso profeta (cap. 19) y, por último, el dragón mismo (cap. 20).</p>

  <h2>Entonces, ¿qué es todavía futuro?</h2>
  <p>Cada visión termina en el mismo suceso real: el regreso visible de Cristo, la resurrección de los muertos, el juicio final y la nueva creación. Las visiones paralelas también muestran que la era termina con un <strong>clímax breve e intenso</strong>: la guerra de la bestia contra los testigos (11:7), Satanás desatado «por un poco de tiempo» (20:3, 7–9), y lo que Pablo llama la revelación del «hombre de pecado» (2 Tesalonicenses 2:3). La iglesia pasa por esa última prueba bajo la protección de Dios, y Cristo le pone fin con Su venida.</p>

  <section class="evidence" aria-labelledby="ev-structure-es">
    <h2 id="ev-structure-es">¿Cómo lo sabemos?</h2>
    <p class="evidence-intro">Las etiquetas distinguen lo que dice el texto de las conexiones y conclusiones que se sacan de él.</p>
    <details class="ev"><summary><span class="ev-n">01</span><span class="ev-ref">Apocalipsis 6:12–17</span><i class="tag stated">Declarado</i></summary><div class="ev-body"><p>El sexto sello describe la disolución del cielo y de la tierra y anuncia que ha llegado el gran día de la ira.</p><a href="https://www.biblegateway.com/passage/?search=Apocalipsis+6&amp;version=NBLA" target="_blank" rel="noopener">Leer Apocalipsis 6 ↗</a></div></details>
    <details class="ev"><summary><span class="ev-n">02</span><span class="ev-ref">Apocalipsis 11:15–18</span><i class="tag stated">Declarado</i></summary><div class="ev-body"><p>La séptima trompeta anuncia que «llegó el tiempo de juzgar a los muertos y de dar la recompensa a Tus siervos». Es otra vez el fin, al cierre del segundo ciclo.</p><a href="https://www.biblegateway.com/passage/?search=Apocalipsis+11&amp;version=NBLA" target="_blank" rel="noopener">Leer Apocalipsis 11 ↗</a></div></details>
    <details class="ev"><summary><span class="ev-n">03</span><span class="ev-ref">Apocalipsis 16:14; 19:19; 20:8</span><i class="tag link">Conexión</i></summary><div class="ev-body"><p>Tres descripciones de las naciones reunidas para «la batalla» contra Dios, cada una seguida por la victoria decisiva de Cristo.</p><a href="https://www.biblegateway.com/passage/?search=Apocalipsis+20&amp;version=NBLA" target="_blank" rel="noopener">Leer Apocalipsis 20 ↗</a></div></details>
    <details class="ev"><summary><span class="ev-n">04</span><span class="ev-ref">Ezequiel 38–39</span><i class="tag link">Conexión</i></summary><div class="ev-body"><p>El banquete de las aves de Apocalipsis 19:17–18 viene de Ezequiel 39:17–20, y Gog y Magog en 20:8 vienen de Ezequiel 38:2. Una misma profecía está detrás de ambos capítulos.</p><a href="https://www.biblegateway.com/passage/?search=Ezequiel+39&amp;version=NBLA" target="_blank" rel="noopener">Leer Ezequiel 39 ↗</a></div></details>
    <details class="ev"><summary><span class="ev-n">05</span><span class="ev-ref">Génesis 41:32; Daniel 2 y 7</span><i class="tag link">Conexión</i></summary><div class="ev-body"><p>Dios da una misma revelación en más de una forma para confirmarla. El Apocalipsis sigue el patrón de los profetas que cita.</p><a href="https://www.biblegateway.com/passage/?search=G%C3%A9nesis+41&amp;version=NBLA" target="_blank" rel="noopener">Leer Génesis 41 ↗</a></div></details>
    <details class="ev"><summary><span class="ev-n">06</span><span class="ev-ref">Dónde trazar las divisiones</span><i class="tag caution">Precaución</i></summary><div class="ev-body"><p>Las siete secciones de Hendriksen son un bosquejo cuidadoso. Otros intérpretes de la misma tradición, como G. K. Beale, dividen los ciclos de manera un poco distinta, pero coinciden en lo central: las visiones se repiten y se intensifican en lugar de avanzar en una sola secuencia.</p></div></details>
  </section>

  <details class="alt">
    <summary>Cómo lo leen otros</summary>
    <div class="alt-body">
      <p class="alt-intro">La diferencia principal es si los capítulos 4–22 forman una sola secuencia continua.</p>
      <div class="alt-grid">
        <article><h3>Una sola línea recta</h3><p>Muchos futuristas leen los capítulos 4–22 como una sola cronología: la iglesia arrebatada (4:1), siete años de tribulación (capítulos 6–18), el regreso de Cristo (19) y luego un reino terrenal de mil años (20).</p></article>
        <article class="ours"><h3>Siete visiones paralelas</h3><p>Los sellos, las trompetas y las copas llegan cada uno al fin; el capítulo 20 vuelve a la primera venida. El libro muestra una misma era siete veces, y un solo regreso al final.</p></article>
      </div>
    </div>
  </details>

  <aside class="lesson"><span class="rubric">Recuerda esto</span><p>Estés donde estés leyendo en el Apocalipsis, la cruz está detrás de ti y el regreso de Cristo está delante. Tú vives en la era que describen las visiones.</p></aside>
</section>

<section class="page" id="interpretations" data-nav="Cómo interpretar el Apocalipsis" data-num="◈" data-keywords="interpretación preterismo historicismo futurismo idealismo amilenial premilenial posmilenial postmilenial puntos de vista">
  <p class="eyebrow">Cómo leer el libro · Cuatro lentes, tres posturas</p>
  <h1>Distintos lentes, un solo Apocalipsis</h1>
  <p class="lead">Cristianos que aman el Apocalipsis lo han leído de distintas maneras. Dos preguntas ordenan la mayoría de las diferencias: ¿<em>cuándo</em> se cumplen las visiones?, y ¿<em>cuándo</em> son los mil años del capítulo 20?</p>

  <div class="primary">
    <span class="rubric">La lectura que sigue esta guía</span>
    <h2>Cristo reina ahora. Volverá una sola vez, en gloria.</h2>
    <p>Esta guía sigue la lectura amilenial de las confesiones reformadas, enseñada por Geerhardus Vos, Louis Berkhof, William Hendriksen, Anthony Hoekema, Kim Riddlebarger y W. Robert Godfrey. El Apocalipsis habló primero a iglesias reales bajo Roma. Sus siete visiones muestran el patrón de toda la era entre las dos venidas de Cristo. Los mil años del capítulo 20 son esa era presente, en la que Cristo reina y Satanás no puede impedir que el evangelio llegue a las naciones.</p>
    <p>Al final de la era, Cristo volverá visiblemente, una sola vez. Todos los muertos resucitarán, el mundo será juzgado y el cielo y la tierra serán hechos nuevos.</p>
  </div>

  <div class="disclaimer"><p style="margin:0">Son <strong>dos preguntas distintas</strong>, así que las respuestas se pueden combinar. Alguien puede ser amilenialista y preterista parcial, por ejemplo. Ninguno de los diagramas de abajo es un calendario del futuro.</p></div>

<section class="page topic" id="churches" data-nav="¿Qué son las siete cartas?" data-num="01" data-keywords="siete iglesias cartas éfeso esmirna pérgamo tiatira sardis filadelfia laodicea candelabros apocalipsis 2 3 vencedor">
  <p class="eyebrow">Pregunta 01 · Apocalipsis 1–3</p>
  <h1>¿Qué son las siete cartas?</h1>
  <p class="deck">La palabra de Cristo a Su iglesia en toda época</p>
  <div class="locator" data-vision="1"></div>
  <ul class="refs" aria-label="Pasajes para leer"><li class="refs-label">Leer en la NBLA</li><li><a href="https://www.biblegateway.com/passage/?search=Apocalipsis+1&amp;version=NBLA" target="_blank" rel="noopener">Apocalipsis 1</a></li><li><a href="https://www.biblegateway.com/passage/?search=Apocalipsis+2&amp;version=NBLA" target="_blank" rel="noopener">Apocalipsis 2</a></li><li><a href="https://www.biblegateway.com/passage/?search=Apocalipsis+3&amp;version=NBLA" target="_blank" rel="noopener">Apocalipsis 3</a></li></ul>
  <figure class="art"><img data-art src="https://commons.wikimedia.org/wiki/Special:FilePath/Albrecht_D%C3%BCrer,_The_Vision_of_the_Seven_Candlesticks,_1498,_NGA_142350.jpg?width=1000" alt="Grabado: Cristo entronizado entre siete candelabros, con siete estrellas en la mano y una espada que sale de Su boca; Juan arrodillado ante Él." loading="lazy" decoding="async" width="1000" height="1400"><figcaption><b>La visión de los siete candelabros</b>, Alberto Durero, 1498. Obra histórica, no un retrato literal de la visión.</figcaption></figure>
  <blockquote class="passage"><span class="rubric">El texto</span><p>En cuanto al misterio de las siete estrellas que viste en Mi mano derecha y de los siete candelabros de oro: las siete estrellas son los ángeles de las siete iglesias, y los siete candelabros son las siete iglesias.</p><footer><cite>Apocalipsis 1:20</cite><a href="https://www.biblegateway.com/passage/?search=Apocalipsis+1&amp;version=NBLA" target="_blank" rel="noopener">Leer el capítulo ↗</a></footer></blockquote>
  <div class="myth"><span class="rubric">Un malentendido común</span><p>Las siete iglesias son una cronología cifrada de siete épocas de la historia de la iglesia, y ahora vivimos en la última, la tibia Laodicea.</p></div>
  <div class="teach">
    <h2>Lo que enseña la Escritura</h2>
    <p class="illum">Eran siete congregaciones reales de la provincia romana de Asia, nombradas en el orden en que un mensajero recorrería el camino que las unía. Cristo habla a cada una por su nombre, sobre su ciudad y sus problemas concretos. Sin embargo, cada carta termina: «El que tiene oído, oiga lo que el Espíritu dice a <strong>las iglesias</strong>», en plural. El siete es el número de la plenitud, así que juntas estas cartas son la palabra de Cristo a toda la iglesia, en todo lugar y en todo siglo.</p>
    <p>Cada carta sigue el mismo patrón. Cristo se presenta con un título tomado de la visión del capítulo 1, dice que conoce las obras de la iglesia, elogia lo bueno, reprende lo malo, llama al arrepentimiento y hace una promesa «al vencedor». Cada una de esas promesas se cumple en la visión final de la nueva creación.</p>
  </div>
  <ul class="churches" aria-label="Las siete iglesias">
    <li><span class="ref">2:1–7</span><b>Éfeso</b><small>Sana en doctrina, pero ha dejado su primer amor</small></li>
    <li class="clean"><span class="ref">2:8–11</span><b>Esmirna</b><small>Pobre y perseguida, pero rica. Sin reprensión</small></li>
    <li><span class="ref">2:12–17</span><b>Pérgamo</b><small>Fiel bajo presión, pero tolera la falsa enseñanza</small></li>
    <li><span class="ref">2:18–29</span><b>Tiatira</b><small>Creciendo en amor y servicio, pero tolera a «Jezabel»</small></li>
    <li><span class="ref">3:1–6</span><b>Sardis</b><small>Tiene fama de estar viva, pero está muerta</small></li>
    <li class="clean"><span class="ref">3:7–13</span><b>Filadelfia</b><small>Poca fuerza, pero fiel. Sin reprensión</small></li>
    <li><span class="ref">3:14–22</span><b>Laodicea</b><small>Rica y cómoda, pero tibia</small></li>
  </ul>
  <h3>Promesas hechas en los capítulos 2–3, cumplidas en los capítulos 21–22</h3>
  <div class="table-scroll"><table class="promises">
    <thead><tr><th scope="col">La promesa</th><th scope="col">Hecha</th><th scope="col">Cumplida</th></tr></thead>
    <tbody>
      <tr><td>El árbol de la vida</td><td class="ref">2:7</td><td><span class="ref">22:2</span> A cada lado del río estaba el árbol de la vida</td></tr>
      <tr><td>Libre de la muerte segunda</td><td class="ref">2:11</td><td><span class="ref">21:7–8</span> La muerte segunda es para los incrédulos, no para el vencedor</td></tr>
      <tr><td>Un nombre nuevo</td><td class="ref">2:17</td><td><span class="ref">22:4</span> Su nombre estará en sus frentes</td></tr>
      <tr><td>El lucero de la mañana</td><td class="ref">2:28</td><td><span class="ref">22:16</span> Jesús es el lucero resplandeciente de la mañana</td></tr>
      <tr><td>Escrito en el libro de la vida</td><td class="ref">3:5</td><td><span class="ref">21:27</span> Solo entran aquellos cuyos nombres están en el libro de la vida del Cordero</td></tr>
      <tr><td>El nombre de la nueva Jerusalén</td><td class="ref">3:12</td><td><span class="ref">21:2</span> La ciudad santa desciende del cielo</td></tr>
      <tr><td>Sentarse en el trono de Cristo</td><td class="ref">3:21</td><td><span class="ref">22:5</span> Reinarán por los siglos de los siglos</td></tr>
    </tbody>
  </table></div>
  <section class="evidence" aria-labelledby="ev-churches-es">
    <h2 id="ev-churches-es">¿Cómo lo sabemos?</h2>
    <details class="ev"><summary><span class="ev-n">01</span><span class="ev-ref">Apocalipsis 1:4, 11</span><i class="tag stated">Declarado</i></summary><div class="ev-body"><p>Juan escribe «a las siete iglesias que están en Asia» y nombra las siete ciudades.</p><a href="https://www.biblegateway.com/passage/?search=Apocalipsis+1&amp;version=NBLA" target="_blank" rel="noopener">Leer Apocalipsis 1 ↗</a></div></details>
    <details class="ev"><summary><span class="ev-n">02</span><span class="ev-ref">Apocalipsis 2:7, 11, 17, 29; 3:6, 13, 22</span><i class="tag stated">Declarado</i></summary><div class="ev-body"><p>Cada carta termina con un llamado a oír lo que el Espíritu dice a todas las iglesias, no solo a la destinataria.</p><a href="https://www.biblegateway.com/passage/?search=Apocalipsis+2&amp;version=NBLA" target="_blank" rel="noopener">Leer Apocalipsis 2 ↗</a></div></details>
    <details class="ev"><summary><span class="ev-n">03</span><span class="ev-ref">Apocalipsis 21–22</span><i class="tag link">Conexión</i></summary><div class="ev-body"><p>Las promesas al vencedor reaparecen, una por una, como rasgos de la nueva Jerusalén.</p><a href="https://www.biblegateway.com/passage/?search=Apocalipsis+22&amp;version=NBLA" target="_blank" rel="noopener">Leer Apocalipsis 22 ↗</a></div></details>
    <details class="ev"><summary><span class="ev-n">04</span><span class="ev-ref">«Los ángeles de las iglesias»</span><i class="tag caution">Precaución</i></summary><div class="ev-body"><p>Los intérpretes difieren sobre si los «ángeles» (1:20) son guardianes celestiales, los pastores de las iglesias o una forma de personificar a cada iglesia. El mensaje central de las cartas no depende de la respuesta.</p></div></details>
  </section>
  <details class="alt"><summary>Cómo lo leen otros</summary><div class="alt-body"><div class="alt-grid">
    <article><h3>Siete épocas de la iglesia</h3><p>Algunos lectores dispensacionalistas e historicistas ven en las cartas la profecía de siete períodos, desde los apóstoles (Éfeso) hasta los últimos días (Laodicea).</p></article>
    <article class="ours"><h3>Siete iglesias reales, una sola iglesia</h3><p>Las cartas se dirigen a congregaciones reales del primer siglo y, como el siete es el número de la plenitud, hablan a toda iglesia de toda época. Los siete tipos de iglesia existen al mismo tiempo, hoy como entonces.</p></article>
  </div></div></details>
  <aside class="lesson"><span class="rubric">La lección para recordar</span><p>Cristo camina entre Sus iglesias. Ve lo que escondemos, y promete todo a los que vencen.</p></aside>
  <section class="quiz"><span class="rubric">Comprueba lo que aprendiste</span><h3>Cada carta termina: «Oiga lo que el Espíritu dice a…»</h3><div class="quiz-options"><button class="quiz-opt" data-correct>«las iglesias»: cada carta es para toda la iglesia</button><button class="quiz-opt">«esta iglesia»: cada carta es privada para una ciudad</button><button class="quiz-opt">«la última iglesia»: solo Laodicea nos habla hoy</button></div><p class="quiz-feedback" hidden>El plural aparece al final de las siete cartas (2:7 y siguientes). Cristo quiere que todas las iglesias oigan lo que dice a cada una.</p></section>
</section>

<section class="page topic" id="throne" data-nav="¿Quién es el Cordero en el trono?" data-num="02" data-keywords="trono cordero león ancianos veinticuatro seres vivientes libro rollo apocalipsis 4 5 cielo adoración">
  <p class="eyebrow">Pregunta 02 · Apocalipsis 4–5</p>
  <h1>¿Quién es el Cordero en el trono?</h1>
  <p class="deck">La vista desde el cielo que da sentido a todo lo demás</p>
  <div class="locator" data-vision="2"></div>
  <ul class="refs" aria-label="Pasajes para leer"><li class="refs-label">Leer en la NBLA</li><li><a href="https://www.biblegateway.com/passage/?search=Apocalipsis+4&amp;version=NBLA" target="_blank" rel="noopener">Apocalipsis 4</a></li><li><a href="https://www.biblegateway.com/passage/?search=Apocalipsis+5&amp;version=NBLA" target="_blank" rel="noopener">Apocalipsis 5</a></li><li><a href="https://www.biblegateway.com/passage/?search=Ezequiel+1&amp;version=NBLA" target="_blank" rel="noopener">Ezequiel 1</a></li><li><a href="https://www.biblegateway.com/passage/?search=Isa%C3%ADas+6&amp;version=NBLA" target="_blank" rel="noopener">Isaías 6</a></li></ul>
  <figure class="art"><img data-art src="https://commons.wikimedia.org/wiki/Special:FilePath/Albrecht_D%C3%BCrer,_Saint_John_before_God_and_the_Elders,_1498,_NGA_142351.jpg?width=1000" alt="Grabado: Dios entronizado en el cielo con el Cordero, rodeado por los veinticuatro ancianos coronados, mientras Juan mira hacia arriba por una puerta abierta." loading="lazy" decoding="async" width="1000" height="1400"><figcaption><b>San Juan ante Dios y los ancianos</b>, Alberto Durero, 1498. Obra histórica, no un retrato literal de la visión.</figcaption></figure>
  <blockquote class="passage"><span class="rubric">El texto</span><p>Entonces uno de los ancianos me dijo: «No llores; mira, el León de la tribu de Judá, la Raíz de David, ha vencido para abrir el libro y sus siete sellos». Miré, y vi entre el trono (con los cuatro seres vivientes) y los ancianos, a un Cordero, de pie, como inmolado, que tenía siete cuernos y siete ojos, que son los siete Espíritus de Dios enviados por toda la tierra.</p><footer><cite>Apocalipsis 5:5–6</cite><a href="https://www.biblegateway.com/passage/?search=Apocalipsis+5&amp;version=NBLA" target="_blank" rel="noopener">Leer el capítulo ↗</a></footer></blockquote>
  <div class="myth"><span class="rubric">Un malentendido común</span><p>«Sube acá» en 4:1 es el arrebatamiento de la iglesia, así que la iglesia desaparece del libro después del capítulo 3.</p></div>
  <div class="teach">
    <h2>Lo que enseña la Escritura</h2>
    <p class="illum">Antes de ver un solo juicio, a Juan se le muestra el trono. El cielo no está vacío y la historia no está fuera de control: Dios está en Su trono, rodeado de adoración (cap. 4). Luego viene el punto decisivo de todo el libro. Nadie es digno de abrir el libro sellado, el plan de Dios para juzgar el mal y redimir a Su pueblo, hasta que el anciano anuncia al León de Judá. Juan se vuelve y ve <strong>un Cordero, de pie, como inmolado</strong>, junto al trono.</p>
    <p>Es el evangelio en una sola imagen. Cristo venció como León muriendo como Cordero, y ahora comparte el trono de Su Padre: «como yo también vencí y me senté con Mi Padre en Su trono» (3:21). Esta es Su entronización después de la cruz y la ascensión, el reinado presente que todo el resto del Apocalipsis da por sentado. Los veinticuatro ancianos representan a todo el pueblo de Dios: doce por las tribus de Israel y doce por los apóstoles, los mismos dos doces escritos en las puertas y los cimientos de la nueva Jerusalén (21:12–14). Los cuatro seres vivientes son los guardianes del trono de Ezequiel 1 e Isaías 6, que dirigen la alabanza de toda la creación.</p>
    <p>Y en 4:1 la voz dice: «Sube acá y te mostraré las cosas que deben suceder después de estas». Es el llamado a Juan para entrar en la visión, no la partida de la iglesia. La iglesia está en la tierra a lo largo de todo el libro: son «los santos», los siervos sellados, los testigos y la novia.</p>
  </div>
  <section class="evidence" aria-labelledby="ev-throne-es">
    <h2 id="ev-throne-es">¿Cómo lo sabemos?</h2>
    <details class="ev"><summary><span class="ev-n">01</span><span class="ev-ref">Apocalipsis 5:5–6, 9</span><i class="tag stated">Declarado</i></summary><div class="ev-body"><p>Juan oye de un León, pero ve a un Cordero inmolado, que es digno porque «con Tu sangre compraste para Dios a gente de toda tribu, lengua, pueblo y nación».</p><a href="https://www.biblegateway.com/passage/?search=Apocalipsis+5&amp;version=NBLA" target="_blank" rel="noopener">Leer Apocalipsis 5 ↗</a></div></details>
    <details class="ev"><summary><span class="ev-n">02</span><span class="ev-ref">Apocalipsis 3:21</span><i class="tag stated">Declarado</i></summary><div class="ev-body"><p>Cristo dice: «como yo también vencí y me senté con Mi Padre en Su trono». Su reinado sigue a Su victoria; no está postergado.</p><a href="https://www.biblegateway.com/passage/?search=Apocalipsis+3&amp;version=NBLA" target="_blank" rel="noopener">Leer Apocalipsis 3 ↗</a></div></details>
    <details class="ev"><summary><span class="ev-n">03</span><span class="ev-ref">Apocalipsis 21:12–14</span><i class="tag link">Conexión</i></summary><div class="ev-body"><p>Las puertas de la ciudad llevan los nombres de las doce tribus y sus cimientos los de los doce apóstoles: un solo pueblo de Dios, del antiguo y del nuevo pacto.</p><a href="https://www.biblegateway.com/passage/?search=Apocalipsis+21&amp;version=NBLA" target="_blank" rel="noopener">Leer Apocalipsis 21 ↗</a></div></details>
    <details class="ev"><summary><span class="ev-n">04</span><span class="ev-ref">Apocalipsis 4:1</span><i class="tag caution">Precaución</i></summary><div class="ev-body"><p>La voz dice «Sube acá y te mostraré». Se dirige a Juan, no a la iglesia, e introduce lo que él va a ver.</p><a href="https://www.biblegateway.com/passage/?search=Apocalipsis+4&amp;version=NBLA" target="_blank" rel="noopener">Leer Apocalipsis 4 ↗</a></div></details>
  </section>
  <details class="alt"><summary>Cómo lo leen otros</summary><div class="alt-body"><div class="alt-grid">
    <article><h3>La iglesia arrebatada en el cielo</h3><p>Algunos dispensacionalistas ven en los ancianos a la iglesia ya llevada al cielo antes de una tribulación de siete años, y en 4:1 el momento del arrebatamiento.</p></article>
    <article class="ours"><h3>El reinado presente del Cordero</h3><p>Los capítulos 4–5 muestran a Cristo entronizado desde Su ascensión. Los ancianos representan a todo el pueblo de Dios, y el libro que Él abre gobierna toda la era que sigue.</p></article>
  </div></div></details>
  <aside class="lesson"><span class="rubric">La lección para recordar</span><p>Pase lo que pase en la tierra, el trono del cielo está ocupado, y el que se sienta en él fue inmolado por ti.</p></aside>
  <section class="quiz"><span class="rubric">Comprueba lo que aprendiste</span><h3>El anciano le dice a Juan que mire a un León. ¿Qué ve Juan en realidad?</h3><div class="quiz-options"><button class="quiz-opt" data-correct>Un Cordero, de pie, como inmolado</button><button class="quiz-opt">Un león con siete cabezas</button><button class="quiz-opt">Un trono vacío</button></div><p class="quiz-feedback" hidden>Juan oye «León» y ve un Cordero inmolado (5:5–6). La victoria real de Cristo se ganó por medio de Su muerte sacrificial.</p></section>
</section>

<section class="page topic" id="horsemen" data-nav="¿Quiénes son los cuatro jinetes?" data-num="03" data-keywords="cuatro jinetes sellos caballo blanco rojo negro amarillento apocalipsis 6 zacarías conquista guerra hambre muerte">
  <p class="eyebrow">Pregunta 03 · Apocalipsis 6</p>
  <h1>¿Quiénes son los cuatro jinetes?</h1>
  <p class="deck">Los males de una era caída, desatados por el Cordero</p>
  <div class="locator" data-vision="2"></div>
  <ul class="refs" aria-label="Pasajes para leer"><li class="refs-label">Leer en la NBLA</li><li><a href="https://www.biblegateway.com/passage/?search=Apocalipsis+6&amp;version=NBLA" target="_blank" rel="noopener">Apocalipsis 6</a></li><li><a href="https://www.biblegateway.com/passage/?search=Zacar%C3%ADas+6&amp;version=NBLA" target="_blank" rel="noopener">Zacarías 6</a></li><li><a href="https://www.biblegateway.com/passage/?search=Mateo+24&amp;version=NBLA" target="_blank" rel="noopener">Mateo 24</a></li></ul>
  <figure class="art"><img data-art src="https://commons.wikimedia.org/wiki/Special:FilePath/Albrecht_D%C3%BCrer,_The_Four_Horsemen,_1498,_NGA_142352.jpg?width=1000" alt="Grabado: cuatro jinetes cabalgan por el cielo pisoteando a la gente debajo de ellos, con un ángel arriba." loading="lazy" decoding="async" width="1000" height="1400"><figcaption><b>Los cuatro jinetes</b>, Alberto Durero, 1498. Obra histórica, no un retrato literal de la visión.</figcaption></figure>
  <blockquote class="passage"><span class="rubric">El texto</span><p>Y miré, y había un caballo amarillento. El que estaba montado en él se llamaba Muerte, y el Hades lo seguía. Y se les dio autoridad sobre la cuarta parte de la tierra, para matar con espada, con hambre, con pestilencia y con las fieras de la tierra.</p><footer><cite>Apocalipsis 6:8</cite><a href="https://www.biblegateway.com/passage/?search=Apocalipsis+6&amp;version=NBLA" target="_blank" rel="noopener">Leer el capítulo ↗</a></footer></blockquote>
  <div class="myth"><span class="rubric">Un malentendido común</span><p>Cuatro jinetes sobrenaturales aparecerán en una futura tribulación de siete años, justo antes del fin del mundo.</p></div>
  <div class="teach">
    <h2>Lo que enseña la Escritura</h2>
    <p class="illum">Los jinetes salen solo cuando el Cordero abre los sellos. Representan la conquista, la guerra, la escasez y la muerte: los mismos cuatro juicios que Dios nombró por medio de Ezequiel, «espada, hambre, fieras y plaga» (Ezequiel 14:21), dibujados como caballos tomados de las visiones de Zacarías (Zacarías 1 y 6). Jesús dijo que estos males marcarían toda la era: «Ustedes van a oír de guerras y rumores de guerras… y en diferentes lugares habrá hambre y terremotos. Pero todo esto es solo el comienzo de dolores» (Mateo 24:6–8).</p>
    <p>Así que los jinetes no son cuatro sucesos futuros. Son los dolores característicos de la historia entre las dos venidas de Cristo. Fíjate en los límites: la autoridad se les «dio», y solo «sobre la cuarta parte de la tierra». Luego el quinto sello muestra a los mártires clamando «¿Hasta cuándo?», y el sexto sello trae el fin del mundo. El séptimo se abre a las trompetas, la siguiente visión de la misma era.</p>
  </div>
  <div class="seals" aria-labelledby="seals-h-es">
    <h3 id="seals-h-es">Un libro, siete sellos</h3>
    <p>Cuatro jinetes, un clamor desde el altar y el fin, y luego silencio antes de que empiece la siguiente visión.</p>
    <ol class="seal-row">
      <li class="seal"><span class="wax" aria-hidden="true">I</span><b>Caballo blanco</b><small>Conquista · 6:1–2</small></li>
      <li class="seal"><span class="wax" aria-hidden="true">II</span><b>Caballo rojo</b><small>Guerra · 6:3–4</small></li>
      <li class="seal"><span class="wax" aria-hidden="true">III</span><b>Caballo negro</b><small>Escasez · 6:5–6</small></li>
      <li class="seal"><span class="wax" aria-hidden="true">IV</span><b>Caballo amarillento</b><small>Muerte · 6:7–8</small></li>
      <li class="seal"><span class="wax" aria-hidden="true">V</span><b>Los mártires</b><small>«¿Hasta cuándo?» · 6:9–11</small></li>
      <li class="seal end"><span class="wax" aria-hidden="true">VI</span><b>El fin</b><small>El día de la ira · 6:12–17</small></li>
      <li class="seal"><span class="wax" aria-hidden="true">VII</span><b>Silencio</b><small>Luego, las trompetas · 8:1–5</small></li>
    </ol>
    <p class="seal-note">Entre el sexto y el séptimo sello, el capítulo 7 hace una pausa para mostrar al pueblo de Dios sellado y seguro. La pregunta «¿y quién podrá sostenerse?» (6:17) se responde enseguida: los siervos sellados de Dios.</p>
  </div>
  <section class="evidence" aria-labelledby="ev-horsemen-es">
    <h2 id="ev-horsemen-es">¿Cómo lo sabemos?</h2>
    <details class="ev"><summary><span class="ev-n">01</span><span class="ev-ref">Apocalipsis 6:1–8</span><i class="tag stated">Declarado</i></summary><div class="ev-body"><p>Cada jinete aparece cuando el Cordero abre un sello, y a cada uno se le «dio» su autoridad.</p><a href="https://www.biblegateway.com/passage/?search=Apocalipsis+6&amp;version=NBLA" target="_blank" rel="noopener">Leer Apocalipsis 6 ↗</a></div></details>
    <details class="ev"><summary><span class="ev-n">02</span><span class="ev-ref">Zacarías 1:8–11; 6:1–8</span><i class="tag link">Conexión</i></summary><div class="ev-body"><p>En las visiones nocturnas de Zacarías, caballos de colores recorren la tierra, enviados por el Señor.</p><a href="https://www.biblegateway.com/passage/?search=Zacar%C3%ADas+6&amp;version=NBLA" target="_blank" rel="noopener">Leer Zacarías 6 ↗</a></div></details>
    <details class="ev"><summary><span class="ev-n">03</span><span class="ev-ref">Mateo 24:6–8</span><i class="tag link">Conexión</i></summary><div class="ev-body"><p>Jesús describe la guerra, el hambre y los terremotos como rasgos de la era antes del fin: «todavía no es el fin».</p><a href="https://www.biblegateway.com/passage/?search=Mateo+24&amp;version=NBLA" target="_blank" rel="noopener">Leer Mateo 24 ↗</a></div></details>
    <details class="ev"><summary><span class="ev-n">04</span><span class="ev-ref">El caballo blanco (6:2)</span><i class="tag caution">Precaución</i></summary><div class="ev-body"><p>El primer jinete es discutido incluso entre intérpretes reformados. Hendriksen vio a Cristo y el avance del evangelio (compara 19:11); muchos otros ven la conquista o una imitación de Cristo, ya que los otros tres jinetes traen daño.</p></div></details>
  </section>
  <details class="alt"><summary>Cómo lo leen otros</summary><div class="alt-body"><div class="alt-grid">
    <article><h3>Juicios de una tribulación futura</h3><p>Los futuristas sitúan los sellos en un período venidero de siete años, y a menudo ven en el jinete blanco al Anticristo que trae una paz falsa.</p></article>
    <article class="ours"><h3>Rasgos de toda la era</h3><p>Los sellos muestran lo que sufre cada generación entre las venidas de Cristo, bajo el control del Cordero, hasta que el sexto sello trae el fin.</p></article>
  </div></div></details>
  <aside class="lesson"><span class="rubric">La lección para recordar</span><p>Cuando el mundo tiembla, recuerda quién abre los sellos.</p></aside>
  <section class="quiz"><span class="rubric">Comprueba lo que aprendiste</span><h3>¿Qué ocurre en el sexto sello?</h3><div class="quiz-options"><button class="quiz-opt" data-correct>Llega el gran día de la ira: el fin del mundo</button><button class="quiz-opt">Sale un quinto jinete</button><button class="quiz-opt">La iglesia es quitada en secreto</button></div><p class="quiz-feedback" hidden>En el sexto sello el cielo desaparece como un pergamino que se enrolla y «ha llegado el gran día de la ira de ellos» (6:12–17). El primer ciclo de visiones ya llegó al fin.</p></section>
</section>

<section class="page topic" id="144000" data-nav="¿Quiénes son los 144,000?" data-num="04" data-keywords="144000 144,000 sellados tribus israel gran multitud apocalipsis 7 14 iglesia">
  <p class="eyebrow">Pregunta 04 · Apocalipsis 7 y 14</p>
  <h1>¿Quiénes son los 144,000?</h1>
  <p class="deck">El pueblo que Dios cuenta, sella y guarda</p>
  <div class="locator" data-vision="2,4"></div>
  <ul class="refs" aria-label="Pasajes para leer"><li class="refs-label">Leer en la NBLA</li><li><a href="https://www.biblegateway.com/passage/?search=Apocalipsis+7&amp;version=NBLA" target="_blank" rel="noopener">Apocalipsis 7</a></li><li><a href="https://www.biblegateway.com/passage/?search=Apocalipsis+14&amp;version=NBLA" target="_blank" rel="noopener">Apocalipsis 14</a></li><li><a href="https://www.biblegateway.com/passage/?search=N%C3%BAmeros+1&amp;version=NBLA" target="_blank" rel="noopener">Números 1</a></li></ul>
  <figure class="art"><img data-art src="https://commons.wikimedia.org/wiki/Special:FilePath/Albrecht_D%C3%BCrer,_The_Four_Angels_Holding_the_Winds,_1498,_NGA_142354.jpg?width=1000" alt="Grabado: cuatro ángeles detienen los vientos mientras otro ángel marca la frente de una multitud de fieles." loading="lazy" decoding="async" width="1000" height="1400"><figcaption><b>Los cuatro ángeles que detienen los vientos</b> y el sellado de los siervos de Dios, Alberto Durero, 1498. Obra histórica, no un retrato literal de la visión.</figcaption></figure>
  <blockquote class="passage"><span class="rubric">El texto</span><p>Después de esto miré, y vi una gran multitud, que nadie podía contar, de todas las naciones, tribus, pueblos, y lenguas, de pie delante del trono y delante del Cordero, vestidos con vestiduras blancas y con palmas en las manos.</p><footer><cite>Apocalipsis 7:9</cite><a href="https://www.biblegateway.com/passage/?search=Apocalipsis+7&amp;version=NBLA" target="_blank" rel="noopener">Leer el capítulo ↗</a></footer></blockquote>
  <div class="myth"><span class="rubric">Un malentendido común</span><p>Solo 144,000 personas serán salvas, o el número es un grupo especial de evangelistas judíos en una tribulación futura.</p></div>
  <div class="teach">
    <h2>Lo que enseña la Escritura</h2>
    <p class="illum">Juan <em>oye</em> un número: «Oí el número de los que fueron sellados: 144,000 sellados de todas las tribus de los israelitas» (7:4). Luego se vuelve y <em>ve</em> «una gran multitud, que nadie podía contar, de todas las naciones» (7:9). Es exactamente lo que pasó en el capítulo 5, cuando oyó de un León y vio un Cordero. Lo que Juan oye y lo que ve son la misma realidad desde dos lados. <strong>Los 144,000 son toda la iglesia</strong>, descrita como el verdadero Israel de Dios y contada hasta la última persona; la gran multitud es esa misma iglesia tal como realmente es, reunida de todos los pueblos.</p>
