    <details class="ev"><summary><span class="ev-n">05</span><span class="ev-ref">Babilonia y el papado</span><i class="tag caution">Precaución</i></summary><div class="ev-body"><p>Muchos reformadores identificaron a Babilonia con la Roma papal. Esa lectura tiene una larga historia protestante, pero las pistas del propio texto apuntan primero a la Roma imperial y, por medio de ella, al sistema del mundo en toda época.</p></div></details>
  </section>
  <details class="alt"><summary>Cómo lo leen otros</summary><div class="alt-body"><div class="alt-grid">
    <article><h3>Una ciudad reconstruida o un sistema final</h3><p>Algunos futuristas esperan una Babilonia literal reconstruida en Irak, o un futuro sistema económico y religioso mundial.</p></article>
    <article class="ours"><h3>La ciudad del mundo en toda época</h3><p>Babilonia es Roma para los lectores de Juan y el mundo orgulloso e idólatra de cada generación, juzgado de una vez para siempre al final.</p></article>
  </div></div></details>
  <aside class="lesson"><span class="rubric">La lección para recordar</span><p>No pongas tu esperanza en la riqueza, la comodidad o una cultura que se acaba. Tu ciudadanía está en la ciudad que desciende de Dios.</p></aside>
  <section class="quiz"><span class="rubric">Comprueba lo que aprendiste</span><h3>¿Qué ciudad pone el Apocalipsis frente a Babilonia?</h3><div class="quiz-options"><button class="quiz-opt" data-correct>La nueva Jerusalén, la novia del Cordero</button><button class="quiz-opt">La antigua Nínive</button><button class="quiz-opt">Roma, que reemplaza a Babilonia</button></div><p class="quiz-feedback" hidden>La ciudad ramera (17:1) y la ciudad novia (21:9) se presentan con las mismas palabras. Toda persona pertenece a una ciudad o a la otra.</p></section>
</section>

<section class="page topic" id="armageddon" data-nav="¿Qué es el Armagedón?" data-num="15" data-keywords="armagedón meguido batalla reyes éufrates gog magog guerra apocalipsis 16 19 20">
  <p class="eyebrow">Pregunta 15 · Apocalipsis 16:12–16</p>
  <h1>¿Qué es el Armagedón?</h1>
  <p class="deck">La última rebelión, terminada con una palabra</p>
  <div class="locator" data-vision="5,6,7"></div>
  <ul class="refs" aria-label="Pasajes para leer"><li class="refs-label">Leer en la NBLA</li><li><a href="https://www.biblegateway.com/passage/?search=Apocalipsis+16&amp;version=NBLA" target="_blank" rel="noopener">Apocalipsis 16</a></li><li><a href="https://www.biblegateway.com/passage/?search=Apocalipsis+19&amp;version=NBLA" target="_blank" rel="noopener">Apocalipsis 19</a></li><li><a href="https://www.biblegateway.com/passage/?search=Apocalipsis+20&amp;version=NBLA" target="_blank" rel="noopener">Apocalipsis 20</a></li><li><a href="https://www.biblegateway.com/passage/?search=Ezequiel+38&amp;version=NBLA" target="_blank" rel="noopener">Ezequiel 38</a></li></ul>
  <figure class="art"><img data-art src="https://commons.wikimedia.org/wiki/Special:FilePath/Albrecht_D%C3%BCrer,_The_Four_Avenging_Angels,_1498,_NGA_142356.jpg?width=1000" alt="Grabado: cuatro ángeles armados abaten a multitudes, con jinetes y caballos que echan fuego detrás de ellos." loading="lazy" decoding="async" width="1000" height="1400"><figcaption><b>Los cuatro ángeles vengadores</b>, Alberto Durero, 1498. Los ángeles soltados junto al Éufrates (9:14), el río donde después se reúne a los reyes para el Armagedón (16:12). Obra histórica, no un retrato literal de la visión.</figcaption></figure>
  <blockquote class="passage"><span class="rubric">El texto</span><p>Entonces los reunieron en el lugar que en hebreo se llama Armagedón.</p><footer><cite>Apocalipsis 16:16</cite><a href="https://www.biblegateway.com/passage/?search=Apocalipsis+16&amp;version=NBLA" target="_blank" rel="noopener">Leer el capítulo ↗</a></footer></blockquote>
  <div class="myth"><span class="rubric">Un malentendido común</span><p>El Armagedón es una tercera guerra mundial nuclear librada en un campo de batalla localizado en el norte de Israel.</p></div>
  <div class="teach">
    <h2>Lo que enseña la Escritura</h2>
    <p class="illum">«Armagedón» significa «monte de Meguido». Meguido era una llanura real de Israel, famosa por batallas decisivas (Jueces 5:19; 2 Reyes 23:29). Pero en Meguido no hay ningún monte, y el nombre se da como símbolo, «en hebreo». Representa <strong>el lugar donde la rebelión del mundo hace su última resistencia</strong>, reunida por mentiras demoníacas (16:13–14).</p>
    <p>Fíjate en algo notable: la batalla nunca se describe peleándose. En el capítulo 16 se reúne a los reyes, y lo siguiente es: «Hecho está». En el capítulo 19 la bestia y los reyes están «reunidos para hacer guerra», y el Jinete simplemente los vence con la espada que sale de Su boca, que es Su palabra (19:15, 21). En el capítulo 20 Satanás reúne a las naciones «para la batalla», y «descendió fuego del cielo y los devoró» (20:9). Son tres vistas del mismo ataque final contra la iglesia, y cada una toma imágenes de la profecía de Ezequiel sobre Gog y Magog. Pablo dice lo mismo: el Señor matará al impío «con el espíritu de Su boca» (2 Tesalonicenses 2:8).</p>
  </div>
  <ol class="steps" aria-label="Una batalla, tres vistas">
    <li><span class="ref">16:14–16</span><b>«Para la batalla»</b><small>Los reyes reunidos en Armagedón; luego, «Hecho está»</small></li>
    <li><span class="ref">19:19–21</span><b>«Reunidos para hacer guerra»</b><small>La bestia y los reyes, vencidos por la espada de la boca de Cristo</small></li>
    <li><span class="ref">20:8–9</span><b>«Para la batalla»</b><small>Gog y Magog rodean a los santos; fuego del cielo</small></li>
    <li><span class="ref">2 Ts 2:8</span><b>Un solo aliento</b><small>El Señor destruye al impío en Su venida</small></li>
  </ol>
  <section class="evidence" aria-labelledby="ev-armageddon-es">
    <h2 id="ev-armageddon-es">¿Cómo lo sabemos?</h2>
    <details class="ev"><summary><span class="ev-n">01</span><span class="ev-ref">Apocalipsis 16:13–16</span><i class="tag stated">Declarado</i></summary><div class="ev-body"><p>Espíritus de demonios van a los reyes de todo el mundo «a reunirlos para la batalla del gran día del Dios Todopoderoso».</p><a href="https://www.biblegateway.com/passage/?search=Apocalipsis+16&amp;version=NBLA" target="_blank" rel="noopener">Leer Apocalipsis 16 ↗</a></div></details>
    <details class="ev"><summary><span class="ev-n">02</span><span class="ev-ref">Apocalipsis 19:15, 19–21</span><i class="tag stated">Declarado</i></summary><div class="ev-body"><p>«Los demás fueron muertos con la espada que salía de la boca de Aquel que montaba el caballo».</p><a href="https://www.biblegateway.com/passage/?search=Apocalipsis+19&amp;version=NBLA" target="_blank" rel="noopener">Leer Apocalipsis 19 ↗</a></div></details>
    <details class="ev"><summary><span class="ev-n">03</span><span class="ev-ref">Ezequiel 38–39 en Apocalipsis 19 y 20</span><i class="tag link">Conexión</i></summary><div class="ev-body"><p>El gran banquete de las aves (19:17–18) y Gog y Magog (20:8) vienen ambos de la única profecía de Ezequiel sobre el enemigo final.</p><a href="https://www.biblegateway.com/passage/?search=Ezequiel+39&amp;version=NBLA" target="_blank" rel="noopener">Leer Ezequiel 39 ↗</a></div></details>
    <details class="ev"><summary><span class="ev-n">04</span><span class="ev-ref">Jueces 5:19; 2 Reyes 23:29</span><i class="tag link">Conexión</i></summary><div class="ev-body"><p>Meguido se recordaba por sus batallas, de victoria y de desastre, lo que la hacía un símbolo adecuado.</p><a href="https://www.biblegateway.com/passage/?search=Jueces+5&amp;version=NBLA" target="_blank" rel="noopener">Leer Jueces 5 ↗</a></div></details>
  </section>
  <details class="alt"><summary>Cómo lo leen otros</summary><div class="alt-body"><div class="alt-grid">
    <article><h3>Una guerra literal en Israel</h3><p>Muchos futuristas esperan que los ejércitos del mundo se reúnan en el valle de Jezreel antes del regreso de Cristo, aparte de una rebelión posterior de Gog y Magog después del milenio.</p></article>
    <article class="ours"><h3>El ataque final, visto tres veces</h3><p>El Armagedón, la batalla del capítulo 19 y Gog y Magog son un mismo y último ataque contra la iglesia, al que Cristo pone fin al instante en Su venida.</p></article>
  </div></div></details>
  <aside class="lesson"><span class="rubric">La lección para recordar</span><p>El resultado no está en duda. La última batalla termina en el momento en que Cristo habla.</p></aside>
  <section class="quiz"><span class="rubric">Comprueba lo que aprendiste</span><h3>¿Cómo vence Cristo a los ejércitos en Apocalipsis 19?</h3><div class="quiz-options"><button class="quiz-opt" data-correct>Con la espada que sale de Su boca, Su palabra</button><button class="quiz-opt">Con armas modernas que le dan Sus seguidores</button><button class="quiz-opt">Después de una larga guerra de siete años</button></div><p class="quiz-feedback" hidden>«Los demás fueron muertos con la espada que salía de la boca de Aquel que montaba el caballo» (19:21). Cristo vence con Su palabra.</p></section>
</section>

<section class="page topic" id="rapture" data-nav="¿Y el arrebatamiento?" data-num="16" data-keywords="arrebatamiento rapto arrebatados encuentro del señor en el aire secreto dejados atrás 1 tesalonicenses 4 trompeta pretribulacional">
  <p class="eyebrow">Pregunta 16 · 1 Tesalonicenses 4</p>
  <h1>¿Y el arrebatamiento?</h1>
  <p class="deck">Salir al encuentro del Rey que regresa</p>
  <div class="locator" data-vision="6"></div>
  <ul class="refs" aria-label="Pasajes para leer"><li class="refs-label">Leer en la NBLA</li><li><a href="https://www.biblegateway.com/passage/?search=1+Tesalonicenses+4&amp;version=NBLA" target="_blank" rel="noopener">1 Tesalonicenses 4</a></li><li><a href="https://www.biblegateway.com/passage/?search=1+Corintios+15&amp;version=NBLA" target="_blank" rel="noopener">1 Corintios 15</a></li><li><a href="https://www.biblegateway.com/passage/?search=Mateo+24&amp;version=NBLA" target="_blank" rel="noopener">Mateo 24</a></li></ul>
  <blockquote class="passage"><span class="rubric">El texto</span><p>Pues el Señor mismo descenderá del cielo con voz de mando, con voz de arcángel y con la trompeta de Dios, y los muertos en Cristo se levantarán primero. Entonces nosotros, los que estemos vivos y que permanezcamos, seremos arrebatados juntamente con ellos en las nubes al encuentro del Señor en el aire, y así estaremos con el Señor siempre.</p><footer><cite>1 Tesalonicenses 4:16–17</cite><a href="https://www.biblegateway.com/passage/?search=1+Tesalonicenses+4&amp;version=NBLA" target="_blank" rel="noopener">Leer el capítulo ↗</a></footer></blockquote>
  <ol class="steps" aria-label="Lo que describe Pablo, en orden">
    <li><span class="ref">4:16</span><b>El Señor desciende</b><small>Voz de mando, voz de arcángel, trompeta de Dios</small></li>
    <li><span class="ref">4:16</span><b>Los muertos resucitan</b><small>«Los muertos en Cristo se levantarán primero»</small></li>
    <li><span class="ref">4:17</span><b>Los vivos son arrebatados</b><small>Juntamente con ellos, al encuentro del Señor</small></li>
    <li><span class="ref">4:17</span><b>Siempre con el Señor</b><small>Sin otra partida, sin otra espera</small></li>
  </ol>
  <div class="myth"><span class="rubric">Un malentendido común</span><p>Jesús se llevará en secreto a los cristianos, dejando al mundo desconcertado, y luego volverá públicamente siete años después.</p></div>
  <div class="teach">
    <h2>Lo que enseña la Escritura</h2>
    <p class="illum">La Biblia sí enseña un «arrebatamiento». Los creyentes que estén vivos cuando Cristo regrese «seremos arrebatados» para recibirlo. Pero Pablo lo describe como <strong>el suceso más ruidoso de la historia</strong>: voz de mando, voz de arcángel, la trompeta de Dios. Ocurre junto con la resurrección de los muertos y en «el día del Señor», que «vendrá así como un ladrón en la noche» para los desprevenidos (5:2). Pablo llama a la misma trompeta «la trompeta final» (1 Corintios 15:52), y Jesús dice que Sus ángeles reunirán a Sus escogidos «con una gran trompeta» cuando todas las tribus de la tierra lo vean venir «sobre las nubes del cielo con poder y gran gloria» (Mateo 24:30–31).</p>
    <p>La expresión «al encuentro» que usa Pablo se empleaba cuando los ciudadanos salían de una ciudad para recibir a un rey que llegaba y escoltarlo de vuelta. Esa es la imagen. No nos vamos con Cristo al cielo mientras el mundo sigue su curso. Salimos a recibir a nuestro Rey y venimos con Él cuando llega para juzgar al mundo y hacerlo nuevo. Hay <strong>un solo regreso, no dos</strong>.</p>
  </div>
  <section class="evidence" aria-labelledby="ev-rapture-es">
    <h2 id="ev-rapture-es">¿Cómo lo sabemos?</h2>
    <details class="ev"><summary><span class="ev-n">01</span><span class="ev-ref">1 Tesalonicenses 4:16–5:2</span><i class="tag stated">Declarado</i></summary><div class="ev-body"><p>El arrebatamiento es público, va acompañado de la resurrección y pertenece a «el día del Señor».</p><a href="https://www.biblegateway.com/passage/?search=1+Tesalonicenses+5&amp;version=NBLA" target="_blank" rel="noopener">Leer 1 Tesalonicenses 5 ↗</a></div></details>
    <details class="ev"><summary><span class="ev-n">02</span><span class="ev-ref">1 Corintios 15:51–52</span><i class="tag link">Conexión</i></summary><div class="ev-body"><p>Los creyentes son transformados «a la trompeta final», cuando los muertos resucitan. No hay trompeta después de la final.</p><a href="https://www.biblegateway.com/passage/?search=1+Corintios+15&amp;version=NBLA" target="_blank" rel="noopener">Leer 1 Corintios 15 ↗</a></div></details>
    <details class="ev"><summary><span class="ev-n">03</span><span class="ev-ref">Mateo 24:30–31</span><i class="tag link">Conexión</i></summary><div class="ev-body"><p>La reunión de los escogidos ocurre cuando Cristo viene visiblemente «sobre las nubes del cielo con poder y gran gloria».</p><a href="https://www.biblegateway.com/passage/?search=Mateo+24&amp;version=NBLA" target="_blank" rel="noopener">Leer Mateo 24 ↗</a></div></details>
    <details class="ev"><summary><span class="ev-n">04</span><span class="ev-ref">Apocalipsis 3:10; 4:1</span><i class="tag caution">Precaución</i></summary><div class="ev-body"><p>Estos versículos se citan a menudo a favor de un arrebatamiento antes de la tribulación, pero 3:10 promete protección en la prueba (compara Juan 17:15) y 4:1 llama solo a Juan a entrar en la visión.</p><a href="https://www.biblegateway.com/passage/?search=Apocalipsis+3&amp;version=NBLA" target="_blank" rel="noopener">Leer Apocalipsis 3 ↗</a></div></details>
  </section>
  <details class="alt"><summary>Cómo lo leen otros</summary><div class="alt-body"><div class="alt-grid">
    <article><h3>Un arrebatamiento antes de la tribulación</h3><p>Los dispensacionalistas enseñan que Cristo viene en secreto por Su iglesia antes de una tribulación de siete años, y luego con Su iglesia de manera visible.</p></article>
    <article class="ours"><h3>Un solo regreso visible</h3><p>Los creyentes son arrebatados para recibir a Cristo en Su única y gloriosa venida, a la trompeta final, junto con la resurrección de los muertos.</p></article>
  </div></div></details>
  <aside class="lesson"><span class="rubric">La lección para recordar</span><p>Nuestra esperanza no es escapar sino encontrarnos con Él: el regreso visible de nuestro Salvador, y estar con Él para siempre.</p></aside>
  <section class="quiz"><span class="rubric">Comprueba lo que aprendiste</span><h3>¿Cuál de estas cosas dice Pablo que acompañará el arrebatamiento de los creyentes?</h3><div class="quiz-options"><button class="quiz-opt" data-correct>Voz de mando, voz de arcángel y la trompeta de Dios</button><button class="quiz-opt">Silencio total, para que nadie lo note</button><button class="quiz-opt">Siete años de señales de advertencia antes</button></div><p class="quiz-feedback" hidden>La descripción de Pablo es todo menos secreta (1 Tesalonicenses 4:16). El mundo entero sabrá que el Rey ha llegado.</p></section>
</section>

<section class="page topic" id="second-coming" data-nav="¿Qué pasa cuando Jesús regrese?" data-num="17" data-keywords="segunda venida regreso de cristo caballo blanco fiel y verdadero juicio resurrección apocalipsis 19 un solo día">
  <p class="eyebrow">Pregunta 17 · Apocalipsis 19:11–21</p>
  <h1>¿Qué pasa cuando Jesús regrese?</h1>
  <p class="deck">El Rey viene, y todo queda resuelto</p>
  <div class="locator" data-vision="1,2,3,4,5,6,7"></div>
  <ul class="refs" aria-label="Pasajes para leer"><li class="refs-label">Leer en la NBLA</li><li><a href="https://www.biblegateway.com/passage/?search=Apocalipsis+19&amp;version=NBLA" target="_blank" rel="noopener">Apocalipsis 19</a></li><li><a href="https://www.biblegateway.com/passage/?search=Apocalipsis+20&amp;version=NBLA" target="_blank" rel="noopener">Apocalipsis 20</a></li><li><a href="https://www.biblegateway.com/passage/?search=Juan+5&amp;version=NBLA" target="_blank" rel="noopener">Juan 5</a></li><li><a href="https://www.biblegateway.com/passage/?search=Mateo+25&amp;version=NBLA" target="_blank" rel="noopener">Mateo 25</a></li></ul>
  <blockquote class="passage"><span class="rubric">El texto</span><p>Vi el cielo abierto, y apareció un caballo blanco. El que lo montaba se llama Fiel y Verdadero. Con justicia juzga y hace la guerra.</p><footer><cite>Apocalipsis 19:11</cite><a href="https://www.biblegateway.com/passage/?search=Apocalipsis+19&amp;version=NBLA" target="_blank" rel="noopener">Leer el capítulo ↗</a></footer></blockquote>
  <div class="myth"><span class="rubric">Un malentendido común</span><p>El regreso de Cristo es un paso dentro de una larga serie de etapas futuras: una venida secreta, una tribulación, una venida pública, un reino de mil años y luego otra resurrección y otro juicio.</p></div>
  <div class="teach">
    <h2>Lo que enseña la Escritura</h2>
    <p class="illum">Cada una de las siete visiones del Apocalipsis termina en el mismo lugar, porque al final de la era hay un solo gran suceso. Cristo vendrá otra vez <strong>de manera visible</strong>: «todo ojo lo verá» (1:7). Vendrá <strong>en gloria</strong>, con el nombre escrito: «REY DE REYES Y SEÑOR DE SEÑORES» (19:16). Y en ese único día se cumple todo lo que la Biblia promete acerca del fin.</p>
    <p>Jesús dijo que «viene la hora en que todos los que están en los sepulcros oirán Su voz, y saldrán», tanto los que hicieron lo bueno como los que practicaron lo malo (Juan 5:28–29). Las naciones serán reunidas delante de Su trono y separadas como ovejas y cabritos (Mateo 25:31–32). La muerte, «el último enemigo», será eliminada (1 Corintios 15:26). Y el cielo y la tierra serán hechos nuevos (2 Pedro 3:13). Las confesiones reformadas lo resumen como una resurrección general y un juicio final. No sabemos el día: «de aquel día y hora nadie sabe» (Mateo 24:36). Así que el llamado no es a calcular, sino a estar preparados.</p>
  </div>
  <ol class="steps" aria-label="El único día del regreso de Cristo">
    <li><span class="ref">Ap 1:7; 19:11</span><b>Cristo aparece</b><small>Visible, glorioso, ante todo ojo</small></li>
    <li><span class="ref">Juan 5:28–29</span><b>Todos los muertos resucitan</b><small>Justos e injustos, en una sola hora</small></li>
    <li><span class="ref">Ap 20:11–15</span><b>El juicio final</b><small>Toda persona ante el gran trono blanco</small></li>
    <li><span class="ref">Ap 21:1–5</span><b>Todo hecho nuevo</b><small>Un cielo nuevo y una tierra nueva</small></li>
  </ol>
  <section class="evidence" aria-labelledby="ev-return-es">
    <h2 id="ev-return-es">¿Cómo lo sabemos?</h2>
    <details class="ev"><summary><span class="ev-n">01</span><span class="ev-ref">Apocalipsis 19:11–16</span><i class="tag stated">Declarado</i></summary><div class="ev-body"><p>Cristo es el Jinete, «Fiel y Verdadero», cuyo nombre es «El Verbo de Dios», «REY DE REYES Y SEÑOR DE SEÑORES».</p><a href="https://www.biblegateway.com/passage/?search=Apocalipsis+19&amp;version=NBLA" target="_blank" rel="noopener">Leer Apocalipsis 19 ↗</a></div></details>
    <details class="ev"><summary><span class="ev-n">02</span><span class="ev-ref">Juan 5:28–29; Hechos 24:15</span><i class="tag stated">Declarado</i></summary><div class="ev-body"><p>Una misma hora venidera trae la resurrección de justos e injustos.</p><a href="https://www.biblegateway.com/passage/?search=Juan+5&amp;version=NBLA" target="_blank" rel="noopener">Leer Juan 5 ↗</a></div></details>
    <details class="ev"><summary><span class="ev-n">03</span><span class="ev-ref">1 Corintios 15:23–26</span><i class="tag link">Conexión</i></summary><div class="ev-body"><p>«Luego los que son de Cristo en Su venida. Entonces vendrá el fin». Cristo reina ahora, pues «debe reinar hasta que haya puesto a todos Sus enemigos debajo de Sus pies», y la muerte es el último enemigo en ser eliminado.</p><a href="https://www.biblegateway.com/passage/?search=1+Corintios+15&amp;version=NBLA" target="_blank" rel="noopener">Leer 1 Corintios 15 ↗</a></div></details>
    <details class="ev"><summary><span class="ev-n">04</span><span class="ev-ref">Mateo 24:36</span><i class="tag caution">Precaución</i></summary><div class="ev-body"><p>Nadie sabe el día ni la hora. Todo intento de fijar una fecha se ha equivocado.</p><a href="https://www.biblegateway.com/passage/?search=Mateo+24&amp;version=NBLA" target="_blank" rel="noopener">Leer Mateo 24 ↗</a></div></details>
  </section>
  <details class="alt"><summary>Cómo lo leen otros</summary><div class="alt-body"><div class="alt-grid">
    <article><h3>Etapas e intervalos</h3><p>Las posturas premileniales colocan mil años entre el regreso de Cristo y el juicio final, con la resurrección de creyentes y no creyentes separada por ese período.</p></article>
    <article class="ours"><h3>Un solo día del Señor</h3><p>El regreso de Cristo, la resurrección de todos, el juicio final y la nueva creación van juntos como un solo gran suceso.</p></article>
  </div></div></details>
  <aside class="lesson"><span class="rubric">La lección para recordar</span><p>Para los que le pertenecen, el regreso de Cristo no es una amenaza, sino su gran esperanza.</p></aside>
  <section class="quiz"><span class="rubric">Comprueba lo que aprendiste</span><h3>Según Juan 5:28–29, ¿quiénes resucitarán cuando llegue la hora?</h3><div class="quiz-options"><button class="quiz-opt" data-correct>Todos los que están en los sepulcros, justos e injustos</button><button class="quiz-opt">Solo los creyentes; los no creyentes mil años después</button><button class="quiz-opt">Solo los que estén vivos en ese momento</button></div><p class="quiz-feedback" hidden>Jesús habla de una sola hora en que «todos los que están en los sepulcros oirán Su voz, y saldrán» (Juan 5:28–29).</p></section>
</section>

<section class="page topic" id="millennium" data-nav="¿Qué es el milenio?" data-num="18" data-keywords="milenio mil años satanás atado abismo cadena reinado amilenial apocalipsis 20 reino">
  <p class="eyebrow">Pregunta 18 · Apocalipsis 20:1–10</p>
  <h1>¿Qué es el milenio?</h1>
  <p class="deck">Un Rey que reina ahora</p>
  <div class="locator" data-vision="7"></div>
  <ul class="refs" aria-label="Pasajes para leer"><li class="refs-label">Leer en la NBLA</li><li><a href="https://www.biblegateway.com/passage/?search=Apocalipsis+20&amp;version=NBLA" target="_blank" rel="noopener">Apocalipsis 20</a></li><li><a href="https://www.biblegateway.com/passage/?search=Mateo+12&amp;version=NBLA" target="_blank" rel="noopener">Mateo 12</a></li><li><a href="https://www.biblegateway.com/passage/?search=Efesios+1&amp;version=NBLA" target="_blank" rel="noopener">Efesios 1</a></li><li><a href="https://www.biblegateway.com/passage/?search=Mateo+28&amp;version=NBLA" target="_blank" rel="noopener">Mateo 28</a></li></ul>
  <figure class="art"><img data-art src="https://commons.wikimedia.org/wiki/Special:FilePath/Albrecht_D%C3%BCrer,_The_Angel_with_the_Key_to_the_Bottomless_Pit,_probably_c._1496-1498,_NGA_6685.jpg?width=1000" alt="Grabado: un ángel encierra al dragón encadenado en el abismo mientras otro ángel le muestra a Juan la nueva Jerusalén sobre un monte." loading="lazy" decoding="async" width="1000" height="1400"><figcaption><b>El ángel con la llave del abismo</b>, Alberto Durero, hacia 1496–98. El último grabado de la serie: Satanás atado y la ciudad santa a la vista. Obra histórica, no un retrato literal de la visión.</figcaption></figure>
  <blockquote class="passage"><span class="rubric">El texto</span><p>El ángel prendió al dragón, la serpiente antigua, que es el Diablo y Satanás, y lo ató por mil años. Lo arrojó al abismo, y lo encerró y puso un sello sobre él para que no engañara más a las naciones, hasta que se cumplieran los mil años. Después de esto debe ser desatado por un poco de tiempo.</p><footer><cite>Apocalipsis 20:2–3</cite><a href="https://www.biblegateway.com/passage/?search=Apocalipsis+20&amp;version=NBLA" target="_blank" rel="noopener">Leer el capítulo ↗</a></footer></blockquote>
  <div class="myth"><span class="rubric">Un malentendido común</span><p>Jesús todavía no reina como Rey. Su reino comienza solo después de que regrese y establezca un Estado político de mil años en la tierra.</p></div>
  <div class="teach">
    <h2>Lo que enseña la Escritura</h2>
    <p class="illum">El capítulo 20 es la séptima visión y, como cada una de las anteriores, vuelve a empezar en la primera venida de Cristo. El atar a Satanás no es un suceso futuro. Jesús lo describió durante Su ministerio: «¿O cómo puede alguien entrar en la casa de un hombre fuerte y saquear sus bienes, si primero no lo ata?» (Mateo 12:29). Observa <strong>qué</strong> se le impide hacer a Satanás: «para que no engañara más a las naciones» (20:3). Durante siglos las naciones estuvieron en tinieblas mientras la verdad de Dios se limitaba en gran medida a Israel. Desde la cruz, el evangelio ha salido a todos los pueblos, y Satanás no puede detenerlo.</p>
    <p>Los <strong>mil años</strong> son, por lo tanto, toda la era entre las dos venidas de Cristo: un período largo y completo (diez × diez × diez), no un cronómetro. Durante ese tiempo las almas de los creyentes que han muerto «volvieron a la vida y reinaron con Cristo» en el cielo (20:4), y en la tierra Cristo reina ahora: «Toda autoridad me ha sido dada en el cielo y en la tierra» (Mateo 28:18). Al final, Satanás es desatado «por un poco de tiempo», reúne a las naciones para la misma batalla final que vimos en los capítulos 16 y 19, y es arrojado al lago de fuego. Esta es la lectura amilenial de las confesiones reformadas. <em>Amilenial</em> no significa «sin milenio». Significa que no hay un milenio terrenal futuro y separado: el milenio es ahora.</p>
  </div>
  <div class="mill-inline">
    <div class="mill-track" role="img" aria-label="Cronología: primera venida y Satanás atado, los mil años del reinado de Cristo, una breve liberación, el regreso de Cristo, la nueva creación">
      <div class="mill-seg event" style="--w:.9"><i></i><b>Primera venida</b><small>Satanás atado · 20:1–3</small></div>
      <div class="mill-seg reign" style="--w:3"><i></i><b>Los mil años</b><small>Cristo reina; el evangelio a las naciones · 20:4–6</small></div>
      <div class="mill-seg event" style="--w:.9"><i></i><b>Breve liberación</b><small>Rebelión final · 20:7–9</small></div>
      <div class="mill-seg final" style="--w:1.2"><i></i><b>Cristo regresa</b><small>Juicio, nueva creación · 20:10–22:5</small></div>
    </div>
  </div>
  <section class="evidence" aria-labelledby="ev-mill-es">
    <h2 id="ev-mill-es">¿Cómo lo sabemos?</h2>
    <details class="ev"><summary><span class="ev-n">01</span><span class="ev-ref">Apocalipsis 20:3</span><i class="tag stated">Declarado</i></summary><div class="ev-body"><p>El atar a Satanás tiene un propósito declarado: «para que no engañara más a las naciones». No dice que no pueda hacer absolutamente nada.</p><a href="https://www.biblegateway.com/passage/?search=Apocalipsis+20&amp;version=NBLA" target="_blank" rel="noopener">Leer Apocalipsis 20 ↗</a></div></details>
    <details class="ev"><summary><span class="ev-n">02</span><span class="ev-ref">Mateo 12:28–29; Juan 12:31–32</span><i class="tag link">Conexión</i></summary><div class="ev-body"><p>Jesús dice que el hombre fuerte está siendo atado en Su ministerio, y que, cuando sea levantado en la cruz, «atraeré a todos a Mí mismo», mientras el príncipe de este mundo es echado fuera.</p><a href="https://www.biblegateway.com/passage/?search=Mateo+12&amp;version=NBLA" target="_blank" rel="noopener">Leer Mateo 12 ↗</a></div></details>
    <details class="ev"><summary><span class="ev-n">03</span><span class="ev-ref">Efesios 1:20–22; 1 Corintios 15:25</span><i class="tag link">Conexión</i></summary><div class="ev-body"><p>Cristo ya está sentado «muy por encima de todo principado, autoridad, poder, dominio», y «debe reinar hasta que haya puesto a todos Sus enemigos debajo de Sus pies». Su reinado es presente.</p><a href="https://www.biblegateway.com/passage/?search=Efesios+1&amp;version=NBLA" target="_blank" rel="noopener">Leer Efesios 1 ↗</a></div></details>
    <details class="ev"><summary><span class="ev-n">04</span><span class="ev-ref">Apocalipsis 20:8 con 16:14 y 19:19</span><i class="tag inference">Inferencia</i></summary><div class="ev-body"><p>La reunión «para la batalla» en 20:8 coincide con 16:14 y 19:19, y toma imágenes de la misma profecía de Ezequiel que 19:17–18. Por eso el capítulo 20 recapitula, en lugar de seguir, al capítulo 19.</p><a href="https://www.biblegateway.com/passage/?search=Apocalipsis+20&amp;version=NBLA" target="_blank" rel="noopener">Leer Apocalipsis 20 ↗</a></div></details>
    <details class="ev"><summary><span class="ev-n">05</span><span class="ev-ref">Satanás sigue activo</span><i class="tag caution">Precaución</i></summary><div class="ev-body"><p>El Nuevo Testamento también dice que el diablo anda al acecho (1 Pedro 5:8) y ciega a los incrédulos (2 Corintios 4:4). Estar atado en un aspecto, sin poder impedir que el evangelio llegue a las naciones, no es estar inactivo en todos.</p></div></details>
  </section>
  <details class="alt"><summary>Cómo lo leen otros</summary><div class="alt-body"><div class="alt-grid">
    <article><h3>Premilenial</h3><p>Cristo regresa antes de un reinado futuro de mil años en la tierra; los capítulos 19 y 20 se leen en secuencia.</p></article>
    <article><h3>Posmilenial</h3><p>Una era dorada de éxito del evangelio llega dentro de la historia antes del regreso de Cristo.</p></article>
  </div><p class="alt-intro" style="margin:14px 0 0">La comparación completa está en <a href="#mill-study">Cómo interpretar el Apocalipsis</a>.</p></div></details>
  <aside class="lesson"><span class="rubric">La lección para recordar</span><p>No estamos esperando que Jesús llegue a ser Rey. Él reina ahora, y el evangelio llega a las naciones porque el hombre fuerte está atado.</p></aside>
  <section class="quiz"><span class="rubric">Comprueba lo que aprendiste</span><h3>Según Apocalipsis 20:3, ¿qué no puede hacer Satanás mientras está atado?</h3><div class="quiz-options"><button class="quiz-opt" data-correct>Engañar a las naciones</button><button class="quiz-opt">Tentar a nadie en absoluto</button><button class="quiz-opt">Existir en ningún lugar de la tierra</button></div><p class="quiz-feedback" hidden>El atar es específico: «para que no engañara más a las naciones» (20:3). Desde la cruz, el evangelio llega a todos los pueblos.</p></section>
</section>

<section class="page topic" id="resurrection" data-nav="¿Qué es la primera resurrección?" data-num="19" data-keywords="primera resurrección muerte segunda almas reinan tronos estado intermedio apocalipsis 20 4 6 lago de fuego">
  <p class="eyebrow">Pregunta 19 · Apocalipsis 20:4–6</p>
  <h1>¿Qué es la primera resurrección?</h1>
  <p class="deck">Vivos con Cristo, aun en la muerte</p>
  <div class="locator" data-vision="7"></div>
  <ul class="refs" aria-label="Pasajes para leer"><li class="refs-label">Leer en la NBLA</li><li><a href="https://www.biblegateway.com/passage/?search=Apocalipsis+20&amp;version=NBLA" target="_blank" rel="noopener">Apocalipsis 20</a></li><li><a href="https://www.biblegateway.com/passage/?search=Apocalipsis+6&amp;version=NBLA" target="_blank" rel="noopener">Apocalipsis 6</a></li><li><a href="https://www.biblegateway.com/passage/?search=Filipenses+1&amp;version=NBLA" target="_blank" rel="noopener">Filipenses 1</a></li><li><a href="https://www.biblegateway.com/passage/?search=Juan+5&amp;version=NBLA" target="_blank" rel="noopener">Juan 5</a></li></ul>
  <figure class="art"><img data-art src="https://commons.wikimedia.org/wiki/Special:FilePath/Cloisters_Apocalypse_-_New_Jerusalem_and_angel.jpg?width=1000" alt="Iluminación medieval: un ángel muestra a Juan la nueva Jerusalén, dibujada como una ciudad amurallada con puertas enjoyadas." loading="lazy" decoding="async" width="1000" height="1200"><figcaption><b>La nueva Jerusalén y el ángel</b>, Apocalipsis de The Cloisters, hacia 1330. Obra histórica, no un retrato literal de la visión.</figcaption></figure>
  <blockquote class="passage"><span class="rubric">El texto</span><p>Bienaventurado y santo es el que tiene parte en la primera resurrección. La muerte segunda no tiene poder sobre estos sino que serán sacerdotes de Dios y de Cristo, y reinarán con Él por mil años.</p><footer><cite>Apocalipsis 20:6</cite><a href="https://www.biblegateway.com/passage/?search=Apocalipsis+20&amp;version=NBLA" target="_blank" rel="noopener">Leer el capítulo ↗</a></footer></blockquote>
  <div class="myth"><span class="rubric">Un malentendido común</span><p>Los creyentes resucitan corporalmente mil años antes que los incrédulos, así que hay dos resurrecciones corporales separadas por el milenio.</p></div>
  <div class="teach">
    <h2>Lo que enseña la Escritura</h2>
    <p class="illum">Fíjate en quiénes ve Juan: «las <strong>almas</strong> de los que habían sido decapitados por causa del testimonio de Jesús» (20:4). Eso recuerda el quinto sello, donde Juan vio «las almas de los que habían sido muertos» debajo del altar, esperando y clamando «¿Hasta cuándo?» (6:9–11). Ahora se les ve en tronos, viviendo y reinando con Cristo. Esto es lo que le sucede a todo creyente al morir: «el deseo de partir y estar con Cristo, pues eso es mucho mejor» (Filipenses 1:23). Prefieren «estar ausentes del cuerpo y habitar con el Señor» (2 Corintios 5:8).</p>
    <p>El Apocalipsis usa un patrón intencional. Para los creyentes, la <em>primera muerte</em> (la muerte física) conduce a la <strong>primera resurrección</strong>, la vida y el reinado con Cristo en el cielo. Luego, al final, viene la resurrección corporal de todos, en la única hora de la que habló Jesús (Juan 5:28–29). Para los incrédulos, la vida física va seguida de la <strong>muerte segunda</strong>: «Esta es la muerte segunda: el lago de fuego» (20:14). El propósito del pasaje es consolar a una iglesia perseguida: los que pierden la vida por Cristo no han perdido. Reinan.</p>
  </div>
  <div class="pair-cards">
    <article class="dark"><span class="ref">20:4–6 · 6:9–11 · Fil 1:23</span><h3>El creyente</h3><p>La primera muerte, luego la primera resurrección: vivo y reinando con Cristo. «La muerte segunda no tiene poder sobre estos».</p></article>
    <article class="red"><span class="ref">20:5, 12–15 · 21:8</span><h3>El incrédulo</h3><p>La vida física, luego el juicio en el último día, y la muerte segunda: el lago de fuego.</p></article>
  </div>
  <section class="evidence" aria-labelledby="ev-res-es">
    <h2 id="ev-res-es">¿Cómo lo sabemos?</h2>
    <details class="ev"><summary><span class="ev-n">01</span><span class="ev-ref">Apocalipsis 20:4</span><i class="tag stated">Declarado</i></summary><div class="ev-body"><p>Juan ve almas, no cuerpos, en tronos: los decapitados por su testimonio y los que no adoraron a la bestia.</p><a href="https://www.biblegateway.com/passage/?search=Apocalipsis+20&amp;version=NBLA" target="_blank" rel="noopener">Leer Apocalipsis 20 ↗</a></div></details>
    <details class="ev"><summary><span class="ev-n">02</span><span class="ev-ref">Apocalipsis 6:9–11</span><i class="tag link">Conexión</i></summary><div class="ev-body"><p>Las mismas almas de los mártires aparecen debajo del altar en el quinto sello. En el capítulo 20 su espera se muestra como reinado.</p><a href="https://www.biblegateway.com/passage/?search=Apocalipsis+6&amp;version=NBLA" target="_blank" rel="noopener">Leer Apocalipsis 6 ↗</a></div></details>
    <details class="ev"><summary><span class="ev-n">03</span><span class="ev-ref">Juan 5:28–29; Hechos 24:15</span><i class="tag link">Conexión</i></summary><div class="ev-body"><p>La resurrección corporal de justos e injustos ocurre junta, en una sola hora. Eso descarta dos resurrecciones corporales separadas por mil años.</p><a href="https://www.biblegateway.com/passage/?search=Juan+5&amp;version=NBLA" target="_blank" rel="noopener">Leer Juan 5 ↗</a></div></details>
    <details class="ev"><summary><span class="ev-n">04</span><span class="ev-ref">Apocalipsis 20:14; 21:8</span><i class="tag stated">Declarado</i></summary><div class="ev-body"><p>«Esta es la muerte segunda: el lago de fuego». El par «primera» y «segunda» es del propio Apocalipsis.</p><a href="https://www.biblegateway.com/passage/?search=Apocalipsis+21&amp;version=NBLA" target="_blank" rel="noopener">Leer Apocalipsis 21 ↗</a></div></details>
    <details class="ev"><summary><span class="ev-n">05</span><span class="ev-ref">¿El nuevo nacimiento?</span><i class="tag caution">Precaución</i></summary><div class="ev-body"><p>Agustín leyó la primera resurrección como el nuevo nacimiento, cuando los muertos espirituales «oirán la voz del Hijo de Dios, y los que oigan vivirán» (Juan 5:25). Muchos amilenialistas, entre ellos Warfield, Hoekema y Riddlebarger, prefieren la lectura de arriba, ya que 20:4 describe las almas de los que han muerto. Ambas lecturas sitúan la primera resurrección en la era presente.</p></div></details>
  </section>
  <details class="alt"><summary>Cómo lo leen otros</summary><div class="alt-body"><div class="alt-grid">
    <article><h3>Dos resurrecciones corporales</h3><p>Los premilenialistas leen «volvieron a la vida» como la resurrección corporal de los creyentes antes del milenio, y la de los demás después de él.</p></article>
    <article class="ours"><h3>Vida con Cristo ahora, el cuerpo después</h3><p>La primera resurrección es la entrada del creyente a la vida y el reinado con Cristo al morir; el cuerpo resucita con todos los demás en el último día.</p></article>
  </div></div></details>
  <aside class="lesson"><span class="rubric">La lección para recordar</span><p>Para el cristiano, la muerte no es el fin de la vida, sino el comienzo de reinar con Cristo.</p></aside>
  <section class="quiz"><span class="rubric">Comprueba lo que aprendiste</span><h3>En Apocalipsis 20:4, ¿qué ve Juan sobre los tronos?</h3><div class="quiz-options"><button class="quiz-opt" data-correct>Las almas de los que murieron por su testimonio</button><button class="quiz-opt">Gobernantes políticos de un reino terrenal futuro</button><button class="quiz-opt">Ángeles que nunca vivieron en la tierra</button></div><p class="quiz-feedback" hidden>Juan ve «las almas de los que habían sido decapitados por causa del testimonio de Jesús» (20:4), los mismos mártires que vio debajo del altar en 6:9.</p></section>
</section>

<section class="page topic" id="new-creation" data-nav="¿Qué es la nueva Jerusalén?" data-num="20" data-keywords="nueva jerusalén cielo nuevo tierra nueva ciudad santa novia edén árbol de la vida río apocalipsis 21 22 estado eterno">
  <p class="eyebrow">Pregunta 20 · Apocalipsis 21–22</p>
  <h1>¿Qué es la nueva Jerusalén?</h1>
  <p class="deck">Dios hace nuevas todas las cosas</p>
  <div class="locator" data-vision="7"></div>
  <ul class="refs" aria-label="Pasajes para leer"><li class="refs-label">Leer en la NBLA</li><li><a href="https://www.biblegateway.com/passage/?search=Apocalipsis+21&amp;version=NBLA" target="_blank" rel="noopener">Apocalipsis 21</a></li><li><a href="https://www.biblegateway.com/passage/?search=Apocalipsis+22&amp;version=NBLA" target="_blank" rel="noopener">Apocalipsis 22</a></li><li><a href="https://www.biblegateway.com/passage/?search=Isa%C3%ADas+65&amp;version=NBLA" target="_blank" rel="noopener">Isaías 65</a></li><li><a href="https://www.biblegateway.com/passage/?search=Romanos+8&amp;version=NBLA" target="_blank" rel="noopener">Romanos 8</a></li></ul>
  <figure class="art"><img data-art src="https://commons.wikimedia.org/wiki/Special:FilePath/Saint-Sever_Beatus_f._207v-208r_-_New_Jerusalem.jpg?width=1000" alt="Iluminación medieval: la nueva Jerusalén como una ciudad cuadrada con doce puertas, cada una con un apóstol, y el Cordero en el centro." loading="lazy" decoding="async" width="1000" height="700"><figcaption><b>La nueva Jerusalén</b>, Beato de Saint-Sever, siglo XI. Doce puertas, doce apóstoles y el Cordero en el centro. Obra histórica, no un retrato literal de la visión.</figcaption></figure>
  <blockquote class="passage"><span class="rubric">El texto</span><p>Entonces oí una gran voz que decía desde el trono: «El tabernáculo de Dios está entre los hombres, y Él habitará entre ellos y ellos serán Su pueblo, y Dios mismo estará entre ellos». Él enjugará toda lágrima de sus ojos, y ya no habrá muerte, ni habrá más duelo, ni clamor, ni dolor, porque las primeras cosas han pasado.</p><footer><cite>Apocalipsis 21:3–4</cite><a href="https://www.biblegateway.com/passage/?search=Apocalipsis+21&amp;version=NBLA" target="_blank" rel="noopener">Leer el capítulo ↗</a></footer></blockquote>
  <div class="myth"><span class="rubric">Un malentendido común</span><p>La esperanza cristiana es flotar para siempre como un espíritu entre las nubes, lejos del mundo físico.</p></div>
  <div class="teach">
    <h2>Lo que enseña la Escritura</h2>
    <p class="illum">El Apocalipsis no termina con un escape de la creación, sino con la creación renovada: «un cielo nuevo y una tierra nueva» (21:1). La ciudad <strong>desciende</strong> «del cielo, de Dios» a la tierra. La creación misma «será también liberada de la esclavitud de la corrupción» (Romanos 8:21), y los cuerpos del pueblo de Dios resucitarán. El ángel le dice a Juan: «Ven, te mostraré la novia, la esposa del Cordero», y lo que le muestra es la ciudad santa (21:9–10). La ciudad es el pueblo de Dios, por fin perfectamente en casa con Él.</p>
    <p>Cada detalle dice lo mismo: <strong>Dios habita con Su pueblo.</strong> La ciudad es un cubo perfecto, pues «su longitud, anchura, y altura son iguales» (21:16), la forma del Lugar Santísimo en el templo de Salomón (1 Reyes 6:20); así que toda la ciudad es ahora el lugar de la presencia de Dios. Por eso Juan dice: «No vi en ella templo alguno, porque su templo es el Señor, el Dios Todopoderoso, y el Cordero» (21:22). El río de agua de vida y el árbol de la vida vuelven del Edén (22:1–2), y «ya no habrá más maldición». La historia de la Biblia, que empezó en un huerto, termina en una ciudad-huerto donde «ellos verán Su rostro» (22:4).</p>
  </div>
  <section class="evidence" aria-labelledby="ev-new-es">
    <h2 id="ev-new-es">¿Cómo lo sabemos?</h2>
    <details class="ev"><summary><span class="ev-n">01</span><span class="ev-ref">Apocalipsis 21:1–4</span><i class="tag stated">Declarado</i></summary><div class="ev-body"><p>Un cielo nuevo y una tierra nueva, la ciudad que desciende, Dios que habita entre los hombres, y el fin de la muerte y del duelo.</p><a href="https://www.biblegateway.com/passage/?search=Apocalipsis+21&amp;version=NBLA" target="_blank" rel="noopener">Leer Apocalipsis 21 ↗</a></div></details>
    <details class="ev"><summary><span class="ev-n">02</span><span class="ev-ref">Apocalipsis 21:9–10</span><i class="tag stated">Declarado</i></summary><div class="ev-body"><p>El ángel promete mostrar «la novia» y muestra la ciudad santa: la ciudad es el pueblo de Dios.</p><a href="https://www.biblegateway.com/passage/?search=Apocalipsis+21&amp;version=NBLA" target="_blank" rel="noopener">Leer Apocalipsis 21 ↗</a></div></details>
    <details class="ev"><summary><span class="ev-n">03</span><span class="ev-ref">Apocalipsis 21:16, 22; 1 Reyes 6:20</span><i class="tag link">Conexión</i></summary><div class="ev-body"><p>La ciudad en forma de cubo coincide con el santuario interior del templo, y no hay templo porque Dios y el Cordero son su templo.</p><a href="https://www.biblegateway.com/passage/?search=1+Reyes+6&amp;version=NBLA" target="_blank" rel="noopener">Leer 1 Reyes 6 ↗</a></div></details>
    <details class="ev"><summary><span class="ev-n">04</span><span class="ev-ref">Apocalipsis 22:1–5; Génesis 2–3</span><i class="tag link">Conexión</i></summary><div class="ev-body"><p>El río, el árbol de la vida y el fin de la maldición devuelven el Edén, y lo superan.</p><a href="https://www.biblegateway.com/passage/?search=Apocalipsis+22&amp;version=NBLA" target="_blank" rel="noopener">Leer Apocalipsis 22 ↗</a></div></details>
    <details class="ev"><summary><span class="ev-n">05</span><span class="ev-ref">Romanos 8:19–23; 2 Pedro 3:13</span><i class="tag inference">Inferencia</i></summary><div class="ev-body"><p>La creación es liberada, no desechada. Leer «nuevo» como renovación y no como reemplazo es como la tradición reformada ha entendido en general estos textos, aunque algunos leen 2 Pedro 3:10 como una disolución más completa.</p><a href="https://www.biblegateway.com/passage/?search=Romanos+8&amp;version=NBLA" target="_blank" rel="noopener">Leer Romanos 8 ↗</a></div></details>
  </section>
  <aside class="lesson"><span class="rubric">La lección para recordar</span><p>La última palabra no es destrucción. Es vida con Dios, cara a cara, para siempre. «Ven, Señor Jesús».</p></aside>
  <section class="quiz"><span class="rubric">Comprueba lo que aprendiste</span><h3>¿Por qué no hay templo en la nueva Jerusalén?</h3><div class="quiz-options"><button class="quiz-opt" data-correct>Porque su templo es el Señor, el Dios Todopoderoso, y el Cordero</button><button class="quiz-opt">Porque la adoración ha terminado</button><button class="quiz-opt">Porque la ciudad no está terminada</button></div><p class="quiz-feedback" hidden>«No vi en ella templo alguno, porque su templo es el Señor, el Dios Todopoderoso, y el Cordero» (21:22). Toda la ciudad es la morada de Dios.</p></section>

      beast: [['Roma y sus emperadores', 'La bestia es el Imperio romano y su culto al emperador, que amenazaba a las iglesias de Juan.'], ['Opresores sucesivos', 'La bestia se rastrea en poderes de la historia de la iglesia; los reformadores solían ver aquí al papado.'], ['Un gobernante mundial final', 'La bestia es sobre todo un dictador y un imperio futuros al final de la historia.'], ['Todo Estado que desafía a Dios', 'La bestia es el Estado perseguidor de toda época: primero Roma, y al final un Anticristo definitivo.']],
      babylon: [['Roma (o Jerusalén)', 'Babilonia es la Roma del primer siglo; algunos preteristas dicen que es la Jerusalén apóstata.'], ['Un poder corrupto de iglesia y Estado', 'Babilonia es una institución posterior de falsa adoración, a menudo identificada con la Roma papal.'], ['Una ciudad o sistema del fin', 'Babilonia es una ciudad literal futura o un sistema mundial.'], ['El sistema seductor del mundo', 'Babilonia es la cultura humana organizada en torno al orgullo, la riqueza y la idolatría, en toda época.']],
      armageddon: [['Juicio sobre Roma', 'Las imágenes de batalla describen el juicio de Dios dentro del conflicto del primer siglo.'], ['Un conflicto histórico', 'Armagedón se identifica con una guerra concreta de la historia de la iglesia.'], ['Una batalla literal en Israel', 'Los ejércitos se reúnen cerca de Meguido para una guerra final antes del regreso de Cristo.'], ['El último asalto, decidido por una palabra', 'Armagedón es el ataque final contra la iglesia, al que Cristo pone fin en Su venida. La misma batalla aparece en 19:19 y 20:8.']],
      millennium: [['Varía', 'Los preteristas pueden ser amilenialistas o posmilenialistas; la etiqueta trata del momento, no de Apocalipsis 20 en sí.'], ['Un tramo de la historia', 'Los mil años son un período definido dentro de la historia de la iglesia, a veces contado literalmente.'], ['Un reino terrenal futuro', 'La mayoría de los futuristas esperan un reinado literal de mil años después del regreso de Cristo.'], ['El reinado presente de Cristo', 'Los mil años son la era de la iglesia; Satanás está atado y los santos reinan con Cristo.']],
      seals: [['Calamidades bajo Roma', 'Los sellos describen desastres del mundo romano del primer siglo.'], ['Épocas de la historia de la iglesia', 'Cada sello es un período sucesivo de la historia.'], ['Juicios de una tribulación final', 'Los sellos se abren durante una tribulación futura de siete años.'], ['Rasgos de toda la era', 'La conquista, la guerra, el hambre y la muerte marcan la era hasta que el sexto sello trae el fin. El Cordero abre cada uno.']]
    },
    lensNames: { preterism: 'Preterista', historicism: 'Historicista', futurism: 'Futurista', idealism: 'Idealista' },
    readingSuffix: '', readingPrefix: 'Lectura ', goTo: t => 'Ir al capítulo: ' + t + ' →',
    pair: { preterism: 'El preterismo parcial lee gran parte del libro a la luz de la Roma del primer siglo.', historicism: 'El historicismo sigue las visiones a lo largo de los siglos.', futurism: 'El futurismo coloca la mayoría de las visiones al final de todo.', idealism: 'El idealismo lee las visiones como el patrón de toda la era.' },
    pairMill: { pre: 'Cristo regresa antes de un milenio futuro.', a: 'El milenio es el reinado presente de Cristo.', post: 'Una era dorada llega antes del regreso de Cristo.' },
    pairOurs: 'Esto se acerca a la lectura de esta guía, que además la ancla firmemente en el primer siglo y en un final real y futuro.',
    pairOther: 'Cada intérprete es distinto; tómalo como una tendencia general, no como un bando fijo.',
    timeline: 'Cronología: ', then: ', luego '
  }
};

/* ==========================================================================
   State
   ========================================================================== */
const host = $('#pages');
const done = new Set(store.get('done', []));
let lang = 'en', pages = [], byId = {}, order = [], topics = [], currentId = null;
const t = k => UI[lang][k];
const titleOf = id => byId[id] ? (byId[id].dataset.nav || $('h1', byId[id]).textContent.trim()) : id;

function pickLang() {
  const q = new URLSearchParams(location.search).get('lang');
  if (UI[q]) return q;
  const saved = store.get('lang', null);
  if (UI[saved]) return saved;
  const nav = (navigator.languages || [navigator.language || 'en']).map(l => String(l).slice(0, 2).toLowerCase());
  return nav.find(l => UI[l]) || 'en';
}

/* ---------- Shell text ---------- */
function applyUI() {
  document.documentElement.lang = lang;
  $$('[data-i18n]').forEach(el => { el.textContent = t(el.dataset.i18n); });
  $$('[data-i18n-label]').forEach(el => el.setAttribute('aria-label', t(el.dataset.i18nLabel)));
  $$('[data-i18n-ph]').forEach(el => el.setAttribute('placeholder', t(el.dataset.i18nPh)));
  const meta = $('meta[name="description"]'); if (meta) meta.setAttribute('content', t('description'));
  $$('.lang-pick button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.lang === lang)));
}

/* ---------- Navigation (sidebar + drawer share one source) ---------- */
function buildNav(container, withSearch) {
  container.replaceChildren();
  IDS.forEach((ids, gi) => {
    ids = ids.filter(id => byId[id]);
    if (!ids.length) return;
    const [title, sub] = t('groups')[gi];
    const wrap = document.createElement('div'); wrap.className = 'nav-group';
    const h = document.createElement('p'); h.className = 'nav-group-title'; h.textContent = title;
    if (sub) { const s = document.createElement('span'); s.className = 'nav-group-sub'; s.textContent = sub; h.append(s); }
    const ul = document.createElement('ul'); ul.className = 'nav-list';
    ids.forEach(id => {
      const li = document.createElement('li');
      const a = document.createElement('a');
      a.className = 'nav-link'; a.href = '#' + id; a.dataset.target = id;
      if (withSearch) a.dataset.search = fold(titleOf(id) + ' ' + (byId[id].dataset.keywords || '') + ' ' + title);
      const n = document.createElement('span'); n.className = 'nav-num'; n.textContent = byId[id].dataset.num || '·';
      const tx = document.createElement('span'); tx.textContent = titleOf(id);
      const c = document.createElement('span'); c.className = 'nav-done'; c.setAttribute('aria-hidden', 'true'); c.textContent = '✓';
      a.append(n, tx, c);
      if (done.has(id)) { a.classList.add('is-done'); a.setAttribute('aria-label', `${titleOf(id)} (${t('quizDone')})`); }
      if (id === currentId) a.setAttribute('aria-current', 'page');
      li.append(a); ul.append(li);
    });
    wrap.append(h, ul);
    container.append(wrap);
  });
  if (withSearch) {
    const empty = document.createElement('p');
    empty.className = 'drawer-empty'; empty.hidden = true; empty.textContent = t('empty');
    container.append(empty);
  }
}

function markDone(id) {
  if (done.has(id)) return;
  done.add(id);
  store.set('done', [...done]);
  $$(`.nav-link[data-target="${CSS.escape(id)}"]`).forEach(a => { a.classList.add('is-done'); a.setAttribute('aria-label', `${titleOf(id)} (${t('quizDone')})`); });
  updateStatus(currentId);
}

/* ---------- Page furniture added per language ---------- */
const VISIONS = ['I', 'II', 'III', 'IV', 'V', 'VI', 'VII'];
const LETTERS = ['A', 'B', 'C', 'D'];

function enhance() {
  // Evidence legend
  $$('.evidence', host).forEach(sec => {
    const lg = document.createElement('div'); lg.className = 'legend';
    t('legend').forEach(([cls, name, desc]) => {
      const s = document.createElement('span');
      const i = document.createElement('i'); i.className = 'tag ' + cls; i.textContent = name;
      s.append(i, ' ' + desc); lg.append(s);
    });
    $('h2', sec).after(lg);
  });

  // Vision locator strips
  $$('.locator[data-vision]', host).forEach(el => {
    const on = el.dataset.vision.split(',').map(Number);
    const label = document.createElement('span'); label.textContent = t('locator');
    const track = document.createElement('span'); track.className = 'locator-track';
    VISIONS.forEach((v, i) => {
      const a = document.createElement('a');
      a.href = '#vision-' + (i + 1); a.textContent = v;
      const isOn = on.includes(i + 1);
      if (isOn) a.className = 'on';
      a.setAttribute('aria-label', `${t('vision')} ${v}${isOn ? ` (${t('thisTopic')})` : ''}`);
      track.append(a);
    });
    el.append(label, track);
  });

  // Previous / next
  order.forEach((id, i) => {
    const nav = document.createElement('nav');
    nav.className = 'pager'; nav.setAttribute('aria-label', t('pagerLabel'));
    const mk = (j, cls, word) => {
      const a = document.createElement('a'); a.href = '#' + order[j]; a.className = cls;
      const s = document.createElement('small'); s.textContent = word;
      const tx = document.createElement('span'); tx.textContent = titleOf(order[j]);
      a.append(s, tx); return a;
    };
    if (i > 0) nav.append(mk(i - 1, 'prev', t('prev')));
    if (i < order.length - 1) nav.append(mk(i + 1, 'next', t('next')));
    byId[id].append(nav);
  });

  // Quizzes: shuffle, letter, explain
  $$('.quiz', host).forEach(quiz => {
    const box = $('.quiz-options', quiz);
    const opts = $$('.quiz-opt', box);
    for (let i = opts.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [opts[i], opts[j]] = [opts[j], opts[i]]; }
    opts.forEach((b, i) => {
      const l = document.createElement('span'); l.className = 'quiz-letter'; l.setAttribute('aria-hidden', 'true'); l.textContent = LETTERS[i];
      const tx = document.createElement('span'); tx.innerHTML = b.innerHTML;
      b.replaceChildren(l, tx); b.type = 'button'; box.append(b);
    });
    const fb = $('.quiz-feedback', quiz);
    const why = fb.innerHTML;
    const retry = document.createElement('button');
    retry.type = 'button'; retry.className = 'quiz-retry'; retry.textContent = t('retry'); retry.hidden = true;
    fb.after(retry); fb.hidden = true; fb.setAttribute('aria-live', 'polite');
    box.addEventListener('click', e => {
      const b = e.target.closest('.quiz-opt');
      if (!b || b.disabled) return;
      const right = b.hasAttribute('data-correct');
      opts.forEach(o => {
        o.disabled = true;
        if (o.hasAttribute('data-correct')) o.classList.add('right');
        else if (o === b) o.classList.add('wrong');
        else o.classList.add('dim');
      });
      fb.innerHTML = `<b>${right ? t('right') : t('wrong')}</b> ` + why;
      fb.hidden = false; retry.hidden = right;
      if (right) markDone(quiz.closest('.page').id);
    });
    retry.addEventListener('click', () => {
      opts.forEach(o => { o.disabled = false; o.classList.remove('right', 'wrong', 'dim'); });
      fb.hidden = true; retry.hidden = true; opts[0].focus();
    });
  });

  // Seven visions: expandable rows
  $$('.vlabel', host).forEach(btn => btn.addEventListener('click', () => setVision(btn, btn.getAttribute('aria-expanded') !== 'true')));

  // Artwork that fails to load degrades to an ornament
  $$('img[data-art]', host).forEach(img => {
    const fail = () => img.closest('figure').classList.add('is-missing');
    if (img.complete && img.naturalWidth === 0 && img.getAttribute('src')) fail();
    img.addEventListener('error', fail);
  });

  initLab();
}

function setVision(btn, open) {
  const panel = document.getElementById(btn.getAttribute('aria-controls'));
  if (!panel) return;
  btn.setAttribute('aria-expanded', String(open));
  panel.hidden = !open;
}

/* ---------- Interpretation lab ---------- */
const LENS_ORDER = ['preterism', 'historicism', 'futurism', 'idealism'];
function initLab() {
  const lensTabs = $('#lensTabs');
  if (!lensTabs) return;
  const L = LAB[lang];
  const selectTab = (group, btn) => $$('[role="tab"]', group).forEach(x => x.setAttribute('aria-selected', String(x === btn)));
  const renderLens = key => {
    const d = L.lenses[key];
    $('#lensTitle').textContent = d.title; $('#lensDesc').textContent = d.desc;
    $('#lensStress').textContent = d.stress; $('#lensCaveat').textContent = d.caveat;
    $('#lensEras').replaceChildren(...d.eras.map((o, i) => {
      const e = document.createElement('div'); e.className = 'era';
      const bar = document.createElement('i'); bar.style.setProperty('--o', o);
      const s = document.createElement('span'); s.textContent = L.eras[i];
      e.append(bar, s); return e;
    }));
  };
  const renderMill = key => {
    const d = L.mills[key];
    $('#millTitle').textContent = d.title; $('#millDesc').textContent = d.desc;
    $('#millTexts').textContent = d.texts; $('#millCaveat').textContent = d.caveat;
    const track = document.createElement('div'); track.className = 'mill-track';
    d.segs.forEach(([b, s, kind, w]) => {
      const seg = document.createElement('div'); seg.className = 'mill-seg ' + kind; seg.style.setProperty('--w', w);
      const i = document.createElement('i'); const bb = document.createElement('b'); bb.textContent = b;
      const sm = document.createElement('small'); sm.textContent = s;
      seg.append(i, bb, sm); track.append(seg);
    });
    $('#millVisual').replaceChildren(track);
    $('#millVisual').setAttribute('aria-label', L.timeline + d.segs.map(s => s[0]).join(L.then));
  };
  let readingLens = 'idealism';
  const renderReading = () => {
    const key = $('#passagePick').value;
    const [ttl, d] = L.readings[key][LENS_ORDER.indexOf(readingLens)];
    $('#readingLabel').textContent = (L.readingPrefix || '') + L.lensNames[readingLens] + (L.readingSuffix || '');
    $('#readingTitle').textContent = ttl; $('#readingDesc').textContent = d;
    const target = key === 'seals' ? 'horsemen' : key;
    const link = $('#readingTopic'); link.href = '#' + target; link.textContent = L.goTo(titleOf(target));
  };
  lensTabs.addEventListener('click', e => { const b = e.target.closest('[data-lens]'); if (!b) return; selectTab(lensTabs, b); renderLens(b.dataset.lens); });
  const millTabs = $('#millTabs');
  millTabs.addEventListener('click', e => { const b = e.target.closest('[data-mill]'); if (!b) return; selectTab(millTabs, b); renderMill(b.dataset.mill); });
  const readTabs = $('#readingTabs');
  readTabs.addEventListener('click', e => { const b = e.target.closest('[data-reading]'); if (!b) return; selectTab(readTabs, b); readingLens = b.dataset.reading; renderReading(); });
  $('#passagePick').addEventListener('change', renderReading);
  [lensTabs, millTabs, readTabs].forEach(group => group.addEventListener('keydown', e => {
    if (!['ArrowLeft', 'ArrowRight'].includes(e.key)) return;
    const tabs = $$('[role="tab"]', group); const i = tabs.indexOf(document.activeElement); if (i < 0) return;
    const next = tabs[(i + (e.key === 'ArrowRight' ? 1 : tabs.length - 1)) % tabs.length];
    next.focus(); next.click();
  }));
  const matrix = $('#matrix');
  matrix.addEventListener('click', e => {
    const b = e.target.closest('[data-pair]'); if (!b) return;
    $$('[data-pair]', matrix).forEach(x => x.setAttribute('aria-pressed', String(x === b)));
    const [lens, mill] = b.dataset.pair.split('|');
    $('#matrixOut').textContent = `${L.pair[lens]} ${L.pairMill[mill]} ` + (lens === 'idealism' && mill === 'a' ? L.pairOurs : L.pairOther);
  });
  renderLens('preterism'); renderMill('a'); renderReading();
}

/* ==========================================================================
   Routing
   ========================================================================== */
function updateStatus(id) {
  const n = topics.indexOf(id);
  $('#topStatus').textContent = n >= 0
    ? t('statusQ')(n + 1, topics.length) + (done.size ? ' · ' + t('statusDone')(done.size) : '')
    : (done.size ? t('statusAll')(done.size, topics.length) : '');
}
function updateResume() {
  const resume = $('#resume');
  if (!resume) return;
  const last = store.get('last', null);
  const ok = last && byId[last] && last !== 'introduction';
  resume.hidden = !ok;
  if (ok) { const a = $('a', resume); a.href = '#' + last; a.textContent = titleOf(last); }
}
function show(id, focus) {
  if (!byId[id]) id = 'introduction';
  const changed = id !== currentId;
  pages.forEach(p => { p.hidden = p.id !== id; });
  $$('.nav-link').forEach(a => {
    if (a.dataset.target === id) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current');
  });
  currentId = id;
  document.title = (id === 'introduction' ? t('home') : titleOf(id) + ' · ' + t('home')) + ' — ' + t('docTitle');
  updateStatus(id);
  if (id === 'introduction') updateResume(); else store.set('last', id);
  if (changed) {
    window.scrollTo(0, 0);
    const side = $('#sideNav .nav-link[aria-current="page"]');
    if (side) side.scrollIntoView({ block: 'nearest' });
    if (focus) { const h = $('h1', byId[id]); if (h) { h.setAttribute('tabindex', '-1'); h.focus({ preventScroll: true }); } }
  }
  requestAnimationFrame(updateProgress);
}
function route(focus) {
  const raw = decodeURIComponent(location.hash.slice(1));
  if (!raw) return show('introduction', false);
  if (byId[raw]) return show(raw, focus);
  const target = document.getElementById(raw);
  const page = target && target.closest('.page');
  if (page) {
    show(page.id, false);
    if (target.matches('.vlabel')) setVision(target, true);
    requestAnimationFrame(() => target.scrollIntoView({ block: 'start' }));
    return;
  }
  show('introduction', false);
}

/* ---------- Mount a language ---------- */
function mount(next) {
  lang = UI[next] ? next : 'en';
  store.set('lang', lang);
  host.replaceChildren($('#tpl-' + lang).content.cloneNode(true));
  pages = $$('.page', host);
  byId = Object.fromEntries(pages.map(p => [p.id, p]));
  order = IDS.flat().filter(id => byId[id]);
  pages.forEach(p => { if (!order.includes(p.id)) order.push(p.id); });
  topics = order.filter(id => byId[id].classList.contains('topic'));
  applyUI();
  const keep = currentId;
  currentId = null;
  buildNav($('#sideNav'), false);
  buildNav($('#drawerNav'), true);
  enhance();
  if (keep && !location.hash) show(keep, false); else route(false);
}

/* ==========================================================================
   One-time wiring
   ========================================================================== */
window.addEventListener('hashchange', () => route(true));

function updateProgress() {
  const page = byId[currentId];
  if (!page) return;
  const r = page.getBoundingClientRect();
  const total = Math.max(1, r.height - window.innerHeight + 120);
  $('#progressFill').style.width = Math.min(100, Math.max(0, (-r.top + 60) / total * 100)) + '%';
}
window.addEventListener('scroll', updateProgress, { passive: true });
window.addEventListener('resize', updateProgress);

// Language picker
$$('.lang-pick button').forEach(b => b.addEventListener('click', () => {
  if (b.dataset.lang === lang) return;
  mount(b.dataset.lang);
  b.focus();
}));

// Drawer
const drawer = $('#drawer'), openBtn = $('#drawerOpen'), search = $('#drawerSearch');
let lastFocus = null;
function filterDrawer() {
  const q = fold(search.value.trim());
  let shown = 0;
  $$('#drawerNav .nav-group').forEach(g => {
    let any = false;
    $$('.nav-link', g).forEach(a => {
      const hit = !q || a.dataset.search.includes(q);
      a.parentElement.hidden = !hit;
      if (hit) { any = true; shown++; }
    });
    g.hidden = !any;
  });
  const empty = $('#drawerNav .drawer-empty'); if (empty) empty.hidden = shown !== 0;
}
function openDrawer() {
  lastFocus = document.activeElement;
  search.value = ''; filterDrawer();
  drawer.hidden = false;
  openBtn.setAttribute('aria-expanded', 'true');
  document.body.classList.add('drawer-open');
  const cur = $('#drawerNav .nav-link[aria-current="page"]');
  if (cur) cur.scrollIntoView({ block: 'center' });
  $('#drawerClose').focus();
}
function closeDrawer(restore = true) {
  if (drawer.hidden) return;
  drawer.hidden = true;
  openBtn.setAttribute('aria-expanded', 'false');
  document.body.classList.remove('drawer-open');
  if (restore && lastFocus && lastFocus.isConnected) lastFocus.focus();
}
openBtn.addEventListener('click', openDrawer);
$('#drawerClose').addEventListener('click', () => closeDrawer());
$('[data-close]', drawer).addEventListener('click', () => closeDrawer());
search.addEventListener('input', filterDrawer);
$('#drawerNav').addEventListener('click', e => { if (e.target.closest('.nav-link')) closeDrawer(false); });
drawer.addEventListener('keydown', e => {
  if (e.key === 'Escape') { e.preventDefault(); closeDrawer(); return; }
  if (e.key !== 'Tab') return;
  const f = $$('button, input, a[href]', drawer).filter(el => !el.closest('[hidden]'));
  const first = f[0], last = f[f.length - 1];
  if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
  else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
});
window.matchMedia('(min-width: 1101px)').addEventListener('change', m => { if (m.matches) closeDrawer(false); });

mount(pickLang());
})();

</script>
