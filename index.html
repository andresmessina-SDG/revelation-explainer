    <details class="ev"><summary><span class="ev-n">03</span><span class="ev-ref">Mateo 24:6–8</span><i class="tag link">Conexión</i></summary><div class="ev-body"><p>Jesús describe la guerra, el hambre y los terremotos como rasgos de la era antes del fin: «todavía no es el fin».</p><a href="https://www.biblegateway.com/passage/?search=Mateo+24&amp;version=NBLA" target="_blank" rel="noopener">Leer Mateo 24 ↗</a></div></details>
    <details class="ev"><summary><span class="ev-n">04</span><span class="ev-ref">El caballo blanco (6:2)</span><i class="tag caution">Precaución</i></summary><div class="ev-body"><p>El primer jinete es discutido incluso entre intérpretes reformados. Hendriksen vio a Cristo y el avance del evangelio (compara 19:11); muchos otros ven la conquista o una imitación de Cristo, ya que los otros tres jinetes traen daño.</p></div></details>
  </section>
  <details class="alt"><summary>Cómo lo leen otros</summary><div class="alt-body"><div class="alt-grid">
    <article><h3>Juicios de una tribulación futura</h3><p>Los futuristas sitúan los sellos en un período venidero de siete años, y a menudo ven en el jinete blanco al Anticristo que trae una paz falsa.</p></article>
    <article class="ours"><h3>Rasgos de toda la era</h3><p>Los sellos muestran lo que sufre cada generación entre las venidas de Cristo, bajo el control del Cordero, hasta que el sexto sello trae el fin.</p></article>
  </div></div></details>
  <aside class="lesson"><span class="rubric">La lección para recordar</span><p>Cuando el mundo tiembla, recuerda quién abre los sellos.</p></aside>
  <section class="quiz"><span class="rubric">Comprueba lo que aprendiste</span><h3>¿Qué ocurre en el sexto sello?</h3><div class="quiz-options"><button class="quiz-opt" data-correct>Llega el gran día de la ira: el fin del mundo</button><button class="quiz-opt">Sale un quinto jinete</button><button class="quiz-opt">La iglesia es quitada en secreto</button></div><p class="quiz-feedback" hidden>En el sexto sello el cielo desaparece como un pergamino que se enrolla y «ha llegado el gran día de la ira de ellos» (6:12–17). El primer ciclo de visiones ya llegó al fin.</p></section>
</section>

<section class="page topic" id="144000" data-nav="¿Quiénes son los 144,000?" data-num="04" data-keywords="144000 144,000 sellados tribus israel gran multitud apocalipsis 7 14 iglesia">
  <p class="eyebrow">Pregunta 04 · Apocalipsis 7 y 14</p>
  <h1>¿Quiénes son los 144,000?</h1>
  <p class="deck">El pueblo que Dios cuenta, sella y guarda</p>
  <div class="locator" data-vision="2,4"></div>
  <ul class="refs" aria-label="Pasajes para leer"><li class="refs-label">Leer en la NBLA</li><li><a href="https://www.biblegateway.com/passage/?search=Apocalipsis+7&amp;version=NBLA" target="_blank" rel="noopener">Apocalipsis 7</a></li><li><a href="https://www.biblegateway.com/passage/?search=Apocalipsis+14&amp;version=NBLA" target="_blank" rel="noopener">Apocalipsis 14</a></li><li><a href="https://www.biblegateway.com/passage/?search=N%C3%BAmeros+1&amp;version=NBLA" target="_blank" rel="noopener">Números 1</a></li></ul>
  <figure class="art"><img data-art src="https://commons.wikimedia.org/wiki/Special:FilePath/Albrecht_D%C3%BCrer,_The_Four_Angels_Holding_the_Winds,_1498,_NGA_142354.jpg?width=1000" alt="Grabado: cuatro ángeles detienen los vientos mientras otro ángel marca la frente de una multitud de fieles." loading="lazy" decoding="async" width="1000" height="1400"><figcaption><b>Los cuatro ángeles que detienen los vientos</b> y el sellado de los siervos de Dios, Alberto Durero, 1498. Obra histórica, no un retrato literal de la visión.</figcaption></figure>
  <blockquote class="passage"><span class="rubric">El texto</span><p>Después de esto miré, y vi una gran multitud, que nadie podía contar, de todas las naciones, tribus, pueblos, y lenguas, de pie delante del trono y delante del Cordero, vestidos con vestiduras blancas y con palmas en las manos.</p><footer><cite>Apocalipsis 7:9</cite><a href="https://www.biblegateway.com/passage/?search=Apocalipsis+7&amp;version=NBLA" target="_blank" rel="noopener">Leer el capítulo ↗</a></footer></blockquote>
  <div class="myth"><span class="rubric">Un malentendido común</span><p>Solo 144,000 personas serán salvas, o el número es un grupo especial de evangelistas judíos en una tribulación futura.</p></div>
  <div class="teach">
    <h2>Lo que enseña la Escritura</h2>
    <p class="illum">Juan <em>oye</em> un número: «Oí el número de los que fueron sellados: 144,000 sellados de todas las tribus de los israelitas» (7:4). Luego se vuelve y <em>ve</em> «una gran multitud, que nadie podía contar, de todas las naciones» (7:9). Es exactamente lo que pasó en el capítulo 5, cuando oyó de un León y vio un Cordero. Lo que Juan oye y lo que ve son la misma realidad desde dos lados. <strong>Los 144,000 son toda la iglesia</strong>, descrita como el verdadero Israel de Dios y contada hasta la última persona; la gran multitud es esa misma iglesia tal como realmente es, reunida de todos los pueblos.</p>
    <p>El número está construido, no contado: 12 tribus × 12 apóstoles × 1,000, la plenitud del pueblo de Dios. Está ordenado como un censo militar (compara Números 1), porque son el ejército del Cordero, «los que siguen al Cordero adondequiera que va» (14:4). La lista misma es inusual. Judá, la tribu del Mesías, va primero, y Dan no aparece. No es una lista común de las tribus; es un retrato del pueblo del Mesías. El Nuevo Testamento llama a la iglesia «el Israel de Dios» (Gálatas 6:16), y el sello en sus frentes significa que pertenecen a Él y serán guardados en toda prueba.</p>
  </div>
  <div class="pair-cards">
    <article><span class="ref">Lo que Juan oye · 7:4–8</span><h3>144,000</h3><p>Contados por tribu, sellados, ordenados para la batalla. La iglesia como el verdadero Israel, completo.</p></article>
    <article class="dark"><span class="ref">Lo que Juan ve · 7:9–17</span><h3>Una multitud incontable</h3><p>De todas las naciones, vestida de blanco, delante del trono. La misma iglesia, tal como es.</p></article>
  </div>
  <section class="evidence" aria-labelledby="ev-144-es">
    <h2 id="ev-144-es">¿Cómo lo sabemos?</h2>
    <details class="ev"><summary><span class="ev-n">01</span><span class="ev-ref">Apocalipsis 7:4, 9</span><i class="tag stated">Declarado</i></summary><div class="ev-body"><p>«Oí el número…», y luego: «Después de esto miré, y vi una gran multitud, que nadie podía contar».</p><a href="https://www.biblegateway.com/passage/?search=Apocalipsis+7&amp;version=NBLA" target="_blank" rel="noopener">Leer Apocalipsis 7 ↗</a></div></details>
    <details class="ev"><summary><span class="ev-n">02</span><span class="ev-ref">Apocalipsis 5:5–6</span><i class="tag link">Conexión</i></summary><div class="ev-body"><p>El mismo patrón: Juan oye «León» y ve un Cordero. Oír y ver describen una sola realidad de dos maneras.</p><a href="https://www.biblegateway.com/passage/?search=Apocalipsis+5&amp;version=NBLA" target="_blank" rel="noopener">Leer Apocalipsis 5 ↗</a></div></details>
    <details class="ev"><summary><span class="ev-n">03</span><span class="ev-ref">Gálatas 6:16; Romanos 2:28–29; Filipenses 3:3</span><i class="tag link">Conexión</i></summary><div class="ev-body"><p>Pablo llama a los creyentes «el Israel de Dios» y la verdadera circuncisión, los que adoran por el Espíritu.</p><a href="https://www.biblegateway.com/passage/?search=G%C3%A1latas+6&amp;version=NBLA" target="_blank" rel="noopener">Leer Gálatas 6 ↗</a></div></details>
    <details class="ev"><summary><span class="ev-n">04</span><span class="ev-ref">Apocalipsis 14:1–4</span><i class="tag inference">Inferencia</i></summary><div class="ev-body"><p>Los 144,000 están con el Cordero, llevan «el nombre del Cordero y el nombre de Su Padre» y lo siguen. Verlos como toda la iglesia redimida es una conclusión que se saca de los capítulos 5, 7 y 14 en conjunto.</p><a href="https://www.biblegateway.com/passage/?search=Apocalipsis+14&amp;version=NBLA" target="_blank" rel="noopener">Leer Apocalipsis 14 ↗</a></div></details>
  </section>
  <details class="alt"><summary>Cómo lo leen otros</summary><div class="alt-body"><div class="alt-grid">
    <article><h3>El Israel étnico en el fin</h3><p>Los dispensacionalistas ven a 144,000 creyentes judíos sellados durante una tribulación futura, distintos de la multitud de creyentes gentiles.</p></article>
    <article class="ours"><h3>Todo el pueblo de Dios</h3><p>El número simboliza la plenitud, y la multitud es la misma compañía vista tal como es: una sola iglesia de judíos y gentiles.</p></article>
  </div></div></details>
  <aside class="lesson"><span class="rubric">La lección para recordar</span><p>Dios conoce a cada uno de los Suyos por nombre, y ninguno de ellos se perderá.</p></aside>
  <section class="quiz"><span class="rubric">Comprueba lo que aprendiste</span><h3>¿Qué ve Juan justo después de oír el número 144,000?</h3><div class="quiz-options"><button class="quiz-opt" data-correct>Una gran multitud, que nadie podía contar, de todas las naciones</button><button class="quiz-opt">Exactamente 144,000 hombres de Israel y nadie más</button><button class="quiz-opt">Un cielo vacío esperando ser llenado</button></div><p class="quiz-feedback" hidden>Juan oye el número y luego ve la multitud incontable (7:4, 9), igual que oyó del León y vio al Cordero en el capítulo 5.</p></section>
</section>

<section class="page topic" id="trumpets" data-nav="¿Qué son las trompetas y las copas?" data-num="05" data-keywords="siete trompetas siete copas plagas egipto éxodo ira tercera parte apocalipsis 8 9 15 16 juicios">
  <p class="eyebrow">Pregunta 05 · Apocalipsis 8–9 y 15–16</p>
  <h1>¿Qué son las trompetas y las copas?</h1>
  <p class="deck">Las plagas de Egipto, resonando sobre toda la era</p>
  <div class="locator" data-vision="3,5"></div>
  <ul class="refs" aria-label="Pasajes para leer"><li class="refs-label">Leer en la NBLA</li><li><a href="https://www.biblegateway.com/passage/?search=Apocalipsis+8&amp;version=NBLA" target="_blank" rel="noopener">Apocalipsis 8</a></li><li><a href="https://www.biblegateway.com/passage/?search=Apocalipsis+9&amp;version=NBLA" target="_blank" rel="noopener">Apocalipsis 9</a></li><li><a href="https://www.biblegateway.com/passage/?search=Apocalipsis+16&amp;version=NBLA" target="_blank" rel="noopener">Apocalipsis 16</a></li><li><a href="https://www.biblegateway.com/passage/?search=%C3%89xodo+7&amp;version=NBLA" target="_blank" rel="noopener">Éxodo 7</a></li></ul>
  <figure class="art"><img data-art src="https://commons.wikimedia.org/wiki/Special:FilePath/Albrecht_D%C3%BCrer,_The_Seven_Angels_with_the_Trumpets,_probably_c._1496-1498,_NGA_850.jpg?width=1000" alt="Grabado: siete ángeles reciben trompetas ante el trono de Dios mientras fuego, granizo y una estrella que cae golpean la tierra y el mar." loading="lazy" decoding="async" width="1000" height="1400"><figcaption><b>Los siete ángeles con las trompetas</b>, Alberto Durero, hacia 1496–98. Obra histórica, no un retrato literal de la visión.</figcaption></figure>
  <blockquote class="passage"><span class="rubric">El texto</span><p>El resto de la humanidad, los que no fueron muertos por estas plagas, no se arrepintieron de las obras de sus manos ni dejaron de adorar a los demonios y a los ídolos de oro, de plata, de bronce, de piedra, y de madera, que no pueden ver ni oír ni andar.</p><footer><cite>Apocalipsis 9:20</cite><a href="https://www.biblegateway.com/passage/?search=Apocalipsis+9&amp;version=NBLA" target="_blank" rel="noopener">Leer el capítulo ↗</a></footer></blockquote>
  <div class="myth"><span class="rubric">Un malentendido común</span><p>Las trompetas y las copas son catorce desastres distintos que ocurrirán uno tras otro en los últimos años de la historia.</p></div>
  <div class="teach">
    <h2>Lo que enseña la Escritura</h2>
    <p class="illum">Ambas series siguen el modelo de las plagas que Dios envió sobre Egipto antes del éxodo: granizo y fuego, aguas convertidas en sangre, tinieblas, langostas, úlceras. El punto es el mismo que en Éxodo. Dios juzga a un mundo que adora dioses falsos y oprime a Su pueblo, y está sacando a Su pueblo hacia la libertad. Justo antes de que suenen las trompetas, el humo del incienso sube «con las oraciones de los santos», y el fuego del altar es arrojado a la tierra (8:3–5). <strong>Los juicios son la respuesta de Dios a las oraciones de Su pueblo.</strong></p>
    <p>Las dos series golpean los mismos blancos, en el mismo orden. La diferencia está en su alcance. Las trompetas caen sobre «la tercera parte», juicios parciales que sirven de advertencia, y aun así el mundo no se arrepiente (9:20–21). Las copas son «siete plagas, las últimas, porque en ellas se ha consumado el furor de Dios» (15:1). No son sucesos posteriores, sino el mismo patrón visto con toda su fuerza, al final de la era.</p>
  </div>
  <div class="table-scroll wide"><table class="parallels">
    <caption>Los mismos blancos, el mismo orden. Las trompetas advierten; las copas completan.</caption>
    <thead><tr><th scope="col">Blanco</th><th scope="col">Trompetas · parciales</th><th scope="col">Copas · completas</th></tr></thead>
    <tbody>
      <tr><th scope="row">1 · La tierra<small>Éxodo: granizo, úlceras</small></th><td><span class="ref">8:7</span>Granizo y fuego; se quema la tercera parte de la tierra</td><td><span class="ref">16:2</span>Úlceras malignas sobre los que tienen la marca de la bestia</td></tr>
      <tr><th scope="row">2 · El mar<small>Éxodo: sangre</small></th><td><span class="ref">8:8–9</span>La tercera parte del mar se convierte en sangre</td><td><span class="ref">16:3</span>El mar se vuelve sangre; muere todo ser vivo en él</td></tr>
      <tr><th scope="row">3 · Ríos y fuentes</th><td><span class="ref">8:10–11</span>La estrella Ajenjo; la tercera parte de las aguas se vuelve amarga</td><td><span class="ref">16:4–7</span>Los ríos y las fuentes se vuelven sangre</td></tr>
      <tr><th scope="row">4 · El sol</th><td><span class="ref">8:12</span>Se oscurece la tercera parte del sol, la luna y las estrellas</td><td><span class="ref">16:8–9</span>El sol quema a los hombres con fuego</td></tr>
      <tr><th scope="row">5 · Tinieblas<small>Éxodo: tinieblas, langostas</small></th><td><span class="ref">9:1–11</span>Se abre el abismo; el humo oscurece el cielo; langostas</td><td><span class="ref">16:10–11</span>El reino de la bestia queda en tinieblas</td></tr>
      <tr><th scope="row">6 · El Éufrates</th><td><span class="ref">9:13–21</span>Se sueltan cuatro ángeles junto al río; un inmenso ejército</td><td><span class="ref">16:12–16</span>Se seca el río; los reyes son reunidos en Armagedón</td></tr>
      <tr class="final"><th scope="row">7 · El fin</th><td><span class="ref">11:15–19</span>«El reino del mundo ha venido a ser el reino de nuestro Señor»; relámpagos, terremoto, granizo</td><td><span class="ref">16:17–21</span>«Hecho está»; el terremoto más grande, granizo enorme</td></tr>
    </tbody>
  </table></div>
  <section class="evidence" aria-labelledby="ev-trumpets-es">
    <h2 id="ev-trumpets-es">¿Cómo lo sabemos?</h2>
    <details class="ev"><summary><span class="ev-n">01</span><span class="ev-ref">Éxodo 7–10</span><i class="tag link">Conexión</i></summary><div class="ev-body"><p>Sangre, granizo, langostas, tinieblas y úlceras son las plagas de Egipto, que el Apocalipsis repite como juicios sobre un nuevo Faraón.</p><a href="https://www.biblegateway.com/passage/?search=%C3%89xodo+9&amp;version=NBLA" target="_blank" rel="noopener">Leer Éxodo 9 ↗</a></div></details>
    <details class="ev"><summary><span class="ev-n">02</span><span class="ev-ref">Apocalipsis 8:3–5</span><i class="tag stated">Declarado</i></summary><div class="ev-body"><p>El incienso con las oraciones de los santos sube ante Dios, y luego el fuego del mismo altar es arrojado a la tierra.</p><a href="https://www.biblegateway.com/passage/?search=Apocalipsis+8&amp;version=NBLA" target="_blank" rel="noopener">Leer Apocalipsis 8 ↗</a></div></details>
    <details class="ev"><summary><span class="ev-n">03</span><span class="ev-ref">Apocalipsis 9:4, 20–21</span><i class="tag stated">Declarado</i></summary><div class="ev-body"><p>Los que tienen el sello de Dios están protegidos, y las plagas son llamados al arrepentimiento que el mundo rechaza.</p><a href="https://www.biblegateway.com/passage/?search=Apocalipsis+9&amp;version=NBLA" target="_blank" rel="noopener">Leer Apocalipsis 9 ↗</a></div></details>
    <details class="ev"><summary><span class="ev-n">04</span><span class="ev-ref">Apocalipsis 15:1</span><i class="tag inference">Inferencia</i></summary><div class="ev-body"><p>Las copas se llaman «las últimas» porque en ellas se consuma el furor de Dios. Leerlas como las trompetas con toda su fuerza, y no como sucesos posteriores, se deduce del patrón coincidente de siete pasos.</p><a href="https://www.biblegateway.com/passage/?search=Apocalipsis+15&amp;version=NBLA" target="_blank" rel="noopener">Leer Apocalipsis 15 ↗</a></div></details>
  </section>
  <details class="alt"><summary>Cómo lo leen otros</summary><div class="alt-body"><div class="alt-grid">
    <article><h3>Una cuenta regresiva cronológica</h3><p>Los futuristas suelen leer los sellos, las trompetas y las copas como veintiún juicios en secuencia: las trompetas salen del séptimo sello y las copas de la séptima trompeta.</p></article>
    <article class="ours"><h3>Ciclos paralelos de una misma era</h3><p>Las trompetas advierten a lo largo de la era; las copas muestran los mismos juicios completos al final. Ambas terminan con la misma tormenta que sale del trono.</p></article>
  </div></div></details>
  <aside class="lesson"><span class="rubric">La lección para recordar</span><p>Cada desastre de este mundo es una trompeta: un llamado a arrepentirse mientras todavía hay tiempo.</p></aside>
  <section class="quiz"><span class="rubric">Comprueba lo que aprendiste</span><h3>¿Cuál es la diferencia principal entre las trompetas y las copas?</h3><div class="quiz-options"><button class="quiz-opt" data-correct>Las trompetas golpean la tercera parte como advertencia; las copas son completas</button><button class="quiz-opt">Golpean partes completamente distintas de la creación</button><button class="quiz-opt">Las copas se derraman sobre la iglesia</button></div><p class="quiz-feedback" hidden>Las dos series golpean los mismos siete blancos en el mismo orden. Las trompetas son parciales («la tercera parte»), y en las copas «se ha consumado el furor de Dios» (15:1).</p></section>
</section>

<section class="page topic" id="witnesses" data-nav="¿Quiénes son los dos testigos?" data-num="06" data-keywords="dos testigos olivos candelabros moisés elías apocalipsis 11 templo medido cilicio profetizar">
  <p class="eyebrow">Pregunta 06 · Apocalipsis 11</p>
  <h1>¿Quiénes son los dos testigos?</h1>
  <p class="deck">La iglesia que da testimonio ante las naciones</p>
  <div class="locator" data-vision="3"></div>
  <ul class="refs" aria-label="Pasajes para leer"><li class="refs-label">Leer en la NBLA</li><li><a href="https://www.biblegateway.com/passage/?search=Apocalipsis+11&amp;version=NBLA" target="_blank" rel="noopener">Apocalipsis 11</a></li><li><a href="https://www.biblegateway.com/passage/?search=Zacar%C3%ADas+4&amp;version=NBLA" target="_blank" rel="noopener">Zacarías 4</a></li><li><a href="https://www.biblegateway.com/passage/?search=Deuteronomio+19&amp;version=NBLA" target="_blank" rel="noopener">Deuteronomio 19</a></li></ul>
  <figure class="art"><img data-art src="https://commons.wikimedia.org/wiki/Special:FilePath/Albrecht_D%C3%BCrer_-_Saint_John_Devouring_the_Book_(NGA_1941.3.9).jpg?width=1000" alt="Grabado: un ángel poderoso con piernas como columnas de fuego entrega a Juan un librito, que él se come." loading="lazy" decoding="async" width="1000" height="1400"><figcaption><b>San Juan devorando el libro</b>, Alberto Durero, hacia 1496–98. Justo antes de que aparezcan los testigos, a Juan se le dice: «Debes profetizar otra vez» (10:11). Obra histórica, no un retrato literal de la visión.</figcaption></figure>
  <blockquote class="passage"><span class="rubric">El texto</span><p>Otorgaré autoridad a mis dos testigos, y ellos profetizarán por 1,260 días, vestidos de cilicio. Estos son los dos olivos y los dos candelabros que están delante del Señor de la tierra.</p><footer><cite>Apocalipsis 11:3–4</cite><a href="https://www.biblegateway.com/passage/?search=Apocalipsis+11&amp;version=NBLA" target="_blank" rel="noopener">Leer el capítulo ↗</a></footer></blockquote>
  <div class="myth"><span class="rubric">Un malentendido común</span><p>Dos profetas concretos, quizá Moisés y Elías de regreso, predicarán en un templo reconstruido en Jerusalén durante una tribulación futura.</p></div>
  <div class="teach">
    <h2>Lo que enseña la Escritura</h2>
    <p class="illum">El Apocalipsis nos dice quiénes son: «los dos candelabros» (11:4). Y ya nos dijo qué son los candelabros: «los siete candelabros son las siete iglesias» (1:20). Los testigos son <strong>la iglesia en su llamado a dar testimonio</strong>. ¿Por qué dos? Porque la ley exigía dos testigos para establecer un asunto (Deuteronomio 19:15), y Jesús envió a Sus discípulos de dos en dos. También puede ser significativo que solo dos de las siete iglesias, Esmirna y Filadelfia, no recibieron reprensión.</p>
    <p>Sus poderes son los de Moisés y Elías: «cerrar el cielo a fin de que no llueva», como Elías durante tres años y medio (Santiago 5:17), y convertir las aguas «en sangre», como Moisés en Egipto (11:6). La iglesia lleva el testimonio completo de la Ley y los Profetas. Su historia sigue la de su Señor. Profetiza durante toda la era (1,260 días), está protegida hasta terminar su obra y, al final, la bestia la vence. Durante tres días y medio el mundo celebra en «la gran ciudad, que simbólicamente se llama Sodoma y Egipto, donde también su Señor fue crucificado» (11:8). Luego «el aliento de vida de parte de Dios vino a ellos», se ponen en pie y oyen: «Suban acá». Suben al cielo en la nube mientras sus enemigos los ven (11:11–12). Enseguida suena la séptima trompeta del fin.</p>
  </div>
  <section class="evidence" aria-labelledby="ev-witnesses-es">
    <h2 id="ev-witnesses-es">¿Cómo lo sabemos?</h2>
    <details class="ev"><summary><span class="ev-n">01</span><span class="ev-ref">Apocalipsis 11:4 con 1:20</span><i class="tag stated">Declarado</i></summary><div class="ev-body"><p>Los testigos son candelabros, y los candelabros son iglesias. El Apocalipsis interpreta su propio símbolo.</p><a href="https://www.biblegateway.com/passage/?search=Apocalipsis+1&amp;version=NBLA" target="_blank" rel="noopener">Leer Apocalipsis 1 ↗</a></div></details>
    <details class="ev"><summary><span class="ev-n">02</span><span class="ev-ref">Zacarías 4:2–3, 14</span><i class="tag link">Conexión</i></summary><div class="ev-body"><p>Zacarías vio un candelabro junto a dos olivos, los ungidos que están delante del Señor: el pueblo de Dios capacitado por Su Espíritu.</p><a href="https://www.biblegateway.com/passage/?search=Zacar%C3%ADas+4&amp;version=NBLA" target="_blank" rel="noopener">Leer Zacarías 4 ↗</a></div></details>
    <details class="ev"><summary><span class="ev-n">03</span><span class="ev-ref">Apocalipsis 11:6; Santiago 5:17; Éxodo 7:20</span><i class="tag link">Conexión</i></summary><div class="ev-body"><p>Cerrar el cielo recuerda a Elías; convertir el agua en sangre recuerda a Moisés.</p><a href="https://www.biblegateway.com/passage/?search=Santiago+5&amp;version=NBLA" target="_blank" rel="noopener">Leer Santiago 5 ↗</a></div></details>
    <details class="ev"><summary><span class="ev-n">04</span><span class="ev-ref">Apocalipsis 11:8</span><i class="tag stated">Declarado</i></summary><div class="ev-body"><p>La gran ciudad «simbólicamente se llama Sodoma y Egipto». El mismo texto indica que el lugar es simbólico: la ciudad del mundo que rechaza a Dios.</p><a href="https://www.biblegateway.com/passage/?search=Apocalipsis+11&amp;version=NBLA" target="_blank" rel="noopener">Leer Apocalipsis 11 ↗</a></div></details>
    <details class="ev"><summary><span class="ev-n">05</span><span class="ev-ref">¿Dos individuos?</span><i class="tag caution">Precaución</i></summary><div class="ev-body"><p>Algunos intérpretes cuidadosos, incluso algunos amilenialistas, sostienen que al final también aparecerán dos profetas individuales. La lectura simbólica no depende de descartarlo, pero el texto no da nombres.</p></div></details>
  </section>
  <details class="alt"><summary>Cómo lo leen otros</summary><div class="alt-body"><div class="alt-grid">
    <article><h3>Dos profetas del fin</h3><p>Los futuristas suelen esperar dos profetas literales, identificados a menudo con Moisés y Elías o con Enoc y Elías, que ministrarán en Jerusalén durante tres años y medio.</p></article>
    <article class="ours"><h3>La iglesia que testifica</h3><p>Los dos candelabros son la iglesia, que profetiza durante toda la era, es silenciada brevemente al final y es vindicada cuando Cristo regresa.</p></article>
  </div></div></details>
  <aside class="lesson"><span class="rubric">La lección para recordar</span><p>La iglesia no está llamada a estar cómoda, sino a ser fiel. Su testimonio no puede ser silenciado hasta que Dios diga que su obra ha terminado.</p></aside>
  <section class="quiz"><span class="rubric">Comprueba lo que aprendiste</span><h3>El Apocalipsis llama a los testigos «los dos candelabros». ¿Qué son los candelabros en el Apocalipsis?</h3><div class="quiz-options"><button class="quiz-opt" data-correct>Iglesias (1:20)</button><button class="quiz-opt">Ángeles que custodian Jerusalén</button><button class="quiz-opt">Las dos mitades de la Biblia</button></div><p class="quiz-feedback" hidden>«Los siete candelabros son las siete iglesias» (1:20). Así que los dos candelabros de 11:4 apuntan a la iglesia como testigo de Dios.</p></section>
</section>

<section class="page topic" id="1260" data-nav="¿Qué significan los 1,260 días?" data-num="07" data-keywords="1260 días 42 meses cuarenta y dos meses tiempo tiempos medio tiempo tres años y medio daniel 7 12 desierto números">
  <p class="eyebrow">Pregunta 07 · Apocalipsis 11–13</p>
  <h1>¿Qué significan los 1,260 días?</h1>
  <p class="deck">Un solo período de prueba, con cinco nombres</p>
  <div class="locator" data-vision="3,4"></div>
  <ul class="refs" aria-label="Pasajes para leer"><li class="refs-label">Leer en la NBLA</li><li><a href="https://www.biblegateway.com/passage/?search=Apocalipsis+12&amp;version=NBLA" target="_blank" rel="noopener">Apocalipsis 12</a></li><li><a href="https://www.biblegateway.com/passage/?search=Daniel+7&amp;version=NBLA" target="_blank" rel="noopener">Daniel 7</a></li><li><a href="https://www.biblegateway.com/passage/?search=Daniel+12&amp;version=NBLA" target="_blank" rel="noopener">Daniel 12</a></li></ul>
  <figure class="art"><img data-art src="https://commons.wikimedia.org/wiki/Special:FilePath/Albrecht_D%C3%BCrer,_The_Apocalyptic_Woman,_1498,_NGA_142358.jpg?width=1000" alt="Grabado: una mujer vestida del sol y de pie sobre la luna recibe alas de águila, mientras un dragón de siete cabezas la amenaza y su hijo es llevado hacia Dios." loading="lazy" decoding="async" width="1000" height="1400"><figcaption><b>La mujer del Apocalipsis</b>, Alberto Durero, 1498. La mujer es sustentada en el desierto por 1,260 días. Obra histórica, no un retrato literal de la visión.</figcaption></figure>
  <blockquote class="passage"><span class="rubric">El texto</span><p>Y ella dio a luz un Hijo varón, que ha de regir a todas las naciones con vara de hierro. Su Hijo fue arrebatado hasta Dios y hasta Su trono. La mujer huyó al desierto, donde tenía un lugar preparado por Dios, para ser sustentada allí por 1,260 días.</p><footer><cite>Apocalipsis 12:5–6</cite><a href="https://www.biblegateway.com/passage/?search=Apocalipsis+12&amp;version=NBLA" target="_blank" rel="noopener">Leer el capítulo ↗</a></footer></blockquote>
  <div class="myth"><span class="rubric">Un malentendido común</span><p>Estos números son un cronómetro de los últimos tres años y medio de la historia, y con ellos se puede calcular cuándo regresará Cristo.</p></div>
  <div class="teach">
    <h2>Lo que enseña la Escritura</h2>
    <p class="illum">Observa cuándo empieza el período en el capítulo 12. El Hijo nace y «fue arrebatado hasta Dios y hasta Su trono»: es el nacimiento y la ascensión de Cristo. Luego la mujer huye y es sustentada por 1,260 días. <strong>El período comienza con la primera venida de Cristo.</strong> Es el tiempo de la iglesia en el desierto, entre la ascensión y el regreso.</p>
    <p>El Apocalipsis nombra este período de tres maneras: cuarenta y dos meses, 1,260 días, y «un tiempo, tiempos y medio tiempo», es decir, tres años y medio. Las tres vienen de Daniel, donde un tiempo de persecución feroz pero limitada dura lo que la NBLA traduce «tres años y medio» (Daniel 7:25; 12:7; literalmente, un tiempo, tiempos y la mitad de un tiempo). Tres y medio es la mitad de siete: un tiempo <em>acortado</em>. También recuerda los tres años y medio en que Elías fue sustentado por Dios mientras la tierra estaba bajo juicio (Santiago 5:17). La iglesia es pisoteada pero protegida, perseguida pero sustentada, y el tiempo lo fija Dios, no el dragón.</p>
  </div>
  <ul class="periods" aria-label="Los cinco nombres de un solo período">
    <li><b>Cuarenta y dos meses</b><span>Las naciones pisotean el patio exterior; el templo interior es medido y guardado</span><span class="ref">11:2</span></li>
    <li><b>1,260 días</b><span>Los dos testigos profetizan vestidos de cilicio</span><span class="ref">11:3</span></li>
    <li><b>1,260 días</b><span>La mujer es sustentada en el desierto</span><span class="ref">12:6</span></li>
    <li><b>Un tiempo, tiempos y medio tiempo</b><span>La mujer es sustentada fuera del alcance de la serpiente</span><span class="ref">12:14</span></li>
    <li><b>Cuarenta y dos meses</b><span>A la bestia se le da autoridad para blasfemar y hacer guerra</span><span class="ref">13:5</span></li>
    <li class="short"><b>Tres días y medio</b><span>Al final mismo, los testigos yacen muertos y el mundo celebra, hasta que Dios los levanta</span><span class="ref">11:9–11</span></li>
  </ul>
  <section class="evidence" aria-labelledby="ev-1260-es">
    <h2 id="ev-1260-es">¿Cómo lo sabemos?</h2>
    <details class="ev"><summary><span class="ev-n">01</span><span class="ev-ref">Apocalipsis 12:5–6</span><i class="tag stated">Declarado</i></summary><div class="ev-body"><p>La mujer huye por 1,260 días justo después de que el Hijo es arrebatado hasta el trono de Dios.</p><a href="https://www.biblegateway.com/passage/?search=Apocalipsis+12&amp;version=NBLA" target="_blank" rel="noopener">Leer Apocalipsis 12 ↗</a></div></details>
    <details class="ev"><summary><span class="ev-n">02</span><span class="ev-ref">Apocalipsis 12:6, 14</span><i class="tag stated">Declarado</i></summary><div class="ev-body"><p>El mismo suceso, la mujer sustentada en el desierto, se describe como 1,260 días y como «un tiempo, tiempos y medio tiempo».</p><a href="https://www.biblegateway.com/passage/?search=Apocalipsis+12&amp;version=NBLA" target="_blank" rel="noopener">Leer Apocalipsis 12 ↗</a></div></details>
    <details class="ev"><summary><span class="ev-n">03</span><span class="ev-ref">Daniel 7:25; 12:7</span><i class="tag link">Conexión</i></summary><div class="ev-body"><p>Daniel usa la expresión «tres años y medio» (literalmente, un tiempo, tiempos y la mitad de un tiempo) para la persecución de los santos por un poder hostil, un período limitado al que Dios pone fin.</p><a href="https://www.biblegateway.com/passage/?search=Daniel+7&amp;version=NBLA" target="_blank" rel="noopener">Leer Daniel 7 ↗</a></div></details>
    <details class="ev"><summary><span class="ev-n">04</span><span class="ev-ref">Fechas exactas</span><i class="tag caution">Precaución</i></summary><div class="ev-body"><p>Mucha gente ha intentado convertir estos números en calendarios. Todas esas fechas han fallado, y Jesús dijo: «de aquel día y hora nadie sabe» (Mateo 24:36).</p></div></details>
  </section>
  <details class="alt"><summary>Cómo lo leen otros</summary><div class="alt-body"><div class="alt-grid">
    <article><h3>La segunda mitad de la semana setenta de Daniel</h3><p>Los futuristas toman los 1,260 días como días literales en la última mitad de una tribulación de siete años. Los historicistas suelen leerlos como 1,260 años.</p></article>
    <article class="ours"><h3>Toda la era de la iglesia</h3><p>Los números describen un solo período limitado por Dios, desde la ascensión hasta el regreso, visto como pisoteo, testimonio, protección y persecución.</p></article>
  </div></div></details>
  <aside class="lesson"><span class="rubric">La lección para recordar</span><p>El desierto de la iglesia tiene fecha de término, y Dios la fijó. Mientras tanto, Él sustenta a Su pueblo.</p></aside>
  <section class="quiz"><span class="rubric">Comprueba lo que aprendiste</span><h3>En Apocalipsis 12, ¿después de qué suceso comienzan los 1,260 días de la mujer?</h3><div class="quiz-options"><button class="quiz-opt" data-correct>Su Hijo es arrebatado hasta Dios y hasta Su trono</button><button class="quiz-opt">El arrebatamiento de la iglesia</button><button class="quiz-opt">La reconstrucción de un templo</button></div><p class="quiz-feedback" hidden>El Hijo, Cristo, «fue arrebatado hasta Dios y hasta Su trono» (12:5), y luego la mujer huye (12:6). El período empieza con Su ascensión.</p></section>
</section>

<section class="page topic" id="satan" data-nav="¿Gobierna Satanás el mundo?" data-num="08" data-keywords="satanás diablo dragón serpiente guerra en el cielo miguel acusador arrojado apocalipsis 12 cruz derrotado">
  <p class="eyebrow">Pregunta 08 · Apocalipsis 12</p>
  <h1>¿Gobierna Satanás el mundo?</h1>
  <p class="deck">Un enemigo derrotado con el tiempo contado</p>
  <div class="locator" data-vision="4,7"></div>
  <ul class="refs" aria-label="Pasajes para leer"><li class="refs-label">Leer en la NBLA</li><li><a href="https://www.biblegateway.com/passage/?search=Apocalipsis+12&amp;version=NBLA" target="_blank" rel="noopener">Apocalipsis 12</a></li><li><a href="https://www.biblegateway.com/passage/?search=Juan+12&amp;version=NBLA" target="_blank" rel="noopener">Juan 12</a></li><li><a href="https://www.biblegateway.com/passage/?search=Colosenses+2&amp;version=NBLA" target="_blank" rel="noopener">Colosenses 2</a></li></ul>
  <figure class="art"><img data-art src="https://commons.wikimedia.org/wiki/Special:FilePath/Albrecht_D%C3%BCrer_-_Saint_Michael_Fighting_the_Dragon_(NGA_2008.109.12).jpg?width=1000" alt="Grabado: el arcángel Miguel y sus ángeles atraviesan con lanzas al dragón y a sus demonios en el cielo, sobre un paisaje tranquilo." loading="lazy" decoding="async" width="1000" height="1400"><figcaption><b>San Miguel combatiendo al dragón</b>, Alberto Durero, 1498. Obra histórica, no un retrato literal de la visión.</figcaption></figure>
  <blockquote class="passage"><span class="rubric">El texto</span><p>Y fue arrojado el gran dragón, la serpiente antigua que se llama Diablo y Satanás, el cual engaña al mundo entero. Fue arrojado a la tierra y sus ángeles fueron arrojados con él.</p><footer><cite>Apocalipsis 12:9</cite><a href="https://www.biblegateway.com/passage/?search=Apocalipsis+12&amp;version=NBLA" target="_blank" rel="noopener">Leer el capítulo ↗</a></footer></blockquote>
  <div class="myth"><span class="rubric">Un malentendido común</span><p>Dios y Satanás son dos poderes iguales enfrascados en una lucha de resultado todavía incierto.</p></div>
  <div class="teach">
    <h2>Lo que enseña la Escritura</h2>
    <p class="illum">La guerra en el cielo de Apocalipsis 12 no trata de algo anterior a la creación. Sucede a causa de la cruz. El Hijo es arrebatado hasta el trono de Dios, el dragón es arrojado, y el cielo explica por qué: «Ahora ha venido la salvación, el poder y el reino de nuestro Dios y la autoridad de Su Cristo, porque <strong>el acusador de nuestros hermanos</strong>, el que los acusa delante de nuestro Dios día y noche, <strong>ha sido arrojado</strong>». Los santos «lo vencieron por medio de la sangre del Cordero y por la palabra del testimonio de ellos» (12:10–11). Jesús dijo lo mismo camino a la cruz: «ahora el príncipe de este mundo será echado fuera» (Juan 12:31).</p>
    <p>Así que Satanás es real, peligroso y furioso, pero es una criatura derrotada. Ya no puede acusar al pueblo de Dios delante de Dios, porque Cristo pagó por sus pecados. Se enfurece en la tierra «sabiendo que tiene poco tiempo» (12:12). Todavía persigue y engaña, y Pedro advierte que «anda al acecho como león rugiente, buscando a quien devorar» (1 Pedro 5:8). Pero está encadenado (20:1–3), su sentencia ya fue dictada y el lago de fuego lo espera (20:10).</p>
  </div>
  <section class="evidence" aria-labelledby="ev-satan-es">
    <h2 id="ev-satan-es">¿Cómo lo sabemos?</h2>
    <details class="ev"><summary><span class="ev-n">01</span><span class="ev-ref">Apocalipsis 12:5, 9–11</span><i class="tag stated">Declarado</i></summary><div class="ev-body"><p>El dragón es arrojado después de que el Hijo es arrebatado hasta Dios, y el cielo celebra la llegada de la salvación por la sangre del Cordero.</p><a href="https://www.biblegateway.com/passage/?search=Apocalipsis+12&amp;version=NBLA" target="_blank" rel="noopener">Leer Apocalipsis 12 ↗</a></div></details>
    <details class="ev"><summary><span class="ev-n">02</span><span class="ev-ref">Juan 12:31; Lucas 10:18; Colosenses 2:14–15</span><i class="tag link">Conexión</i></summary><div class="ev-body"><p>Jesús dijo: «Yo veía a Satanás caer del cielo como un rayo», y habló del príncipe de este mundo echado fuera. Pablo dice que Cristo, al clavar en la cruz el documento de deuda, despojó «a los poderes y autoridades» e «hizo de ellos un espectáculo público».</p><a href="https://www.biblegateway.com/passage/?search=Colosenses+2&amp;version=NBLA" target="_blank" rel="noopener">Leer Colosenses 2 ↗</a></div></details>
    <details class="ev"><summary><span class="ev-n">03</span><span class="ev-ref">Apocalipsis 12:12; 1 Pedro 5:8</span><i class="tag stated">Declarado</i></summary><div class="ev-body"><p>El diablo sigue activo y furioso, pero tiene poco tiempo.</p><a href="https://www.biblegateway.com/passage/?search=1+Pedro+5&amp;version=NBLA" target="_blank" rel="noopener">Leer 1 Pedro 5 ↗</a></div></details>
    <details class="ev"><summary><span class="ev-n">04</span><span class="ev-ref">Apocalipsis 20:10</span><i class="tag stated">Declarado</i></summary><div class="ev-body"><p>«El diablo que los engañaba fue arrojado al lago de fuego y azufre». Su fin es seguro.</p><a href="https://www.biblegateway.com/passage/?search=Apocalipsis+20&amp;version=NBLA" target="_blank" rel="noopener">Leer Apocalipsis 20 ↗</a></div></details>
  </section>
  <details class="alt"><summary>Cómo lo leen otros</summary><div class="alt-body"><div class="alt-grid">
    <article><h3>Una caída futura o primitiva</h3><p>Algunos leen la guerra en el cielo como la rebelión original de Satanás antes de la creación; otros la sitúan en medio de una tribulación futura.</p></article>
    <article class="ours"><h3>Arrojado por la cruz</h3><p>El contexto une la derrota de Satanás a la muerte y ascensión de Cristo. Apocalipsis 12 explica por qué el diablo se enfurece ahora: ha perdido, y lo sabe.</p></article>
  </div></div></details>
  <aside class="lesson"><span class="rubric">La lección para recordar</span><p>No subestimes al diablo, pero nunca imagines que es igual a Dios. El acusador ha sido arrojado.</p></aside>
  <section class="quiz"><span class="rubric">Comprueba lo que aprendiste</span><h3>¿Cómo vencen los santos al dragón en Apocalipsis 12?</h3><div class="quiz-options"><button class="quiz-opt" data-correct>Por medio de la sangre del Cordero y la palabra de su testimonio</button><button class="quiz-opt">Superándolo con sus propios ejércitos de ángeles</button><button class="quiz-opt">No pueden; el resultado sigue indeciso</button></div><p class="quiz-feedback" hidden>«Ellos lo vencieron por medio de la sangre del Cordero y por la palabra del testimonio de ellos» (12:11). La victoria se ganó en la cruz.</p></section>
</section>

<section class="page topic" id="beast" data-nav="¿Qué es la bestia?" data-num="09" data-keywords="bestia mar tierra falso profeta daniel 7 roma imperio apocalipsis 13 estado poder">
  <p class="eyebrow">Pregunta 09 · Apocalipsis 13</p>
  <h1>¿Qué es la bestia?</h1>
  <p class="deck">El poder que pretende ser Dios</p>
  <div class="locator" data-vision="4,6"></div>
  <ul class="refs" aria-label="Pasajes para leer"><li class="refs-label">Leer en la NBLA</li><li><a href="https://www.biblegateway.com/passage/?search=Apocalipsis+13&amp;version=NBLA" target="_blank" rel="noopener">Apocalipsis 13</a></li><li><a href="https://www.biblegateway.com/passage/?search=Daniel+7&amp;version=NBLA" target="_blank" rel="noopener">Daniel 7</a></li><li><a href="https://www.biblegateway.com/passage/?search=Apocalipsis+19&amp;version=NBLA" target="_blank" rel="noopener">Apocalipsis 19</a></li></ul>
  <figure class="art"><img data-art src="https://commons.wikimedia.org/wiki/Special:FilePath/Albrecht_D%C3%BCrer_-_The_Seven-Headed_Beast_and_the_Beast_with_Lamb%27s_Horns_-_Google_Art_Project.jpg?width=1000" alt="Grabado: una bestia de siete cabezas sube del mar mientras una segunda bestia con cuernos de cordero hace descender fuego, y las multitudes se arrodillan en adoración." loading="lazy" decoding="async" width="1000" height="1400"><figcaption><b>La bestia de siete cabezas y la bestia con cuernos de cordero</b>, Alberto Durero, hacia 1496–98. Obra histórica, no un retrato literal de la visión.</figcaption></figure>
  <blockquote class="passage"><span class="rubric">El texto</span><p>Y vi que subía del mar una bestia que tenía diez cuernos y siete cabezas. En sus cuernos había diez diademas, y en sus cabezas había nombres blasfemos. La bestia que vi era semejante a un leopardo, sus pies eran como los de un oso y su boca como la boca de un león. El dragón le dio su poder, su trono, y gran autoridad.</p><footer><cite>Apocalipsis 13:1–2</cite><a href="https://www.biblegateway.com/passage/?search=Apocalipsis+13&amp;version=NBLA" target="_blank" rel="noopener">Leer el capítulo ↗</a></footer></blockquote>
  <div class="myth"><span class="rubric">Un malentendido común</span><p>La bestia es solo un futuro dictador mundial, y la tarea de los cristianos es averiguar quién es.</p></div>
  <div class="teach">
    <h2>Lo que enseña la Escritura</h2>
    <p class="illum">En Daniel 7 suben del mar cuatro bestias, y a Daniel se le explica: «Estas bestias enormes, que son cuatro, son cuatro reyes que se levantarán de la tierra» (7:17). Un león, un oso, un leopardo y una cuarta bestia aterradora. La bestia de Juan es todas ellas en una: leopardo, oso y león a la vez. <strong>Es el Estado que desafía a Dios</strong>: el poder político que exige la adoración que solo pertenece a Dios y que hace «guerra contra los santos» (13:7). Para los primeros lectores de Juan, eso era Roma y su culto al emperador. Pero la bestia sobrevive a Roma. Ha vuelto a levantarse en cada imperio que se ha hecho pasar por dios.</p>
    <p>Una segunda bestia sube de la tierra. «Tenía dos cuernos semejantes a los de un cordero y hablaba como un dragón» (13:11). Hace señales y persuade a la gente a adorar a la primera bestia; más adelante el Apocalipsis la llama «el falso profeta» (16:13; 19:20). Es la religión falsa y la propaganda al servicio del Estado. Juntos, el dragón, la bestia y el falso profeta forman una imitación malvada del Padre, el Hijo y el Espíritu. La bestia incluso tiene una herida mortal que «fue sanada» (13:3), una parodia de la resurrección. Al final, este patrón llega a su punto culminante, en lo que Hoekema llamó a la vez un principio y una persona. Y entonces es apresada y arrojada al lago de fuego (19:20).</p>
  </div>
  <div class="pair-cards">
    <article class="red"><span class="ref">13:1–10 · del mar</span><h3>La primera bestia</h3><p>Poder político que reclama autoridad divina. Blasfema contra Dios, hace guerra contra los santos y el mundo la adora.</p></article>
    <article class="red"><span class="ref">13:11–18 · de la tierra</span><h3>El falso profeta</h3><p>Religión y persuasión al servicio del Estado. Parece un cordero, habla como el dragón.</p></article>
  </div>
  <section class="evidence" aria-labelledby="ev-beast-es">
    <h2 id="ev-beast-es">¿Cómo lo sabemos?</h2>
    <details class="ev"><summary><span class="ev-n">01</span><span class="ev-ref">Daniel 7:3–7, 17</span><i class="tag stated">Declarado</i></summary><div class="ev-body"><p>Las bestias de Daniel que suben del mar se explican como reyes y reinos.</p><a href="https://www.biblegateway.com/passage/?search=Daniel+7&amp;version=NBLA" target="_blank" rel="noopener">Leer Daniel 7 ↗</a></div></details>
    <details class="ev"><summary><span class="ev-n">02</span><span class="ev-ref">Apocalipsis 13:1–2</span><i class="tag link">Conexión</i></summary><div class="ev-body"><p>La bestia de Juan combina el leopardo, el oso y el león de Daniel, y tiene diez cuernos como la cuarta bestia de Daniel.</p><a href="https://www.biblegateway.com/passage/?search=Apocalipsis+13&amp;version=NBLA" target="_blank" rel="noopener">Leer Apocalipsis 13 ↗</a></div></details>
    <details class="ev"><summary><span class="ev-n">03</span><span class="ev-ref">Apocalipsis 13:11–14; 19:20</span><i class="tag stated">Declarado</i></summary><div class="ev-body"><p>La segunda bestia dirige la adoración hacia la primera y más tarde es llamada el falso profeta.</p><a href="https://www.biblegateway.com/passage/?search=Apocalipsis+19&amp;version=NBLA" target="_blank" rel="noopener">Leer Apocalipsis 19 ↗</a></div></details>
    <details class="ev"><summary><span class="ev-n">04</span><span class="ev-ref">Apocalipsis 17:9–11</span><i class="tag caution">Precaución</i></summary><div class="ev-body"><p>Las siete cabezas son «siete montes» y siete reyes, lo cual hacía pensar en Roma a los lectores del primer siglo. Los intentos de hacer coincidir los reyes con una lista exacta de emperadores nunca se han puesto de acuerdo.</p><a href="https://www.biblegateway.com/passage/?search=Apocalipsis+17&amp;version=NBLA" target="_blank" rel="noopener">Leer Apocalipsis 17 ↗</a></div></details>
  </section>
  <details class="alt"><summary>Cómo lo leen otros</summary><div class="alt-body"><div class="alt-grid">
    <article><h3>Un solo gobernante futuro</h3><p>Los futuristas ven en la bestia del mar sobre todo a un dictador mundial venidero y su imperio, con el falso profeta como su aliado religioso.</p></article>
    <article class="ours"><h3>El Estado perseguidor de toda época</h3><p>Primero Roma, luego todo poder que desafía a Dios, y una encarnación final al terminar la era. La bestia es un patrón que culminará en una persona.</p></article>
  </div></div></details>
  <aside class="lesson"><span class="rubric">La lección para recordar</span><p>Los gobiernos son servidores de Dios, nunca Dios. Cuando un poder exige la adoración que pertenece a Cristo, el cristiano debe negarse.</p></aside>
  <section class="quiz"><span class="rubric">Comprueba lo que aprendiste</span><h3>¿Qué capítulo del Antiguo Testamento explica que las bestias que suben del mar son reinos?</h3><div class="quiz-options"><button class="quiz-opt" data-correct>Daniel 7</button><button class="quiz-opt">Génesis 1</button><button class="quiz-opt">Salmo 23</button></div><p class="quiz-feedback" hidden>Daniel vio cuatro bestias subir del mar, y se le dijo que son «cuatro reyes» (Daniel 7:17). La bestia de Juan las combina.</p></section>
</section>

<section class="page topic" id="666" data-nav="¿Qué significa el 666?" data-num="10" data-keywords="666 616 número de la bestia nerón gematría seis siete apocalipsis 13 18">
  <p class="eyebrow">Pregunta 10 · Apocalipsis 13:18</p>
  <h1>¿Qué significa el 666?</h1>
  <p class="deck">Un número, no una maldición</p>
  <div class="locator" data-vision="4"></div>
  <ul class="refs" aria-label="Pasajes para leer"><li class="refs-label">Leer en la NBLA</li><li><a href="https://www.biblegateway.com/passage/?search=Apocalipsis+13&amp;version=NBLA" target="_blank" rel="noopener">Apocalipsis 13</a></li></ul>
  <div class="number-art" aria-hidden="true">
    <div><span class="big">7</span><small>El número de la plenitud de Dios: siete iglesias, sellos, trompetas, copas</small></div>
    <div class="red"><span class="big">666</span><small>Seis, seis y seis: siempre uno menos que siete</small></div>
  </div>
  <blockquote class="passage"><span class="rubric">El texto</span><p>Aquí hay sabiduría. El que tiene entendimiento, que calcule el número de la bestia, porque el número es el de un hombre, y su número es 666.</p><footer><cite>Apocalipsis 13:18</cite><a href="https://www.biblegateway.com/passage/?search=Apocalipsis+13&amp;version=NBLA" target="_blank" rel="noopener">Leer el capítulo ↗</a></footer></blockquote>
  <div class="myth"><span class="rubric">Un malentendido común</span><p>Los dígitos 666 son peligrosos en sí mismos, así que verlos en un recibo, una placa o un número de teléfono trae maldición.</p></div>
  <div class="teach">
    <h2>Lo que enseña la Escritura</h2>
    <p class="illum">En el Apocalipsis, el siete es el número de la plenitud, el número de la obra perfecta de Dios. El seis se queda corto. El seis, repetido tres veces, es <strong>la humanidad que intenta ser Dios y siempre se queda corta</strong>. La bestia imita a la Trinidad, exige adoración y hace prodigios, pero sigue siendo solo «el de un hombre». Por más impresionante que parezca, nunca llegará al siete.</p>
    <p>Hay una segunda capa. En hebreo y en griego, las letras también servían como números. Si se escribe «Nerón César» con letras hebreas (<em>Nrwn Qsr</em>), sus valores suman 666. Nerón fue el primer emperador que persiguió a los cristianos, y muchos romanos esperaban que volviera; la herida sanada de la bestia quizá aluda a ese rumor (13:3). Algo notable: algunos manuscritos antiguos dicen 616, que es justo el total de la forma latina del nombre de Nerón escrita en letras hebreas. Nerón es la probable clave del primer siglo, y el significado simbólico alcanza a toda época. Las dos cosas encajan: Nerón fue simplemente el primer «hombre» del 666.</p>
  </div>
  <section class="evidence" aria-labelledby="ev-666-es">
    <h2 id="ev-666-es">¿Cómo lo sabemos?</h2>
    <details class="ev"><summary><span class="ev-n">01</span><span class="ev-ref">Apocalipsis 13:17–18</span><i class="tag stated">Declarado</i></summary><div class="ev-body"><p>El número pertenece al nombre de la bestia y «es el de un hombre». Juan pide sabiduría, no miedo.</p><a href="https://www.biblegateway.com/passage/?search=Apocalipsis+13&amp;version=NBLA" target="_blank" rel="noopener">Leer Apocalipsis 13 ↗</a></div></details>
    <details class="ev"><summary><span class="ev-n">02</span><span class="ev-ref">Los sietes del Apocalipsis</span><i class="tag link">Conexión</i></summary><div class="ev-body"><p>Siete iglesias, espíritus, sellos, trompetas, copas y más: el siete marca la plenitud de la obra de Dios.</p></div></details>
    <details class="ev"><summary><span class="ev-n">03</span><span class="ev-ref">Nerón César = 666</span><i class="tag inference">Inferencia</i></summary><div class="ev-body"><p>La grafía hebrea נרון קסר (50 + 200 + 6 + 50 + 100 + 60 + 200) suma 666; sin la <em>n</em> final suma 616, la variante que tienen algunos manuscritos. Esta identificación es muy aceptada, pero no es segura.</p></div></details>
    <details class="ev"><summary><span class="ev-n">04</span><span class="ev-ref">Nombres y aparatos modernos</span><i class="tag caution">Precaución</i></summary><div class="ev-body"><p>Casi cualquier nombre puede sumar 666 si se ajusta lo suficiente. Los cálculos dirigidos a líderes modernos se han equivocado una y otra vez.</p></div></details>
  </section>
  <details class="alt"><summary>Cómo lo leen otros</summary><div class="alt-body"><div class="alt-grid">
    <article><h3>Un código para una persona futura</h3><p>Algunos futuristas esperan que el número identifique al Anticristo final por su nombre o por un sistema que él controle.</p></article>
    <article class="ours"><h3>La humanidad que se queda corta, vista primero en Nerón</h3><p>El número retrata a todo poder que intenta ser Dios y fracasa. Nerón fue el ejemplo del primer siglo; el patrón continúa hasta el fin.</p></article>
  </div></div></details>
  <aside class="lesson"><span class="rubric">La lección para recordar</span><p>El mal puede impresionar, pero es solo una criatura. Siempre se quedará a uno de Dios.</p></aside>
  <section class="quiz"><span class="rubric">Comprueba lo que aprendiste</span><h3>El Apocalipsis dice que el número de la bestia es el de…</h3><div class="quiz-options"><button class="quiz-opt" data-correct>un hombre</button><button class="quiz-opt">una maldición que cae sobre quien lo ve</button><button class="quiz-opt">la fecha del fin</button></div><p class="quiz-feedback" hidden>«El número es el de un hombre» (13:18). La bestia, a pesar de todo lo que pretende, es solo humana y se queda corta ante Dios.</p></section>
</section>

<section class="page topic" id="mark" data-nav="¿Qué es la marca de la bestia?" data-num="11" data-keywords="marca de la bestia frente mano sello de dios comprar vender lealtad adoración chip código de barras apocalipsis 13 14">
  <p class="eyebrow">Pregunta 11 · Apocalipsis 13:16–17</p>
  <h1>¿Qué es la marca de la bestia?</h1>
  <p class="deck">Una cuestión de lealtad</p>
  <div class="locator" data-vision="4"></div>
  <ul class="refs" aria-label="Pasajes para leer"><li class="refs-label">Leer en la NBLA</li><li><a href="https://www.biblegateway.com/passage/?search=Apocalipsis+13&amp;version=NBLA" target="_blank" rel="noopener">Apocalipsis 13</a></li><li><a href="https://www.biblegateway.com/passage/?search=Apocalipsis+14&amp;version=NBLA" target="_blank" rel="noopener">Apocalipsis 14</a></li><li><a href="https://www.biblegateway.com/passage/?search=Apocalipsis+7&amp;version=NBLA" target="_blank" rel="noopener">Apocalipsis 7</a></li><li><a href="https://www.biblegateway.com/passage/?search=Deuteronomio+6&amp;version=NBLA" target="_blank" rel="noopener">Deuteronomio 6</a></li></ul>
  <blockquote class="passage"><span class="rubric">El texto</span><p>Y hace que a todos, pequeños y grandes, ricos y pobres, libres y esclavos, se les dé una marca en la mano derecha o en la frente, para que nadie pueda comprar ni vender, sino el que tenga la marca, la cual es el nombre de la bestia o el número de su nombre.</p><footer><cite>Apocalipsis 13:16–17</cite><a href="https://www.biblegateway.com/passage/?search=Apocalipsis+13&amp;version=NBLA" target="_blank" rel="noopener">Leer el capítulo ↗</a></footer></blockquote>
  <div class="myth"><span class="rubric">Un malentendido común</span><p>La marca es un microchip, un código de barras, una vacuna o una identificación digital que alguien podría recibir sin darse cuenta.</p></div>
  <div class="teach">
    <h2>Lo que enseña la Escritura</h2>
    <p class="illum">El Apocalipsis tiene dos marcas, no una. Antes de que la bestia marque a nadie, Dios ordena que nada sea dañado «hasta que hayamos puesto un sello en la frente a los siervos de nuestro Dios» (7:3), y los 144,000 tienen «el nombre del Cordero y el nombre de Su Padre escrito en la frente» (14:1). Nadie piensa que el sello de Dios sea un tatuaje. Significa que le pertenecen. <strong>La marca de la bestia es la imitación</strong>: muestra quién pertenece a la bestia.</p>
    <p>¿Por qué la mano y la frente? Porque Dios le dijo a Israel acerca de Sus palabras: «Las atarás como una señal a tu mano, y serán por insignias entre tus ojos» (Deuteronomio 6:8). Es decir, Su palabra debía gobernar lo que pensaban y lo que hacían. La marca de la bestia es lo contrario: una mente y una vida moldeadas por la lealtad al poder que desafía a Dios. El detalle de comprar y vender muestra cómo funciona esa presión. En tiempos de Juan, un gremio de oficios podía excluir a quien no honrara a los dioses y al emperador. El Apocalipsis trata de la adoración y la lealtad, y toda persona lleva una marca o la otra.</p>
  </div>
  <div class="pair-cards">
    <article class="dark"><span class="ref">7:3 · 14:1 · 22:4</span><h3>El sello de Dios</h3><p>El nombre del Padre y del Cordero en la frente. Pertenencia, protección y, al final, ver Su rostro.</p></article>
    <article class="red"><span class="ref">13:16–17 · 14:9–11</span><h3>La marca de la bestia</h3><p>El nombre de la bestia en la mano o en la frente. Lealtad comprada con acceso al mercado, y perdida en el juicio.</p></article>
  </div>
  <section class="evidence" aria-labelledby="ev-mark-es">
    <h2 id="ev-mark-es">¿Cómo lo sabemos?</h2>
    <details class="ev"><summary><span class="ev-n">01</span><span class="ev-ref">Apocalipsis 13:15–17</span><i class="tag stated">Declarado</i></summary><div class="ev-body"><p>La marca va unida a la adoración de la imagen de la bestia y a la exclusión del comercio.</p><a href="https://www.biblegateway.com/passage/?search=Apocalipsis+13&amp;version=NBLA" target="_blank" rel="noopener">Leer Apocalipsis 13 ↗</a></div></details>
    <details class="ev"><summary><span class="ev-n">02</span><span class="ev-ref">Apocalipsis 7:3; 14:1; 22:4</span><i class="tag link">Conexión</i></summary><div class="ev-body"><p>Los siervos de Dios son sellados con Su nombre en la frente: «Su nombre estará en sus frentes». El Apocalipsis pone las dos marcas lado a lado.</p><a href="https://www.biblegateway.com/passage/?search=Apocalipsis+14&amp;version=NBLA" target="_blank" rel="noopener">Leer Apocalipsis 14 ↗</a></div></details>
    <details class="ev"><summary><span class="ev-n">03</span><span class="ev-ref">Deuteronomio 6:6–8</span><i class="tag link">Conexión</i></summary><div class="ev-body"><p>Las palabras de Dios debían atarse a la mano y llevarse entre los ojos: pensamiento y acción consagrados a Él.</p><a href="https://www.biblegateway.com/passage/?search=Deuteronomio+6&amp;version=NBLA" target="_blank" rel="noopener">Leer Deuteronomio 6 ↗</a></div></details>
    <details class="ev"><summary><span class="ev-n">04</span><span class="ev-ref">Apocalipsis 14:9–11</span><i class="tag stated">Declarado</i></summary><div class="ev-body"><p>Recibir la marca va unido a adorar a la bestia: «Si alguien adora a la bestia y a su imagen, y recibe una marca en su frente o en su mano». Es una lealtad elegida, no un accidente.</p><a href="https://www.biblegateway.com/passage/?search=Apocalipsis+14&amp;version=NBLA" target="_blank" rel="noopener">Leer Apocalipsis 14 ↗</a></div></details>
  </section>
  <details class="alt"><summary>Cómo lo leen otros</summary><div class="alt-body"><div class="alt-grid">
    <article><h3>Una señal visible del fin</h3><p>Algunos esperan una marca literal y visible impuesta por un régimen final, y vigilan las nuevas tecnologías buscándola.</p></article>
    <article class="ours"><h3>Dos maneras de pertenecer</h3><p>La marca y el sello representan la lealtad a la bestia o a Dios. La presión de transigir para poder trabajar y comerciar es tan real hoy como en tiempos de Juan.</p></article>
  </div></div></details>
  <aside class="lesson"><span class="rubric">La lección para recordar</span><p>No te preguntes a qué aparato temer. Pregúntate qué nombre está escrito en tu manera de pensar y de actuar.</p></aside>
  <section class="quiz"><span class="rubric">Comprueba lo que aprendiste</span><h3>¿Qué pone el Apocalipsis frente a la marca de la bestia?</h3><div class="quiz-options"><button class="quiz-opt" data-correct>El sello de Dios, Su nombre en la frente de Sus siervos</button><button class="quiz-opt">Un microchip rival emitido por la iglesia</button><button class="quiz-opt">Nada. Todos reciben la marca</button></div><p class="quiz-feedback" hidden>Dios sella primero a Sus siervos (7:3; 14:1). Toda persona pertenece a Dios o a la bestia.</p></section>
</section>

<section class="page topic" id="antichrist" data-nav="¿Quién es el Anticristo?" data-num="12" data-keywords="anticristo hombre de pecado inicuo impío 1 juan 2 tesalonicenses 2 papado papa bestia confesión">
  <p class="eyebrow">Pregunta 12 · 1 Juan 2 y 2 Tesalonicenses 2</p>
  <h1>¿Quién es el Anticristo?</h1>
  <p class="deck">Un espíritu que ya actúa, y un último opositor que vendrá</p>
  <div class="locator" data-vision="4"></div>
  <ul class="refs" aria-label="Pasajes para leer"><li class="refs-label">Leer en la NBLA</li><li><a href="https://www.biblegateway.com/passage/?search=1+Juan+2&amp;version=NBLA" target="_blank" rel="noopener">1 Juan 2</a></li><li><a href="https://www.biblegateway.com/passage/?search=2+Juan+1&amp;version=NBLA" target="_blank" rel="noopener">2 Juan</a></li><li><a href="https://www.biblegateway.com/passage/?search=2+Tesalonicenses+2&amp;version=NBLA" target="_blank" rel="noopener">2 Tesalonicenses 2</a></li></ul>
  <figure class="art"><img data-art src="https://commons.wikimedia.org/wiki/Special:FilePath/Bamberg_Apocalypse_Msc.Bibl.140_0070._32v_The_beast_of_the_sea_miniature_cropped.jpg?width=1000" alt="Miniatura medieval: una bestia de muchas cabezas sube del mar." loading="lazy" decoding="async" width="1000" height="1000"><figcaption><b>La bestia del mar</b>, Apocalipsis de Bamberg, comienzos del siglo XI. Obra histórica, no un retrato literal de la visión.</figcaption></figure>
  <blockquote class="passage"><span class="rubric">El texto</span><p>Hijitos, es la última hora, y así como oyeron que el anticristo viene, también ahora han surgido muchos anticristos. Por eso sabemos que es la última hora.</p><footer><cite>1 Juan 2:18</cite><a href="https://www.biblegateway.com/passage/?search=1+Juan+2&amp;version=NBLA" target="_blank" rel="noopener">Leer el capítulo ↗</a></footer></blockquote>
  <div class="myth"><span class="rubric">Un malentendido común</span><p>El Apocalipsis trata del Anticristo, un misterioso dictador futuro al que los cristianos deben intentar identificar entre los políticos de hoy.</p></div>
  <div class="teach">
    <h2>Lo que enseña la Escritura</h2>
    <p class="illum">La palabra <em>anticristo</em> nunca aparece en el Apocalipsis. Solo la usan las cartas de Juan, y allí dice algo sorprendente: «ahora han surgido muchos anticristos». Un anticristo es cualquiera que «niega que Jesús es el Cristo» (1 Juan 2:22), o que no confiesa «que Jesucristo ha venido en carne» (2 Juan 7). El «espíritu del anticristo» ya estaba en el mundo en el primer siglo (1 Juan 4:3). Y Juan dice que por eso saben que «es la última hora», lo cual muestra que los últimos días comenzaron con la primera venida de Cristo.</p>
    <p>Pablo añade que antes del regreso de Cristo será revelado «el hombre de pecado, el hijo de perdición», que «se sienta en el templo de Dios, presentándose como si fuera Dios», y a quien «el Señor matará con el espíritu de Su boca» (2 Tesalonicenses 2:3–8). Pero aun entonces «el misterio de la iniquidad ya está en acción» (2:7). Juntando todo, Hoekema describió al anticristo como <strong>un espíritu presente y una persona futura</strong>: la oposición a Cristo recorre toda la era y llega a su punto culminante justo antes del fin. La bestia del Apocalipsis es la misma realidad en forma de imagen.</p>
  </div>
  <div class="note"><p><strong>Una nota de la historia reformada.</strong> La Confesión de Westminster (25.6) y la Confesión Bautista de Londres de 1689 (26.4) identificaron al papa de Roma como aquel anticristo, aquel hombre de pecado e hijo de perdición. Los reformadores veían en las pretensiones de Roma al hombre de pecado sentado en el templo de Dios. Algunas revisiones posteriores, como la revisión estadounidense de 1903 de la Confesión de Westminster, quitaron esa frase, y los cristianos reformados de hoy difieren en si debe sostenerse como identificación definitiva o como una encarnación histórica del espíritu del anticristo.</p></div>
  <section class="evidence" aria-labelledby="ev-antichrist-es">
    <h2 id="ev-antichrist-es">¿Cómo lo sabemos?</h2>
    <details class="ev"><summary><span class="ev-n">01</span><span class="ev-ref">1 Juan 2:18, 22; 4:3; 2 Juan 7</span><i class="tag stated">Declarado</i></summary><div class="ev-body"><p>Muchos anticristos ya habían venido; el espíritu del anticristo niega al Padre y al Hijo, y niega la encarnación.</p><a href="https://www.biblegateway.com/passage/?search=1+Juan+2&amp;version=NBLA" target="_blank" rel="noopener">Leer 1 Juan 2 ↗</a></div></details>
    <details class="ev"><summary><span class="ev-n">02</span><span class="ev-ref">2 Tesalonicenses 2:3–8</span><i class="tag stated">Declarado</i></summary><div class="ev-body"><p>Un último hombre de pecado será revelado y destruido por Cristo en Su venida: Él lo «destruirá con el resplandor de Su venida».</p><a href="https://www.biblegateway.com/passage/?search=2+Tesalonicenses+2&amp;version=NBLA" target="_blank" rel="noopener">Leer 2 Tesalonicenses 2 ↗</a></div></details>
    <details class="ev"><summary><span class="ev-n">03</span><span class="ev-ref">Apocalipsis 13; 19:19–20</span><i class="tag inference">Inferencia</i></summary><div class="ev-body"><p>La blasfemia de la bestia, la adoración que recibe y su destrucción en la venida de Cristo coinciden con el hombre de pecado de Pablo. Relacionarlos es una interpretación, ya que el Apocalipsis no usa la palabra.</p><a href="https://www.biblegateway.com/passage/?search=Apocalipsis+13&amp;version=NBLA" target="_blank" rel="noopener">Leer Apocalipsis 13 ↗</a></div></details>
  </section>
  <details class="alt"><summary>Cómo lo leen otros</summary><div class="alt-body"><div class="alt-grid">
    <article><h3>Solo un gobernante mundial futuro</h3><p>El futurismo popular espera que un individuo surja en los últimos siete años, haga un pacto con Israel y luego lo rompa.</p></article>
    <article class="ours"><h3>Un espíritu presente y una persona futura</h3><p>Ha habido anticristos a lo largo de la historia; uno último aparecerá antes del regreso de Cristo y será destruido por Él.</p></article>
  </div></div></details>
  <aside class="lesson"><span class="rubric">La lección para recordar</span><p>No conviertas el Apocalipsis en un juego de adivinanzas sobre figuras públicas. Aprende a reconocer toda enseñanza y todo poder que niega a Jesucristo.</p></aside>
  <section class="quiz"><span class="rubric">Comprueba lo que aprendiste</span><h3>¿Dónde se usa la palabra «anticristo» en la Biblia?</h3><div class="quiz-options"><button class="quiz-opt" data-correct>Solo en las cartas de Juan</button><button class="quiz-opt">A lo largo de todo el Apocalipsis</button><button class="quiz-opt">En Daniel</button></div><p class="quiz-feedback" hidden>«Anticristo» aparece solo en 1 y 2 Juan, donde Juan dice que «han surgido muchos anticristos» (1 Juan 2:18).</p></section>
</section>

<section class="page topic" id="tribulation" data-nav="¿Qué es la gran tribulación?" data-num="13" data-keywords="gran tribulación siete años sufrimiento persecución apocalipsis 7 14 era de la iglesia daniel semana setenta">
  <p class="eyebrow">Pregunta 13 · Apocalipsis 1:9 y 7:14</p>
  <h1>¿Qué es la gran tribulación?</h1>
  <p class="deck">Fidelidad bajo presión, en toda época</p>
  <div class="locator" data-vision="2,3,4"></div>
  <ul class="refs" aria-label="Pasajes para leer"><li class="refs-label">Leer en la NBLA</li><li><a href="https://www.biblegateway.com/passage/?search=Apocalipsis+7&amp;version=NBLA" target="_blank" rel="noopener">Apocalipsis 7</a></li><li><a href="https://www.biblegateway.com/passage/?search=Juan+16&amp;version=NBLA" target="_blank" rel="noopener">Juan 16</a></li><li><a href="https://www.biblegateway.com/passage/?search=Hechos+14&amp;version=NBLA" target="_blank" rel="noopener">Hechos 14</a></li></ul>
  <figure class="art"><img data-art src="https://commons.wikimedia.org/wiki/Special:FilePath/Albrecht_D%C3%BCrer,_The_Opening_of_the_Fifth_and_Sixth_Seals,_probably_c._1496-1498,_NGA_52558.jpg?width=1000" alt="Grabado: ángeles dan vestiduras blancas a las almas de los mártires debajo del altar mientras caen estrellas sobre gente aterrada." loading="lazy" decoding="async" width="1000" height="1400"><figcaption><b>La apertura del quinto y del sexto sello</b>, Alberto Durero, hacia 1496–98. Los mártires reciben vestiduras blancas. Obra histórica, no un retrato literal de la visión.</figcaption></figure>
  <blockquote class="passage"><span class="rubric">El texto</span><p>Y le respondí: «Señor mío, usted lo sabe». Y él me dijo: «Estos son los que vienen de la gran tribulación, y han lavado sus vestiduras y las han emblanquecido en la sangre del Cordero».</p><footer><cite>Apocalipsis 7:14</cite><a href="https://www.biblegateway.com/passage/?search=Apocalipsis+7&amp;version=NBLA" target="_blank" rel="noopener">Leer el capítulo ↗</a></footer></blockquote>
  <div class="myth"><span class="rubric">Un malentendido común</span><p>La gran tribulación es un período de siete años al final de la historia, y los cristianos serán quitados antes de que comience.</p></div>
  <div class="teach">
    <h2>Lo que enseña la Escritura</h2>
    <p class="illum">Juan abre el libro presentándose como «hermano de ustedes y compañero en <strong>la tribulación</strong>, en el reino y en la perseverancia en Jesús» (1:9). Para él, en Patmos, la tribulación ya había comenzado. Jesús se la prometió a todo discípulo: «En el mundo tienen tribulación; pero confíen, Yo he vencido al mundo» (Juan 16:33). Pablo les dijo a los nuevos creyentes: «Es necesario que a través de muchas tribulaciones entremos en el reino de Dios» (Hechos 14:22).</p>
    <p>Así que la gran multitud de 7:14 es la iglesia de toda época, que sale de las pruebas de esta vida hacia la presencia de Dios. Eso no descarta una persecución final más aguda al final mismo: la última guerra de la bestia contra los testigos (11:7) y la breve liberación de Satanás (20:7–9). Pero la iglesia pasa <em>por</em> la tribulación, sellada y guardada por Dios, no alrededor de ella. El Apocalipsis no menciona en ninguna parte un período de siete años. Ese esquema surge de unirlo a una lectura particular de Daniel 9:27.</p>
  </div>
  <section class="evidence" aria-labelledby="ev-trib-es">
    <h2 id="ev-trib-es">¿Cómo lo sabemos?</h2>
    <details class="ev"><summary><span class="ev-n">01</span><span class="ev-ref">Apocalipsis 1:9</span><i class="tag stated">Declarado</i></summary><div class="ev-body"><p>Juan ya comparte «la tribulación» con las iglesias.</p><a href="https://www.biblegateway.com/passage/?search=Apocalipsis+1&amp;version=NBLA" target="_blank" rel="noopener">Leer Apocalipsis 1 ↗</a></div></details>
    <details class="ev"><summary><span class="ev-n">02</span><span class="ev-ref">Juan 16:33; Hechos 14:22; 2 Timoteo 3:12</span><i class="tag link">Conexión</i></summary><div class="ev-body"><p>Jesús y los apóstoles enseñan que el sufrimiento es parte de la vida cristiana normal.</p><a href="https://www.biblegateway.com/passage/?search=Juan+16&amp;version=NBLA" target="_blank" rel="noopener">Leer Juan 16 ↗</a></div></details>
    <details class="ev"><summary><span class="ev-n">03</span><span class="ev-ref">Apocalipsis 3:10; Juan 17:15</span><i class="tag link">Conexión</i></summary><div class="ev-body"><p>Cristo promete: «Yo también te guardaré de la hora de la prueba», con el mismo lenguaje que Jesús usó al orar: «No te ruego que los saques del mundo, sino que los guardes del maligno». Protección en la prueba, no retiro de ella.</p><a href="https://www.biblegateway.com/passage/?search=Juan+17&amp;version=NBLA" target="_blank" rel="noopener">Leer Juan 17 ↗</a></div></details>
    <details class="ev"><summary><span class="ev-n">04</span><span class="ev-ref">Una tribulación de siete años</span><i class="tag caution">Precaución</i></summary><div class="ev-body"><p>La idea depende de poner un intervalo antes de la última de las setenta semanas de Daniel (Daniel 9:27). El Apocalipsis mismo nunca habla de siete años.</p></div></details>
  </section>
  <details class="alt"><summary>Cómo lo leen otros</summary><div class="alt-body"><div class="alt-grid">
    <article><h3>Siete años futuros</h3><p>Los dispensacionalistas esperan una tribulación de siete años después de un arrebatamiento previo, y llaman «la gran tribulación» a su segunda mitad.</p></article>
    <article class="ours"><h3>Toda la era, más aguda al final</h3><p>La iglesia sufre tribulación desde los apóstoles hasta el regreso, con una temporada final intensa, y Dios la guarda en todo momento.</p></article>
  </div></div></details>
  <aside class="lesson"><span class="rubric">La lección para recordar</span><p>Cristo no promete librarnos de los problemas. Promete guardarnos en ellos y llevarnos a través de ellos hasta la gloria.</p></aside>
  <section class="quiz"><span class="rubric">Comprueba lo que aprendiste</span><h3>En Apocalipsis 1:9, ¿cómo se describe Juan a sí mismo?</h3><div class="quiz-options"><button class="quiz-opt" data-correct>Compañero de las iglesias en la tribulación</button><button class="quiz-opt">Alguien que fue quitado a salvo antes de la tribulación</button><button class="quiz-opt">Profeta de una tribulación a dos mil años de distancia</button></div><p class="quiz-feedback" hidden>Juan se llama «hermano de ustedes y compañero en la tribulación» (1:9). Ya era la experiencia de la iglesia.</p></section>
</section>

<section class="page topic" id="babylon" data-nav="¿Quién es Babilonia la grande?" data-num="14" data-keywords="babilonia gran ramera prostituta roma ciudad mercaderes novia apocalipsis 17 18 salgan de ella">
  <p class="eyebrow">Pregunta 14 · Apocalipsis 17–18</p>
  <h1>¿Quién es Babilonia la grande?</h1>
  <p class="deck">La ciudad del orgullo humano, y la ciudad de Dios</p>
  <div class="locator" data-vision="6"></div>
  <ul class="refs" aria-label="Pasajes para leer"><li class="refs-label">Leer en la NBLA</li><li><a href="https://www.biblegateway.com/passage/?search=Apocalipsis+17&amp;version=NBLA" target="_blank" rel="noopener">Apocalipsis 17</a></li><li><a href="https://www.biblegateway.com/passage/?search=Apocalipsis+18&amp;version=NBLA" target="_blank" rel="noopener">Apocalipsis 18</a></li><li><a href="https://www.biblegateway.com/passage/?search=G%C3%A9nesis+11&amp;version=NBLA" target="_blank" rel="noopener">Génesis 11</a></li><li><a href="https://www.biblegateway.com/passage/?search=Jerem%C3%ADas+51&amp;version=NBLA" target="_blank" rel="noopener">Jeremías 51</a></li></ul>
  <figure class="art"><img data-art src="https://commons.wikimedia.org/wiki/Special:FilePath/Albrecht_D%C3%BCrer,_The_Whore_of_Babylon,_1498,_NGA_142362.jpg?width=1000" alt="Grabado: una mujer ricamente vestida sobre una bestia de siete cabezas levanta una copa ante gente que la admira, mientras una ciudad arde y un ángel anuncia su caída." loading="lazy" decoding="async" width="1000" height="1400"><figcaption><b>La ramera de Babilonia</b>, Alberto Durero, 1498. Obra histórica, no un retrato literal de la visión.</figcaption></figure>
  <blockquote class="passage"><span class="rubric">El texto</span><p>Ellos pelearán contra el Cordero, pero el Cordero los vencerá, porque Él es Señor de señores y Rey de reyes, y los que están con Él son llamados, escogidos y fieles.</p><footer><cite>Apocalipsis 17:14</cite><a href="https://www.biblegateway.com/passage/?search=Apocalipsis+17&amp;version=NBLA" target="_blank" rel="noopener">Leer el capítulo ↗</a></footer></blockquote>
  <div class="myth"><span class="rubric">Un malentendido común</span><p>Babilonia tiene que ser un país, una ciudad o una institución moderna en particular, y la tarea es ponerle nombre.</p></div>
  <div class="teach">
    <h2>Lo que enseña la Escritura</h2>
    <p class="illum">Babilonia fue la ciudad que destruyó Jerusalén y llevó al pueblo de Dios al exilio, y antes de eso, Babel fue donde la humanidad intentó construir una torre hasta el cielo. En la Biblia se convierte en la imagen de <strong>la civilización humana organizada contra Dios</strong>: orgullosa, rica, seductora y violenta. El ángel explica: «La mujer que viste es la gran ciudad, que reina sobre los reyes de la tierra» (17:18), y sus siete cabezas son «siete montes sobre los que se sienta la mujer» (17:9). Cualquier lector del primer siglo habría pensado en Roma. Pero Babilonia es más que Roma. Roma era simplemente la Babilonia de los días de Juan.</p>
    <p>El Apocalipsis pone deliberadamente a dos mujeres y dos ciudades lado a lado. Uno de los ángeles de las siete copas dice: «Ven; te mostraré el juicio de la gran ramera» (17:1), y más adelante: «Ven, te mostraré la novia, la esposa del Cordero» (21:9). Una ciudad está embriagada con la sangre de los santos; la otra es la ciudad santa donde Dios habita. A una la lloran los mercaderes que perdieron su negocio; la otra está llena de la gloria de Dios. Toda persona vive en una ciudad o en la otra, y el llamado es el mismo en toda época: «Salgan de ella, pueblo mío» (18:4).</p>
  </div>
  <div class="pair-cards">
    <article class="red"><span class="ref">17:1 · «Ven; te mostraré…»</span><h3>La ramera, Babilonia</h3><p>Vestida de púrpura y oro, ebria de la sangre de los santos, montada sobre la bestia. Cae «en una hora».</p></article>
    <article class="dark"><span class="ref">21:9 · «Ven, te mostraré…»</span><h3>La novia, la nueva Jerusalén</h3><p>Vestida de lino fino, las acciones justas de los santos. Desciende de Dios y permanece para siempre.</p></article>
  </div>
  <section class="evidence" aria-labelledby="ev-babylon-es">
    <h2 id="ev-babylon-es">¿Cómo lo sabemos?</h2>
    <details class="ev"><summary><span class="ev-n">01</span><span class="ev-ref">Apocalipsis 17:9, 18</span><i class="tag stated">Declarado</i></summary><div class="ev-body"><p>La mujer es una gran ciudad que reina sobre los reyes de la tierra, sentada sobre siete montes.</p><a href="https://www.biblegateway.com/passage/?search=Apocalipsis+17&amp;version=NBLA" target="_blank" rel="noopener">Leer Apocalipsis 17 ↗</a></div></details>
    <details class="ev"><summary><span class="ev-n">02</span><span class="ev-ref">Apocalipsis 18:3, 10–19, 24</span><i class="tag stated">Declarado</i></summary><div class="ev-body"><p>Su riqueza corrompe a las naciones, los mercaderes lloran su caída, y «en ella fue hallada la sangre de los profetas, de los santos».</p><a href="https://www.biblegateway.com/passage/?search=Apocalipsis+18&amp;version=NBLA" target="_blank" rel="noopener">Leer Apocalipsis 18 ↗</a></div></details>
    <details class="ev"><summary><span class="ev-n">03</span><span class="ev-ref">Jeremías 51:6–8; Isaías 47</span><i class="tag link">Conexión</i></summary><div class="ev-body"><p>Apocalipsis 18 hace eco de los oráculos de los profetas contra la antigua Babilonia, incluido el llamado a huir de ella.</p><a href="https://www.biblegateway.com/passage/?search=Jerem%C3%ADas+51&amp;version=NBLA" target="_blank" rel="noopener">Leer Jeremías 51 ↗</a></div></details>
    <details class="ev"><summary><span class="ev-n">04</span><span class="ev-ref">Apocalipsis 17:1; 21:9</span><i class="tag link">Conexión</i></summary><div class="ev-body"><p>La misma presentación angélica introduce a la ramera y a la novia, e invita al lector a comparar las dos ciudades.</p><a href="https://www.biblegateway.com/passage/?search=Apocalipsis+21&amp;version=NBLA" target="_blank" rel="noopener">Leer Apocalipsis 21 ↗</a></div></details>
