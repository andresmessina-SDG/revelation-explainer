<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#F4EBD6">
<meta name="description" content="A clear, hopeful guide to the Book of Revelation: seven visions of one age, and twenty of its most misunderstood questions, read in the light of all Scripture.">
<title>Revelation · The Illuminated Codex / Apocalipsis · El Códice Iluminado</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600&amp;family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&amp;display=swap">
<style>
/* ==========================================================================
   Revelation · The Illuminated Codex
   One stylesheet. Tokens first, then layout, then components.
   ========================================================================== */

:root{
  --vellum:#F4EBD6;      /* page ground */
  --vellum-2:#EADBB9;    /* deeper vellum: panels, "age to come" */
  --paper:#FBF6EA;       /* raised surfaces */
  --rule:#D9C7A0;        /* hairlines */
  --rule-strong:#A68A62;
  --ink:#2B1D12;         /* body text */
  --ink-2:#5A4632;       /* secondary text */
  --ink-3:#7A6449;       /* captions (still 4.5:1 on vellum) */
  --lapis:#1F3A6B;       /* Christ, the church, the present age */
  --lapis-2:#2E4E86;
  --lapis-ink:#F6EEDC;   /* text on lapis */
  --gilt:#C9A045;        /* gold leaf: fills and rules only */
  --gilt-deep:#7E5A17;   /* gold as text */
  --gilt-pale:#E6C877;   /* gold on lapis */
  --vermilion:#9E2A17;   /* rubrics, warnings */
  --vermilion-pale:#F3DED2;
  --verdigris:#2F6152;   /* correct answers, connections */
  --verdigris-pale:#DCE8DF;

  --display:'EB Garamond',Georgia,'Times New Roman',serif;
  --text:'EB Garamond',Georgia,'Times New Roman',serif;
  --caps:'Cinzel',Georgia,serif;

  --measure:44rem;
  --wide:62rem;
  --radius:3px;
  --top:64px;
}

*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:calc(var(--top) + 24px);-webkit-text-size-adjust:100%;overflow-x:clip}
@media (prefers-reduced-motion:no-preference){html{scroll-behavior:smooth}}
body{
  margin:0;background:var(--vellum);color:var(--ink);
  font:400 19px/1.7 var(--text);
  font-kerning:normal;font-variant-ligatures:common-ligatures;
  -webkit-font-smoothing:antialiased;overflow-x:clip;
}
img{max-width:100%;display:block}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--lapis);text-decoration-thickness:1px;text-underline-offset:3px}
a:hover{color:var(--vermilion)}
::selection{background:#E3CF9B;color:var(--ink)}
:focus-visible{outline:3px solid var(--lapis-2);outline-offset:3px;border-radius:2px}
[hidden]{display:none!important}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
.skip{position:absolute;left:16px;top:-60px;z-index:300;background:var(--lapis);color:var(--lapis-ink);padding:10px 16px;font:500 15px var(--text);text-decoration:none}
.skip:focus{top:12px;color:var(--lapis-ink)}

/* ---------- Top bar ---------- */
.topbar{position:sticky;top:0;z-index:50;height:var(--top);background:var(--vellum);border-bottom:1px solid var(--rule)}
.topbar-inner{max-width:1480px;height:100%;margin:0 auto;padding:0 28px;display:flex;align-items:center;justify-content:space-between;gap:16px}
.brand{display:flex;align-items:baseline;gap:12px;text-decoration:none;color:var(--ink);min-width:0}
.brand-mark{font:600 24px/1 var(--caps);letter-spacing:.06em;color:var(--ink)}
.brand-sub{font:400 15px/1 var(--text);font-style:italic;color:var(--ink-2);white-space:nowrap}
.top-actions{display:flex;align-items:center;gap:10px}
.top-status{font:500 12px/1 var(--caps);letter-spacing:.14em;text-transform:uppercase;color:var(--ink-2);white-space:nowrap}
.lang-pick{display:inline-flex;border:1px solid var(--rule-strong);border-radius:var(--radius);background:var(--paper);overflow:hidden}
.lang-pick button{min-width:44px;min-height:44px;padding:0 10px;border:0;background:none;font:600 12.5px/1 var(--caps);letter-spacing:.12em;color:var(--ink-2)}
.lang-pick button+button{border-left:1px solid var(--rule-strong)}
.lang-pick button:hover{color:var(--lapis);background:#fff}
.lang-pick button[aria-pressed="true"]{background:var(--lapis);color:var(--lapis-ink);cursor:default}
.brand-star{color:var(--vermilion)}
.contents-btn{display:none;align-items:center;gap:8px;min-height:44px;padding:0 14px;border:1px solid var(--rule-strong);border-radius:var(--radius);background:var(--paper);font:500 13px/1 var(--caps);letter-spacing:.12em;text-transform:uppercase;color:var(--ink)}
.contents-btn svg{width:18px;height:18px}
.progress{position:fixed;top:var(--top);left:0;right:0;height:2px;z-index:51;pointer-events:none}
.progress span{display:block;height:100%;width:0;background:var(--gilt)}

/* ---------- Layout ---------- */
.layout{max-width:1480px;margin:0 auto;display:grid;grid-template-columns:300px minmax(0,1fr)}
.side{border-right:1px solid var(--rule);min-width:0}
.side-inner{position:sticky;top:var(--top);max-height:calc(100vh - var(--top));overflow-y:auto;padding:28px 18px 40px 26px;scrollbar-width:thin;scrollbar-color:var(--rule-strong) transparent}
.reading{min-width:0;padding:56px clamp(22px,5vw,72px) 96px}

/* ---------- Navigation (sidebar + drawer share markup) ---------- */
.nav-group{margin:0 0 22px}
.nav-group-title{margin:0 0 6px;padding:0 10px;font:600 11.5px/1.5 var(--caps);letter-spacing:.16em;text-transform:uppercase;color:var(--vermilion)}
.nav-group-sub{display:block;font:italic 400 13.5px/1.4 var(--text);letter-spacing:0;text-transform:none;color:var(--ink-3);margin-top:1px}
.nav-list{list-style:none;margin:0;padding:0}
.nav-link{display:grid;grid-template-columns:30px minmax(0,1fr) 16px;align-items:baseline;gap:6px;width:100%;padding:7px 10px;border:0;border-left:2px solid transparent;background:none;text-align:left;font:400 16px/1.35 var(--text);color:var(--ink-2);text-decoration:none;border-radius:0}
.nav-link:hover{background:var(--vellum-2);color:var(--ink)}
.nav-link[aria-current="page"]{border-left-color:var(--lapis);background:var(--paper);color:var(--ink);font-weight:500}
.nav-num{font:500 12px/1 var(--caps);color:var(--gilt-deep);letter-spacing:.04em}
.nav-done{font-size:13px;color:var(--verdigris);opacity:0}
.nav-link.is-done .nav-done{opacity:1}

/* ---------- Drawer (mobile contents) ---------- */
.drawer{position:fixed;inset:0;z-index:200}
.drawer-shade{position:absolute;inset:0;background:rgba(27,20,12,.55)}
.drawer-panel{position:absolute;left:0;right:0;bottom:0;max-height:88dvh;display:flex;flex-direction:column;background:var(--vellum);border-top:3px double var(--gilt);padding-bottom:env(safe-area-inset-bottom,0)}
.drawer-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 18px 10px}
.drawer-head h2{margin:0;font:500 26px/1.1 var(--display)}
.drawer-kicker{display:block;font:600 11px/1.4 var(--caps);letter-spacing:.16em;text-transform:uppercase;color:var(--vermilion)}
.icon-btn{display:inline-grid;place-items:center;min-width:44px;min-height:44px;border:1px solid var(--rule-strong);border-radius:50%;background:var(--paper);color:var(--ink)}
.drawer-search{margin:0 18px 10px;display:flex;align-items:center;gap:10px;padding:0 14px;border:1px solid var(--rule-strong);background:var(--paper);border-radius:var(--radius)}
.drawer-search svg{flex:none;width:18px;height:18px;color:var(--ink-3)}
.drawer-search input{flex:1;min-width:0;height:46px;border:0;background:none;outline:none;font-size:17px}
.drawer-search:focus-within{outline:3px solid var(--lapis-2);outline-offset:2px}
.drawer-list{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding:4px 10px 20px}
.drawer-list .nav-link{min-height:48px;align-items:center;font-size:17px}
.drawer-empty{padding:16px 12px;color:var(--ink-2)}
body.drawer-open{overflow:hidden}

/* ---------- Page shell ---------- */
.page{max-width:var(--measure);margin:0 auto}
.page:focus{outline:none}
@media (prefers-reduced-motion:no-preference){.page:not([hidden]){animation:reveal .35s ease both}}
@keyframes reveal{from{opacity:.2;transform:translateY(8px)}to{opacity:1;transform:none}}
.wide{position:relative;left:50%;transform:translateX(-50%);width:min(var(--wide),calc(100vw - 48px))}
@media (min-width:1101px){.wide{width:min(var(--wide),calc(100vw - 300px - 2*clamp(22px,5vw,72px)))}}
[tabindex="-1"]:focus{outline:none}

/* ---------- Typography ---------- */
h1,h2,h3{font-family:var(--display);font-weight:500;color:var(--ink);text-wrap:balance}
h1{font-size:clamp(42px,5.4vw,70px);line-height:1.02;letter-spacing:-.015em;margin:0 0 18px}
h2{font-size:clamp(28px,3.2vw,38px);line-height:1.12;margin:56px 0 16px}
h3{font-size:clamp(22px,2.3vw,26px);line-height:1.2;margin:32px 0 10px}
p{margin:0 0 1em}
.eyebrow{display:flex;align-items:center;flex-wrap:wrap;gap:10px;margin:0 0 18px;font:600 13px/1.5 var(--caps);letter-spacing:.18em;text-transform:uppercase;color:var(--vermilion)}
.eyebrow::after{content:'';flex:1;min-width:40px;max-width:120px;height:1px;background:var(--gilt)}
.lead{font-size:clamp(20px,2vw,23px);line-height:1.55;color:var(--ink)}
.deck{font-size:22px;font-style:italic;color:var(--ink-2);margin:-6px 0 18px}
.rubric{font:600 12.5px/1.5 var(--caps);letter-spacing:.16em;text-transform:uppercase;color:var(--vermilion);display:block;margin-bottom:8px}
.small{font-size:16px;color:var(--ink-2)}
strong{font-weight:600}
em{font-style:italic}
.ornament{display:flex;align-items:center;justify-content:center;gap:14px;margin:48px 0;color:var(--gilt-deep)}
.ornament::before,.ornament::after{content:'';flex:1;max-width:160px;height:1px;background:var(--gilt)}
.ornament span{width:8px;height:8px;background:var(--vermilion);transform:rotate(45deg)}

/* Illuminated initial — first paragraph of teaching sections */
.illum::first-letter{
  float:left;font:600 3.35em/1 var(--caps);color:var(--gilt-pale);background:var(--lapis);
  border:2px solid var(--gilt);padding:.16em .14em .1em;margin:.08em .14em 0 0;
}

/* ---------- Scripture chips ---------- */
.refs{display:flex;flex-wrap:wrap;gap:8px;list-style:none;margin:0 0 30px;padding:0}
.refs-label{width:100%;font:600 11.5px/1.4 var(--caps);letter-spacing:.16em;text-transform:uppercase;color:var(--ink-3)}
.refs a{display:inline-flex;align-items:center;gap:6px;min-height:36px;padding:4px 12px;border:1px solid var(--rule-strong);border-radius:999px;background:var(--paper);font-size:16px;color:var(--ink);text-decoration:none}
.refs a:hover{border-color:var(--lapis);color:var(--lapis)}
.refs a::after{content:'↗';font-size:13px;color:var(--ink-3)}

/* ---------- Vision locator strip ---------- */
.locator{display:flex;align-items:center;flex-wrap:wrap;gap:6px 12px;margin:0 0 26px;font-size:15.5px;color:var(--ink-2)}
.locator-track{display:flex;gap:3px}
.locator a{display:inline-grid;place-items:center;min-width:34px;height:28px;padding:0 4px;font:500 12px/1 var(--caps);letter-spacing:.04em;color:var(--ink-2);text-decoration:none;border:1px solid var(--rule)}
.locator a.on{background:var(--lapis);color:var(--lapis-ink);border-color:var(--lapis)}
.locator a:hover{border-color:var(--lapis)}

/* ---------- Art ---------- */
.art{margin:8px 0 36px;background:var(--paper);border:1px solid var(--rule);padding:14px}
.art img{width:100%;height:clamp(240px,36vw,420px);object-fit:contain;background:#EFE6CF;mix-blend-mode:multiply}
.art figcaption{padding:12px 4px 0;font-size:15.5px;line-height:1.45;font-style:italic;color:var(--ink-2)}
.art figcaption b{font-style:normal;font-weight:500;color:var(--ink)}
.art.is-missing img{display:none}
.art.is-missing::before{content:'✦';display:grid;place-items:center;height:120px;font-size:34px;color:var(--gilt);background:#EFE6CF}

/* ---------- Passage ---------- */
.passage{margin:0 0 34px;padding:28px 30px 24px;background:var(--paper);border-top:3px double var(--gilt);border-bottom:3px double var(--gilt)}
.passage .rubric{margin-bottom:12px}
.passage p{margin:0 0 14px;font-size:clamp(21px,2.1vw,25px);line-height:1.5;font-style:italic;color:var(--ink)}
.passage footer{display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:8px 16px}
.passage cite{font:600 14px/1.4 var(--caps);letter-spacing:.1em;font-style:normal;color:var(--ink)}
.passage a{font-size:16px}

/* ---------- Misunderstanding / teaching / lesson ---------- */
.myth{margin:0 0 36px;padding:20px 24px;background:var(--vermilion-pale);border:1px solid #E2BFAE}
.myth .rubric{margin-bottom:6px}
.myth p{margin:0;font-size:21px;line-height:1.45;color:#4A2418}
.teach h2{margin-top:0}
.teach p{font-size:19.5px}
.lesson{margin:44px 0;padding:28px 30px;background:var(--lapis);color:var(--lapis-ink);border:1px solid var(--lapis);outline:1px solid var(--gilt);outline-offset:-8px}
.lesson .rubric{color:var(--gilt-pale)}
.lesson p{margin:0;font:500 clamp(22px,2.3vw,27px)/1.35 var(--display);color:var(--lapis-ink)}
.note{margin:28px 0;padding:18px 22px;background:var(--vellum-2);font-size:18px;color:var(--ink)}
.note p:last-child{margin:0}

/* ---------- Evidence ---------- */
.evidence{margin:48px 0 0}
.evidence h2{margin:0 0 6px}
.evidence-intro{font-size:17px;color:var(--ink-2);margin:0 0 14px}
.legend{display:flex;flex-wrap:wrap;gap:8px 16px;margin:0 0 16px;font-size:15px;color:var(--ink-2)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.tag{display:inline-block;padding:2px 8px;font:600 10.5px/1.6 var(--caps);letter-spacing:.1em;text-transform:uppercase;border:1px solid currentColor;white-space:nowrap}
.tag.stated{color:var(--lapis)}
.tag.link{color:var(--verdigris)}
.tag.inference{color:var(--gilt-deep)}
.tag.caution{color:var(--vermilion)}
.ev{border-top:1px solid var(--rule)}
.ev:last-of-type{border-bottom:1px solid var(--rule)}
.ev summary{list-style:none;cursor:pointer;display:grid;grid-template-columns:28px minmax(0,1fr) auto 20px;align-items:center;gap:12px;min-height:56px;padding:10px 4px}
.ev summary::-webkit-details-marker{display:none}
.ev summary::after{content:'+';font:400 24px/1 var(--display);color:var(--gilt-deep);text-align:center}
.ev[open] summary::after{content:'−'}
.ev-n{font:500 13px/1 var(--caps);color:var(--gilt-deep)}
.ev-ref{font-weight:500;font-size:18px}
.ev-body{padding:0 4px 18px 44px;font-size:18px}
.ev-body p{margin:0 0 8px}
.ev-body a{font-size:16px}

/* ---------- Alternatives ---------- */
.alt{margin:40px 0 0;border:1px solid var(--rule-strong);background:var(--paper)}
.alt summary{list-style:none;cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:56px;padding:12px 20px;font:600 13px/1.4 var(--caps);letter-spacing:.14em;text-transform:uppercase;color:var(--ink)}
.alt summary::-webkit-details-marker{display:none}
.alt summary::after{content:'+';font:400 26px/1 var(--display);color:var(--gilt-deep)}
.alt[open] summary::after{content:'−'}
.alt[open] summary{border-bottom:1px solid var(--rule)}
.alt-body{padding:18px 20px 22px}
.alt-intro{font-size:17px;color:var(--ink-2)}
.alt-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.alt-grid article{padding:16px 18px;border:1px solid var(--rule);background:var(--vellum)}
.alt-grid h3{margin:0 0 6px;font-size:20px}
.alt-grid p{margin:0;font-size:17px;line-height:1.55}
.alt-grid article.ours{background:var(--paper);border-color:var(--lapis)}
:root{--ours:'This guide · '}
:root[lang="es"]{--ours:'Esta guía · '}
.alt-grid article.ours h3::before{content:var(--ours);font:600 11px/1 var(--caps);letter-spacing:.12em;text-transform:uppercase;color:var(--lapis);vertical-align:2px}

/* ---------- Quiz ---------- */
.quiz{margin:44px 0 0;padding:26px 0 0;border-top:3px double var(--gilt)}
.quiz h3{margin:4px 0 16px}
.quiz-options{display:grid;gap:10px}
.quiz-opt{display:grid;grid-template-columns:30px minmax(0,1fr);gap:10px;align-items:start;width:100%;min-height:54px;padding:13px 16px;text-align:left;border:1px solid var(--rule-strong);border-radius:var(--radius);background:var(--paper);font-size:18px;line-height:1.45;color:var(--ink)}
.quiz-opt:hover:not(:disabled){border-color:var(--lapis);background:#fff}
.quiz-letter{font:600 13px/1.9 var(--caps);color:var(--gilt-deep)}
.quiz-opt:disabled{cursor:default}
.quiz-opt.right{border-color:var(--verdigris);background:var(--verdigris-pale)}
.quiz-opt.right .quiz-letter{color:var(--verdigris)}
.quiz-opt.wrong{border-color:var(--vermilion);background:var(--vermilion-pale)}
.quiz-opt.wrong .quiz-letter{color:var(--vermilion)}
.quiz-opt.dim{opacity:.6}
.quiz-feedback{margin:16px 0 0;padding:16px 18px;background:var(--vellum-2);font-size:18px}
.quiz-feedback b{font-weight:600}
.quiz-retry{margin-top:10px;min-height:44px;padding:0 4px;border:0;background:none;color:var(--lapis);text-decoration:underline;text-underline-offset:3px;font-size:17px}

/* ---------- Pager ---------- */
.pager{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:56px 0 0;padding-top:26px;border-top:1px solid var(--rule)}
.pager a{display:flex;flex-direction:column;gap:2px;min-height:72px;padding:14px 18px;border:1px solid var(--rule-strong);background:var(--paper);text-decoration:none;color:var(--ink)}
.pager a:hover{border-color:var(--lapis)}
.pager a.next{text-align:right;grid-column:2}
.pager small{font:600 11.5px/1.5 var(--caps);letter-spacing:.14em;text-transform:uppercase;color:var(--vermilion)}
.pager span{font-size:19px;line-height:1.3}

/* ---------- Buttons ---------- */
.btn{display:inline-flex;align-items:center;gap:10px;min-height:48px;padding:0 20px;border:1px solid var(--lapis);background:var(--lapis);color:var(--lapis-ink);font:600 13px/1 var(--caps);letter-spacing:.14em;text-transform:uppercase;text-decoration:none;border-radius:var(--radius)}
.btn:hover{background:var(--lapis-2);color:var(--lapis-ink)}
.btn.ghost{background:transparent;color:var(--lapis)}
.btn.ghost:hover{background:var(--paper);color:var(--lapis)}
.btn-row{display:flex;flex-wrap:wrap;gap:12px;margin:28px 0}
.resume{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;margin:0 0 28px;padding:12px 16px;border:1px solid var(--rule-strong);background:var(--paper);font-size:17px}
.resume a{font-weight:500}

/* ---------- Intro ---------- */
.hero-art{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,.95fr);margin:34px 0 40px;border:1px solid var(--rule-strong);background:var(--paper)}
.hero-art img{width:100%;height:100%;min-height:320px;max-height:440px;object-fit:cover}
.hero-art figcaption{display:flex;flex-direction:column;justify-content:center;gap:14px;padding:32px}
.hero-art blockquote{margin:0;font:italic 500 clamp(28px,3.2vw,38px)/1.2 var(--display);color:var(--ink)}
.hero-art cite{font:600 12.5px/1.5 var(--caps);letter-spacing:.14em;font-style:normal;color:var(--vermilion)}
.hero-art small{font-size:14.5px;font-style:italic;color:var(--ink-3)}
.hero-art.is-missing img{display:none}
.purpose{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:22px 0}
.purpose article{padding:20px 22px;background:var(--paper);border:1px solid var(--rule)}
.purpose h3{margin:0 0 4px;font-size:22px}
.purpose p{margin:0;font-size:17.5px;line-height:1.5;color:var(--ink-2)}
.purpose .n{font:600 12px/1 var(--caps);letter-spacing:.12em;color:var(--vermilion)}
.symbols{width:100%;border-collapse:collapse;margin:16px 0 26px;font-size:18px}
.symbols th,.symbols td{text-align:left;vertical-align:top;padding:11px 10px;border-bottom:1px solid var(--rule)}
.symbols th{font:600 12px/1.5 var(--caps);letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);border-bottom:1px solid var(--rule-strong)}
.symbols td:first-child{font-weight:500;width:34%}
.symbols td:last-child{color:var(--ink-2);font-size:16.5px;white-space:nowrap}
.movements{list-style:none;margin:24px 0;padding:0;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));border-top:2px solid var(--gilt)}
.movements li{position:relative;padding:20px 12px 8px 0}
.movements li::before{content:'';position:absolute;top:-6px;left:0;width:10px;height:10px;background:var(--vellum);border:2px solid var(--gilt-deep);transform:rotate(45deg)}
.movements b{display:block;font:500 21px/1.2 var(--display);margin:6px 0 4px}
.movements small{display:block;font-size:15.5px;line-height:1.4;color:var(--ink-2)}
.movements .n{font:600 12px/1 var(--caps);letter-spacing:.12em;color:var(--vermilion)}

/* World of Revelation schema */
.world{margin:40px 0;padding:28px clamp(16px,3vw,32px) 30px;background:var(--paper);border:1px solid var(--rule-strong)}
.world h2{margin:0 0 8px}
.world > p{font-size:18px}
.world-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px 28px;margin:24px 0 8px}
.node{display:flex;flex-direction:column;align-items:flex-start;gap:3px;width:100%;padding:16px 18px;text-align:left;text-decoration:none;color:var(--ink);background:var(--vellum);border:1px solid var(--rule-strong)}
.node:hover{border-color:var(--lapis);color:var(--ink)}
.node b{font:500 22px/1.15 var(--display)}
.node small{font-size:15.5px;line-height:1.4;color:var(--ink-2)}
.node.christ{grid-column:1/-1;background:var(--lapis);border-color:var(--lapis);color:var(--lapis-ink);outline:1px solid var(--gilt);outline-offset:-6px;align-items:center;text-align:center}
.node.christ small{color:#DCE3F0}
.node.christ:hover{color:var(--lapis-ink);background:var(--lapis-2)}
.node.enemy{background:var(--vermilion-pale);border-color:#D9A894}
.node.newc{grid-column:1/-1;align-items:center;text-align:center;background:var(--vellum-2);border-color:var(--gilt)}
.world-col{display:flex;flex-direction:column;gap:10px}
.world-label{font:600 11.5px/1.5 var(--caps);letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3)}
.world-label.red{color:var(--vermilion)}
.world-pair{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.world-foot{font-size:16.5px;color:var(--ink-2);margin:16px 0 0}

/* ---------- Seven visions graphic ---------- */
.visions{margin:30px 0 20px;padding:clamp(18px,3vw,36px);background:var(--vellum);border:1px solid var(--gilt);outline:1px solid var(--gilt);outline-offset:4px}
.visions-title{text-align:center;margin:0 0 6px}
.visions-title .rubric{margin-bottom:4px}
.visions-title h3{margin:0;font:500 clamp(28px,3.4vw,40px)/1.1 var(--display);letter-spacing:.01em}
.visions-title p{margin:8px auto 0;max-width:36em;font-style:italic;color:var(--ink-2);font-size:18px}
.vgrid{display:grid;grid-template-columns:minmax(0,15rem) minmax(0,1fr) minmax(0,9.5rem);margin-top:26px}
.vcell{min-width:0}
.vmid{border-left:1px solid var(--rule-strong);border-right:1px solid var(--rule-strong)}
.vend{background:var(--vellum-2)}
.vaxis{padding:0 0 12px;font:600 11.5px/1.4 var(--caps);letter-spacing:.12em;text-transform:uppercase;color:var(--ink-2)}
.vaxis.vmid{display:flex;justify-content:space-between;gap:8px;padding-left:12px;padding-right:12px}
.vaxis.vmid span:nth-child(2){color:var(--lapis);text-align:center}
.vaxis.vend{padding-left:14px;display:flex;align-items:flex-end}
.vpart{padding:20px 16px 8px 0;border-top:1px solid var(--rule);font:600 11.5px/1.5 var(--caps);letter-spacing:.16em;text-transform:uppercase;color:var(--vermilion)}
.vpart.vmid{padding:20px 16px 8px;font:italic 400 16px/1.4 var(--text);letter-spacing:0;text-transform:none;color:var(--ink-2)}
.vpart.vend{border-top:1px solid var(--rule)}
.vrow{display:contents}
.vlabel{display:flex;align-items:center;gap:12px;width:100%;padding:12px 14px 12px 0;border:0;background:none;text-align:left;color:var(--ink)}
.vlabel .vn{flex:none;width:40px;font:500 20px/1 var(--caps);color:var(--vermilion)}
.vlabel .vt{display:flex;flex-direction:column;min-width:0}
.vlabel .vt b{font:500 19px/1.2 var(--display)}
.vlabel .vt small{font-size:15px;color:var(--ink-2)}
.vlabel .vchev{margin-left:auto;font-size:14px;color:var(--gilt-deep);transition:transform .2s}
.vlabel[aria-expanded="true"] .vchev{transform:rotate(90deg)}
.vlabel:hover .vt b{color:var(--lapis)}
.vbar{padding:16px 0 10px;display:flex;flex-direction:column;gap:7px}
.vtrack{display:flex;align-items:center;height:10px}
.vtrack i{display:block;height:10px}
.vtrack .age{flex:1;background:var(--lapis)}
.vtrack .end{flex:none;background:var(--gilt)}
.vtrack .dot{flex:none;width:22px;height:22px;border-radius:50%;background:var(--gilt);margin-right:-11px;position:relative;z-index:1}
.vtrack .dot.open{background:var(--vellum);border:1.5px dashed var(--vermilion)}
.vcap{display:flex;justify-content:flex-end;gap:10px;flex-wrap:wrap;padding-right:20px;font-size:15.5px;line-height:1.35;color:var(--ink-2);text-align:right}
.vcap .tie{font-style:italic;color:var(--vermilion)}
.vbeyond{padding:16px 12px 10px 13px;display:flex;flex-direction:column;gap:7px}
.vbeyond i{display:block;height:10px;background:var(--gilt)}
.vbeyond span{font-size:15px;line-height:1.35;color:var(--ink-2);text-align:right}
.vdetail{grid-column:1/-1;padding:4px 0 18px}
.vdetail-inner{padding:16px 20px;background:var(--paper);border:1px solid var(--rule-strong)}
.vdetail p{margin:0 0 10px;font-size:17.5px}
.vdetail ul{display:flex;flex-wrap:wrap;gap:8px;list-style:none;margin:0;padding:0}
.vdetail a{display:inline-block;padding:4px 12px;border:1px solid var(--rule-strong);border-radius:999px;font-size:15.5px;text-decoration:none;background:var(--vellum)}
.vdetail a:hover{border-color:var(--lapis)}
.vclose{grid-column:1/-1;border-top:1px solid var(--rule);height:6px}
.vlegend{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:10px 24px;margin-top:18px;font-size:15.5px;color:var(--ink-2)}
.vlegend .keys{display:flex;flex-wrap:wrap;gap:8px 22px}
.vlegend .keys span{display:inline-flex;align-items:center;gap:8px}
.k-age{width:30px;height:8px;background:var(--lapis)}
.k-end{width:30px;height:8px;background:var(--gilt)}
.k-ring{width:15px;height:15px;border-radius:50%;border:1.5px dashed var(--vermilion)}
.vlegend em{color:var(--ink-3)}

/* Mini version on the introduction */
.mini-visions{list-style:none;margin:22px 0 8px;padding:18px 20px;background:var(--paper);border:1px solid var(--rule-strong);display:grid;gap:8px}
.mini-visions li{display:grid;grid-template-columns:2.6rem 3.6rem minmax(0,1fr);align-items:center;gap:8px}
.mv-n{font:500 15px/1 var(--caps);color:var(--vermilion)}
.mv-c{font-size:15px;color:var(--ink-2)}
.mv-bar{display:block;height:8px;background:var(--lapis);position:relative}
.mv-bar i{position:absolute;right:0;top:0;bottom:0;width:var(--end);background:var(--gilt)}

/* Trumpets / bowls parallels */
.parallels{width:100%;border-collapse:collapse;margin:18px 0 10px;font-size:17px;line-height:1.4}
.parallels caption{caption-side:bottom;padding-top:10px;text-align:left;font-size:15.5px;font-style:italic;color:var(--ink-2)}
.parallels th,.parallels td{padding:12px 10px;vertical-align:top;border-bottom:1px solid var(--rule)}
.parallels thead th{font:600 12px/1.4 var(--caps);letter-spacing:.12em;text-transform:uppercase;text-align:left;color:var(--ink-3);border-bottom:1px solid var(--rule-strong)}
.parallels tbody th{width:22%;text-align:left;font-weight:500}
.parallels tbody th small{display:block;font-weight:400;font-size:14.5px;color:var(--vermilion);font-style:italic}
.parallels .ref{display:block;font:600 11.5px/1.5 var(--caps);letter-spacing:.08em;color:var(--gilt-deep)}
.parallels tr.final td,.parallels tr.final th{background:var(--vellum-2)}
.table-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}

/* Seals procession */
.seals{margin:30px 0;padding:24px clamp(14px,3vw,28px);background:var(--paper);border:1px solid var(--rule-strong)}
.seals h3{margin:0 0 4px}
.seals > p{font-size:17px;color:var(--ink-2)}
.seal-row{list-style:none;display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px;margin:20px 0 6px;padding:0;position:relative}
.seal-row::before{content:'';position:absolute;top:28px;left:6%;right:6%;height:1px;background:var(--rule-strong)}
.seal{position:relative;display:flex;flex-direction:column;align-items:center;text-align:center;gap:4px}
.wax{display:grid;place-items:center;width:56px;height:56px;border-radius:50%;background:var(--vermilion);color:#F7E6DA;font:600 17px/1 var(--caps);box-shadow:inset 0 0 0 4px var(--vermilion),inset 0 0 0 5px #C76A55}
.seal.end .wax{background:var(--gilt);color:var(--ink);box-shadow:inset 0 0 0 4px var(--gilt),inset 0 0 0 5px #E8CF8C}
.seal b{font:500 17px/1.2 var(--display);margin-top:6px}
.seal small{font-size:14px;line-height:1.35;color:var(--ink-2)}
.seal-note{margin:16px 0 0;font-size:16.5px;color:var(--ink-2)}

/* Numbered comparisons used on several pages */
.pair-cards{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:22px 0 30px}
.pair-cards article{padding:20px 22px;border:1px solid var(--rule-strong);background:var(--paper)}
.pair-cards article.dark{background:var(--lapis);color:var(--lapis-ink);border-color:var(--lapis)}
.pair-cards article.red{background:var(--vermilion-pale);border-color:#D9A894}
.pair-cards h3{margin:0 0 6px;font-size:23px}
.pair-cards article.dark h3{color:var(--lapis-ink)}
.pair-cards p{margin:0 0 6px;font-size:17px;line-height:1.5}
.pair-cards .ref{font:600 11.5px/1.5 var(--caps);letter-spacing:.1em;color:var(--gilt-deep)}
.pair-cards article.dark .ref{color:var(--gilt-pale)}

.steps{list-style:none;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:0;margin:24px 0 30px;padding:0;border-top:2px solid var(--lapis)}
.steps li{position:relative;padding:18px 12px 6px 0}
.steps li::before{content:'';position:absolute;top:-7px;left:0;width:12px;height:12px;border-radius:50%;background:var(--lapis)}
.steps li:last-child::before{background:var(--gilt)}
.steps b{display:block;font:500 20px/1.2 var(--display)}
.steps small{display:block;font-size:15px;line-height:1.4;color:var(--ink-2)}
.steps .ref{display:block;font:600 11.5px/1.6 var(--caps);letter-spacing:.08em;color:var(--gilt-deep)}

.periods{list-style:none;margin:22px 0 30px;padding:0;border:1px solid var(--rule-strong);background:var(--paper)}
.periods li{display:grid;grid-template-columns:12rem minmax(0,1fr) 7rem;gap:12px;align-items:center;padding:14px 18px;border-top:1px solid var(--rule)}
.periods li:first-child{border-top:0}
.periods b{font:500 20px/1.2 var(--display)}
.periods span{font-size:17px;color:var(--ink-2);line-height:1.45}
.periods .ref{font:600 12px/1.4 var(--caps);letter-spacing:.08em;color:var(--gilt-deep);text-align:right}
.periods li.short{background:var(--vermilion-pale)}

.number-art{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:8px 0 36px}
.number-art div{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:26px 16px;text-align:center;border:1px solid var(--rule-strong);background:var(--paper)}
.number-art .big{font:500 clamp(54px,8vw,84px)/1 var(--caps);letter-spacing:.06em;color:var(--lapis)}
.number-art div.red .big{color:var(--vermilion)}
.number-art small{font-size:16px;color:var(--ink-2);max-width:20em}

.promises{width:100%;border-collapse:collapse;margin:16px 0 30px;font-size:17px}
.promises th,.promises td{padding:10px 8px;text-align:left;vertical-align:top;border-bottom:1px solid var(--rule)}
.promises thead th{font:600 12px/1.4 var(--caps);letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);border-bottom:1px solid var(--rule-strong)}
.promises td:first-child{font-weight:500;white-space:nowrap}
.promises .ref{font:600 11.5px/1.5 var(--caps);letter-spacing:.06em;color:var(--gilt-deep);white-space:nowrap}

.churches{list-style:none;display:grid;grid-template-columns:repeat(auto-fill,minmax(13.5rem,1fr));gap:10px;margin:20px 0 30px;padding:0}
.churches li{padding:14px 16px;border:1px solid var(--rule-strong);background:var(--paper)}
.churches li.clean{border-color:var(--verdigris);background:#EEF3EC}
.churches b{display:block;font:500 21px/1.2 var(--display)}
.churches small{display:block;font-size:15.5px;line-height:1.4;color:var(--ink-2)}
.churches .ref{display:block;font:600 11.5px/1.6 var(--caps);letter-spacing:.08em;color:var(--gilt-deep)}

/* ---------- Interpretation lab ---------- */
.primary{margin:30px 0 40px;padding:26px 28px;background:var(--lapis);color:var(--lapis-ink);outline:1px solid var(--gilt);outline-offset:-8px}
.primary .rubric{color:var(--gilt-pale)}
.primary h2{margin:4px 0 12px;color:var(--lapis-ink);font-size:clamp(26px,3vw,34px)}
.primary p{margin:0 0 10px;font-size:18.5px}
.primary p:last-child{margin:0}
.lab{margin:44px 0 0;padding-top:34px;border-top:1px solid var(--rule-strong)}
.lab > h2{margin:0 0 10px}
.tabs{display:flex;flex-wrap:wrap;gap:8px;margin:18px 0 16px}
.tab{min-height:44px;padding:0 16px;border:1px solid var(--rule-strong);background:var(--paper);border-radius:var(--radius);font:600 12.5px/1 var(--caps);letter-spacing:.1em;text-transform:uppercase;color:var(--ink)}
.tab[aria-selected="true"]{background:var(--lapis);border-color:var(--lapis);color:var(--lapis-ink)}
.panel{padding:22px 24px;background:var(--paper);border:1px solid var(--rule-strong)}
.panel h3{margin:0 0 8px}
.panel p{font-size:18px}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:12px;padding-top:14px;border-top:1px solid var(--rule)}
.cols p{font-size:17px;margin:4px 0 0}
.eras{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin:0 0 16px}
.era{display:flex;flex-direction:column;gap:6px;font-size:14px;line-height:1.3;color:var(--ink-2);text-align:center}
.era i{display:block;height:34px;background:var(--lapis);opacity:var(--o,.2);transition:opacity .4s}
.mill{margin:0 0 16px}
.mill-track{display:flex;gap:4px;align-items:stretch}
.mill-seg{flex:var(--w,1);min-width:0;display:flex;flex-direction:column;gap:6px;text-align:center}
.mill-seg i{display:block;height:14px;background:var(--lapis)}
.mill-seg.event i{background:var(--vermilion)}
.mill-seg.reign i{background:var(--gilt)}
.mill-seg.final i{background:var(--verdigris)}
.mill-seg b{font:500 16px/1.2 var(--display)}
.mill-seg small{font-size:13.5px;line-height:1.3;color:var(--ink-2)}
.matrix{width:100%;border-collapse:collapse;font-size:16.5px;background:var(--paper);border:1px solid var(--rule-strong)}
.matrix th,.matrix td{padding:10px;border-bottom:1px solid var(--rule);text-align:left}
.matrix thead th{font:600 11.5px/1.4 var(--caps);letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3)}
.matrix button{min-height:40px;padding:0 12px;border:1px solid var(--rule-strong);background:var(--vellum);border-radius:var(--radius);font-size:15.5px;white-space:nowrap}
.matrix button[aria-pressed="true"]{background:var(--lapis);color:var(--lapis-ink);border-color:var(--lapis)}
.matrix-out{margin-top:12px;padding:16px 18px;background:var(--vellum-2);font-size:17.5px}
.field{display:block;margin:16px 0 6px;font:600 12px/1.4 var(--caps);letter-spacing:.12em;text-transform:uppercase;color:var(--ink-2)}
.select{width:100%;max-width:28rem;min-height:46px;padding:0 12px;border:1px solid var(--rule-strong);background:var(--paper);border-radius:var(--radius);font-size:17px}
.disclaimer{margin:18px 0;padding:14px 18px;background:var(--vellum-2);font-size:17px}

/* Timeline on the millennium page */
.mill-inline{margin:8px 0 34px;padding:20px 18px 16px;background:var(--paper);border:1px solid var(--rule-strong)}
@media (max-width:760px){.mill-inline .mill-track{flex-direction:column;gap:12px}.mill-inline .mill-seg{text-align:left;display:grid;grid-template-columns:44px minmax(0,1fr);column-gap:12px}.mill-inline .mill-seg i{grid-row:1/3;height:auto;min-height:40px;width:44px}}

/* ---------- Footer ---------- */
.site-foot{max-width:var(--measure);margin:80px auto 0;padding-top:26px;border-top:3px double var(--gilt);font-size:16px;color:var(--ink-2)}
.site-foot h2{margin:0 0 10px;font-size:24px}
.site-foot ul{margin:0 0 16px;padding-left:20px}
.site-foot li{margin:2px 0}

/* ==========================================================================
   Responsive
   ========================================================================== */
@media (max-width:1100px){
  .layout{display:block}
  .side{display:none}
  .contents-btn{display:inline-flex}
  .top-status{display:none}
  .reading{padding:40px clamp(18px,5vw,40px) 90px}
  .wide{width:auto;left:0;transform:none}
}
@media (max-width:760px){
  :root{--top:58px}
  body{font-size:18px}
  .topbar-inner{padding:0 16px}
  .brand-sub{display:none}
  .reading{padding:30px 18px 80px}
  .passage{padding:22px 18px 18px}
  .lesson,.primary{padding:22px 20px}
  .myth{padding:18px}
  .alt-grid,.purpose,.cols,.pair-cards,.number-art,.world-grid{grid-template-columns:1fr}
  .world-pair{grid-template-columns:1fr 1fr}
  .movements{grid-template-columns:1fr;border-top:0;border-left:2px solid var(--gilt);padding-left:18px}
  .movements li{padding:12px 0}
  .movements li::before{top:20px;left:-25px}
  .steps{grid-template-columns:1fr;border-top:0;border-left:2px solid var(--lapis);padding-left:18px}
  .steps li{padding:10px 0}
  .steps li::before{top:16px;left:-26px}
  .seal-row{grid-template-columns:repeat(4,minmax(0,1fr));row-gap:18px}
  .seal-row::before{display:none}
  .periods li{grid-template-columns:1fr;gap:4px}
  .periods .ref{text-align:left}
  .hero-art{grid-template-columns:1fr}
  .hero-art img{min-height:220px;max-height:300px}
  .hero-art figcaption{padding:22px}
  .pager{grid-template-columns:1fr}
  .pager a.next{grid-column:1}
  .ev summary{grid-template-columns:22px minmax(0,1fr) 18px;row-gap:4px}
  .ev summary .tag{grid-column:2;grid-row:2;justify-self:start}
  .ev summary::after{grid-column:3;grid-row:1}
  .ev-body{padding-left:34px}
  .symbols td:last-child{white-space:normal}
  /* seven visions: label row on top, bar row below */
  .vgrid{grid-template-columns:minmax(0,1fr) 3.4rem}
  .vaxis.vlab,.vpart.vlab{display:none}
  .vaxis.vmid span:nth-child(2){display:none}
  .vaxis.vend{padding-left:6px;font-size:10px;letter-spacing:.06em}
  .vpart.vmid{grid-column:1;border-top:1px solid var(--rule);padding:16px 12px 4px}
  .vpart.vmid::before{content:attr(data-part);display:block;font:600 11px/1.5 var(--caps);letter-spacing:.14em;text-transform:uppercase;color:var(--vermilion);margin-bottom:2px}
  .vlabel{grid-column:1/-1;padding:14px 0 2px;border-top:1px solid var(--rule)}
  .vcell.vlab{grid-column:1/-1}
  .vcap{padding-right:16px;font-size:14.5px}
  .vbeyond{padding:16px 6px 10px 9px}
  .vbeyond span{display:none}
}
@media (max-width:420px){
  .brand-mark{font-size:19px;letter-spacing:.03em}
  .top-actions{gap:6px}
  .lang-pick button{min-width:40px;padding:0 8px}
  .contents-btn span{display:none}
  .contents-btn{padding:0 12px}
  .world-pair{grid-template-columns:1fr}
  .seal-row{grid-template-columns:repeat(2,minmax(0,1fr))}
}

/* ==========================================================================
   Print — the current page, clean
   ========================================================================== */
@media print{
  body{background:#fff;font-size:12pt}
  .topbar,.side,.progress,.drawer,.pager,.quiz,.btn-row,.resume,.skip{display:none!important}
  .layout{display:block}
  .reading{padding:0}
  .page{max-width:none}
  .wide{width:auto;left:0;transform:none}
  details.alt,details.ev{border:0}
  details:not([open]) > :not(summary){display:block}
  .lesson,.primary,.node.christ,.pair-cards article.dark{background:#fff!important;color:var(--ink)!important;outline:0;border:2px solid var(--lapis)}
  .lesson p,.primary h2,.pair-cards article.dark h3{color:var(--ink)!important}
  .art img{height:220px}
}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}

</style>

<header class="topbar">
  <div class="topbar-inner">

      <span class="brand-mark"><span data-i18n="brand">Revelation</span><span class="brand-star" aria-hidden="true"> ✦</span></span>

<section class="page intro" id="introduction" data-nav="Understanding Revelation" data-num="✦" data-keywords="introduction start begin purpose symbols revelation 1 patmos john">
  <p class="eyebrow">The Book of Revelation · An introduction</p>
  <h1>An unveiling of hope</h1>
  <p class="lead">Revelation is not a book of secret codes about the end of the world. It is “the revelation of Jesus Christ” (1:1). It shows us, from heaven’s side, the Lamb who has already won, and it was given to a suffering church so that it would stay faithful until he comes.</p>
  <p class="resume" id="resume" hidden>Continue where you left off: <a href="#">…</a></p>

  <figure class="hero-art">
    <img data-art src="https://commons.wikimedia.org/wiki/Special:FilePath/Saint-Sever_Beatus_f._207v-208r_-_New_Jerusalem.jpg?width=1000" alt="A medieval illumination of the New Jerusalem as a square walled city with twelve gates, the Lamb at its centre." width="1000" height="700" decoding="async">
    <figcaption>
      <blockquote>“Behold, I make all things new.”</blockquote>
      <cite>Revelation 21:5 · BSB</cite>
      <small>The New Jerusalem, Saint-Sever Beatus, 11th century.</small>
    </figcaption>
  </figure>

  <blockquote class="passage">
    <span class="rubric">Begin with Scripture</span>
    <p>Blessed is the one who reads aloud the words of this prophecy, and blessed are those who hear and obey what is written in it, because the time is near.</p>
    <footer><cite>Revelation 1:3</cite><a href="https://ebible.org/engbsb/REV01.htm" target="_blank" rel="noopener">Read Revelation 1 ↗</a></footer>
  </blockquote>

  <h2>What is Revelation?</h2>
  <p class="illum">Revelation is the last book of the Bible. The apostle John wrote it around AD 95, near the end of the emperor Domitian’s reign, while he was exiled on the island of Patmos “because of the word of God and my testimony about Jesus” (1:9). The risen Christ gave him a series of visions and told him to send them to seven real churches in the Roman province of Asia, in what is now western Turkey.</p>
  <p>The Greek title, <em>apokalypsis</em>, means an <strong>unveiling</strong>. Revelation pulls back the curtain on what is really happening behind history: Christ reigns now, Satan rages against the church, God judges evil, and his people will live with him forever. It was written to be understood. It even promises a blessing to everyone who reads it aloud and obeys it.</p>
  <div class="note"><p>Revelation is a letter, a prophecy and an apocalypse all at once (1:1–4). It spoke first to Christians in the first century, and through them it speaks to the church in every age.</p></div>

  <h2>Why was it written?</h2>
  <p>Imagine being a Christian in the Roman Empire. Your neighbours worship the gods of the city and honour Caesar as divine. Refusing to join in can cost you your trade, your friends, even your life. The church looks small and Rome looks invincible. If Jesus is King, why does Caesar seem to be winning?</p>
  <p><strong>Revelation answers by showing the same world from heaven’s point of view.</strong></p>
  <div class="purpose">
    <article><span class="n">I</span><h3>Courage in suffering</h3><p>Christ knows his people’s trials and walks among them (1:12–13; 2:10).</p></article>
    <article><span class="n">II</span><h3>Faithfulness in temptation</h3><p>The church must refuse idolatry and compromise, even when it is costly (2:14; 13:16–17).</p></article>
    <article><span class="n">III</span><h3>Confidence in Christ</h3><p>Empires rise and fall, but the Lamb is on the throne now (5:6; 17:14).</p></article>
    <article><span class="n">IV</span><h3>Hope for the future</h3><p>Evil will be judged, death destroyed and all things made new (21:4–5).</p></article>
  </div>

  <h2>How should we read it?</h2>
  <p>In the very first verse, the word translated “made known” means to show by signs. So the right question is not “literal or symbolic?” but “<strong>what does this sign point to?</strong>” Often Revelation tells us itself:</p>
  <table class="symbols">
    <thead><tr><th scope="col">The picture</th><th scope="col">What it stands for</th><th scope="col">Where</th></tr></thead>
    <tbody>
      <tr><td>Seven lampstands</td><td>The churches</td><td>1:20</td></tr>
      <tr><td>The Lamb with seven horns</td><td>Christ, slain and risen, all-powerful</td><td>5:6</td></tr>
      <tr><td>Bowls of incense</td><td>The prayers of the saints</td><td>5:8</td></tr>
      <tr><td>The great dragon</td><td>Satan, “that ancient serpent”</td><td>12:9</td></tr>
      <tr><td>The many waters</td><td>Peoples, nations and languages</td><td>17:15</td></tr>
      <tr><td>The woman on the beast</td><td>The great city that rules the kings</td><td>17:18</td></tr>
      <tr><td>The bride of the Lamb</td><td>The holy city, God’s people</td><td>21:9–10</td></tr>
    </tbody>
  </table>
  <p>Numbers work the same way. <strong>Seven</strong> means fullness, <strong>twelve</strong> means the people of God, <strong>three and a half</strong> is a limited time of trouble (half of seven), and <strong>a thousand</strong> is a vast, complete number.</p>
  <div class="note"><p><strong>Four questions for every vision.</strong> What would the seven churches have understood? Where else does the Bible use this picture? (Revelation echoes the Old Testament hundreds of times.) What does it show us about Christ? How should it change the way we live?</p></div>

  <h2>Is it a timeline of future events?</h2>
  <p>Not a single straight line. Seven times, John is shown the whole age from Christ’s first coming to his return, each time from a new angle. It is like watching one match from seven cameras: the same game, but each angle shows what the others miss. And every time, the vision runs all the way to the end.</p>
  <ol class="mini-visions" aria-label="The seven visions in brief">
    <li><span class="mv-n">I</span><span class="mv-c">1–3</span><span class="mv-bar"><i style="--end:0"></i></span></li>
    <li><span class="mv-n">II</span><span class="mv-c">4–7</span><span class="mv-bar"><i style="--end:6%"></i></span></li>
    <li><span class="mv-n">III</span><span class="mv-c">8–11</span><span class="mv-bar"><i style="--end:10%"></i></span></li>
    <li><span class="mv-n">IV</span><span class="mv-c">12–14</span><span class="mv-bar"><i style="--end:14%"></i></span></li>
    <li><span class="mv-n">V</span><span class="mv-c">15–16</span><span class="mv-bar"><i style="--end:19%"></i></span></li>
    <li><span class="mv-n">VI</span><span class="mv-c">17–19</span><span class="mv-bar"><i style="--end:24%"></i></span></li>
    <li><span class="mv-n">VII</span><span class="mv-c">20–22</span><span class="mv-bar"><i style="--end:30%"></i></span></li>
  </ol>
  <p class="small">Each bar runs from Christ’s first coming to his second. The gold is the end coming into fuller view.</p>
  <p>That does not mean nothing in Revelation is future. Christ’s return, the resurrection of the dead, the last judgment and the new creation are still ahead of us. But a vision that comes later in the book does not have to happen later in time.</p>
  <p><a class="btn ghost" href="#structure">See the seven visions in full →</a></p>

  <section class="world wide" aria-labelledby="world-title">
    <span class="rubric">A field guide</span>
    <h2 id="world-title">The world of Revelation</h2>
    <p>The symbols are not separate puzzles. They tell one story. Christ is Lord of all. His church belongs to him. Satan opposes him, attacking the church through persecution and deception. Christ judges evil and brings his people into the new creation. Select any figure to study it.</p>
    <div class="world-grid">
      <a class="node christ" href="#throne"><b>Christ, the Lamb</b><small>On the throne now, Lord of all · Rev 5</small></a>
      <div class="world-col">
        <span class="world-label">Christ saves and keeps his people</span>
        <a class="node" href="#144000"><b>God’s people</b><small>Sealed, counted, kept · Rev 7</small></a>
        <a class="node" href="#witnesses"><b>The two witnesses</b><small>The church bearing testimony · Rev 11</small></a>
      </div>
      <div class="world-col">
        <span class="world-label red">Satan opposes Christ and attacks the church</span>
        <a class="node enemy" href="#satan"><b>The dragon</b><small>Satan, a defeated creature · Rev 12</small></a>
        <div class="world-pair">
          <a class="node enemy" href="#beast"><b>The beasts</b><small>Persecution and deceit · Rev 13</small></a>
          <a class="node enemy" href="#babylon"><b>Babylon</b><small>Seduction and idolatry · Rev 17–18</small></a>

    <p class="world-foot">The dragon is not Christ’s equal. He is a creature under God’s rule, already defeated at the cross and kept on a chain until his judgment.</p>
  </section>

  <h2>The story in five movements</h2>
  <ol class="movements">
    <li><span class="n">I</span><b>The church suffers</b><small>A faithful people under pressure</small></li>
    <li><span class="n">II</span><b>Christ reigns</b><small>The throne of heaven is not empty</small></li>
    <li><span class="n">III</span><b>Evil resists</b><small>The dragon, the beasts and Babylon</small></li>
    <li><span class="n">IV</span><b>Christ triumphs</b><small>Every enemy defeated at his return</small></li>
    <li><span class="n">V</span><b>All things new</b><small>God dwells with his people</small></li>
  </ol>

  <h2>What is its great message?</h2>
  <p>The One who died and rose again is “alive forever and ever” and holds “the keys of Death and of Hades” (1:18). He is coming again (22:20). Everything in between explains why his return is good news for his people.</p>
  <aside class="lesson"><span class="rubric">Remember this</span><p>Revelation was written to produce faithfulness rather than speculation, courage rather than fear, and hope rather than despair.</p></aside>

<section class="page" id="structure" data-nav="How the book is built" data-num="◇" data-keywords="structure seven visions progressive parallelism recapitulation hendriksen timeline outline">
  <p class="eyebrow">Reading the book · Its structure</p>
  <h1>Seven visions, one age</h1>
  <p class="lead">Revelation does not march forward chapter by chapter. Seven times John is shown the whole span from Christ’s first coming to his return, each vision from a new vantage point. Every vision reaches the end, and each time the end comes into fuller view, until the last opens onto the new creation.</p>
  <p>William Hendriksen called this pattern <strong>progressive parallelism</strong>. The visions run <em>parallel</em>, because each covers the same age. They are <em>progressive</em>, because the end is announced, then shown, then shown more and more fully. Select any vision below to open it.</p>

  <div class="visions wide" role="group" aria-labelledby="visions-h">
    <div class="visions-title">
      <span class="rubric">The Apocalypse of John</span>
      <h3 id="visions-h">Seven Visions, One Age</h3>
      <p>Each vision spans Christ’s first coming to his return, and each shows the end more fully.</p>
    </div>

      <div class="vcell vpart vend"></div>

      <button type="button" class="vcell vlabel" id="vision-1" aria-expanded="false" aria-controls="vd-1"><span class="vn">I</span><span class="vt"><b>Christ among the lampstands</b><small>Chapters 1–3</small></span><span class="vchev" aria-hidden="true">▸</span></button>

      <div class="vdetail" id="vd-1" hidden><div class="vdetail-inner">
        <p>The risen Christ walks among seven lampstands, which are the churches (1:12–20). His seven letters show the church of every age as he sees it. The end is not yet pictured, only promised: “He is coming with the clouds” (1:7). Every promise to “the one who overcomes” is kept in chapters 21–22.</p>

      <div class="vdetail" id="vd-2" hidden><div class="vdetail-inner">
        <p>Heaven’s throne room, and the slain Lamb takes the scroll (5:5–6), which is his enthronement after the cross. As he opens the seals, conquest, war, famine and death ride through the age; martyrs cry “How long?”; and the sixth seal brings the end itself (6:12–17). Chapter 7 shows God’s people sealed and safe.</p>

      <div class="vcell vend"></div>
      <div class="vdetail" id="vd-3" hidden><div class="vdetail-inner">
        <p>Trumpets sound warnings over a third of the world, yet the rest of mankind “still did not repent” (9:20). Meanwhile the church bears witness like Moses and Elijah, is overpowered and killed, and is raised to heaven. The seventh trumpet announces that the kingdom of the world has become the kingdom of Christ (11:15).</p>

      <div class="vdetail" id="vd-4" hidden><div class="vdetail-inner">
        <p>The curtain lifts on the spiritual war behind history. This vision starts with Christ’s birth and ascension (12:5). Thrown down by the cross, the dragon rages against the woman and calls up two beasts, the persecuting state and its false prophet. The age ends with the Son of Man reaping the harvest of the earth (14:14–20).</p>
        <ul><li><a href="#satan">Is Satan ruling the world?</a></li><li><a href="#beast">What is the beast?</a></li><li><a href="#666">What does 666 mean?</a></li><li><a href="#mark">What is the mark of the beast?</a></li><li><a href="#antichrist">Who is the Antichrist?</a></li></ul>

        <p>Back to the beginning one last time. At Christ’s first coming Satan is bound, so that he can no longer deceive the nations (20:1–3), and the souls of the faithful dead reign with Christ for the “thousand years.” After a brief release comes the same final battle as 19:19–21, then the great white throne, and finally the new heaven and new earth.</p>

  <h2>Five clues that Revelation repeats itself</h2>
  <h3>1. The end arrives too early</h3>
  <p>At the sixth seal the sun turns black, the sky rolls up like a scroll, every mountain and island moves, and people cry that “the great day of Their wrath has come” (6:12–17). That is the end of the world, and we are only in chapter 6. The book has to start over, and it does.</p>
  <h3>2. Trumpets and bowls strike the same targets in the same order</h3>
  <p>Earth, sea, rivers, sun, darkness, the river Euphrates, and a final storm: the trumpets (chapters 8–11) and the bowls (chapter 16) follow the same seven-step pattern, both modelled on the plagues of Egypt. The difference is that the trumpets strike “a third,” while the bowls are complete. <a href="#trumpets">See the two lists side by side.</a></p>
  <h3>3. The same storm closes each series, louder each time</h3>
  <p>Each series ends in the same storm from God’s throne, and it grows every time. After the seals come thunder, rumblings, lightning and an earthquake (8:5). After the trumpets, the same storm with a great hailstorm added (11:19). After the bowls, an earthquake greater than any in history and hailstones weighing almost a hundred pounds (16:18–21).</p>
  <h3>4. One final battle, told three times</h3>
  <p>The unclean spirits gather the kings “for battle on the great day” (16:14). The beast and the kings are “assembled to wage war” against the Rider (19:19). Satan gathers the nations “for battle” (20:8). In Greek each is <em>the</em> battle, and chapters 19 and 20 both borrow from the same prophecy, Ezekiel 38–39. So chapter 20 does not happen after chapter 19. It tells the same last battle from a new angle.</p>
  <h3>5. One period with five names</h3>
  <p>The time of the church’s witness and suffering is called 42 months, 1,260 days, and “a time, and times, and half a time” (11:2–3; 12:6, 14; 13:5). These are three ways of saying the same thing. <a href="#1260">See how they fit together.</a></p>

  <div class="note"><p><strong>Repetition is how God confirms a message.</strong> Joseph told Pharaoh, “because the dream was given to Pharaoh in two versions, the matter has been decreed by God” (Genesis 41:32). Daniel saw the same four kingdoms first as a statue (Daniel 2), then as four beasts (Daniel 7). Revelation does the same thing seven times over. The earliest Latin commentary on Revelation, by Victorinus of Pettau (died about 304), already taught that the bowls repeat the trumpets.</p></div>

  <h2>Two halves</h2>
  <p>Hendriksen saw the seven visions fall into two groups. <strong>Chapters 1–11</strong> show the struggle on the surface of history: the church persecuted by the world, but guarded, avenged and victorious. <strong>Chapters 12–22</strong> go deeper and show the spiritual war behind it: Christ and his church against the dragon and his helpers, the beast, the false prophet and Babylon. One by one, in the reverse order of their appearance, those enemies are judged: Babylon (ch. 18), the beast and false prophet (ch. 19), and finally the dragon himself (ch. 20).</p>

  <h2>So what is still future?</h2>
  <p>Every vision ends at the same real event: Christ’s visible return, the resurrection of the dead, the last judgment and the new creation. The parallel visions also show that the age ends with a <strong>short, intense climax</strong>: the beast’s war on the witnesses (11:7), Satan released “for a brief period of time” (20:3, 7–9), and what Paul calls the revealing of “the man of lawlessness” (2 Thessalonians 2:3). The church goes through that last trial under God’s protection, and Christ ends it by his coming.</p>

  <section class="evidence" aria-labelledby="ev-structure">
    <h2 id="ev-structure">How do we know?</h2>
    <p class="evidence-intro">The labels separate what the text says from the connections and conclusions drawn from it.</p>
    <div class="legend"><span><i class="tag stated">Stated</i> the text says it</span><span><i class="tag link">Connection</i> another passage sheds light</span><span><i class="tag inference">Inference</i> a conclusion drawn from both</span><span><i class="tag caution">Caution</i> where certainty ends</span></div>
    <details class="ev"><summary><span class="ev-n">01</span><span class="ev-ref">Revelation 6:12–17</span><i class="tag stated">Stated</i></summary><div class="ev-body"><p>The sixth seal describes the dissolving of heaven and earth and announces that the great day of wrath has come.</p><a href="https://ebible.org/engbsb/REV06.htm" target="_blank" rel="noopener">Read Revelation 6 ↗</a></div></details>
    <details class="ev"><summary><span class="ev-n">02</span><span class="ev-ref">Revelation 11:15–18</span><i class="tag stated">Stated</i></summary><div class="ev-body"><p>The seventh trumpet announces that “the time has come to judge the dead and to reward Your servants.” This is the end again, at the close of the second cycle.</p><a href="https://ebible.org/engbsb/REV11.htm" target="_blank" rel="noopener">Read Revelation 11 ↗</a></div></details>
    <details class="ev"><summary><span class="ev-n">03</span><span class="ev-ref">Revelation 16:14; 19:19; 20:8</span><i class="tag link">Connection</i></summary><div class="ev-body"><p>Three descriptions of the nations gathered for “the battle” against God, each followed by Christ’s decisive victory.</p><a href="https://ebible.org/engbsb/REV20.htm" target="_blank" rel="noopener">Read Revelation 20 ↗</a></div></details>
    <details class="ev"><summary><span class="ev-n">04</span><span class="ev-ref">Ezekiel 38–39</span><i class="tag link">Connection</i></summary><div class="ev-body"><p>The birds’ feast of Revelation 19:17–18 comes from Ezekiel 39:17–20, and Gog and Magog in 20:8 come from Ezekiel 38:2. One prophecy stands behind both chapters.</p><a href="https://ebible.org/engbsb/EZK39.htm" target="_blank" rel="noopener">Read Ezekiel 39 ↗</a></div></details>
    <details class="ev"><summary><span class="ev-n">05</span><span class="ev-ref">Genesis 41:32; Daniel 2 and 7</span><i class="tag link">Connection</i></summary><div class="ev-body"><p>God gives one revelation in more than one form to confirm it. Revelation follows the pattern of the prophets it quotes.</p><a href="https://ebible.org/engbsb/GEN41.htm" target="_blank" rel="noopener">Read Genesis 41 ↗</a></div></details>
    <details class="ev"><summary><span class="ev-n">06</span><span class="ev-ref">Where to draw the lines</span><i class="tag caution">Caution</i></summary><div class="ev-body"><p>Hendriksen’s seven sections are one careful outline. Other interpreters in the same tradition, such as G. K. Beale, divide the cycles a little differently, but they agree on the central point: the visions repeat and intensify rather than march in one sequence.</p></div></details>
  </section>

  <details class="alt">
    <summary>How others read it</summary>
    <div class="alt-body">
      <p class="alt-intro">The main difference is whether chapters 4–22 form one continuous sequence.</p>
      <div class="alt-grid">
        <article><h3>One straight line</h3><p>Many futurists read chapters 4–22 as a single chronology: the church removed (4:1), seven years of tribulation (chapters 6–18), Christ’s return (19), then a thousand-year earthly kingdom (20).</p></article>
        <article class="ours"><h3>Seven parallel visions</h3><p>The seals, trumpets and bowls each reach the end; chapter 20 returns to the first coming. The book shows one age seven times, and one return at its close.</p></article>
      </div>
    </div>
  </details>

  <aside class="lesson"><span class="rubric">Remember this</span><p>Wherever you are reading in Revelation, the cross is behind you and the return of Christ is ahead of you. You are living in the age the visions describe.</p></aside>
</section>

<section class="page" id="interpretations" data-nav="How to interpret Revelation" data-num="◈" data-keywords="interpretation preterism historicism futurism idealism amillennial premillennial postmillennial views">
  <p class="eyebrow">Reading the book · Four lenses, three views</p>
  <h1>Different lenses, one Revelation</h1>
  <p class="lead">Christians who love Revelation have read it in different ways. Two questions sort out most of the differences: <em>when</em> are the visions fulfilled, and <em>when</em> is the thousand years of chapter 20?</p>

  <div class="primary">
    <span class="rubric">The reading used in this guide</span>
    <h2>Christ reigns now. He will return once, in glory.</h2>
    <p>This guide follows the amillennial reading of the Reformed confessions, taught by Geerhardus Vos, Louis Berkhof, William Hendriksen, Anthony Hoekema, Kim Riddlebarger and W. Robert Godfrey. Revelation spoke first to real churches under Rome. Its seven visions show the pattern of the whole age between Christ’s comings. The thousand years of chapter 20 is that present age, in which Christ reigns and Satan cannot stop the gospel from reaching the nations.</p>
    <p>At the end of the age Christ will return visibly, once. All the dead will be raised, the world judged, and heaven and earth made new.</p>
  </div>

  <div class="disclaimer"><p style="margin:0">These are <strong>two separate questions</strong>, so the answers can be combined. Someone can be an amillennialist and a partial preterist, for example. None of the diagrams below is a calendar of the future.</p></div>

<section class="page topic" id="churches" data-nav="What are the seven letters?" data-num="01" data-keywords="seven churches letters ephesus smyrna pergamum thyatira sardis philadelphia laodicea lampstands revelation 2 3 overcomer">
  <p class="eyebrow">Question 01 · Revelation 1–3</p>
  <h1>What are the seven letters?</h1>
  <p class="deck">Christ’s word to his church in every age</p>
  <div class="locator" data-vision="1"></div>
  <ul class="refs" aria-label="Passages to read"><li class="refs-label">Read in the BSB</li><li><a href="https://ebible.org/engbsb/REV01.htm" target="_blank" rel="noopener">Revelation 1</a></li><li><a href="https://ebible.org/engbsb/REV02.htm" target="_blank" rel="noopener">Revelation 2</a></li><li><a href="https://ebible.org/engbsb/REV03.htm" target="_blank" rel="noopener">Revelation 3</a></li></ul>
  <figure class="art"><img data-art src="https://commons.wikimedia.org/wiki/Special:FilePath/Albrecht_D%C3%BCrer,_The_Vision_of_the_Seven_Candlesticks,_1498,_NGA_142350.jpg?width=1000" alt="Woodcut: Christ enthroned among seven candlesticks, holding seven stars, a sword from his mouth, with John kneeling before him." loading="lazy" decoding="async" width="1000" height="1400"><figcaption><b>The Vision of the Seven Candlesticks</b>, Albrecht Dürer, 1498. Historical artwork, not a literal picture of the vision.</figcaption></figure>
  <blockquote class="passage"><span class="rubric">The text</span><p>This is the mystery of the seven stars you saw in My right hand and of the seven golden lampstands: The seven stars are the angels of the seven churches, and the seven lampstands are the seven churches.</p><footer><cite>Revelation 1:20</cite><a href="https://ebible.org/engbsb/REV01.htm" target="_blank" rel="noopener">Read the chapter ↗</a></footer></blockquote>
  <div class="myth"><span class="rubric">A common misunderstanding</span><p>The seven churches are a coded timeline of seven ages of church history, and we now live in the last one, lukewarm Laodicea.</p></div>
  <div class="teach">
    <h2>What Scripture teaches</h2>
    <p class="illum">These were seven real congregations in the Roman province of Asia, listed in the order a messenger would travel the road that linked them. Christ speaks to each by name, about their actual city and troubles. Yet each letter ends, “He who has an ear, let him hear what the Spirit says to <strong>the churches</strong>”—plural. Seven is the number of fullness, so together these letters are Christ’s word to the whole church, in every place and every century.</p>
    <p>Each letter follows the same pattern. Christ describes himself with a title from the vision of chapter 1, says “I know your works,” praises what is good, rebukes what is wrong, calls for repentance, and makes a promise “to the one who overcomes.” Every one of those promises is fulfilled in the final vision of the new creation.</p>
  </div>
  <ul class="churches" aria-label="The seven churches">
    <li><span class="ref">2:1–7</span><b>Ephesus</b><small>Sound in doctrine, but has abandoned its first love</small></li>
    <li class="clean"><span class="ref">2:8–11</span><b>Smyrna</b><small>Poor and persecuted, but rich. No rebuke</small></li>
    <li><span class="ref">2:12–17</span><b>Pergamum</b><small>Faithful under pressure, yet tolerating false teaching</small></li>
    <li><span class="ref">2:18–29</span><b>Thyatira</b><small>Growing in love and service, yet tolerating “Jezebel”</small></li>
    <li><span class="ref">3:1–6</span><b>Sardis</b><small>A reputation for life, but dead</small></li>
    <li class="clean"><span class="ref">3:7–13</span><b>Philadelphia</b><small>Little strength, yet faithful. No rebuke</small></li>
    <li><span class="ref">3:14–22</span><b>Laodicea</b><small>Rich and comfortable, but lukewarm</small></li>
  </ul>
  <h3>Promises made in chapters 2–3, kept in chapters 21–22</h3>
  <div class="table-scroll"><table class="promises">
    <thead><tr><th scope="col">The promise</th><th scope="col">Made</th><th scope="col">Kept</th></tr></thead>
    <tbody>
      <tr><td>The tree of life</td><td class="ref">2:7</td><td><span class="ref">22:2</span> On either side of the river stood a tree of life</td></tr>
      <tr><td>Safe from the second death</td><td class="ref">2:11</td><td><span class="ref">21:7–8</span> The second death is for the unbelieving, not the overcomer</td></tr>
      <tr><td>A new name</td><td class="ref">2:17</td><td><span class="ref">22:4</span> His name will be on their foreheads</td></tr>
      <tr><td>The morning star</td><td class="ref">2:28</td><td><span class="ref">22:16</span> Jesus is the bright Morning Star</td></tr>
      <tr><td>Named in the book of life</td><td class="ref">3:5</td><td><span class="ref">21:27</span> Only those in the Lamb’s book of life enter the city</td></tr>
      <tr><td>The name of the New Jerusalem</td><td class="ref">3:12</td><td><span class="ref">21:2</span> The holy city comes down from heaven</td></tr>
      <tr><td>A share in Christ’s throne</td><td class="ref">3:21</td><td><span class="ref">22:5</span> They will reign forever and ever</td></tr>
    </tbody>
  </table></div>
  <section class="evidence" aria-labelledby="ev-churches">
    <h2 id="ev-churches">How do we know?</h2>
    <details class="ev"><summary><span class="ev-n">01</span><span class="ev-ref">Revelation 1:4, 11</span><i class="tag stated">Stated</i></summary><div class="ev-body"><p>John writes “to the seven churches in the province of Asia” and names the seven cities.</p><a href="https://ebible.org/engbsb/REV01.htm" target="_blank" rel="noopener">Read Revelation 1 ↗</a></div></details>
    <details class="ev"><summary><span class="ev-n">02</span><span class="ev-ref">Revelation 2:7, 11, 17, 29; 3:6, 13, 22</span><i class="tag stated">Stated</i></summary><div class="ev-body"><p>Every letter closes with a call to hear what the Spirit says to all the churches, not only the one addressed.</p><a href="https://ebible.org/engbsb/REV02.htm" target="_blank" rel="noopener">Read Revelation 2 ↗</a></div></details>
    <details class="ev"><summary><span class="ev-n">03</span><span class="ev-ref">Revelation 21–22</span><i class="tag link">Connection</i></summary><div class="ev-body"><p>The promises to the overcomer reappear, one by one, as features of the New Jerusalem.</p><a href="https://ebible.org/engbsb/REV22.htm" target="_blank" rel="noopener">Read Revelation 22 ↗</a></div></details>
    <details class="ev"><summary><span class="ev-n">04</span><span class="ev-ref">“The angels of the churches”</span><i class="tag caution">Caution</i></summary><div class="ev-body"><p>Interpreters differ on whether the “angels” (1:20) are heavenly guardians, the churches’ pastors, or a way of personifying each church. The main message of the letters does not depend on the answer.</p></div></details>
  </section>
  <details class="alt"><summary>How others read it</summary><div class="alt-body"><div class="alt-grid">
    <article><h3>Seven church ages</h3><p>Some dispensational and historicist readers see the letters as prophecy of seven periods, from the apostles (Ephesus) to the last days (Laodicea).</p></article>
    <article class="ours"><h3>Seven real churches, one whole church</h3><p>The letters address actual first-century congregations, and because seven is the number of fullness, they speak to every church in every age. All seven kinds of church exist at the same time, today as then.</p></article>
  </div></div></details>
  <aside class="lesson"><span class="rubric">The lesson to remember</span><p>Christ walks among his churches. He sees what we hide, and he promises everything to those who overcome.</p></aside>
  <section class="quiz"><span class="rubric">Check your understanding</span><h3>Each letter closes: “Let him hear what the Spirit says to …”</h3><div class="quiz-options"><button class="quiz-opt" data-correct>“the churches”: every letter is for the whole church</button><button class="quiz-opt">“this church”: each letter is private to one city</button><button class="quiz-opt">“the last church”: only Laodicea speaks to us today</button></div><p class="quiz-feedback" hidden>The plural appears at the end of all seven letters (2:7 and following). Christ wants every church to hear what he says to each.</p></section>
</section>

<section class="page topic" id="throne" data-nav="Who is the Lamb on the throne?" data-num="02" data-keywords="throne room lamb lion elders twenty-four living creatures scroll revelation 4 5 heaven worship">
  <p class="eyebrow">Question 02 · Revelation 4–5</p>
  <h1>Who is the Lamb on the throne?</h1>
  <p class="deck">The view from heaven that makes sense of everything else</p>
  <div class="locator" data-vision="2"></div>
  <ul class="refs" aria-label="Passages to read"><li class="refs-label">Read in the BSB</li><li><a href="https://ebible.org/engbsb/REV04.htm" target="_blank" rel="noopener">Revelation 4</a></li><li><a href="https://ebible.org/engbsb/REV05.htm" target="_blank" rel="noopener">Revelation 5</a></li><li><a href="https://ebible.org/engbsb/EZK01.htm" target="_blank" rel="noopener">Ezekiel 1</a></li><li><a href="https://ebible.org/engbsb/ISA06.htm" target="_blank" rel="noopener">Isaiah 6</a></li></ul>
  <figure class="art"><img data-art src="https://commons.wikimedia.org/wiki/Special:FilePath/Albrecht_D%C3%BCrer,_Saint_John_before_God_and_the_Elders,_1498,_NGA_142351.jpg?width=1000" alt="Woodcut: God enthroned in heaven with the Lamb, surrounded by the twenty-four crowned elders, while John looks up through an open door." loading="lazy" decoding="async" width="1000" height="1400"><figcaption><b>Saint John before God and the Elders</b>, Albrecht Dürer, 1498. Historical artwork, not a literal picture of the vision.</figcaption></figure>
  <blockquote class="passage"><span class="rubric">The text</span><p>Then one of the elders said to me, “Do not weep! Behold, the Lion of the tribe of Judah, the Root of David, has triumphed to open the scroll and its seven seals.” Then I saw a Lamb who appeared to have been slain, standing in the center of the throne, encircled by the four living creatures and the elders.</p><footer><cite>Revelation 5:5–6</cite><a href="https://ebible.org/engbsb/REV05.htm" target="_blank" rel="noopener">Read the chapter ↗</a></footer></blockquote>
  <div class="myth"><span class="rubric">A common misunderstanding</span><p>“Come up here” in 4:1 is the rapture of the church, so the church disappears from the book after chapter 3.</p></div>
  <div class="teach">
    <h2>What Scripture teaches</h2>
    <p class="illum">Before John sees a single judgment, he is shown the throne. Heaven is not empty and history is not out of control: God is enthroned, surrounded by worship (ch. 4). Then comes the turning point of the whole book. No one is worthy to open the sealed scroll, God’s plan to judge evil and redeem his people, until the elder announces the Lion of Judah. John turns and sees a <strong>Lamb, standing though slain</strong>, in the centre of the throne.</p>
    <p>That is the gospel in one picture. Christ conquered as a Lion by dying as a Lamb, and he now shares his Father’s throne (3:21). This is his enthronement after the cross and ascension, the present reign the rest of Revelation assumes. The twenty-four elders stand for the whole people of God: twelve for the tribes of Israel and twelve for the apostles, the same two twelves written on the gates and foundations of the New Jerusalem (21:12–14). The four living creatures are the throne-guardians of Ezekiel 1 and Isaiah 6, leading all creation in praise.</p>
    <p>And 4:1 is John’s own summons into the vision (“I will show you”), not the church’s departure. The church is on earth all through the book as “the saints,” the sealed servants, the witnesses and the bride.</p>
  </div>
  <section class="evidence" aria-labelledby="ev-throne">
    <h2 id="ev-throne">How do we know?</h2>
    <details class="ev"><summary><span class="ev-n">01</span><span class="ev-ref">Revelation 5:5–6, 9</span><i class="tag stated">Stated</i></summary><div class="ev-body"><p>John hears of a Lion but sees a slain Lamb, who is worthy because by his blood he purchased people for God from every nation.</p><a href="https://ebible.org/engbsb/REV05.htm" target="_blank" rel="noopener">Read Revelation 5 ↗</a></div></details>
    <details class="ev"><summary><span class="ev-n">02</span><span class="ev-ref">Revelation 3:21</span><i class="tag stated">Stated</i></summary><div class="ev-body"><p>Christ “overcame and sat down with My Father on His throne.” His reign follows his victory; it is not postponed.</p><a href="https://ebible.org/engbsb/REV03.htm" target="_blank" rel="noopener">Read Revelation 3 ↗</a></div></details>
    <details class="ev"><summary><span class="ev-n">03</span><span class="ev-ref">Revelation 21:12–14</span><i class="tag link">Connection</i></summary><div class="ev-body"><p>The city’s gates bear the names of the twelve tribes and its foundations the twelve apostles: one people of God, old covenant and new.</p><a href="https://ebible.org/engbsb/REV21.htm" target="_blank" rel="noopener">Read Revelation 21 ↗</a></div></details>
    <details class="ev"><summary><span class="ev-n">04</span><span class="ev-ref">Revelation 4:1</span><i class="tag caution">Caution</i></summary><div class="ev-body"><p>The voice says “Come up here, and I will show you.” It is addressed to John, not the church, and it introduces what he will see.</p><a href="https://ebible.org/engbsb/REV04.htm" target="_blank" rel="noopener">Read Revelation 4 ↗</a></div></details>
  </section>
  <details class="alt"><summary>How others read it</summary><div class="alt-body"><div class="alt-grid">
    <article><h3>The raptured church in heaven</h3><p>Some dispensationalists take the elders as the church already taken to heaven before a seven-year tribulation, with 4:1 as the moment of the rapture.</p></article>
    <article class="ours"><h3>The present reign of the Lamb</h3><p>Chapters 4–5 show Christ enthroned since his ascension. The elders represent the whole people of God, and the scroll he opens governs the entire age that follows.</p></article>
  </div></div></details>
  <aside class="lesson"><span class="rubric">The lesson to remember</span><p>Whatever is happening on earth, the throne of heaven is occupied, and the One sitting there was slain for you.</p></aside>
  <section class="quiz"><span class="rubric">Check your understanding</span><h3>The elder tells John to look at a Lion. What does John actually see?</h3><div class="quiz-options"><button class="quiz-opt" data-correct>A Lamb, standing though it had been slain</button><button class="quiz-opt">A lion with seven heads</button><button class="quiz-opt">An empty throne</button></div><p class="quiz-feedback" hidden>John hears “Lion” and sees a slain Lamb (5:5–6). Christ’s royal victory was won through his sacrificial death.</p></section>
</section>

<section class="page topic" id="horsemen" data-nav="Who are the four horsemen?" data-num="03" data-keywords="four horsemen seals white red black pale horse revelation 6 zechariah conquest war famine death">
  <p class="eyebrow">Question 03 · Revelation 6</p>
  <h1>Who are the four horsemen?</h1>
  <p class="deck">The troubles of a fallen age, released by the Lamb</p>
  <div class="locator" data-vision="2"></div>
  <ul class="refs" aria-label="Passages to read"><li class="refs-label">Read in the BSB</li><li><a href="https://ebible.org/engbsb/REV06.htm" target="_blank" rel="noopener">Revelation 6</a></li><li><a href="https://ebible.org/engbsb/ZEC06.htm" target="_blank" rel="noopener">Zechariah 6</a></li><li><a href="https://ebible.org/engbsb/MAT24.htm" target="_blank" rel="noopener">Matthew 24</a></li></ul>
  <figure class="art"><img data-art src="https://commons.wikimedia.org/wiki/Special:FilePath/Albrecht_D%C3%BCrer,_The_Four_Horsemen,_1498,_NGA_142352.jpg?width=1000" alt="Woodcut: four riders charge across the sky, trampling people beneath them, with an angel above." loading="lazy" decoding="async" width="1000" height="1400"><figcaption><b>The Four Horsemen</b>, Albrecht Dürer, 1498. Historical artwork, not a literal picture of the vision.</figcaption></figure>
  <blockquote class="passage"><span class="rubric">The text</span><p>Then I looked and saw a pale green horse. Its rider’s name was Death, and Hades followed close behind. And they were given authority over a fourth of the earth, to kill by sword, by famine, by plague, and by the beasts of the earth.</p><footer><cite>Revelation 6:8</cite><a href="https://ebible.org/engbsb/REV06.htm" target="_blank" rel="noopener">Read the chapter ↗</a></footer></blockquote>
