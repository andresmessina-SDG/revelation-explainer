<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#F7F3EA" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#13110E" media="(prefers-color-scheme: dark)">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<meta name="description" content="A clear, hopeful guide to the Book of Revelation: seven visions of one age, and twenty of its most misunderstood questions, read in the light of all Scripture.">
<title>Revelation · The Illuminated Codex / Apocalipsis · El Códice Iluminado / Откровение · Иллюминированный кодекс</title>
<script>
/* Apply saved reading settings before first paint, so there is no flash. */
(function () {
  try {
    var get = function (k) { var v = localStorage.getItem('codex:' + k); return v === null ? null : JSON.parse(v); };
    var r = document.documentElement, theme = get('theme') || 'vellum', size = get('size');
    if (theme === 'auto') theme = matchMedia('(prefers-color-scheme: dark)').matches ? 'night' : 'vellum';
    r.dataset.theme = theme;
    if (size) r.style.setProperty('--zoom', size);
    if (get('side') === false) r.dataset.side = 'hidden';
  } catch (e) { document.documentElement.dataset.theme = 'vellum'; }
})();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya+SC:wght@500;700&amp;family=Cinzel:wght@600&amp;family=Inter:opsz,wght@14..32,400..700&amp;family=Literata:ital,opsz,wght@0,7..72,400..650;1,7..72,400..600&amp;family=Newsreader:ital,opsz,wght@0,6..72,400..650;1,6..72,400..600&amp;display=swap">
<style>
/* ==========================================================================
   Revelation · The Illuminated Codex
   One stylesheet. Tokens first, then layout, then components.
   ========================================================================== */

:root{
  --vellum:#F4EBD6;      /* page ground */
  --vellum-2:#EADBB9;    /* deeper vellum: panels, "age to come" */
  --paper:#FBF6EA;       /* raised surfaces */
  --rule:#D9C7A0;        /* hairlines */
  --rule-strong:#A68A62;
  --ink:#2B1D12;         /* body text */
  --ink-2:#5A4632;       /* secondary text */
  --ink-3:#7A6449;       /* captions (still 4.5:1 on vellum) */
  --lapis:#1F3A6B;       /* Christ, the church, the present age */
  --lapis-2:#2E4E86;
  --lapis-ink:#F6EEDC;   /* text on lapis */
  --gilt:#C9A045;        /* gold leaf: fills and rules only */
  --gilt-deep:#7E5A17;   /* gold as text */
  --gilt-pale:#E6C877;   /* gold on lapis */
  --vermilion:#9E2A17;   /* rubrics, warnings */
  --vermilion-pale:#F3DED2;
  --verdigris:#2F6152;   /* correct answers, connections */
  --verdigris-pale:#DCE8DF;
  --link:#1F3A6B;        /* lapis used as text */
  --hover:#FFFFFF;       /* hovered raised surface */
  --art-bg:#EFE6CF;
  --myth-line:#E2BFAE;
  --myth-ink:#4A2418;
  --enemy-line:#D9A894;
  --clean-bg:#EEF3EC;
  --select:#E3CF9B;
  --christ-small:#DCE3F0;
  --shade:rgba(27,20,12,.55);
  --shadow:0 18px 50px rgba(43,29,18,.18);
  --side-w:300px;

  --display:'EB Garamond',Georgia,'Times New Roman',serif;
  --text:'EB Garamond',Georgia,'Times New Roman',serif;
  --caps:'Cinzel',Georgia,serif;

  --measure:44rem;
  --wide:62rem;
  --radius:3px;
  --top:64px;
}

/* Night: a low-glare page for evening reading */
:root[data-theme="night"]{
  color-scheme:dark;
  --vellum:#1B1612; --vellum-2:#2A221A; --paper:#231C16;
  --rule:#3B3126; --rule-strong:#6A5944;
  --ink:#EDE3CF; --ink-2:#CDBEA4; --ink-3:#AE9D82;
  --lapis:#2A4A80; --lapis-2:#335A98; --lapis-ink:#F4ECDA;
  --gilt:#B9933F; --gilt-deep:#D6B266; --gilt-pale:#E8CD84;
  --vermilion:#E58A6D; --vermilion-pale:#3A221A;
  --verdigris:#86C3AC; --verdigris-pale:#1C3329;
  --link:#A9C2EE; --hover:#2D251D; --art-bg:#D8CCB1;
  --myth-line:#5C3527; --myth-ink:#F2D3C4; --enemy-line:#6E3F30; --clean-bg:#1F2E26;
  --select:#5A4A2A; --christ-small:#C9D5EC; --shade:rgba(0,0,0,.6); --shadow:0 18px 50px rgba(0,0,0,.5);
}

*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:calc(var(--top) + 24px);-webkit-text-size-adjust:100%;overflow-x:clip}
@media (prefers-reduced-motion:no-preference){html{scroll-behavior:smooth}}
body{
  margin:0;background:var(--vellum);color:var(--ink);
  font:400 19px/1.7 var(--text);
  font-kerning:normal;font-variant-ligatures:common-ligatures;
  -webkit-font-smoothing:antialiased;overflow-x:clip;
}
img{max-width:100%;display:block}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--link);text-decoration-thickness:1px;text-underline-offset:3px}
a:hover{color:var(--vermilion)}
::selection{background:var(--select);color:var(--ink)}
:focus-visible{outline:3px solid var(--lapis-2);outline-offset:3px;border-radius:2px}
[hidden]{display:none!important}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
.skip{position:absolute;left:16px;top:-60px;z-index:300;background:var(--lapis);color:var(--lapis-ink);padding:10px 16px;font:500 15px var(--text);text-decoration:none}
.skip:focus{top:12px;color:var(--lapis-ink)}

/* ---------- Top bar ---------- */
.topbar{position:sticky;top:0;z-index:50;height:var(--top);background:var(--vellum);border-bottom:1px solid var(--rule)}
.topbar-inner{max-width:1480px;height:100%;margin:0 auto;padding:0 28px;display:flex;align-items:center;justify-content:space-between;gap:16px}
.brand{display:flex;align-items:baseline;gap:12px;text-decoration:none;color:var(--ink);min-width:0}
.brand-mark{font:600 24px/1 var(--caps);letter-spacing:.06em;color:var(--ink)}
.brand-sub{font:400 15px/1 var(--text);font-style:italic;color:var(--ink-2);white-space:nowrap}
.top-actions{display:flex;align-items:center;gap:10px}
.top-status{font:500 12px/1 var(--caps);letter-spacing:.14em;text-transform:uppercase;color:var(--ink-2);white-space:nowrap}
.lang-pick{display:inline-flex;border:1px solid var(--rule-strong);border-radius:var(--radius);background:var(--paper);overflow:hidden}
.lang-pick button{min-width:44px;min-height:44px;padding:0 10px;border:0;background:none;font:600 12.5px/1 var(--caps);letter-spacing:.12em;color:var(--ink-2)}
.lang-pick button+button{border-left:1px solid var(--rule-strong)}
.lang-pick button:hover{color:var(--link);background:var(--hover)}
.lang-pick button[aria-pressed="true"]{background:var(--lapis);color:var(--lapis-ink);cursor:default}
.brand-star{color:var(--vermilion)}
.contents-btn{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 14px;border:1px solid var(--rule-strong);border-radius:var(--radius);background:var(--paper);font:500 13px/1 var(--caps);letter-spacing:.12em;text-transform:uppercase;color:var(--ink)}
.contents-btn svg{width:18px;height:18px}
.progress{position:fixed;top:var(--top);left:0;right:0;height:2px;z-index:51;pointer-events:none}
.progress span{display:block;height:100%;width:0;background:var(--gilt)}

/* ---------- Layout ---------- */
.layout{max-width:1480px;margin:0 auto;display:grid;grid-template-columns:var(--side-w) minmax(0,1fr)}
:root[data-side="hidden"]{--side-w:0px}
:root[data-side="hidden"] .side{display:none}
:root[data-side="hidden"] .layout{grid-template-columns:minmax(0,1fr)}
.reading{grid-column:-2/-1}
#pages{zoom:var(--zoom,1)}
.side{border-right:1px solid var(--rule);min-width:0}
.side-inner{position:sticky;top:var(--top);max-height:calc(100vh - var(--top));overflow-y:auto;padding:20px 16px 40px 22px;scrollbar-width:thin;scrollbar-color:var(--rule-strong) transparent}
.reading{min-width:0;padding:56px clamp(22px,5vw,72px) 96px}

/* ---------- Navigation (sidebar + drawer share markup) ---------- */
.nav-group{margin:0 0 22px}
.nav-group-title{margin:0 0 6px;padding:0 10px;font:600 11.5px/1.5 var(--caps);letter-spacing:.16em;text-transform:uppercase;color:var(--vermilion)}
.nav-group-sub{display:block;font:italic 400 13.5px/1.4 var(--text);letter-spacing:0;text-transform:none;color:var(--ink-3);margin-top:1px}
.nav-list{list-style:none;margin:0;padding:0}
.nav-link{display:grid;grid-template-columns:30px minmax(0,1fr) 16px;align-items:baseline;gap:6px;width:100%;padding:7px 10px;border:0;border-left:2px solid transparent;background:none;text-align:left;font:400 16px/1.35 var(--text);color:var(--ink-2);text-decoration:none;border-radius:0}
.nav-link:hover{background:var(--vellum-2);color:var(--ink)}
.nav-link[aria-current="page"]{border-left-color:var(--link);background:var(--paper);color:var(--ink);font-weight:500}
.nav-num{font:500 12px/1 var(--caps);color:var(--gilt-deep);letter-spacing:.04em}
.nav-done{font-size:13px;color:var(--verdigris);opacity:0;text-align:center}
.nav-link.is-done .nav-done{opacity:1}
.nav-link.is-seen .nav-done{opacity:1;font-size:0}
.nav-link.is-seen .nav-done::before{content:'';display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--rule-strong);vertical-align:middle}

/* ---------- Drawer (mobile contents) ---------- */
.drawer{position:fixed;inset:0;z-index:200}
.drawer-shade{position:absolute;inset:0;background:var(--shade)}
.drawer-panel{position:absolute;left:0;right:0;bottom:0;max-height:88dvh;display:flex;flex-direction:column;background:var(--vellum);border-top:3px double var(--gilt);padding-bottom:env(safe-area-inset-bottom,0)}
.drawer-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 18px 10px}
.drawer-head h2{margin:0;font:500 26px/1.1 var(--display)}
.drawer-kicker{display:block;font:600 11px/1.4 var(--caps);letter-spacing:.16em;text-transform:uppercase;color:var(--vermilion)}
.icon-btn{display:inline-grid;place-items:center;min-width:44px;min-height:44px;border:1px solid var(--rule-strong);border-radius:50%;background:var(--paper);color:var(--ink)}
.search-box{display:flex;align-items:center;gap:10px;padding:0 12px;border:1px solid var(--rule-strong);background:var(--paper);border-radius:var(--radius)}
.search-box svg{flex:none;width:18px;height:18px;color:var(--ink-3)}
.search-box input{flex:1;min-width:0;height:42px;border:0;background:none;outline:none;font-size:16.5px;color:var(--ink)}
.search-box input::placeholder{color:var(--ink-3)}
.search-box:focus-within{outline:3px solid var(--lapis-2);outline-offset:2px}
.drawer-search{margin:0 18px 10px}
.drawer-search input{height:46px;font-size:17px}
.drawer-list{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding:4px 10px 20px}
.drawer-list .nav-link{min-height:48px;align-items:center;font-size:17px}
.drawer-empty{padding:16px 12px;color:var(--ink-2)}
body.drawer-open{overflow:hidden}

/* ---------- Page shell ---------- */
.page{max-width:var(--measure);margin:0 auto}
.page:focus{outline:none}
@media (prefers-reduced-motion:no-preference){.page:not([hidden]){animation:reveal .35s ease both}}
@keyframes reveal{from{opacity:.2;transform:translateY(8px)}to{opacity:1;transform:none}}
.wide{position:relative;left:50%;transform:translateX(-50%);width:min(var(--wide),calc((100vw - 48px) / var(--zoom,1)))}
@media (min-width:1101px){.wide{width:min(var(--wide),calc((100vw - var(--side-w) - 2*clamp(22px,5vw,72px)) / var(--zoom,1)))}}
[tabindex="-1"]:focus{outline:none}

/* ---------- Typography ---------- */
h1,h2,h3{font-family:var(--display);font-weight:500;color:var(--ink);text-wrap:balance}
h1{font-size:clamp(42px,5.4vw,70px);line-height:1.02;letter-spacing:-.015em;margin:0 0 18px}
h2{font-size:clamp(28px,3.2vw,38px);line-height:1.12;margin:56px 0 16px}
h3{font-size:clamp(22px,2.3vw,26px);line-height:1.2;margin:32px 0 10px}
p{margin:0 0 1em}
.eyebrow{display:flex;align-items:center;flex-wrap:wrap;gap:10px;margin:0 0 18px;font:600 13px/1.5 var(--caps);letter-spacing:.18em;text-transform:uppercase;color:var(--vermilion)}
.eyebrow::after{content:'';flex:1;min-width:40px;max-width:120px;height:1px;background:var(--gilt)}
.lead{font-size:clamp(20px,2vw,23px);line-height:1.55;color:var(--ink)}
.deck{font-size:22px;font-style:italic;color:var(--ink-2);margin:-6px 0 18px}
.rubric{font:600 12.5px/1.5 var(--caps);letter-spacing:.16em;text-transform:uppercase;color:var(--vermilion);display:block;margin-bottom:8px}
.small{font-size:16px;color:var(--ink-2)}
strong{font-weight:600}
em{font-style:italic}
.ornament{display:flex;align-items:center;justify-content:center;gap:14px;margin:48px 0;color:var(--gilt-deep)}
.ornament::before,.ornament::after{content:'';flex:1;max-width:160px;height:1px;background:var(--gilt)}
.ornament span{width:8px;height:8px;background:var(--vermilion);transform:rotate(45deg)}

/* Illuminated initial — first paragraph of teaching sections */
.illum::first-letter{
  float:left;font:600 3.35em/1 var(--caps);color:var(--gilt-pale);background:var(--lapis);
  border:2px solid var(--gilt);padding:.16em .14em .1em;margin:.08em .14em 0 0;
}

/* ---------- Scripture chips ---------- */
.refs{display:flex;flex-wrap:wrap;gap:8px;list-style:none;margin:0 0 30px;padding:0}
.refs-label{width:100%;font:600 11.5px/1.4 var(--caps);letter-spacing:.16em;text-transform:uppercase;color:var(--ink-3)}
.refs a{display:inline-flex;align-items:center;gap:6px;min-height:36px;padding:4px 12px;border:1px solid var(--rule-strong);border-radius:999px;background:var(--paper);font-size:16px;color:var(--ink);text-decoration:none}
.refs a:hover{border-color:var(--link);color:var(--link)}
.refs a::after{content:'↗';font-size:13px;color:var(--ink-3)}

/* ---------- Vision locator strip ---------- */
.locator{display:flex;align-items:center;flex-wrap:wrap;gap:6px 12px;margin:0 0 26px;font-size:15.5px;color:var(--ink-2)}
.locator-track{display:flex;gap:3px}
.locator a{display:inline-grid;place-items:center;min-width:34px;height:28px;padding:0 4px;font:500 12px/1 var(--caps);letter-spacing:.04em;color:var(--ink-2);text-decoration:none;border:1px solid var(--rule)}
.locator a.on{background:var(--lapis);color:var(--lapis-ink);border-color:var(--lapis)}
.locator a:hover{border-color:var(--link)}

/* ---------- Art ---------- */
.art{margin:8px 0 36px;background:var(--paper);border:1px solid var(--rule);padding:14px}
.art img{width:100%;height:clamp(240px,36vw,420px);object-fit:contain;background:var(--art-bg);mix-blend-mode:multiply}
.art figcaption{padding:12px 4px 0;font-size:15.5px;line-height:1.45;font-style:italic;color:var(--ink-2)}
.art figcaption b{font-style:normal;font-weight:500;color:var(--ink)}
.art.is-missing img{display:none}
.art.is-missing::before{content:'✦';display:grid;place-items:center;height:120px;font-size:34px;color:var(--gilt);background:var(--art-bg)}

/* ---------- Passage ---------- */
.passage{margin:0 0 34px;padding:28px 30px 24px;background:var(--paper);border-top:3px double var(--gilt);border-bottom:3px double var(--gilt)}
.passage .rubric{margin-bottom:12px}
.passage p{margin:0 0 14px;font-size:clamp(21px,2.1vw,25px);line-height:1.5;font-style:italic;color:var(--ink)}
.passage footer{display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:8px 16px}
.passage cite{font:600 14px/1.4 var(--caps);letter-spacing:.1em;font-style:normal;color:var(--ink)}
.passage a{font-size:16px}

/* ---------- Misunderstanding / teaching / lesson ---------- */
.myth{margin:0 0 36px;padding:20px 24px;background:var(--vermilion-pale);border:1px solid var(--myth-line)}
.myth .rubric{margin-bottom:6px}
.myth p{margin:0;font-size:21px;line-height:1.45;color:var(--myth-ink)}
.teach h2{margin-top:0}
.teach p{font-size:19.5px}
.lesson{margin:44px 0;padding:28px 30px;background:var(--lapis);color:var(--lapis-ink);border:1px solid var(--lapis);outline:1px solid var(--gilt);outline-offset:-8px}
.lesson .rubric{color:var(--gilt-pale)}
.lesson p{margin:0;font:500 clamp(22px,2.3vw,27px)/1.35 var(--display);color:var(--lapis-ink)}
.note{margin:28px 0;padding:18px 22px;background:var(--vellum-2);font-size:18px;color:var(--ink)}
.note p:last-child{margin:0}

/* ---------- Evidence ---------- */
.evidence{margin:48px 0 0}
.evidence h2{margin:0 0 6px}
.evidence-intro{font-size:17px;color:var(--ink-2);margin:0 0 14px}
.legend{display:flex;flex-wrap:wrap;gap:8px 16px;margin:0 0 16px;font-size:15px;color:var(--ink-2)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.tag{display:inline-block;padding:2px 8px;font:600 10.5px/1.6 var(--caps);letter-spacing:.1em;text-transform:uppercase;border:1px solid currentColor;white-space:nowrap}
.tag.stated{color:var(--link)}
.tag.link{color:var(--verdigris)}
.tag.inference{color:var(--gilt-deep)}
.tag.caution{color:var(--vermilion)}
.ev{border-top:1px solid var(--rule)}
.ev:last-of-type{border-bottom:1px solid var(--rule)}
.ev summary{list-style:none;cursor:pointer;display:grid;grid-template-columns:28px minmax(0,1fr) auto 20px;align-items:center;gap:12px;min-height:56px;padding:10px 4px}
.ev summary::-webkit-details-marker{display:none}
.ev summary::after{content:'+';font:400 24px/1 var(--display);color:var(--gilt-deep);text-align:center}
.ev[open] summary::after{content:'−'}
.ev-n{font:500 13px/1 var(--caps);color:var(--gilt-deep)}
.ev-ref{font-weight:500;font-size:18px}
.ev-body{padding:0 4px 18px 44px;font-size:18px}
.ev-body p{margin:0 0 8px}
.ev-body a{font-size:16px}

/* ---------- Alternatives ---------- */
.alt{margin:40px 0 0;border:1px solid var(--rule-strong);background:var(--paper)}
.alt summary{list-style:none;cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:56px;padding:12px 20px;font:600 13px/1.4 var(--caps);letter-spacing:.14em;text-transform:uppercase;color:var(--ink)}
.alt summary::-webkit-details-marker{display:none}
.alt summary::after{content:'+';font:400 26px/1 var(--display);color:var(--gilt-deep)}
.alt[open] summary::after{content:'−'}
.alt[open] summary{border-bottom:1px solid var(--rule)}
.alt-body{padding:18px 20px 22px}
.alt-intro{font-size:17px;color:var(--ink-2)}
.alt-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.alt-grid article{padding:16px 18px;border:1px solid var(--rule);background:var(--vellum)}
.alt-grid h3{margin:0 0 6px;font-size:20px}
.alt-grid p{margin:0;font-size:17px;line-height:1.55}
.alt-grid article.ours{background:var(--paper);border-color:var(--link)}
:root{--ours:'This guide · '}
:root[lang="es"]{--ours:'Esta guía · '}
.alt-grid article.ours h3::before{content:var(--ours);font:600 11px/1 var(--caps);letter-spacing:.12em;text-transform:uppercase;color:var(--link);vertical-align:2px}

/* ---------- Quiz ---------- */
.quiz{margin:44px 0 0;padding:26px 0 0;border-top:3px double var(--gilt)}
.quiz h3{margin:4px 0 16px}
.quiz-options{display:grid;gap:10px}
.quiz-opt{display:grid;grid-template-columns:30px minmax(0,1fr);gap:10px;align-items:start;width:100%;min-height:54px;padding:13px 16px;text-align:left;border:1px solid var(--rule-strong);border-radius:var(--radius);background:var(--paper);font-size:18px;line-height:1.45;color:var(--ink)}
.quiz-opt:hover:not(:disabled){border-color:var(--link);background:var(--hover)}
.quiz-letter{font:600 13px/1.9 var(--caps);color:var(--gilt-deep)}
.quiz-opt:disabled{cursor:default}
.quiz-opt.right{border-color:var(--verdigris);background:var(--verdigris-pale)}
.quiz-opt.right .quiz-letter{color:var(--verdigris)}
.quiz-opt.wrong{border-color:var(--vermilion);background:var(--vermilion-pale)}
.quiz-opt.wrong .quiz-letter{color:var(--vermilion)}
.quiz-opt.dim{opacity:.6}
.quiz-feedback{margin:16px 0 0;padding:16px 18px;background:var(--vellum-2);font-size:18px}
.quiz-feedback b{font-weight:600}
.quiz-retry{margin-top:10px;min-height:44px;padding:0 4px;border:0;background:none;color:var(--link);text-decoration:underline;text-underline-offset:3px;font-size:17px}

/* ---------- Pager ---------- */
.pager{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:56px 0 0;padding-top:26px;border-top:1px solid var(--rule)}
.pager a{display:flex;flex-direction:column;gap:2px;min-height:72px;padding:14px 18px;border:1px solid var(--rule-strong);background:var(--paper);text-decoration:none;color:var(--ink)}
.pager a:hover{border-color:var(--link)}
.pager a.next{text-align:right;grid-column:2}
.pager small{font:600 11.5px/1.5 var(--caps);letter-spacing:.14em;text-transform:uppercase;color:var(--vermilion)}
.pager span{font-size:19px;line-height:1.3}

/* ---------- Buttons ---------- */
.btn{display:inline-flex;align-items:center;gap:10px;min-height:48px;padding:0 20px;border:1px solid var(--lapis);background:var(--lapis);color:var(--lapis-ink);font:600 13px/1 var(--caps);letter-spacing:.14em;text-transform:uppercase;text-decoration:none;border-radius:var(--radius)}
.btn:hover{background:var(--lapis-2);color:var(--lapis-ink)}
.btn.ghost{background:transparent;color:var(--link);border-color:var(--link)}
.btn.ghost:hover{background:var(--paper);color:var(--link)}
.btn-row{display:flex;flex-wrap:wrap;gap:12px;margin:28px 0}
.resume{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;margin:0 0 28px;padding:12px 16px;border:1px solid var(--rule-strong);background:var(--paper);font-size:17px}
.resume a{font-weight:500}

/* ---------- Intro ---------- */
.hero-art{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,.95fr);margin:34px 0 40px;border:1px solid var(--rule-strong);background:var(--paper)}
.hero-art img{width:100%;height:100%;min-height:320px;max-height:440px;object-fit:cover}
.hero-art figcaption{display:flex;flex-direction:column;justify-content:center;gap:14px;padding:32px}
.hero-art blockquote{margin:0;font:italic 500 clamp(28px,3.2vw,38px)/1.2 var(--display);color:var(--ink)}
.hero-art cite{font:600 12.5px/1.5 var(--caps);letter-spacing:.14em;font-style:normal;color:var(--vermilion)}
.hero-art small{font-size:14.5px;font-style:italic;color:var(--ink-3)}
.hero-art.is-missing img{display:none}
.purpose{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:22px 0}
.purpose article{padding:20px 22px;background:var(--paper);border:1px solid var(--rule)}
.purpose h3{margin:0 0 4px;font-size:22px}
.purpose p{margin:0;font-size:17.5px;line-height:1.5;color:var(--ink-2)}
.purpose .n{font:600 12px/1 var(--caps);letter-spacing:.12em;color:var(--vermilion)}
.symbols{width:100%;border-collapse:collapse;margin:16px 0 26px;font-size:18px}
.symbols th,.symbols td{text-align:left;vertical-align:top;padding:11px 10px;border-bottom:1px solid var(--rule)}
.symbols th{font:600 12px/1.5 var(--caps);letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);border-bottom:1px solid var(--rule-strong)}
.symbols td:first-child{font-weight:500;width:34%}
.symbols td:last-child{color:var(--ink-2);font-size:16.5px;white-space:nowrap}
.movements{list-style:none;margin:24px 0;padding:0;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));border-top:2px solid var(--gilt)}
.movements li{position:relative;padding:20px 12px 8px 0}
.movements li::before{content:'';position:absolute;top:-6px;left:0;width:10px;height:10px;background:var(--vellum);border:2px solid var(--gilt-deep);transform:rotate(45deg)}
.movements b{display:block;font:500 21px/1.2 var(--display);margin:6px 0 4px}
.movements small{display:block;font-size:15.5px;line-height:1.4;color:var(--ink-2)}
.movements .n{font:600 12px/1 var(--caps);letter-spacing:.12em;color:var(--vermilion)}

/* World of Revelation schema */
.world{margin:40px 0;padding:28px clamp(16px,3vw,32px) 30px;background:var(--paper);border:1px solid var(--rule-strong)}
.world h2{margin:0 0 8px}
.world > p{font-size:18px}
.world-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px 28px;margin:24px 0 8px}
.node{display:flex;flex-direction:column;align-items:flex-start;gap:3px;width:100%;padding:16px 18px;text-align:left;text-decoration:none;color:var(--ink);background:var(--vellum);border:1px solid var(--rule-strong)}
.node:hover{border-color:var(--link);color:var(--ink)}
.node b{font:500 22px/1.15 var(--display)}
.node small{font-size:15.5px;line-height:1.4;color:var(--ink-2)}
.node.christ{grid-column:1/-1;background:var(--lapis);border-color:var(--lapis);color:var(--lapis-ink);outline:1px solid var(--gilt);outline-offset:-6px;align-items:center;text-align:center}
.node.christ small{color:var(--christ-small)}
.node.christ:hover{color:var(--lapis-ink);background:var(--lapis-2)}
.node.enemy{background:var(--vermilion-pale);border-color:var(--enemy-line)}
.node.newc{grid-column:1/-1;align-items:center;text-align:center;background:var(--vellum-2);border-color:var(--gilt)}
.world-col{display:flex;flex-direction:column;gap:10px}
.world-label{font:600 11.5px/1.5 var(--caps);letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3)}
.world-label.red{color:var(--vermilion)}
.world-pair{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.world-foot{font-size:16.5px;color:var(--ink-2);margin:16px 0 0}

/* ---------- Seven visions graphic ---------- */
.visions{margin:30px 0 20px;padding:clamp(18px,3vw,36px);background:var(--vellum);border:1px solid var(--gilt);outline:1px solid var(--gilt);outline-offset:4px}
.visions-title{text-align:center;margin:0 0 6px}
.visions-title .rubric{margin-bottom:4px}
.visions-title h3{margin:0;font:500 clamp(28px,3.4vw,40px)/1.1 var(--display);letter-spacing:.01em}
.visions-title p{margin:8px auto 0;max-width:36em;font-style:italic;color:var(--ink-2);font-size:18px}
.vgrid{display:grid;grid-template-columns:minmax(0,15rem) minmax(0,1fr) minmax(0,9.5rem);margin-top:26px}
.vcell{min-width:0}
.vmid{border-left:1px solid var(--rule-strong);border-right:1px solid var(--rule-strong)}
.vend{background:var(--vellum-2)}
.vaxis{padding:0 0 12px;font:600 11.5px/1.4 var(--caps);letter-spacing:.12em;text-transform:uppercase;color:var(--ink-2)}
.vaxis.vmid{display:flex;justify-content:space-between;gap:8px;padding-left:12px;padding-right:12px}
.vaxis.vmid span:nth-child(2){color:var(--link);text-align:center}
.vaxis.vend{padding-left:14px;display:flex;align-items:flex-end}
.vpart{padding:20px 16px 8px 0;border-top:1px solid var(--rule);font:600 11.5px/1.5 var(--caps);letter-spacing:.16em;text-transform:uppercase;color:var(--vermilion)}
.vpart.vmid{padding:20px 16px 8px;font:italic 400 16px/1.4 var(--text);letter-spacing:0;text-transform:none;color:var(--ink-2)}
.vpart.vend{border-top:1px solid var(--rule)}
.vrow{display:contents}
.vlabel{display:flex;align-items:center;gap:12px;width:100%;padding:12px 14px 12px 0;border:0;background:none;text-align:left;color:var(--ink)}
.vlabel .vn{flex:none;width:40px;font:500 20px/1 var(--caps);color:var(--vermilion)}
.vlabel .vt{display:flex;flex-direction:column;min-width:0}
.vlabel .vt b{font:500 19px/1.2 var(--display)}
.vlabel .vt small{font-size:15px;color:var(--ink-2)}
.vlabel .vchev{margin-left:auto;font-size:14px;color:var(--gilt-deep);transition:transform .2s}
.vlabel[aria-expanded="true"] .vchev{transform:rotate(90deg)}
.vlabel:hover .vt b{color:var(--link)}
.vbar{padding:16px 0 10px;display:flex;flex-direction:column;gap:7px}
.vtrack{display:flex;align-items:center;height:10px}
.vtrack i{display:block;height:10px}
.vtrack .age{flex:1;background:var(--lapis)}
.vtrack .end{flex:none;background:var(--gilt)}
.vtrack .dot{flex:none;width:22px;height:22px;border-radius:50%;background:var(--gilt);margin-right:-11px;position:relative;z-index:1}
.vtrack .dot.open{background:var(--vellum);border:1.5px dashed var(--vermilion)}
.vcap{display:flex;justify-content:flex-end;gap:10px;flex-wrap:wrap;padding-right:20px;font-size:15.5px;line-height:1.35;color:var(--ink-2);text-align:right}
.vcap .tie{font-style:italic;color:var(--vermilion)}
.vbeyond{padding:16px 12px 10px 13px;display:flex;flex-direction:column;gap:7px}
.vbeyond i{display:block;height:10px;background:var(--gilt)}
.vbeyond span{font-size:15px;line-height:1.35;color:var(--ink-2);text-align:right}
.vdetail{grid-column:1/-1;padding:4px 0 18px}
.vdetail-inner{padding:16px 20px;background:var(--paper);border:1px solid var(--rule-strong)}
.vdetail p{margin:0 0 10px;font-size:17.5px}
.vdetail ul{display:flex;flex-wrap:wrap;gap:8px;list-style:none;margin:0;padding:0}
.vdetail a{display:inline-block;padding:4px 12px;border:1px solid var(--rule-strong);border-radius:999px;font-size:15.5px;text-decoration:none;background:var(--vellum)}
.vdetail a:hover{border-color:var(--link)}
.vclose{grid-column:1/-1;border-top:1px solid var(--rule);height:6px}
.vlegend{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:10px 24px;margin-top:18px;font-size:15.5px;color:var(--ink-2)}
.vlegend .keys{display:flex;flex-wrap:wrap;gap:8px 22px}
.vlegend .keys span{display:inline-flex;align-items:center;gap:8px}
.k-age{width:30px;height:8px;background:var(--lapis)}
.k-end{width:30px;height:8px;background:var(--gilt)}
.k-ring{width:15px;height:15px;border-radius:50%;border:1.5px dashed var(--vermilion)}
.vlegend em{color:var(--ink-3)}

/* Mini version on the introduction */
.mini-visions{list-style:none;margin:22px 0 8px;padding:18px 20px;background:var(--paper);border:1px solid var(--rule-strong);display:grid;gap:8px}
.mini-visions li{display:grid;grid-template-columns:2.6rem 3.6rem minmax(0,1fr);align-items:center;gap:8px}
.mv-n{font:500 15px/1 var(--caps);color:var(--vermilion)}
.mv-c{font-size:15px;color:var(--ink-2)}
.mv-bar{display:block;height:8px;background:var(--lapis);position:relative}
.mv-bar i{position:absolute;right:0;top:0;bottom:0;width:var(--end);background:var(--gilt)}

/* Trumpets / bowls parallels */
.parallels{width:100%;border-collapse:collapse;margin:18px 0 10px;font-size:17px;line-height:1.4}
.parallels caption{caption-side:bottom;padding-top:10px;text-align:left;font-size:15.5px;font-style:italic;color:var(--ink-2)}
.parallels th,.parallels td{padding:12px 10px;vertical-align:top;border-bottom:1px solid var(--rule)}
.parallels thead th{font:600 12px/1.4 var(--caps);letter-spacing:.12em;text-transform:uppercase;text-align:left;color:var(--ink-3);border-bottom:1px solid var(--rule-strong)}
.parallels tbody th{width:22%;text-align:left;font-weight:500}
.parallels tbody th small{display:block;font-weight:400;font-size:14.5px;color:var(--vermilion);font-style:italic}
.parallels .ref{display:block;font:600 11.5px/1.5 var(--caps);letter-spacing:.08em;color:var(--gilt-deep)}
.parallels tr.final td,.parallels tr.final th{background:var(--vellum-2)}
.table-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}

/* Seals procession */
.seals{margin:30px 0;padding:24px clamp(14px,3vw,28px);background:var(--paper);border:1px solid var(--rule-strong)}
.seals h3{margin:0 0 4px}
.seals > p{font-size:17px;color:var(--ink-2)}
.seal-row{list-style:none;display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px;margin:20px 0 6px;padding:0;position:relative}
.seal-row::before{content:'';position:absolute;top:28px;left:6%;right:6%;height:1px;background:var(--rule-strong)}
.seal{position:relative;display:flex;flex-direction:column;align-items:center;text-align:center;gap:4px}
.wax{display:grid;place-items:center;width:56px;height:56px;border-radius:50%;background:#9E2A17;color:#F7E6DA;font:600 17px/1 var(--caps);box-shadow:inset 0 0 0 4px #9E2A17,inset 0 0 0 5px #C76A55}
.seal.end .wax{background:var(--gilt);color:#2B1D12;box-shadow:inset 0 0 0 4px var(--gilt),inset 0 0 0 5px #E8CF8C}
.seal b{font:500 17px/1.2 var(--display);margin-top:6px}
.seal small{font-size:14px;line-height:1.35;color:var(--ink-2)}
.seal-note{margin:16px 0 0;font-size:16.5px;color:var(--ink-2)}

/* Numbered comparisons used on several pages */
.pair-cards{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:22px 0 30px}
.pair-cards article{padding:20px 22px;border:1px solid var(--rule-strong);background:var(--paper)}
.pair-cards article.dark{background:var(--lapis);color:var(--lapis-ink);border-color:var(--lapis)}
.pair-cards article.red{background:var(--vermilion-pale);border-color:var(--enemy-line)}
.pair-cards h3{margin:0 0 6px;font-size:23px}
.pair-cards article.dark h3{color:var(--lapis-ink)}
.pair-cards p{margin:0 0 6px;font-size:17px;line-height:1.5}
.pair-cards .ref{font:600 11.5px/1.5 var(--caps);letter-spacing:.1em;color:var(--gilt-deep)}
.pair-cards article.dark .ref{color:var(--gilt-pale)}

.steps{list-style:none;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:0;margin:24px 0 30px;padding:0;border-top:2px solid var(--lapis)}
.steps li{position:relative;padding:18px 12px 6px 0}
.steps li::before{content:'';position:absolute;top:-7px;left:0;width:12px;height:12px;border-radius:50%;background:var(--lapis)}
.steps li:last-child::before{background:var(--gilt)}
.steps b{display:block;font:500 20px/1.2 var(--display)}
.steps small{display:block;font-size:15px;line-height:1.4;color:var(--ink-2)}
.steps .ref{display:block;font:600 11.5px/1.6 var(--caps);letter-spacing:.08em;color:var(--gilt-deep)}

.periods{list-style:none;margin:22px 0 30px;padding:0;border:1px solid var(--rule-strong);background:var(--paper)}
.periods li{display:grid;grid-template-columns:12rem minmax(0,1fr) 7rem;gap:12px;align-items:center;padding:14px 18px;border-top:1px solid var(--rule)}
.periods li:first-child{border-top:0}
.periods b{font:500 20px/1.2 var(--display)}
.periods span{font-size:17px;color:var(--ink-2);line-height:1.45}
.periods .ref{font:600 12px/1.4 var(--caps);letter-spacing:.08em;color:var(--gilt-deep);text-align:right}
.periods li.short{background:var(--vermilion-pale)}

.number-art{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:8px 0 36px}
.number-art div{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:26px 16px;text-align:center;border:1px solid var(--rule-strong);background:var(--paper)}
.number-art .big{font:500 clamp(54px,8vw,84px)/1 var(--caps);letter-spacing:.06em;color:var(--link)}
.number-art div.red .big{color:var(--vermilion)}
.number-art small{font-size:16px;color:var(--ink-2);max-width:20em}

.promises{width:100%;border-collapse:collapse;margin:16px 0 30px;font-size:17px}
.promises th,.promises td{padding:10px 8px;text-align:left;vertical-align:top;border-bottom:1px solid var(--rule)}
.promises thead th{font:600 12px/1.4 var(--caps);letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);border-bottom:1px solid var(--rule-strong)}
.promises td:first-child{font-weight:500;white-space:nowrap}
.promises .ref{font:600 11.5px/1.5 var(--caps);letter-spacing:.06em;color:var(--gilt-deep);white-space:nowrap}

.churches{list-style:none;display:grid;grid-template-columns:repeat(auto-fill,minmax(13.5rem,1fr));gap:10px;margin:20px 0 30px;padding:0}
.churches li{padding:14px 16px;border:1px solid var(--rule-strong);background:var(--paper)}
.churches li.clean{border-color:var(--verdigris);background:var(--clean-bg)}
.churches b{display:block;font:500 21px/1.2 var(--display)}
.churches small{display:block;font-size:15.5px;line-height:1.4;color:var(--ink-2)}
.churches .ref{display:block;font:600 11.5px/1.6 var(--caps);letter-spacing:.08em;color:var(--gilt-deep)}

/* ---------- Interpretation lab ---------- */
.primary{margin:30px 0 40px;padding:26px 28px;background:var(--lapis);color:var(--lapis-ink);outline:1px solid var(--gilt);outline-offset:-8px}
.primary .rubric{color:var(--gilt-pale)}
.primary h2{margin:4px 0 12px;color:var(--lapis-ink);font-size:clamp(26px,3vw,34px)}
.primary p{margin:0 0 10px;font-size:18.5px}
.primary p:last-child{margin:0}
.lab{margin:44px 0 0;padding-top:34px;border-top:1px solid var(--rule-strong)}
.lab > h2{margin:0 0 10px}
.tabs{display:flex;flex-wrap:wrap;gap:8px;margin:18px 0 16px}
.tab{min-height:44px;padding:0 16px;border:1px solid var(--rule-strong);background:var(--paper);border-radius:var(--radius);font:600 12.5px/1 var(--caps);letter-spacing:.1em;text-transform:uppercase;color:var(--ink)}
.tab[aria-selected="true"]{background:var(--lapis);border-color:var(--lapis);color:var(--lapis-ink)}
.panel{padding:22px 24px;background:var(--paper);border:1px solid var(--rule-strong)}
.panel h3{margin:0 0 8px}
.panel p{font-size:18px}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:12px;padding-top:14px;border-top:1px solid var(--rule)}
.cols p{font-size:17px;margin:4px 0 0}
.eras{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin:0 0 16px}
.era{display:flex;flex-direction:column;gap:6px;font-size:14px;line-height:1.3;color:var(--ink-2);text-align:center}
.era i{display:block;height:34px;background:var(--lapis);opacity:var(--o,.2);transition:opacity .4s}
.mill{margin:0 0 16px}
.mill-track{display:flex;gap:4px;align-items:stretch}
.mill-seg{flex:var(--w,1);min-width:0;display:flex;flex-direction:column;gap:6px;text-align:center}
.mill-seg i{display:block;height:14px;background:var(--lapis)}
.mill-seg.event i{background:var(--vermilion)}
.mill-seg.reign i{background:var(--gilt)}
.mill-seg.final i{background:var(--verdigris)}
.mill-seg b{font:500 16px/1.2 var(--display)}
.mill-seg small{font-size:13.5px;line-height:1.3;color:var(--ink-2)}
.matrix{width:100%;border-collapse:collapse;font-size:16.5px;background:var(--paper);border:1px solid var(--rule-strong)}
.matrix th,.matrix td{padding:10px;border-bottom:1px solid var(--rule);text-align:left}
.matrix thead th{font:600 11.5px/1.4 var(--caps);letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3)}
.matrix button{min-height:40px;padding:0 12px;border:1px solid var(--rule-strong);background:var(--vellum);border-radius:var(--radius);font-size:15.5px;white-space:nowrap}
.matrix button[aria-pressed="true"]{background:var(--lapis);color:var(--lapis-ink);border-color:var(--lapis)}
.matrix-out{margin-top:12px;padding:16px 18px;background:var(--vellum-2);font-size:17.5px}
.field{display:block;margin:16px 0 6px;font:600 12px/1.4 var(--caps);letter-spacing:.12em;text-transform:uppercase;color:var(--ink-2)}
.select{width:100%;max-width:28rem;min-height:46px;padding:0 12px;border:1px solid var(--rule-strong);background:var(--paper);border-radius:var(--radius);font-size:17px}
.disclaimer{margin:18px 0;padding:14px 18px;background:var(--vellum-2);font-size:17px}

/* Timeline on the millennium page */
.mill-inline{margin:8px 0 34px;padding:20px 18px 16px;background:var(--paper);border:1px solid var(--rule-strong)}
@media (max-width:760px){.mill-inline .mill-track{flex-direction:column;gap:12px}.mill-inline .mill-seg{text-align:left;display:grid;grid-template-columns:44px minmax(0,1fr);column-gap:12px}.mill-inline .mill-seg i{grid-row:1/3;height:auto;min-height:40px;width:44px}}

/* ---------- Footer ---------- */
.site-foot{max-width:var(--measure);margin:80px auto 0;padding-top:26px;border-top:3px double var(--gilt);font-size:16px;color:var(--ink-2)}
.site-foot h2{margin:0 0 10px;font-size:24px}
.site-foot ul{margin:0 0 16px;padding-left:20px}
.site-foot li{margin:2px 0}

/* ==========================================================================
   Responsive
   ========================================================================== */
@media (max-width:1100px){
  .layout{display:block}
  .side{display:none}
  .top-status{display:none}
  .reading{padding:40px clamp(18px,5vw,40px) 90px}
  .wide{width:auto;left:0;transform:none}
}
@media (max-width:760px){
  :root{--top:58px}
  body{font-size:18px}
  .topbar-inner{padding:0 16px}
  .brand-sub{display:none}
  .reading{padding:30px 18px 80px}
  .passage{padding:22px 18px 18px}
  .lesson,.primary{padding:22px 20px}
  .myth{padding:18px}
  .alt-grid,.purpose,.cols,.pair-cards,.number-art,.world-grid{grid-template-columns:1fr}
  .world-pair{grid-template-columns:1fr 1fr}
  .movements{grid-template-columns:1fr;border-top:0;border-left:2px solid var(--gilt);padding-left:18px}
  .movements li{padding:12px 0}
  .movements li::before{top:20px;left:-25px}
  .steps{grid-template-columns:1fr;border-top:0;border-left:2px solid var(--lapis);padding-left:18px}
  .steps li{padding:10px 0}
  .steps li::before{top:16px;left:-26px}
  .seal-row{grid-template-columns:repeat(4,minmax(0,1fr));row-gap:18px}
  .seal-row::before{display:none}
  .periods li{grid-template-columns:1fr;gap:4px}
  .periods .ref{text-align:left}
  .hero-art{grid-template-columns:1fr}
  .hero-art img{min-height:220px;max-height:300px}
  .hero-art figcaption{padding:22px}
  .pager{grid-template-columns:1fr}
  .pager a.next{grid-column:1}
  .ev summary{grid-template-columns:22px minmax(0,1fr) 18px;row-gap:4px}
  .ev summary .tag{grid-column:2;grid-row:2;justify-self:start}
  .ev summary::after{grid-column:3;grid-row:1}
  .ev-body{padding-left:34px}
  .symbols td:last-child{white-space:normal}
  /* seven visions: label row on top, bar row below */
  .vgrid{grid-template-columns:minmax(0,1fr) 3.4rem}
  .vaxis.vlab,.vpart.vlab{display:none}
  .vaxis.vmid span:nth-child(2){display:none}
  .vaxis.vend{padding-left:6px;font-size:10px;letter-spacing:.06em}
  .vpart.vmid{grid-column:1;border-top:1px solid var(--rule);padding:16px 12px 4px}
  .vpart.vmid::before{content:attr(data-part);display:block;font:600 11px/1.5 var(--caps);letter-spacing:.14em;text-transform:uppercase;color:var(--vermilion);margin-bottom:2px}
  .vlabel{grid-column:1/-1;padding:14px 0 2px;border-top:1px solid var(--rule)}
  .vcell.vlab{grid-column:1/-1}
  .vcap{padding-right:16px;font-size:14.5px}
  .vbeyond{padding:16px 6px 10px 9px}
  .vbeyond span{display:none}
}
@media (max-width:420px){
  .brand-mark{font-size:19px;letter-spacing:.03em}
  .top-actions{gap:6px}
  .lang-pick button{min-width:40px;padding:0 8px}
  .contents-btn span{display:none}
  .contents-btn{padding:0 12px}
  .world-pair{grid-template-columns:1fr}
  .seal-row{grid-template-columns:repeat(2,minmax(0,1fr))}
}

/* ==========================================================================
   Print — the current page, clean
   ========================================================================== */
@media print{
  body{background:#fff;font-size:12pt}
  .topbar,.side,.progress,.drawer,.pager,.quiz,.btn-row,.resume,.skip{display:none!important}
  .layout{display:block}
  .reading{padding:0}
  .page{max-width:none}
  .wide{width:auto;left:0;transform:none}
  details.alt,details.ev{border:0}
  details:not([open]) > :not(summary){display:block}
  .lesson,.primary,.node.christ,.pair-cards article.dark{background:#fff!important;color:var(--ink)!important;outline:0;border:2px solid var(--lapis)}
  .lesson p,.primary h2,.pair-cards article.dark h3{color:var(--ink)!important}
  .art img{height:220px}
}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}


/* ==========================================================================
   Dynamic contents, reading tools
   ========================================================================== */
.tool-btn{display:inline-grid;place-items:center;min-width:44px;min-height:44px;border:1px solid var(--rule-strong);border-radius:var(--radius);background:var(--paper);color:var(--ink)}
.tool-btn:hover,.contents-btn:hover{background:var(--hover)}
.tool-btn[aria-expanded="true"],.contents-btn[aria-expanded="true"]{border-color:var(--link);color:var(--link)}
.aa{font:500 19px/1 var(--display);letter-spacing:.02em}
.icon-btn.small{min-width:36px;min-height:36px;border-radius:var(--radius);font-size:14px}
kbd{display:inline-block;min-width:22px;padding:1px 6px;border:1px solid var(--rule-strong);border-bottom-width:2px;border-radius:4px;background:var(--paper);font:500 13px/1.5 var(--text);color:var(--ink-2);text-align:center}
.search-box kbd{flex:none}
.search-box:focus-within kbd{visibility:hidden}

/* Sidebar tools */
.side-tools{position:sticky;top:-20px;z-index:2;display:flex;gap:8px;align-items:center;margin:-20px -4px 12px;padding:20px 4px 10px;background:var(--vellum)}
.side-tools .search-box{flex:1;min-width:0}

/* Progress card */
.nav-progress{margin:0 0 18px;padding:12px 12px 10px;border:1px solid var(--rule);background:var(--paper)}
.np-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.np-label{font:600 11px/1.4 var(--caps);letter-spacing:.14em;text-transform:uppercase;color:var(--vermilion)}
.np-count{font-size:14.5px;color:var(--ink-2)}
.np-bar{height:5px;margin:8px 0 10px;background:var(--vellum-2);border-radius:3px;overflow:hidden}
.np-bar i{display:block;height:100%;width:0;background:var(--gilt);transition:width .4s ease}
.np-next{display:flex;flex-direction:column;gap:1px;font-size:15.5px;line-height:1.3;text-decoration:none;color:var(--ink)}
.np-next small{font:600 10.5px/1.5 var(--caps);letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3)}
.np-next span{color:var(--link)}
.np-next:hover span{text-decoration:underline}
.np-next[aria-disabled="true"]{color:var(--verdigris);font-style:italic}

/* Collapsible groups */
.nav-group-btn{display:grid;grid-template-columns:minmax(0,1fr) auto 14px;align-items:start;gap:8px;width:100%;margin:0 0 4px;padding:6px 10px;border:0;background:none;text-align:left;border-radius:var(--radius)}
.nav-group-btn:hover{background:var(--vellum-2)}
.ngt{font:600 11.5px/1.5 var(--caps);letter-spacing:.16em;text-transform:uppercase;color:var(--vermilion)}
.ngs{display:block;font:italic 400 13.5px/1.4 var(--text);letter-spacing:0;text-transform:none;color:var(--ink-3);margin-top:1px}
.ngc{font:500 12.5px/1.6 var(--text);color:var(--ink-3);padding:0 6px;border-radius:99px;background:var(--vellum-2)}
.ngc:empty{display:none}
.ngc.full{background:var(--verdigris-pale);color:var(--verdigris)}
.chev{font-size:12px;line-height:1.7;color:var(--gilt-deep);transition:transform .2s}
.nav-group-btn[aria-expanded="false"] .chev{transform:rotate(-90deg)}
.nav-group{margin:0 0 14px}

/* Outline of the current page */
.toc{margin:2px 0 8px 40px;padding:2px 0 4px 12px;border-left:1px solid var(--rule-strong)}
.toc-head{margin:4px 0 4px;font:600 10.5px/1.5 var(--caps);letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3)}
.toc ol{list-style:none;margin:0;padding:0}
.toc a{display:block;padding:4px 8px;margin-left:-13px;border-left:2px solid transparent;font-size:14.5px;line-height:1.3;color:var(--ink-2);text-decoration:none}
.toc a:hover{color:var(--ink);background:var(--vellum-2)}
.toc a[aria-current="location"]{border-left-color:var(--gilt);color:var(--ink);font-weight:500}
.filtering .toc,.filtering .nav-progress{display:none}
.drawer-list .toc a{padding:8px;font-size:16px}
.drawer-foot{padding:8px 18px 12px;border-top:1px solid var(--rule)}

/* Section links and copy buttons */
.sec-anchor{display:block;height:0;scroll-margin-top:calc(var(--top) + 16px)}
h2 .h-link{margin-left:10px;padding:0 6px;border:0;background:none;font:400 .6em/1 var(--text);color:var(--ink-3);opacity:0;vertical-align:middle;border-radius:var(--radius)}
h2:hover .h-link,.h-link:focus-visible{opacity:1}
.h-link:hover{color:var(--link);background:var(--vellum-2)}
@media (hover:none){h2 .h-link{opacity:.55}}
.copy-btn{display:inline-flex;align-items:center;gap:6px;min-height:36px;padding:0 12px;border:1px solid var(--rule-strong);border-radius:999px;background:var(--vellum);font-size:15px;color:var(--ink-2)}
.copy-btn:hover{color:var(--link);border-color:var(--link)}
.passage footer{align-items:center}
.ev-toggle{margin-left:auto;min-height:32px;padding:0 10px;border:1px solid var(--rule-strong);border-radius:var(--radius);background:var(--paper);font:600 11px/1 var(--caps);letter-spacing:.1em;text-transform:uppercase;color:var(--ink-2)}
.ev-toggle:hover{color:var(--link);border-color:var(--link)}
.legend{align-items:center}

/* Settings panel */
.settings{position:absolute;right:28px;top:calc(var(--top) - 6px);z-index:60;width:min(360px,calc(100vw - 32px));padding:16px 18px 14px;background:var(--paper);border:1px solid var(--rule-strong);box-shadow:var(--shadow);border-top:3px double var(--gilt)}
.settings-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:0 0 10px}
.settings-head h2{margin:0;font:500 22px/1.2 var(--display)}
.set-row{display:flex;flex-direction:column;gap:6px;margin:0 0 14px}
.set-label{font:600 11px/1.4 var(--caps);letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3)}
.seg{display:flex;border:1px solid var(--rule-strong);border-radius:var(--radius);overflow:hidden}
.seg button{flex:1;display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:42px;padding:0 6px;border:0;background:var(--vellum);font-size:15px;color:var(--ink-2)}
.seg button+button{border-left:1px solid var(--rule-strong)}
.seg button:hover{background:var(--hover);color:var(--ink)}
.seg button[aria-pressed="true"]{background:var(--lapis);color:var(--lapis-ink)}
.sw{width:14px;height:14px;border-radius:50%;border:1px solid var(--rule-strong)}
.sw-vellum{background:#F4EBD6}.sw-night{background:#1B1612}.sw-auto{background:linear-gradient(90deg,#F4EBD6 50%,#1B1612 50%)}
.set-actions{display:flex;flex-direction:column;align-items:flex-start;gap:2px;padding-top:8px;border-top:1px solid var(--rule)}
.set-link{min-height:40px;padding:0 2px;border:0;background:none;font-size:16px;color:var(--link);text-align:left}
.set-link:hover{text-decoration:underline;text-underline-offset:3px}
.set-link.danger{color:var(--vermilion)}
.set-link.danger[data-armed]{font-weight:600}

/* Shortcuts dialog */
dialog.keys{width:min(440px,calc(100vw - 32px));padding:18px 20px;border:1px solid var(--rule-strong);border-top:3px double var(--gilt);background:var(--paper);color:var(--ink);box-shadow:var(--shadow)}
dialog.keys::backdrop{background:var(--shade)}
.keys dl{display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px 16px;margin:6px 0 0;align-items:center}
.keys dt{display:flex;gap:4px}
.keys dd{margin:0;font-size:16.5px;color:var(--ink-2)}

/* Back to top and toast */
.to-top{position:fixed;right:20px;bottom:20px;z-index:40;display:grid;place-items:center;width:46px;height:46px;border:1px solid var(--rule-strong);border-radius:50%;background:var(--paper);color:var(--ink);box-shadow:var(--shadow)}
.to-top:hover{color:var(--link);border-color:var(--link)}
.toast{position:fixed;left:50%;bottom:24px;z-index:300;transform:translate(-50%,16px);padding:10px 18px;border-radius:99px;background:var(--ink);color:var(--vellum);font-size:16px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s}
.toast.on{opacity:1;transform:translate(-50%,0)}

/* Night adjustments for imagery */
:root[data-theme="night"] .art img{mix-blend-mode:normal;filter:sepia(.12) brightness(.9)}
:root[data-theme="night"] .hero-art img{filter:sepia(.12) brightness(.85)}
:root[data-theme="night"] .toast{background:#EDE3CF;color:#1B1612}

@media (max-width:1100px){
  .settings{right:16px}
}
@media (max-width:600px){
  .settings{position:fixed;left:0;right:0;top:auto;bottom:0;width:auto;padding-bottom:calc(14px + env(safe-area-inset-bottom,0))}
  .to-top{right:14px;bottom:14px}
}
@media (max-width:480px){
  #settingsOpen{display:none}
}
@media (min-width:481px){
  .drawer-foot{display:none}
}
@media print{
  .to-top,.toast,.settings,dialog.keys,.h-link,.copy-btn,.ev-toggle,.sec-anchor{display:none!important}
  #pages{zoom:1}
  :root[data-theme="night"]{--vellum:#fff;--paper:#fff;--ink:#2B1D12;--ink-2:#5A4632;--link:#1F3A6B}
}

/* ==========================================================================
   Facelift — an illuminated manuscript, as a product page
   Glass chrome, continuous corners, soft depth, gold as real leaf.
   ========================================================================== */
:root{
  --vellum:#F7F3EA;      /* page */
  --vellum-2:#EEE7D8;    /* fills, segmented tracks */
  --paper:#FFFDF8;       /* cards */
  --rule:#E7DFCF;
  --rule-strong:#CDBFA6;
  --ink:#1C1915;
  --ink-2:#574D41;
  --ink-3:#73685A;
  --lapis:#1D3D7E; --lapis-2:#2852A3; --lapis-ink:#FBF7EE;
  --gilt:#C9A148; --gilt-deep:#87631A; --gilt-pale:#EBD08A;
  --vermilion:#B0331D; --vermilion-pale:#FBEDE6;
  --verdigris:#2C6B57; --verdigris-pale:#E3F0E8;
  --link:#1F4FA8; --hover:#FFFFFF; --art-bg:#F1E9D6;
  --myth-line:#F0D6CA; --myth-ink:#4E2216; --enemy-line:#EBCFC2; --clean-bg:#EDF5F0;
  --select:#EAD9A6; --christ-small:#D5DEF2;
  --shade:rgba(22,18,12,.38);
  --fill:rgba(120,98,60,.10);          /* iOS-style tinted fill */
  --fill-2:rgba(120,98,60,.16);
  --hair:rgba(80,60,20,.12);           /* hairline */
  --glass:rgba(247,243,234,.74);
  --glass-strong:rgba(255,252,246,.86);
  --thumb:#FFFFFF;                     /* segmented control thumb */
  --lapis-tint:rgba(31,79,168,.10);
  --sh-1:0 1px 1px rgba(60,40,10,.04),0 2px 6px rgba(60,40,10,.05);
  --sh-2:0 1px 2px rgba(60,40,10,.05),0 10px 30px -8px rgba(60,40,10,.16);
  --sh-3:0 2px 6px rgba(40,28,8,.08),0 30px 70px -20px rgba(40,28,8,.35);
  --shadow:var(--sh-3);
  --leaf:linear-gradient(105deg,#8F6A1C 0%,#C99C3C 30%,#F1D995 47%,#C89A3A 64%,#8A651A 100%);
  --leaf-text:linear-gradient(100deg,#7D5B15 0%,#A97F25 40%,#7A5814 75%,#6A4C10 100%);
  --lapis-tile:radial-gradient(130% 120% at 15% 0%,#3463BC 0%,#1F428A 42%,#142C5E 100%);
  --leaf-light:linear-gradient(100deg,#E7C46F 0%,#FFF0C2 45%,#E9C872 70%,#D6AE52 100%);
  --wax:radial-gradient(circle at 34% 28%,#E06A4C 0%,#B53A20 38%,#8C2412 70%,#6A190B 100%);

  --display:'Newsreader','New York',ui-serif,Georgia,serif;
  --text:'Newsreader','New York',ui-serif,Georgia,serif;
  --sans:-apple-system,BlinkMacSystemFont,'SF Pro Text','Inter','Helvetica Neue',Arial,sans-serif;
  --caps:var(--sans);
  --initial:'Cinzel',Georgia,serif;

  --r-xl:28px; --r-lg:22px; --r-md:16px; --r-sm:11px;
  --radius:12px;
  --top:56px;
  --measure:43rem;
}
:root[data-theme="night"]{
  --vellum:#13110E; --vellum-2:#24201B; --paper:#1D1A16;
  --rule:#2E2923; --rule-strong:#4A4237;
  --ink:#F2ECE1; --ink-2:#C9BFAF; --ink-3:#A39885;
  --lapis:#2A55A8; --lapis-2:#3A68C2; --lapis-ink:#F7F2E8;
  --gilt:#C9A24E; --gilt-deep:#E0BE6E; --gilt-pale:#F0D896;
  --vermilion:#FF8A6B; --vermilion-pale:#2C1A15;
  --verdigris:#7CD0B1; --verdigris-pale:#16271F;
  --link:#8DB4FF; --hover:#26221C; --art-bg:#E2D7BF;
  --myth-line:#4A2C22; --myth-ink:#F6D9CC; --enemy-line:#553227; --clean-bg:#17261F;
  --select:#5B4A22; --christ-small:#C9D6F2;
  --shade:rgba(0,0,0,.55);
  --fill:rgba(255,240,210,.08); --fill-2:rgba(255,240,210,.13);
  --hair:rgba(255,240,210,.10);
  --glass:rgba(19,17,14,.72); --glass-strong:rgba(32,28,24,.86);
  --thumb:#3A342C;
  --lapis-tint:rgba(141,180,255,.14);
  --sh-1:0 0 0 1px rgba(255,240,210,.05);
  --sh-2:0 0 0 1px rgba(255,240,210,.06),0 12px 30px -10px rgba(0,0,0,.6);
  --sh-3:0 0 0 1px rgba(255,240,210,.07),0 30px 70px -20px rgba(0,0,0,.8);
  --leaf-text:linear-gradient(100deg,#C99A3E 0%,#F3DB9A 45%,#D2A853 70%,#B58A35 100%);
  --lapis-tile:radial-gradient(130% 120% at 15% 0%,#3A6CCB 0%,#24498F 45%,#152C5C 100%);
}

/* ---------- Base type ---------- */
body{font:400 19px/1.62 var(--text);font-optical-sizing:auto;letter-spacing:-.003em;text-rendering:optimizeLegibility}
h1,h2,h3{font-weight:600;letter-spacing:-.022em;font-optical-sizing:auto}
h1{font-size:clamp(44px,6vw,78px);line-height:1.02;font-weight:500;letter-spacing:-.028em;margin:0 0 16px}
h2{font-size:clamp(30px,3.4vw,42px);line-height:1.08;margin:64px 0 16px}
h3{font-size:clamp(22px,2.2vw,26px);line-height:1.18;letter-spacing:-.015em}
a{color:var(--link);text-decoration-thickness:1px;text-underline-offset:3px;text-decoration-color:color-mix(in srgb,currentColor 35%,transparent)}
a:hover{color:var(--link);text-decoration-color:currentColor}
:focus-visible{outline:3px solid color-mix(in srgb,var(--link) 55%,transparent);outline-offset:3px;border-radius:8px}
::selection{background:var(--select)}

/* small labels: system sans, gentle tracking */
.top-status,.nav-num,.drawer-kicker,.rubric,.refs-label,.locator a,.passage cite,.tag,.ev-n,.quiz-letter,
.hero-art cite,.purpose .n,.symbols th,.movements .n,.world-label,.vaxis,.vpart,.parallels thead th,.parallels .ref,
.pair-cards .ref,.steps .ref,.periods .ref,.promises thead th,.promises .ref,.churches .ref,.matrix thead th,.field,
.np-label,.np-next small,.toc-head,.set-label,.ev-toggle,.nav-group-title{font-family:var(--sans);letter-spacing:.06em}
.rubric{font:600 12px/1.4 var(--sans);letter-spacing:.08em;color:var(--vermilion)}

.eyebrow{font:600 17px/1.35 var(--sans);letter-spacing:-.01em;text-transform:none;color:var(--vermilion);gap:12px;margin:0 0 14px}
.eyebrow::after{display:none}
.deck{font:italic 400 clamp(22px,2.3vw,27px)/1.3 var(--display);letter-spacing:-.01em;color:var(--ink-2);margin:0 0 26px}
.lead{letter-spacing:-.008em}
.small{font-family:var(--sans);font-size:15px}
.ornament::before,.ornament::after{background:var(--leaf);height:1.5px}
.ornament span{background:var(--leaf);border-radius:2px}

/* Illuminated initial: a lapis tile, like an app icon, with a gilded letter */
.illum::first-letter{
  float:left;font:600 3.1em/1 var(--initial);
  color:#F2D98F;background:linear-gradient(160deg,#3463BC 0%,#1F428A 50%,#142C5E 100%);
  border:0;border-radius:.22em;padding:.18em .2em .14em;margin:.1em .16em 0 0;
  text-shadow:0 1px 0 rgba(0,0,0,.25),0 0 18px rgba(241,217,149,.35);
}

/* ---------- Chrome: glass bars ---------- */
.topbar{background:none;border-bottom:1px solid var(--hair)}
/* glass lives on a layer behind the bar, so fixed sheets inside it still anchor to the screen */
.topbar::before{content:'';position:absolute;inset:0;z-index:-1;background:var(--glass);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px)}
.topbar-inner{padding:0 24px}
.brand{align-items:center;gap:10px}
.brand-mark{font:600 22px/1 var(--display);letter-spacing:-.02em}
.brand-star{background:var(--leaf);-webkit-background-clip:text;background-clip:text;color:transparent}
.brand-sub{font:400 14px/1 var(--sans);font-style:normal;letter-spacing:-.005em;color:var(--ink-3)}
.top-status{font:500 13px/1 var(--sans);letter-spacing:0;text-transform:none;color:var(--ink-3)}
.top-actions{gap:8px}

/* segmented controls (language, text size, page) */
.lang-pick,.seg{display:inline-flex;gap:2px;padding:2px;border:0;border-radius:10px;background:var(--fill);overflow:visible}
.lang-pick button,.seg button{border:0!important;border-radius:8px;background:none;color:var(--ink-2)}
.lang-pick button{min-width:40px;min-height:36px;padding:0 9px;font:600 12.5px/1 var(--sans);letter-spacing:.04em}
.lang-pick button:hover,.seg button:hover{background:none;color:var(--ink)}
.lang-pick button[aria-pressed="true"],.seg button[aria-pressed="true"]{background:var(--thumb);color:var(--ink);box-shadow:0 1px 1px rgba(0,0,0,.06),0 2px 8px rgba(0,0,0,.10)}
.seg{display:flex}
.seg button{min-height:38px;font:500 14.5px/1 var(--sans)}

.tool-btn,.contents-btn{border:0;background:none;border-radius:10px;color:var(--ink)}
.tool-btn:hover,.contents-btn:hover{background:var(--fill)}
.tool-btn[aria-expanded="true"],.contents-btn[aria-expanded="true"]{background:var(--fill);color:var(--ink)}
.contents-btn{gap:7px;padding:0 12px;font:500 15px/1 var(--sans);letter-spacing:-.01em;text-transform:none}
.aa{font:600 19px/1 var(--display)}
.icon-btn{border:0;background:var(--fill);color:var(--ink-2)}
.icon-btn:hover{background:var(--fill-2);color:var(--ink)}
.icon-btn.small{border-radius:50%;min-width:32px;min-height:32px;font-size:13px}

.progress{height:2px}
.progress span{background:var(--leaf);box-shadow:0 0 8px rgba(201,161,72,.5)}

/* ---------- Sidebar: like a Mac source list ---------- */
.side{border-right:1px solid var(--hair);background:color-mix(in srgb,var(--vellum) 60%,var(--vellum-2))}
.side-inner{padding:18px 14px 40px 16px}
.side-tools{background:color-mix(in srgb,var(--vellum) 60%,var(--vellum-2))}
.search-box{border:0;border-radius:10px;background:var(--fill);padding:0 10px}
.search-box input{height:36px;font:400 15.5px/1 var(--sans)}
.search-box:focus-within{outline:3px solid color-mix(in srgb,var(--link) 40%,transparent);outline-offset:0}
.search-box svg{width:16px;height:16px}
kbd{border:0;border-radius:5px;background:var(--paper);box-shadow:0 1px 0 var(--rule-strong);font:500 12px/1.6 var(--sans)}

.nav-progress{border:0;border-radius:14px;background:var(--paper);box-shadow:var(--sh-1);padding:14px 14px 12px}
.np-label{font:600 11.5px/1.4 var(--sans);letter-spacing:.06em;color:var(--ink-3)}
.np-count{font:500 13.5px/1.4 var(--sans);color:var(--ink-2)}
.np-bar{height:6px;border-radius:99px;background:var(--fill)}
.np-bar i{background:var(--leaf);border-radius:99px}
.np-next{font:500 15px/1.3 var(--sans)}
.np-next small{font:500 12px/1.5 var(--sans);letter-spacing:0;text-transform:none;color:var(--ink-3)}

.nav-group-btn{border-radius:8px;padding:6px 8px}
.nav-group-btn:hover{background:var(--fill)}
.ngt{font:600 12.5px/1.4 var(--sans);letter-spacing:-.005em;text-transform:none;color:var(--ink-3)}
.ngs{font:400 12.5px/1.35 var(--sans);font-style:normal;color:var(--ink-3);opacity:.85}
.ngc{font:600 11.5px/1.7 var(--sans);background:var(--fill);color:var(--ink-3)}
.chev{color:var(--ink-3)}
.nav-link{grid-template-columns:28px minmax(0,1fr) 16px;padding:7px 8px;border-left:0;border-radius:8px;font:400 15.5px/1.32 var(--sans);letter-spacing:-.01em;color:var(--ink)}
.nav-link:hover{background:var(--fill)}
.nav-link[aria-current="page"]{background:var(--lapis-tint);color:var(--link);font-weight:600}
.nav-num{font:600 11.5px/1 var(--sans);letter-spacing:0;font-variant-numeric:tabular-nums;color:var(--gilt-deep)}
.nav-link[aria-current="page"] .nav-num{color:var(--link)}
.toc{margin-left:36px;border-left:1px solid var(--hair)}
.toc-head{font:600 11px/1.5 var(--sans);letter-spacing:.05em;color:var(--ink-3)}
.toc a{border-radius:0 7px 7px 0;font:400 14px/1.3 var(--sans);letter-spacing:-.005em}
.toc a:hover{background:var(--fill)}
.toc a[aria-current="location"]{border-left-color:var(--gilt);color:var(--ink);font-weight:600}

/* ---------- Sheets, popovers, dialogs ---------- */
.drawer-shade{background:var(--shade);-webkit-backdrop-filter:blur(2px);backdrop-filter:blur(2px)}
.drawer-panel{border-top:0;border-radius:22px 22px 0 0;background:var(--glass-strong);-webkit-backdrop-filter:saturate(180%) blur(30px);backdrop-filter:saturate(180%) blur(30px);box-shadow:var(--sh-3)}
.drawer-head h2{font:600 28px/1.1 var(--display);letter-spacing:-.025em}
.drawer-kicker{font:600 12px/1.4 var(--sans);letter-spacing:0;text-transform:none;color:var(--ink-3)}
.drawer-list .nav-link{font-size:16.5px}
.drawer-foot{border-top:1px solid var(--hair)}
.settings{border:0;border-radius:18px;background:var(--glass-strong);-webkit-backdrop-filter:saturate(180%) blur(30px);backdrop-filter:saturate(180%) blur(30px);box-shadow:var(--sh-3);padding:16px 16px 12px}
.settings-head h2,dialog.keys h2{font:600 20px/1.2 var(--display);letter-spacing:-.02em}
.set-label{font:600 12px/1.4 var(--sans);letter-spacing:0;text-transform:none;color:var(--ink-3)}
.set-actions{border-top:1px solid var(--hair)}
.set-link{font:400 15.5px/1 var(--sans);letter-spacing:-.01em}
.sw{border:1px solid var(--hair)}
dialog.keys{border:0;border-radius:18px;background:var(--paper);box-shadow:var(--sh-3)}
.keys dd{font-family:var(--sans);font-size:15px}
.to-top{border:0;background:var(--glass-strong);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);box-shadow:var(--sh-2)}
.toast{background:rgba(28,25,21,.88);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);font:500 15px/1.2 var(--sans);padding:12px 20px;box-shadow:var(--sh-2)}
:root[data-theme="night"] .toast{background:rgba(242,236,225,.92);color:#13110E}

/* ---------- Header furniture on each page ---------- */
.refs{gap:8px}
.refs-label{font:600 12px/1.4 var(--sans);letter-spacing:0;text-transform:none;color:var(--ink-3)}
.refs a{min-height:34px;padding:0 14px;border:0;background:var(--lapis-tint);font:500 15px/1 var(--sans);letter-spacing:-.01em;color:var(--link)}
.refs a:hover{background:color-mix(in srgb,var(--link) 18%,transparent);color:var(--link)}
.refs a::after{content:'↗';color:inherit;opacity:.7}
.locator{font:400 14.5px/1.3 var(--sans);color:var(--ink-3)}
.locator-track{gap:2px;padding:2px;border-radius:10px;background:var(--fill)}
.locator a{min-width:36px;height:30px;border:0;border-radius:8px;font:600 12px/1 var(--sans);letter-spacing:.02em;color:var(--ink-3)}
.locator a:hover{color:var(--ink)}
.locator a.on{background:var(--lapis-tile);color:#fff;box-shadow:0 1px 3px rgba(20,44,94,.35)}
.resume{border:0;border-radius:99px;background:var(--paper);box-shadow:var(--sh-1);padding:10px 20px;font:400 15.5px/1.4 var(--sans)}
.resume a{font-weight:600}

/* ---------- Cards ---------- */
.art{border:0;border-radius:var(--r-lg);padding:0;overflow:hidden;background:var(--paper);box-shadow:var(--sh-2)}
.art img{height:clamp(260px,38vw,460px)}
.art figcaption{padding:14px 20px 16px;font:400 14.5px/1.45 var(--sans);font-style:normal;letter-spacing:-.005em;color:var(--ink-3)}
.art figcaption b{font-weight:600;color:var(--ink)}
.art figcaption i,.art figcaption em{font-style:italic}

.passage{position:relative;border:0;border-radius:var(--r-lg);background:var(--paper);box-shadow:var(--sh-2);padding:34px 36px 26px}
.passage::before{content:'';position:absolute;left:36px;top:0;width:44px;height:4px;border-radius:0 0 4px 4px;background:var(--leaf)}
.passage p{font-weight:400;letter-spacing:-.01em;line-height:1.45}
.passage cite{font:600 12.5px/1.4 var(--sans);letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2)}
.passage footer a{font:500 15px/1 var(--sans)}
.copy-btn{border:0;background:var(--fill);font:500 14px/1 var(--sans);color:var(--ink-2)}
.copy-btn:hover{background:var(--fill-2);color:var(--ink)}

.myth{border:0;border-radius:var(--r-md);background:var(--vermilion-pale);padding:22px 26px;box-shadow:inset 0 0 0 1px var(--myth-line)}
.myth p{font-size:21px;letter-spacing:-.01em}

.lesson{position:relative;border:0;outline:0;border-radius:var(--r-xl);background:var(--lapis-tile);padding:36px 38px;box-shadow:0 24px 50px -24px rgba(20,44,94,.6),inset 0 0 0 1px rgba(241,217,149,.22);overflow:hidden}
.lesson::after{content:'';position:absolute;right:-60px;top:-60px;width:220px;height:220px;border-radius:50%;background:radial-gradient(circle,rgba(241,217,149,.22),transparent 65%);pointer-events:none}
.lesson .rubric{background:var(--leaf-light);-webkit-background-clip:text;background-clip:text;color:transparent}
.lesson p{font-weight:600;letter-spacing:-.02em;line-height:1.25;font-size:clamp(24px,2.6vw,31px)}

.note,.disclaimer,.matrix-out,.quiz-feedback{border-radius:var(--r-md);background:var(--fill)}
.note{padding:20px 24px}

/* Evidence as an inset grouped list */
.evidence-intro{font-family:var(--sans);font-size:15.5px}
.legend{font:400 13.5px/1.35 var(--sans);color:var(--ink-3)}
.tag{border:0;border-radius:99px;padding:3px 9px;font:600 10.5px/1.4 var(--sans);letter-spacing:.06em}
.tag.stated{background:var(--lapis-tint);color:var(--link)}
.tag.link{background:color-mix(in srgb,var(--verdigris) 13%,transparent);color:var(--verdigris)}
.tag.inference{background:color-mix(in srgb,var(--gilt) 20%,transparent);color:var(--gilt-deep)}
.tag.caution{background:color-mix(in srgb,var(--vermilion) 12%,transparent);color:var(--vermilion)}
.ev-toggle{border:0;border-radius:99px;background:var(--fill);font:600 12.5px/1 var(--sans);letter-spacing:0;text-transform:none;color:var(--link);padding:0 14px}
.ev-toggle:hover{background:var(--fill-2);color:var(--link)}
.ev{border:0;background:var(--paper);box-shadow:var(--sh-1)}
.ev + .ev{border-top:1px solid var(--hair)}
.ev:first-of-type{border-radius:var(--r-md) var(--r-md) 0 0}
.ev:last-of-type{border-bottom:0;border-radius:0 0 var(--r-md) var(--r-md)}
.ev:only-of-type{border-radius:var(--r-md)}
.ev summary{padding:12px 18px;min-height:58px}
.ev summary:hover{background:color-mix(in srgb,var(--fill) 50%,transparent)}
.ev summary::after{content:'';width:9px;height:9px;justify-self:center;border-right:2px solid var(--ink-3);border-bottom:2px solid var(--ink-3);transform:rotate(-45deg);transition:transform .25s}
.ev[open] summary::after{content:'';transform:rotate(45deg) translate(-2px,-2px)}
.ev-n{font:600 12px/1 var(--sans);font-variant-numeric:tabular-nums;letter-spacing:0;color:var(--gilt-deep)}
.ev-ref{font-weight:600;letter-spacing:-.01em}
.ev-body{padding:0 20px 20px 58px}
.ev-body a{font:500 15px/1 var(--sans)}

.alt{border:0;border-radius:var(--r-lg);background:var(--paper);box-shadow:var(--sh-2);overflow:hidden}
.alt summary{min-height:60px;padding:14px 22px;font:600 17px/1.3 var(--sans);letter-spacing:-.015em;text-transform:none}
.alt summary::after{content:'';width:9px;height:9px;border-right:2px solid var(--ink-3);border-bottom:2px solid var(--ink-3);transform:rotate(-45deg);transition:transform .25s;margin-right:4px}
.alt[open] summary::after{content:'';transform:rotate(45deg)}
.alt[open] summary{border-bottom:1px solid var(--hair)}
.alt-intro{font-family:var(--sans);font-size:15.5px}
.alt-grid article{border:0;border-radius:var(--r-md);background:var(--vellum)}
.alt-grid article.ours{background:var(--paper);box-shadow:inset 0 0 0 1.5px color-mix(in srgb,var(--link) 55%,transparent)}
.alt-grid article.ours h3::before{font:600 11px/1 var(--sans);letter-spacing:.06em}

/* Quiz */
.quiz{border-top:0;padding-top:8px}
.quiz h3{font-size:clamp(24px,2.4vw,28px)}
.quiz-options{gap:10px}
.quiz-opt{grid-template-columns:30px minmax(0,1fr);align-items:center;border:0;border-radius:var(--r-md);background:var(--paper);box-shadow:var(--sh-1),inset 0 0 0 1px var(--hair);padding:14px 18px;transition:transform .15s ease,box-shadow .2s}
.quiz-opt:hover:not(:disabled){background:var(--paper);box-shadow:var(--sh-2),inset 0 0 0 1.5px color-mix(in srgb,var(--link) 50%,transparent)}
.quiz-opt:active:not(:disabled){transform:scale(.985)}
.quiz-letter{display:grid;place-items:center;width:28px;height:28px;border-radius:50%;background:var(--fill);font:600 13px/1 var(--sans);letter-spacing:0;color:var(--ink-2)}
.quiz-opt.right{background:var(--verdigris-pale);box-shadow:inset 0 0 0 1.5px var(--verdigris)}
.quiz-opt.right .quiz-letter{background:var(--verdigris);color:#fff}
.quiz-opt.wrong{background:var(--vermilion-pale);box-shadow:inset 0 0 0 1.5px var(--vermilion)}
.quiz-opt.wrong .quiz-letter{background:var(--vermilion);color:#fff}
.quiz-opt.dim{opacity:.5}
.quiz-feedback{padding:18px 20px}
.quiz-retry{font:500 15.5px/1 var(--sans);text-decoration:none;color:var(--link)}

/* Pager: two large tiles */
.pager{gap:14px;border-top:0;padding-top:0}
.pager a{border:0;border-radius:var(--r-lg);background:var(--paper);box-shadow:var(--sh-2);padding:18px 22px 20px;transition:transform .2s ease,box-shadow .2s}
.pager a:hover{transform:translateY(-2px);box-shadow:var(--sh-3)}
.pager small{font:500 13px/1.5 var(--sans);letter-spacing:0;text-transform:none;color:var(--ink-3)}
.pager span{font:600 20px/1.25 var(--display);letter-spacing:-.015em}

/* Buttons: pills */
.btn{min-height:46px;padding:0 24px;border:0;border-radius:99px;background:var(--lapis-tile);font:500 16.5px/1 var(--sans);letter-spacing:-.01em;text-transform:none;box-shadow:0 8px 20px -10px rgba(20,44,94,.6)}
.btn:hover{background:var(--lapis-tile);filter:brightness(1.08);color:var(--lapis-ink)}
.btn.ghost{background:none;box-shadow:inset 0 0 0 1.5px var(--link);color:var(--link)}
.btn.ghost:hover{background:var(--lapis-tint);filter:none}

/* ---------- Introduction ---------- */
.hero-art{border:0;border-radius:var(--r-xl);overflow:hidden;background:var(--paper);box-shadow:var(--sh-3)}
.hero-art img{max-height:480px}
.hero-art figcaption{padding:40px 38px}
.hero-art blockquote{font-weight:500;letter-spacing:-.02em;line-height:1.12}
.hero-art cite{font:600 12.5px/1.4 var(--sans);letter-spacing:.08em}
.hero-art small{font:400 13.5px/1.4 var(--sans);font-style:normal;color:var(--ink-3)}
.purpose{gap:14px}
.purpose article{border:0;border-radius:var(--r-lg);background:var(--paper);box-shadow:var(--sh-2);padding:24px 26px}
.purpose .n{display:block;margin-bottom:10px;font:600 15px/1 var(--display);letter-spacing:.04em;background:var(--leaf-text);-webkit-background-clip:text;background-clip:text;color:transparent}
.purpose h3{letter-spacing:-.02em}
.purpose p{font-size:17px}
.symbols,.parallels,.promises,.matrix{border-collapse:separate;border-spacing:0;background:var(--paper);border:0;border-radius:var(--r-lg);box-shadow:var(--sh-2);overflow:hidden}
.symbols th,.symbols td,.parallels th,.parallels td,.promises th,.promises td,.matrix th,.matrix td{border-bottom:1px solid var(--hair);padding-left:18px;padding-right:14px}
.symbols tbody tr:last-child td,.parallels tbody tr:last-child > *,.promises tbody tr:last-child td,.matrix tbody tr:last-child > *{border-bottom:0}
.symbols th,.parallels thead th,.promises thead th,.matrix thead th{font:600 12px/1.4 var(--sans);letter-spacing:.04em;color:var(--ink-3);border-bottom:1px solid var(--hair);background:color-mix(in srgb,var(--fill) 45%,transparent)}
.symbols td:last-child{font:600 13px/1.6 var(--sans);color:var(--gilt-deep)}
.parallels .ref,.promises .ref,.pair-cards .ref,.steps .ref,.periods .ref,.churches .ref{font:600 12px/1.5 var(--sans);letter-spacing:.02em;font-variant-numeric:tabular-nums;color:var(--gilt-deep)}
.parallels caption{font:400 14.5px/1.4 var(--sans);font-style:normal;color:var(--ink-3)}
.parallels tr.final td,.parallels tr.final th{background:color-mix(in srgb,var(--gilt) 12%,transparent)}
.movements{border-top:0;position:relative}
.movements::before{content:'';position:absolute;left:0;right:0;top:0;height:2px;border-radius:2px;background:var(--leaf)}
.movements li::before{top:-6px;width:14px;height:14px;border:0;border-radius:50%;transform:none;background:var(--paper);box-shadow:0 0 0 3px var(--gilt),0 2px 6px rgba(140,100,20,.35)}
.movements .n{font:500 15px/1 var(--rubric);letter-spacing:.04em}
.movements b{font-weight:600;letter-spacing:-.015em}

.world{border:0;border-radius:var(--r-xl);background:var(--paper);box-shadow:var(--sh-2)}
.world-label{font:600 12px/1.4 var(--sans);letter-spacing:.04em}
.node{border:0;border-radius:var(--r-md);background:var(--vellum);transition:transform .2s ease,box-shadow .2s}
.node:hover{transform:translateY(-2px);box-shadow:var(--sh-2)}
.node b{font-weight:600;letter-spacing:-.015em}
.node.christ{outline:0;background:var(--lapis-tile);box-shadow:0 18px 40px -20px rgba(20,44,94,.7),inset 0 0 0 1px rgba(241,217,149,.25)}
.node.christ:hover{background:var(--lapis-tile);filter:brightness(1.06)}
.node.enemy{background:var(--vermilion-pale);box-shadow:inset 0 0 0 1px var(--enemy-line)}
.node.newc{background:color-mix(in srgb,var(--gilt) 16%,var(--paper));box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--gilt) 60%,transparent)}
.world-foot{font-family:var(--sans);font-size:15px}

/* Seven visions graphic */
.visions{border:0;outline:0;border-radius:var(--r-xl);background:var(--paper);box-shadow:var(--sh-2)}
.visions-title h3{font-weight:600;letter-spacing:-.03em}
.vmid{border-color:var(--hair)}
.vend{background:color-mix(in srgb,var(--gilt) 10%,transparent)}
.vaxis{font:600 11.5px/1.4 var(--sans);letter-spacing:.04em}
.vpart{border-top-color:var(--hair);font:600 11.5px/1.5 var(--sans);letter-spacing:.06em}
.vpart.vmid{font:italic 400 16px/1.4 var(--text);letter-spacing:0}
.vpart.vend{border-top-color:var(--hair)}
.vlabel .vn{font:600 20px/1 var(--display);background:var(--leaf-text);-webkit-background-clip:text;background-clip:text;color:transparent}
.vlabel .vt b{font-weight:600;letter-spacing:-.015em}
.vlabel .vt small{font-family:var(--sans);font-size:13.5px;color:var(--ink-3)}
.vtrack .age{border-radius:99px 0 0 99px;background:linear-gradient(90deg,#2852A3,#1D3D7E)}
.vtrack .end{border-radius:0 99px 99px 0;background:var(--leaf)}
.vtrack .dot{background:var(--leaf);box-shadow:0 2px 6px rgba(140,100,20,.45),inset 0 1px 0 rgba(255,255,255,.5)}
.vtrack .dot.open{background:var(--paper);box-shadow:none}
.vcap{font-family:var(--sans);font-size:14px;color:var(--ink-3)}
.vbeyond i{border-radius:99px;background:var(--leaf)}
.vbeyond span{font-family:var(--sans);font-size:13.5px}
.vdetail-inner{border:0;border-radius:var(--r-md);background:var(--vellum)}
.vdetail a{border:0;background:var(--lapis-tint);color:var(--link);font:500 14.5px/1.6 var(--sans)}
.vclose{border-top-color:var(--hair)}
.vlegend{font-family:var(--sans);font-size:14px;color:var(--ink-3)}
.k-age{border-radius:99px;background:linear-gradient(90deg,#2852A3,#1D3D7E)}
.k-end{border-radius:99px;background:var(--leaf)}

.mini-visions{border:0;border-radius:var(--r-lg);background:var(--paper);box-shadow:var(--sh-2);padding:22px 24px;gap:10px}
.mv-n{font:600 15px/1 var(--display);background:var(--leaf-text);-webkit-background-clip:text;background-clip:text;color:transparent}
.mv-c{font:500 13.5px/1 var(--sans);font-variant-numeric:tabular-nums;color:var(--ink-3)}
.mv-bar{height:8px;border-radius:99px;overflow:hidden;background:linear-gradient(90deg,#2852A3,#1D3D7E)}
.mv-bar i{background:var(--leaf)}

/* Seals: glossy wax, gilded final seal */
.seals{border:0;border-radius:var(--r-xl);background:var(--paper);box-shadow:var(--sh-2)}
.seals > p,.seal-note{font-family:var(--sans);font-size:15.5px;color:var(--ink-3)}
.seal-row::before{background:linear-gradient(90deg,transparent,var(--rule-strong) 10%,var(--rule-strong) 90%,transparent)}
.wax{background:var(--wax);color:#FCE9DE;font:600 17px/1 var(--initial);text-shadow:0 1px 1px rgba(80,10,0,.5);box-shadow:inset 0 1px 1px rgba(255,210,190,.45),inset 0 -3px 6px rgba(70,10,0,.35),0 4px 10px -2px rgba(120,30,10,.45)}
.seal.end .wax{background:radial-gradient(circle at 34% 28%,#FBEBB8 0%,#E2BD62 35%,#B88B2E 70%,#8A651A 100%);color:#3A2808;text-shadow:0 1px 0 rgba(255,240,200,.6);box-shadow:inset 0 1px 1px rgba(255,250,230,.7),inset 0 -3px 6px rgba(90,60,10,.3),0 4px 12px -2px rgba(140,100,20,.5)}
.seal b{font-weight:600;letter-spacing:-.01em}
.seal small{font-family:var(--sans);font-size:13px;color:var(--ink-3)}

.pair-cards{gap:14px}
.pair-cards article{border:0;border-radius:var(--r-lg);background:var(--paper);box-shadow:var(--sh-2);padding:24px 26px}
.pair-cards article.dark{background:var(--lapis-tile);box-shadow:0 20px 44px -22px rgba(20,44,94,.7),inset 0 0 0 1px rgba(241,217,149,.22)}
.pair-cards article.red{background:var(--vermilion-pale);box-shadow:inset 0 0 0 1px var(--enemy-line)}
.pair-cards h3{font-weight:600;letter-spacing:-.02em}
.pair-cards article.dark .ref{color:var(--gilt-pale)}

.steps{border-top:0;position:relative}
.steps::before{content:'';position:absolute;left:0;right:0;top:0;height:2px;border-radius:2px;background:linear-gradient(90deg,#2852A3 0%,#1D3D7E 75%,var(--gilt) 100%)}
.steps li::before{width:14px;height:14px;top:-6px;background:var(--lapis-2);box-shadow:0 0 0 4px var(--vellum)}
.steps li:last-child::before{background:var(--leaf)}
.steps b{font-weight:600;letter-spacing:-.015em}
.steps small{font-family:var(--sans);font-size:14px;color:var(--ink-3)}

.periods{border:0;border-radius:var(--r-lg);background:var(--paper);box-shadow:var(--sh-2);overflow:hidden}
.periods li{border-top-color:var(--hair);padding:16px 22px}
.periods b{font-weight:600;letter-spacing:-.015em}
.periods span{font-family:var(--sans);font-size:15.5px}
.periods li.short{background:var(--vermilion-pale)}

.number-art{gap:14px}
.number-art div{border:0;border-radius:var(--r-xl);background:var(--paper);box-shadow:var(--sh-2);padding:34px 20px 28px}
.number-art .big{font:600 clamp(64px,9vw,104px)/1 var(--display);letter-spacing:-.04em;background:linear-gradient(160deg,#3463BC,#142C5E);-webkit-background-clip:text;background-clip:text;color:transparent}
.number-art div.red .big{background:linear-gradient(160deg,#E06A4C,#8C2412);-webkit-background-clip:text;background-clip:text;color:transparent}
:root[data-theme="night"] .number-art .big{background:linear-gradient(160deg,#9CC0FF,#4B7BD6);-webkit-background-clip:text;background-clip:text}
